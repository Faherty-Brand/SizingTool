<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PO Sizing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* PO Sizing V4 — Faherty Palette */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--sand:#f4ede4;--sand-lt:#faf6f1;--sand-dk:#e8ddd0;--sand-dkr:#d9cab8;--wh:#fff;
--navy:#1a2744;--navy-lt:#2c3e5e;
--blue:#3b7bc0;--blue-lt:#5a9ae0;--blue-pl:rgba(59,123,192,.08);--blue-md:rgba(59,123,192,.15);--blue-st:rgba(59,123,192,.25);
--orange:#c4572a;--orange-lt:#e07040;--orange-pl:rgba(196,87,42,.08);--orange-md:rgba(196,87,42,.15);
--teal:#2a8a8a;--green:#2d8a5e;--green-pl:rgba(45,138,94,.06);--green-bd:rgba(45,138,94,.35);
--yellow:#b8960f;--yellow-pl:rgba(184,150,15,.08);--yellow-bd:rgba(184,150,15,.35);
--red:#c44040;--pink:#c05a8a;--pink-pl:rgba(192,90,138,.08);
--slate:#6a7a8a;--slate-pl:rgba(106,122,138,.08);
--txt:#1a1a1a;--txt2:#555;--txt3:#999;--txti:#f0f0f0;
--bdr:#d9cab8;--bdr-lt:#e8ddd0;
--mono:'IBM Plex Mono','Fira Code',monospace;--sans:'Instrument Sans',-apple-system,sans-serif;
--r:6px;--rl:10px;--t:150ms ease;
--cb:rgba(59,123,192,.06);--cbd:rgba(59,123,192,.13);--co:rgba(196,87,42,.06);--cod:rgba(196,87,42,.13);
--shmd:0 4px 16px rgba(26,39,68,.08);--shlg:0 8px 32px rgba(26,39,68,.1);
}
html{height:100%}body{font-family:var(--sans);background:var(--sand);color:var(--txt);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
input,select,button,textarea{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--sand-dkr);border-radius:3px}
.hidden{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
.anim{animation:fadeUp .3s ease forwards}
.toast-area{position:fixed;bottom:32px;left:16px;z-index:9500;display:flex;flex-direction:column;gap:6px;max-width:380px;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--r);font-size:12px;font-weight:600;font-family:var(--mono);animation:toastIn .3s ease;box-shadow:var(--shmd);pointer-events:auto;word-wrap:break-word}
.toast.ok{background:var(--green-pl);color:var(--green);border:1px solid var(--green-bd)}.toast.out{animation:toastOut .5s ease forwards}
.btn{padding:7px 14px;font-size:11px;font-weight:600;border-radius:var(--r);cursor:pointer;transition:all var(--t);border:none;white-space:nowrap}
.btn-g{background:var(--sand-lt);color:var(--txt2);border:1px solid var(--bdr-lt)}.btn-g:hover{border-color:var(--blue);color:var(--txt)}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{background:var(--blue-lt)}.btn-b:disabled{background:var(--sand-dk);color:var(--txt3);cursor:not-allowed}
.btn-grn{background:var(--green);color:#fff;font-weight:700;padding:7px 18px;font-size:12px;border:none;border-radius:var(--r);cursor:pointer}.btn-grn:hover{background:#35a06a}
.btn-pk{background:var(--pink);color:#fff;font-weight:700;padding:7px 14px;font-size:11px;border:none;border-radius:var(--r);cursor:pointer}.btn-pk:hover{background:rgba(192,90,138,.85);filter:brightness(1.05)}
.btn-sm{padding:5px 10px;font-size:10px}
.metric-pill.mp-ch{background:rgba(42,138,138,.08);color:var(--teal);border:1px solid rgba(42,138,138,.35)}

/* Flows Modal */
.fm-backdrop{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(20,30,40,.55);backdrop-filter:blur(2px);z-index:1000}
.fm-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90vw;max-width:1100px;max-height:88vh;background:var(--wh);border:1px solid var(--bdr-lt);border-radius:var(--rl);box-shadow:0 30px 80px rgba(0,0,0,.25);z-index:1001;display:flex;flex-direction:column;overflow:hidden}
.fm-hdr{padding:16px 22px;border-bottom:1px solid var(--bdr-lt);background:var(--sand-lt);display:flex;flex-direction:column;gap:4px;position:relative}
.fm-title{font-size:18px;font-weight:700;color:var(--navy);font-family:var(--display)}
.fm-subtitle{font-family:var(--mono);font-size:10px;color:var(--txt3);letter-spacing:.5px}
.fm-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:1px solid var(--bdr-lt);background:var(--wh);color:var(--txt2);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.fm-close:hover{border-color:var(--red);color:var(--red)}
.fm-body{padding:18px 22px;overflow:auto;flex:1}
.fm-flows-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:24px}
.fm-flow{background:rgba(192,90,138,.04);border:1px solid rgba(192,90,138,.25);border-radius:var(--rl);padding:14px}
.fm-flow-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.fm-flow-name{font-weight:700;color:var(--pink);font-size:13px}
.fm-flow-date{font-family:var(--mono);font-size:10px;color:var(--txt2);font-weight:600;background:var(--wh);padding:2px 8px;border-radius:3px;border:1px solid rgba(192,90,138,.3)}
.fm-flow-stats{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed rgba(192,90,138,.3)}
.fm-flow-tot{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--navy)}
.fm-flow-pct{font-family:var(--mono);font-size:10px;color:var(--txt3)}
.fm-tbl{width:100%;border-collapse:collapse}
.fm-tbl th{font-family:var(--mono);font-size:9px;color:var(--txt3);font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:5px 8px;text-align:right;border-bottom:1px solid var(--bdr-lt)}
.fm-tbl th:first-child{text-align:left}
.fm-tbl td{padding:4px 8px;font-family:var(--mono);font-size:11px;border-bottom:1px solid rgba(192,90,138,.08)}
.fm-tbl td.fm-sz{font-weight:700;color:var(--navy)}
.fm-tbl td.fm-qty{text-align:right;color:var(--txt)}
.fm-math{margin-top:6px;background:var(--sand-lt);border:1px solid var(--bdr-lt);border-radius:var(--rl);padding:14px}
.fm-math-hdr{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
.fm-math-desc{font-size:11px;color:var(--txt2);margin-bottom:10px;line-height:1.5}
.fm-math-tbl{width:100%;border-collapse:collapse;margin-bottom:14px;background:var(--wh);border-radius:var(--r);overflow:hidden}
.fm-math-tbl th{padding:7px 10px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--txt2);background:var(--sand-dk);border-bottom:2px solid var(--bdr);text-align:right;white-space:nowrap}
.fm-math-tbl th:first-child{text-align:left}
.fm-math-tbl td{padding:5px 10px;font-family:var(--mono);font-size:10px;border-bottom:1px solid var(--bdr-lt);text-align:right}
.fm-math-tbl td.fm-sz{text-align:left;font-weight:700;color:var(--navy)}
.fm-math-tbl td.fm-num{color:var(--txt)}
.fm-math-tbl td.fm-tot{font-weight:700;color:var(--orange);background:var(--orange-pl)}
.fm-math-tbl .fm-sub{color:var(--txt3);font-size:8px}
.fm-math-summary{display:flex;flex-direction:column;gap:5px;padding:10px 0 0;border-top:1px dashed var(--bdr)}
.fm-math-summary>div{font-size:11px;display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
.fm-summary-lbl{color:var(--txt2);font-weight:500}
.fm-summary-val{font-family:var(--mono);font-weight:700;color:var(--navy)}
.fm-bump{font-size:9px;color:var(--orange);font-weight:600;font-style:italic;margin-left:4px}
.bdg{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:2px 6px;border-radius:3px;display:inline-block}
.bdg-cf{color:var(--blue);background:var(--blue-pl)}.bdg-in{color:var(--orange);background:var(--orange-pl)}.bdg-ns{color:var(--txt3);background:var(--sand-dk)}
.pm-flag{font-family:var(--mono);font-size:8px;font-weight:600;padding:3px 6px;border-radius:3px;margin-top:6px;line-height:1.3}
.pm-flag-ok{background:var(--green-pl);color:var(--green);border:1px solid var(--green-bd)}
.pm-flag-bad{background:rgba(196,64,64,.08);color:var(--red);border:1px solid rgba(196,64,64,.35)}
/* Welcome */
#welcome{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative}
#welcome.shown{display:flex}
.w-nav{position:fixed;top:0;left:0;right:0;padding:10px 20px;display:flex;gap:8px;z-index:10}
.w-center{text-align:center;max-width:600px}
.sun-svg{display:block;margin:0 auto 12px}
.w-center .tag{font-family:var(--mono);font-size:10px;letter-spacing:4px;color:var(--orange);text-transform:uppercase;margin-bottom:6px}
.w-center h1{font-size:42px;font-weight:700;letter-spacing:-1.5px;color:var(--navy);margin-bottom:8px}
.w-center .sub{color:var(--txt2);font-size:14px;margin-bottom:36px}
.s-wait{color:var(--txt3);font-family:var(--mono);font-size:12px}
.s-grid{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.s-btn{padding:20px 36px;background:var(--wh);border:2px solid var(--bdr-lt);border-radius:var(--rl);cursor:pointer;transition:all .2s;text-align:center;min-width:200px}
.s-btn:hover{border-color:var(--blue);background:var(--blue-pl);transform:translateY(-2px);box-shadow:var(--shlg)}
.s-btn .code{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--navy);margin-bottom:8px}
.s-btn .ct{font-size:11px;color:var(--txt3);font-family:var(--mono);letter-spacing:.3px;line-height:1.5}
.s-btn .ct-buy{color:var(--green);font-weight:600}
.s-btn .ct-conf{color:var(--blue);font-weight:600}
.s-btn-chase{border-color:#c4572a;background:#fdf6f0}
.s-btn-chase:hover{border-color:#c4572a;background:#fbe9dc}
.s-btn-chase .code{color:#c4572a}
.s-btn .ct-chase{color:#c4572a;font-weight:600}
.u-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:var(--wh);border:1px solid var(--bdr-lt);border-radius:var(--r);cursor:pointer;transition:all var(--t);font-size:11px;font-weight:500;color:var(--txt3);position:relative}
.u-chip:hover{border-color:var(--blue);color:var(--txt2)}.u-chip.ok{border-color:var(--green-bd);color:var(--green);background:var(--green-pl)}
.u-chip input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}.u-chip .meta{font-family:var(--mono);font-size:9px}
.pm-link{display:flex;align-items:center;gap:6px;padding:7px 14px;font-size:11px;font-weight:600;color:var(--navy);background:var(--sand-lt);border:1px solid var(--bdr-lt);border-radius:var(--r);cursor:pointer}.pm-link:hover{border-color:var(--blue);background:var(--blue-pl)}
/* Dashboard */
#dash{display:none;min-height:100vh;flex-direction:column}#dash.active{display:flex}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;border-bottom:1px solid var(--bdr-lt);background:var(--wh);flex-shrink:0;position:sticky;top:0;z-index:20}
.top-l{display:flex;align-items:center;gap:14px}.top-r{display:flex;gap:8px;align-items:center}
.stitle{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--navy);letter-spacing:1px}
.exp-ct{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-right:4px}
/* Grid */
.gv{padding:20px 24px}.gc{margin-bottom:14px}
.gc-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.gc-flex{flex-wrap:wrap;row-gap:6px}
.gc-lbl{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);margin-right:4px;flex-shrink:0}
.sb{padding:5px 10px;font-size:10px;font-weight:600;background:var(--wh);color:var(--txt2);border:1px solid var(--bdr-lt);border-radius:4px;cursor:pointer;transition:all var(--t);white-space:nowrap}
.sb:hover{border-color:var(--blue)}.sb.on{background:var(--navy);color:var(--txti);border-color:var(--navy)}
.fsel{padding:5px 8px;font-size:10px;font-weight:500;background:var(--wh);color:var(--txt);border:1px solid var(--bdr-lt);border-radius:4px;outline:none;cursor:pointer;transition:all var(--t)}
.fsel.dim{opacity:.5}
.fsel.on{background:var(--navy);color:var(--txti);border-color:var(--navy);font-weight:600}
.fsel.on option{background:var(--wh);color:var(--txt)}
.sb.clear-filters{background:#fdf3e6;color:#8a3d1e;border:1px solid #c4572a;font-weight:700}
.sb.clear-filters:hover{background:#c4572a;color:#fff}

/* Division pills (in dash header next to season name) */
.dv-pill{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.5px;padding:5px 11px;border-radius:14px;border:1.5px solid;cursor:pointer;transition:all var(--t);background:var(--wh);text-transform:uppercase}
.dv-pill:hover{transform:translateY(-1px)}
.dv-pill-static{cursor:default}.dv-pill-static:hover{transform:none}
.dv-pill.dv-pill-all{color:var(--txt2);border-color:var(--bdr)}
.dv-pill.dv-pill-all.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.dv-pill.div-m{color:var(--blue);border-color:var(--blue)}
.dv-pill.div-m.on,.dv-pill.div-m.dv-pill-static{background:var(--blue);color:#fff}
.dv-pill.div-w{color:var(--pink);border-color:var(--pink)}
.dv-pill.div-w.on,.dv-pill.div-w.dv-pill-static{background:var(--pink);color:#fff}
.dv-pill.div-n{color:var(--slate);border-color:var(--slate)}
.dv-pill.div-n.on,.dv-pill.div-n.dv-pill-static{background:var(--slate);color:#fff}
#division-pills{display:flex;gap:6px;align-items:center}
.sbar{padding:7px 12px;font-size:12px;background:var(--wh);color:var(--txt);border:1px solid var(--bdr-lt);border-radius:var(--r);outline:none;width:220px}.sbar:focus{border-color:var(--blue)}.sbar::placeholder{color:var(--txt3)}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sc{padding:14px 16px;background:var(--wh);border:2px solid var(--bdr-lt);border-radius:var(--rl);cursor:pointer;transition:all .15s;position:relative}
.sc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:1px;padding-right:0}
.sc-deliv-wrap{flex:1;display:flex;justify-content:center;min-width:0}
.sc-deliv{font-family:var(--mono);font-size:9px;color:var(--orange);font-weight:700;letter-spacing:.5px;background:var(--orange-pl);padding:2px 6px;border-radius:3px;white-space:nowrap}
.sc-buy{font-family:var(--mono);margin:4px 0 2px;line-height:1.2;display:flex;align-items:baseline;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-sized-ok{font-size:14px;font-weight:700;color:var(--green)}
.sc-sized-warn{font-size:14px;font-weight:700;color:#b8800c;animation:flashAmber 1.4s ease-in-out infinite}
.sc-sized-bad{font-size:14px;font-weight:700;color:var(--red);animation:flashRed 1.2s ease-in-out infinite}
.sc-slash{color:var(--txt3);font-size:11px}
.sc-bought{font-size:11px;font-weight:600;color:var(--txt2)}
.sc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.sc-commit{font-family:var(--mono);font-size:9px;color:var(--txt2);background:var(--sand-lt);padding:3px 8px;border-radius:3px;letter-spacing:.3px;font-weight:600;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1}
.sc-commit-empty{color:var(--txt3);background:transparent;padding-left:2px}
@keyframes flashRed{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes flashAmber{0%,100%{opacity:1}50%{opacity:.6}}

/* Mass action buttons */
.sb.mass-btn{font-size:11px;font-weight:700;letter-spacing:.3px;padding:6px 12px;border-radius:var(--rs);transition:all .15s}
.sb.mass-acc{background:var(--green);color:#fff;border:1px solid var(--green)}
.sb.mass-acc:hover{background:#246e4c;border-color:#246e4c}
.sb.mass-unacc{background:var(--wh);color:var(--red);border:1px solid var(--red)}
.sb.mass-unacc:hover{background:var(--red);color:#fff}
.sc:hover{border-color:var(--blue);box-shadow:var(--shmd);transform:translateY(-1px)}
.sc.dv-m{border-left:4px solid var(--blue)}.sc.dv-w{border-left:4px solid var(--pink)}.sc.dv-n{border-left:4px solid var(--slate)}
.sc .chk{position:relative;width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;transition:all var(--t);flex-shrink:0}
.sc .chk:hover{transform:scale(1.1)}
.sc .chk-g{background:var(--green);color:#fff}.sc .chk-e{background:var(--wh);border:2px solid var(--bdr);color:transparent}
.sc .chk-e:hover{border-color:var(--green)}
.sc .sid{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--navy);margin-bottom:2px}
.sc .snm{font-size:10px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.sc .sbu{font-family:var(--mono);font-size:16px;font-weight:700;margin-bottom:2px}.sc .ssb{font-family:var(--mono);font-size:9px;color:var(--txt3)}
.gnote{text-align:center;padding:20px;font-family:var(--mono);font-size:11px;color:var(--txt3)}
/* Detail */
.dv{padding:16px 28px 60px}
.d-back{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:11px;font-weight:600;color:var(--blue);background:var(--blue-pl);border:1px solid var(--blue-md);border-radius:var(--r);cursor:pointer;margin-bottom:12px}.d-back:hover{background:var(--blue-md)}
.detail-sticky{position:sticky;top:52px;z-index:15;background:var(--sand);padding:12px 0 10px;border-bottom:1px solid var(--bdr-lt);margin-bottom:14px}
.ds-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ch-mismatch{background:#fdf3e6;border:1px solid #c4572a;color:#8a3d1e;padding:10px 14px;border-radius:var(--rs);font-size:12px;margin-bottom:12px;line-height:1.5}
.ch-mismatch b{color:#c4572a}
.ds-name{font-size:14px;color:var(--txt2);font-weight:500;margin-bottom:8px}
.ds-color{color:var(--orange);font-weight:600}
.ds-left{display:flex;align-items:center;gap:10px}.ds-left h2{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--navy)}
.ds-right{display:flex;gap:8px;align-items:center}
.attr-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.attr-pill{font-family:var(--mono);font-size:9px;font-weight:600;padding:3px 8px;border-radius:4px;background:var(--blue-pl);color:var(--blue);border:1px solid var(--blue-md)}
.metric-row{display:flex;gap:5px;flex-wrap:wrap}
.metric-pill{font-family:var(--mono);font-size:9px;font-weight:600;padding:3px 8px;border-radius:4px;background:var(--orange-pl);color:var(--orange);border:1px solid var(--orange-md)}
/* V4 Chart */
.cb{background:var(--wh);border:1px solid var(--bdr-lt);border-radius:var(--rl);padding:18px 20px;margin-bottom:12px}
.slbl{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt3);margin-bottom:12px}
.chart-legend-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:8px 0}
.chart-cb{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--txt2);cursor:pointer;padding:4px 10px;border-radius:4px;border:1px solid var(--bdr-lt);background:var(--wh);transition:all var(--t)}

.pm-page{padding:24px 28px 60px}.pm-actions{display:flex;gap:8px;margin-bottom:16px}

<script>
/* ═══════════════════════════════════════
   PO Sizing V7.1 — Supabase Cloud Backend
   ═══════════════════════════════════════ */

// Supabase configuration
const SUPABASE_URL='https://qwtylbbqwkchqkmaycbj.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3dHlsYmJxd2tjaHFrbWF5Y2JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTkxODgsImV4cCI6MjA5MzQ5NTE4OH0.F9CmnmHMc5ST2I_PD3L9OY-_uwNSQKL87vy1T9VKeQw';
const ALLOWED_DOMAIN='@fahertybrand.com';
const SUPA=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});

// Auth state — populated on login, used for attribution writes
const Auth={user:null,email:null,displayName:null};

// ═══ Display name derivation ═══
// "julia.appicelli@fahertybrand.com" → "Julia Appicelli"
function deriveDisplayName(email){
  if(!email)return 'Unknown';
  const local=email.split('@')[0]||email;
  return local.split(/[._\-]+/).map(p=>p?p.charAt(0).toUpperCase()+p.slice(1).toLowerCase():'').filter(Boolean).join(' ')||local;
}

function formatRelTime(iso){
  if(!iso)return '';
  const d=new Date(iso),now=new Date(),diff=(now-d)/1000;
  if(diff<60)return 'just now';
  if(diff<3600)return Math.floor(diff/60)+'m ago';
  if(diff<86400)return Math.floor(diff/3600)+'h ago';
  if(diff<86400*7)return Math.floor(diff/86400)+'d ago';
  return d.toLocaleDateString();
}

// ═══ Auth flow ═══
async function sendMagicLink(){
  const input=document.getElementById('login-email');
  const msg=document.getElementById('login-msg');
  const btn=document.getElementById('login-btn');
  const email=(input.value||'').trim().toLowerCase();
  msg.className='login-msg';msg.textContent='';
  if(!email||!email.includes('@')){msg.className='login-msg err';msg.textContent='Please enter a valid email.';return}
  if(!email.endsWith(ALLOWED_DOMAIN)){msg.className='login-msg err';msg.textContent='Only '+ALLOWED_DOMAIN+' email addresses are allowed.';return}
  btn.disabled=true;btn.textContent='Sending...';
  try{
    const{error}=await SUPA.auth.signInWithOtp({
      email,
      options:{emailRedirectTo:window.location.origin+window.location.pathname}
    });
    if(error)throw error;
    msg.className='login-msg ok';msg.textContent='✓ Check your email for the magic link. It\'ll be valid for 24 hours.';
    btn.textContent='Sent';
  }catch(err){
    msg.className='login-msg err';msg.textContent='Error: '+err.message;
    btn.disabled=false;btn.textContent='Send magic link';
  }
}

async function logout(){
  if(!confirm('Sign out?'))return;
  await SUPA.auth.signOut();
  // Clear in-memory state
  A.raw={inventory:null,sales:null,linelist:null,wip:null};
  A.rawCSV={};A.uploadMeta={};A.cloudMeta={};
  A.presMins={};A.presMinsMeta={};A.scaleSizes={};A.scaleSizeCount={};
  A.activeSeason=null;A.accepted={};A.overrides={};
  Auth.user=null;Auth.email=null;Auth.displayName=null;
  showLogin();
}

function showLogin(){
  document.getElementById('login').classList.add('active');
  document.getElementById('welcome').classList.remove('shown');
  document.getElementById('dash').classList.remove('active');
  // Reset login form
  const msg=document.getElementById('login-msg');if(msg){msg.className='login-msg';msg.textContent=''}
  const btn=document.getElementById('login-btn');if(btn){btn.disabled=false;btn.textContent='Send magic link'}
  const inp=document.getElementById('login-email');if(inp)inp.value='';
}

function hideLogin(){
  document.getElementById('login').classList.remove('active');
  document.getElementById('welcome').classList.add('shown');
  // Update user badge
  const badge=document.getElementById('user-badge');
  if(badge&&Auth.displayName)badge.innerHTML='<b>'+esc(Auth.displayName)+'</b>';
}

// ═══ Cloud: CSV files (Storage + metadata table) ═══
async function cloudUploadCSV(key,text,fileName,rowCount,colCount){
  const path=key+'.csv';
  // Upload to Storage (upsert to replace existing)
  const{error:upErr}=await SUPA.storage.from('csv-uploads').upload(path,new Blob([text],{type:'text/csv'}),{upsert:true,contentType:'text/csv'});
  if(upErr)throw upErr;
  // Insert/update metadata row
  const{error:metaErr}=await SUPA.from('csv_files').upsert({
    key,filename:fileName,row_count:rowCount,col_count:colCount,storage_path:path,
    updated_by_email:Auth.email,updated_by_name:Auth.displayName,updated_at:new Date().toISOString()
  },{onConflict:'key'});
  if(metaErr)throw metaErr;
}

async function cloudDownloadCSV(path){
  const{data,error}=await SUPA.storage.from('csv-uploads').download(path);
  if(error)throw error;
  return await data.text();
}

async function cloudListCSVMeta(){
  const{data,error}=await SUPA.from('csv_files').select('*');
  if(error)throw error;
  const out={};(data||[]).forEach(r=>{out[r.key]=r});
  return out;
}

// ═══ Cloud: Pres Mins ═══
async function cloudListPresMins(){
  const{data,error}=await SUPA.from('pres_mins').select('*');
  if(error)throw error;
  return data||[];
}

async function cloudSavePresMin(scaleName,division,sizes,mins,onlineOnlySizes,onlineFlat){
  const{error}=await SUPA.from('pres_mins').upsert({
    scale_name:scaleName,division,sizes,mins,
    online_only_sizes:onlineOnlySizes||[],
    online_flat:(onlineFlat===undefined||onlineFlat===null)?5:onlineFlat,
    updated_by_email:Auth.email,updated_by_name:Auth.displayName,updated_at:new Date().toISOString()
  },{onConflict:'scale_name'});
  if(error)throw error;
}

async function cloudDeletePresMin(scaleName){
  const{error}=await SUPA.from('pres_mins').delete().eq('scale_name',scaleName);
  if(error)throw error;
}

// ═══ Cloud: Curve Overrides (V9.3) ═══
// Each row is a concrete (division, size_scale, category, channel, size) cell with a percent.
// "ALL" category imports are expanded to per-category rows at import time, so stored rows are
// always concrete categories. Channel is 'Retail' | 'Online' (ALL-channel imports expand to both).
// Table schema (run in Supabase SQL editor):
//   create table curve_overrides (
//     id uuid primary key default gen_random_uuid(),
//     division text not null,
//     size_scale text not null,
//     category text not null,
//     channel text not null,            -- 'Retail' | 'Online'
//     curve jsonb not null,             -- { size: percent, ... } percents 0..100
//     raw_sum numeric,                  -- sum of percents as imported (for the <100 yellow flag)
//     updated_by_email text, updated_by_name text,
//     updated_at timestamptz default now(),
//     unique(division, size_scale, category, channel)
//   );
//   alter table curve_overrides enable row level security;
//   create policy "read curve_overrides" on curve_overrides for select to authenticated using (true);
//   create policy "write curve_overrides" on curve_overrides for all to authenticated using (true) with check (true);
//   grant all on curve_overrides to authenticated;
async function cloudListCurveOverrides(){
  const{data,error}=await SUPA.from('curve_overrides').select('*');
  if(error)throw error;
  return data||[];
}
// Upsert one concrete cell (one category+channel curve). curve is {size:pct}.
async function cloudSaveCurveOverride(division,sizeScale,category,channel,curve,rawSum){
  const{error}=await SUPA.from('curve_overrides').upsert({
    division,size_scale:sizeScale,category,channel,curve,raw_sum:rawSum,
    updated_by_email:Auth.email,updated_by_name:Auth.displayName,updated_at:new Date().toISOString()
  },{onConflict:'division,size_scale,category,channel'});

function setupRealtime(){

// Tab-focus listener — when the tab becomes visible after being hidden, do a metadata sync.

// Compare in-memory CSV metadata against cloud's current state. If anything has shifted,
// trigger a full refresh. Used by tab-focus listener and 60s polling.
async function checkAndAutoRefresh(reason){
  if(_refreshing)return;
  try{
    const cloudCsvMeta=await cloudListCSVMeta();
    let changed=false;
    let actorByKey={};
    for(const key of['inventory','sales','linelist','wip']){
      const cloud=cloudCsvMeta[key];
      const local=A.cloudMeta&&A.cloudMeta[key];
      if(!cloud)continue;
      const cloudTs=cloud.updated_at||'';
      const localTs=(local&&local.updated_at)||'';
      if(cloudTs&&cloudTs!==localTs){
        changed=true;
        // Only show toast if not our own write
        if(cloud.updated_by_email!==Auth.email){
          actorByKey[key]={
            who:cloud.updated_by_name||'Someone',
            what:formatCsvLabel(key),
            rows:cloud.row_count||0,
            cols:cloud.col_count||0,
            when:cloudTs
          };
        }
      }
    }
    if(changed){
      // Merge into pending toasts and trigger refresh
      Object.assign(_pendingActorByKey,actorByKey);
      autoRefresh(reason);
    }
  }catch(err){
    // Silent fail — polling shouldn't surface errors to the user
    console.warn('Auto-refresh check failed ('+reason+'):',err);
  }
}

// Coalesces rapid-fire updates into a single refresh, then drains the toast queue.
// Each pending update produces its own toast.
let _refreshDebounceTimer=null;
function autoRefresh(reason){
  if(_refreshDebounceTimer)clearTimeout(_refreshDebounceTimer);
  // Debounce ~400ms so a burst of writes (e.g. inventory + sales + linelist back-to-back)
  // results in one refresh + multiple toasts, not multiple refreshes.
  _refreshDebounceTimer=setTimeout(async()=>{
    _refreshDebounceTimer=null;
    if(_refreshing){
      // Another refresh in flight — try again shortly
      _refreshDebounceTimer=setTimeout(()=>autoRefresh(reason),500);
      return;
    }
    _refreshing=true;
    try{
      await refreshAllFromCloud();
      // Drain pending toasts (one per file/scale), most-recent first
      const entries=Object.entries(_pendingActorByKey);
      _pendingActorByKey={};
      entries.forEach(([key,info])=>{
        let msg;
        if(info.scale){
          msg=info.who+' updated '+info.what+' · just now';
        } else {
          // "Sera Borg replaced Linelist · 65r × 163c · just now"
          msg=info.who+' replaced '+info.what+' · '+fmt(info.rows)+'r × '+info.cols+'c · just now';
        }
        toast(msg);
      });
    }catch(err){
      console.error('Auto-refresh failed:',err);
    }finally{
      _refreshing=false;
    }
  },400);
}

// Refresh from cloud while preserving per-user state (accepted SKUs, overrides, expanded states, sort/filter prefs).
// Curve adjustments will auto-wipe via fingerprint mismatch inside loadFromCloud → loadCurveAdjustments.
async function refreshAllFromCloud(){
  // Snapshot per-user ephemeral state
  const savedAccepted={...A.accepted};
  const savedOverrides=JSON.parse(JSON.stringify(A.overrides||{}));
  const savedActiveSeason=A.activeSeason;
  const savedSelectedSKU=A.selectedSKU;
  const savedView=A.view;
  const savedModule=A.module;
  const savedFilters=JSON.parse(JSON.stringify(A.filters));
  const savedSort={key:A.sortKey,dir:A.sortDir};
  const savedSearch=A.searchTerm;
  const savedExpandedWip=A.expandedWipSku;
  const savedExpandedChannel=A.expandedChannelSku;

  // Pull fresh data from cloud (this also re-applies curve adjustments via fingerprint check)
  await loadFromCloud();

  // Restore per-user state where it still applies
  A.filters=savedFilters;
  A.sortKey=savedSort.key;A.sortDir=savedSort.dir;
  A.searchTerm=savedSearch;
  A.expandedWipSku=savedExpandedWip;
  A.expandedChannelSku=savedExpandedChannel;

  // Reprocess the active season if applicable (rebuilds A.skus from new linelist)
  if(savedActiveSeason){
    A.activeSeason=savedActiveSeason;
    A.module=savedModule;
    if(allUp())processData(); // populates A.skus with the new data
    // Restore accepted SKUs that still exist in the new data
    A.accepted={};
    for(const sku in savedAccepted){
      if(A.skus&&A.skus[sku])A.accepted[sku]=true;
    }
    // Restore overrides for SKUs+sizes that still exist
    A.overrides={};
    for(const sku in savedOverrides){
      if(A.skus&&A.skus[sku]){
        const newSizes=new Set(A.skus[sku].sizes||[]);
        const sizeOvr={};
        for(const sz in savedOverrides[sku]){
          if(newSizes.has(sz))sizeOvr[sz]=savedOverrides[sku][sz];
        }
        if(Object.keys(sizeOvr).length)A.overrides[sku]=sizeOvr;
      }
    }
    // Re-enter the appropriate view
    if(savedView==='detail'&&savedSelectedSKU&&A.skus[savedSelectedSKU]){
      A.selectedSKU=savedSelectedSKU;A.view='detail';
    } else {
      A.selectedSKU=null;A.view='grid';
    }
  }

  // Re-render whatever view is active
  if(typeof render==='function'&&document.getElementById('main-area'))render();
  if(typeof renderDivisionPills==='function')renderDivisionPills();
  if(typeof updateExpCt==='function')updateExpCt();
  trySeasons();
}

// ─── CSV Parser ───
function parseCSV(t,hi,mergePrevHeader){
  hi=hi||0;const rl=[];let c='',q=false,r=[],fieldStart=true;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(ch==='"'){
      if(q){
        if(t[i+1]==='"'){c+='"';i++}
        else q=false;
      } else if(fieldStart){q=true}
      else{c+='"'}
    } else if(ch===','&&!q){
      r.push(c.trim());c='';fieldStart=true;continue;
    } else if((ch==='\n'||ch==='\r')&&!q){
      if(ch==='\r'&&t[i+1]==='\n')i++;
      r.push(c.trim());
      if(r.length>1||(r.length===1&&r[0]!==''))rl.push(r);
      c='';r=[];fieldStart=true;continue;
    } else{c+=ch}
    fieldStart=false;
  }
  if(c||r.length){r.push(c.trim());rl.push(r)}
  // Find the header row: first row that contains a 'SKU' cell (case-insensitive)
  let hdrIdx=-1;
  for(let i=0;i<Math.min(rl.length,8);i++){
    const row=rl[i]||[];
    if(row.some(cell=>cell.replace(/^\uFEFF/,'').trim().toLowerCase()==='sku')){hdrIdx=i;break}
  }
  if(hdrIdx===-1)return[];
  let h=rl[hdrIdx].map(x=>x.replace(/^\uFEFF/,'').trim());
  // For Linelist: merge row 2 (group labels) into row 3 (column names) to disambiguate.
  // Strategy: find which row 3 labels appear more than once, and ONLY merge those with their
  // forward-filled row 2 group. Unique labels stay as-is. This prevents over-eager prefixing
  // of unrelated columns.
  if(mergePrevHeader&&hdrIdx>0){
    const prev=rl[hdrIdx-1].map(x=>x.replace(/^\uFEFF/,'').trim());
    // Forward-fill row 2: empty cells inherit the most recent non-empty group above
    const filled=[];let last='';
    for(let i=0;i<prev.length;i++){if(prev[i])last=prev[i];filled.push(last)}
    // Count row 3 occurrences
    const counts={};h.forEach(c=>{const k=c.toLowerCase();counts[k]=(counts[k]||0)+1});
    h=h.map((cell,i)=>{
      const isDup=counts[cell.toLowerCase()]>1;
      const ownGroup=prev[i]||''; // non-forward-filled value at this position
      const grp=filled[i]||'';
      if(isDup){
        // Need disambiguation — use forward-filled group if available
        if(grp&&grp!==cell)return grp+' | '+cell;
      } else if(ownGroup&&ownGroup!==cell){
        // Has its own group label (not forward-filled) — merge for clarity
        return ownGroup+' | '+cell;
      }
      return cell;
    });
    // Final dedup safety net: suffix any still-duplicate keys
    const seen={};
    h=h.map(k=>{if(seen[k]){seen[k]++;return k+' ('+seen[k]+')'}seen[k]=1;return k});
  }
  const res=[];
  for(let i=hdrIdx+1;i<rl.length;i++){
    const row=rl[i];if(!row||row.length<2)continue;
    const o={};h.forEach((hh,idx)=>{o[hh]=row[idx]||''});res.push(o);
  }
  return res;
}

function findCol(row,cands){
  if(!row)return null;const keys=Object.keys(row);
  for(const c of cands){const f=keys.find(k=>k.toLowerCase()===c.toLowerCase());if(f)return f}
  for(const c of cands){const cl=c.toLowerCase();const f=keys.find(k=>k.toLowerCase().includes(cl));if(f)return f}
  return null;
}

// numP strips the dot and truncates (fine for unit counts, wrong for 27.5%).

const SO={XXS:1,XS:2,S:3,M:4,L:5,XL:6,XXL:7,XXXL:8,'2XL':7,'3XL':8,MT:5,LT:6,XLT:7,XXLT:8,OS:0};
function ssort(a,b){
  const oa=SO[a.toUpperCase()]??null,ob=SO[b.toUpperCase()]??null;
  if(oa!==null&&ob!==null)return oa-ob;if(oa!==null)return-1;if(ob!==null)return 1;
  const pa=a.match(/^(\d+)/),pb=b.match(/^(\d+)/);
  if(pa&&pb){const wa=+pa[1],wb=+pb[1];if(wa!==wb)return wa-wb;const la=a.match(/(\d+)L$/),lb=b.match(/(\d+)L$/);if(la&&lb)return+la[1]-+lb[1]}
  return a.localeCompare(b);
}

// ─── Delivery month calc ───
const MONTH_MAP={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};

// ═══ V9.9: week-of-year helpers for the seasonal rate ═══
// The sales export carries a Week column that until now was only used to COUNT weeks-live; the
// weekly units themselves were summed away. We now keep the weekly shape, which requires mapping
// each label onto a 1-53 week-of-year slot.
function weekOfYear(d){
  if(!d||isNaN(d))return null;
  const jan1=new Date(d.getFullYear(),0,1);
  const n=Math.floor((d-jan1)/(7*86400000))+1;
  return Math.max(1,Math.min(53,n));
}

// Tolerant of the label shapes these exports use: 'W22', '2026-W22', 'Week 22', '202622',
// a bare '22', or a plain date. NOTE: a 4-5-4 fiscal week number can sit ~1 week off the
// calendar week this returns. That offset is immaterial for a seasonality curve, but it is the
// reason we never join on this number — it only ever indexes a shape.
function parseWeekLabel(raw){
  const t=String(raw==null?'':raw).trim();
  if(!t)return null;
  let m=t.match(/(?:WEEK|WK|W)\s*[-_ ]?(\d{1,2})(?!\d)/i);
  if(m){const n=parseInt(m[1],10);if(n>=1&&n<=53)return n}
  m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return weekOfYear(new Date(+m[1],+m[2]-1,+m[3]));
  m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return weekOfYear(new Date(+m[3],+m[1]-1,+m[2]));
  m=t.match(/^(\d{4})(\d{2})$/);          // YYYYWW
  if(m){const n=parseInt(m[2],10);if(n>=1&&n<=53)return n}
  m=t.match(/^(\d{1,2})$/);
  if(m){const n=parseInt(m[1],10);if(n>=1&&n<=53)return n}
  return null;
}
function deliveryToWeeks(deliveryMonth,seasonCode){
  if(!deliveryMonth||!seasonCode)return 12;
  const base=deliveryMonth.toLowerCase().replace(/_\d+$/,'');
  const mo=MONTH_MAP[base];if(!mo)return 12;
  const yrMatch=seasonCode.match(/(\d{2})$/);if(!yrMatch)return 12;
  let yr=2000+parseInt(yrMatch[1]);
  let target=new Date(yr,mo-1,1);
  const now=new Date();
  // V8.4: Seasons straddle calendar-year boundaries. A "January" delivery for a Fall-26
  // season actually means January 2027, not January 2026 (which is in the past).
  // If the naive target date is already well behind us (>4 weeks), roll it forward a year.
  // The 4-week grace prevents mis-rolling a legitimate current-month delivery.
  const graceMs=4*7*24*60*60*1000;
  if(target<new Date(now.getTime()-graceMs)){
    target=new Date(yr+1,mo-1,1);
  }
  return Math.max(0,Math.round((target-now)/(7*24*60*60*1000)));
}

// Shift a delivery month forward by N months, preserving any _N suffix
// e.g. shiftDelivery('November_2', 1) => 'December_2'
//      shiftDelivery('December_2', 1) => 'January_2' (year wraps but suffix kept)
function shiftDeliveryMonth(deliveryMonth,offset){
  if(!deliveryMonth||offset===0)return deliveryMonth||'';
  const m=deliveryMonth.match(/^([A-Za-z]+)(_\d+)?$/);
  if(!m)return deliveryMonth;
  const base=m[1].toLowerCase();
  const suffix=m[2]||'';
  const mo=MONTH_MAP[base];if(!mo)return deliveryMonth;
  let newMo=mo+offset;
  // Wrap modulo 12 for January follows December
  while(newMo>12)newMo-=12;
  while(newMo<1)newMo+=12;
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return monthNames[newMo-1]+suffix;
}

// ═══ V9.9: Season delivery windows ═══
// Each season owns a contiguous block of delivery months, so a flow must never push a receipt
// past the end of its OWN season. An August receipt on a SU27 buy is a FA27 month and is not a
// valid SU delivery. Windows below match the linelist's observed season/month distribution:
//   SP → Jan–Apr    SU → May–Jul    FA → Aug–Oct    HO → Nov–Jan (wraps the calendar year)
// The HO window is expressed as 11–13, where 13 means January of the following year.
const SEASON_WINDOWS={SP:[1,4],SU:[5,7],FA:[8,10],HO:[11,13]};

// The season FAMILY ('SU27' -> 'SU'). Year is deliberately dropped: a SU27 buy should learn its
// seasonal shape from SU26 and SU25 selling, not from whatever else shipped in 2027.
function seasonPrefix(seasonCode){
  const m=String(seasonCode||'').trim().toUpperCase().match(/^([A-Z]{2})/);
  return m?m[1]:null;
}

function seasonMonthWindow(seasonCode){
  const m=String(seasonCode||'').trim().toUpperCase().match(/^([A-Z]{2})/);
  if(!m)return null;
  return SEASON_WINDOWS[m[1]]||null;
}

// How many months forward a flow may shift before it leaves the buy's own season.
//   0 → the base delivery is already the season's last month, so there is nowhere to flow to.
//   Unknown season prefixes (e.g. LO, which has no regular window) keep the previous ceiling of 2.
function maxFlowOffset(rec){
  const win=seasonMonthWindow(rec.season);
  if(!win)return 2;
  const base=String(rec.deliveryMonth||'').toLowerCase().replace(/_\d+$/,'');
  const mo=MONTH_MAP[base];
  if(!mo)return 2;
  // Normalise into the window's own numbering so a Nov–Jan season compares correctly.
  let cur=mo;const end=win[1];
  if(end>12&&cur<win[0])cur+=12;      // January sits at 13 on an 11–13 window
  if(cur<win[0]||cur>end)return 0;    // delivery already outside its season — don't push it further
  return Math.max(0,end-cur);
}

function handleUpload(key,inp){
  const file=inp.files[0];if(!file)return;
  if(!Auth.email){alert('Please log in first.');return}
  const reader=new FileReader();
  reader.onload=async function(ev){
    const text=ev.target.result;
    let hi=detectHeaderRow(text,key);
    A.raw[key]=parseCSV(text,hi,key==='linelist');
    A.rawCSV[key]=text;
    const rows=A.raw[key].length;
    const cols=A.raw[key][0]?Object.keys(A.raw[key][0]).length:0;
    A.uploadMeta[key]={rows,cols,date:new Date().toLocaleString(),fileName:file.name};
    A.cloudMeta[key]={updated_by_name:Auth.displayName,updated_by_email:Auth.email,updated_at:new Date().toISOString(),filename:file.name,row_count:rows,col_count:cols};
    updateChip(key);
    toast('Uploading '+key+' to cloud...');
    try{
      await cloudUploadCSV(key,text,file.name,rows,cols);
      toast(key.charAt(0).toUpperCase()+key.slice(1)+' synced · '+fmt(rows)+' rows');
      const labelMap={inventory:'Inventory',sales:'L52W Sales',linelist:'Linelist',wip:'WIP'};
      cloudLogEvent('csv_upload','csv',key,'updated '+(labelMap[key]||key)+' CSV',{filename:file.name,rows,cols});
    }catch(err){
      console.error('Cloud upload failed:',err);
      toast('Cloud upload failed: '+err.message);
    }
    // Build scaleSizes from data whenever linelist or sales/inv is uploaded
    if(allUp())buildScaleSizes();
    // Wipe curve adjustments — the underlying sales data has shifted, so prior factors are stale
    if(Object.keys(A.curveAdjustments).length>0){
      A.curveAdjustments={};A.curveAdjStaged={};
      try{localStorage.removeItem(CURVE_ADJ_KEY)}catch(e){}
      toast('Curve adjustments reset (CSV uploaded)');
    }
    // Wipe manual curve selections too — hierarchy levels may have shifted with new data
    if(Object.keys(A.curveOverrides).length>0){
      A.curveOverrides={};
      try{localStorage.removeItem(CURVE_OVR_KEY)}catch(e){}
    }
    trySeasons();
    inp.value='';
  };reader.readAsText(file);
}

function updateChip(key){
  const chip=document.getElementById('uc-'+key);
  const meta=document.getElementById('um-'+key);
  if(A.raw[key]&&chip){
    chip.classList.add('ok');
    const m=A.uploadMeta[key];
    const cm=A.cloudMeta[key];
    let txt=fmt(m.rows)+'r × '+m.cols+'c';
    if(cm&&cm.updated_by_name)txt+=' · '+cm.updated_by_name+' '+formatRelTime(cm.updated_at);
    else if(m.date)txt+=' · '+m.date;
    if(meta)meta.textContent=txt;

function allUp(){return A.raw.inventory&&A.raw.sales&&A.raw.linelist&&A.raw.wip}

function buildScaleSizes(){
  // Build scaleSizes from linelist + sales + inventory data (used internally for SKU matching)
  // Does NOT create or modify presMinsMeta — that is user-controlled only.
  const ll=A.raw.linelist,sales=A.raw.sales,inv=A.raw.inventory;
  if(!ll||!ll[0])return;
  const lSS=findCol(ll[0],['Size Scale']),lS=findCol(ll[0],['SKU']);
  const skuScale={};ll.forEach(r=>{skuScale[r[lS]]=r[lSS]||''});
  A.scaleSizes={};
  if(sales&&sales[0]){const sS=findCol(sales[0],['SKU']),sZ=findCol(sales[0],['Size']);sales.forEach(r=>{const sc=skuScale[r[sS]];if(sc&&r[sZ]){if(!A.scaleSizes[sc])A.scaleSizes[sc]=new Set();A.scaleSizes[sc].add(r[sZ])}})}
  if(inv&&inv[0]){const iS=findCol(inv[0],['SKU']),iZ=findCol(inv[0],['Size']);inv.forEach(r=>{const sc=skuScale[r[iS]];if(sc&&r[iZ]){if(!A.scaleSizes[sc])A.scaleSizes[sc]=new Set();A.scaleSizes[sc].add(r[iZ])}})}
  for(const s in A.scaleSizes){A.scaleSizes[s]=[...A.scaleSizes[s]].sort(ssort);A.scaleSizeCount[s]=A.scaleSizes[s].length}
  // Cache scaleSizes locally (best-effort; not persisted to cloud since it's derived)
  try{dbPut('config','scaleSizes',Object.fromEntries(Object.entries(A.scaleSizes).map(([k,v])=>[k,Array.isArray(v)?v:[...v]])))}catch(e){}
}

// ═══ Curve adjustments persistence (per-user, in localStorage) ═══
// Tied to a "data fingerprint" computed from current CSV metadata. Whenever any CSV is
// reuploaded by anyone (which propagates via realtime → loadFromCloud), the fingerprint
// changes and stale adjustments are discarded.
const CURVE_ADJ_KEY='posizing_curve_adjustments_v1';

function computeDataFingerprint(){
  // Use the cloud metadata `updated_at` for each file. If any is missing, skip with empty string.
  const keys=['inventory','sales','linelist','wip'];
  return keys.map(k=>{
    const m=A.cloudMeta&&A.cloudMeta[k];
    return m&&m.updated_at?m.updated_at:'';
  }).join('|');
}

function loadCurveAdjustments(){
  try{
    const raw=localStorage.getItem(CURVE_ADJ_KEY);
    if(!raw){A.curveAdjustments={};return}
    const parsed=JSON.parse(raw);
    if(!parsed||typeof parsed!=='object'){A.curveAdjustments={};return}
    // Drop if fingerprint mismatched (user is on different CSVs than when they saved)
    const currentFp=computeDataFingerprint();
    if(parsed.fingerprint!==currentFp){
      A.curveAdjustments={};
      try{localStorage.removeItem(CURVE_ADJ_KEY)}catch(e){}
      return;
    }
    A.curveAdjustments=parsed.adjustments||{};
  }catch(err){
    console.warn('Could not load curve adjustments:',err);
    A.curveAdjustments={};
  }
}

function saveCurveAdjustments(){
  try{
    const fp=computeDataFingerprint();
    const payload={fingerprint:fp,adjustments:A.curveAdjustments,savedAt:new Date().toISOString()};
    localStorage.setItem(CURVE_ADJ_KEY,JSON.stringify(payload));
  }catch(err){console.warn('Could not save curve adjustments:',err)}
}

// ═══ V9: Chase PO persistence (local, per-user) ═══
// Chase items are off-plan POs the user manually defines. Stored in localStorage, fingerprint-scoped
// so they survive refresh but wipe if the underlying CSVs change materially (since OH/sales/store
// data they depend on would be stale).
const CHASE_KEY='posizing_chase_items_v1';
function loadChaseItems(){
  try{
    const raw=localStorage.getItem(CHASE_KEY);
    if(!raw){A.chaseItems=[];return}
    const parsed=JSON.parse(raw);
    if(!parsed||typeof parsed!=='object'){A.chaseItems=[];return}
    const currentFp=computeDataFingerprint();
    if(parsed.fingerprint!==currentFp){
      // Data changed — keep the chase definitions (they're user intent) but they'll re-resolve
      // OH/sales against the new data on next render. We keep them rather than wipe, since the
      // user explicitly created them; only their derived numbers refresh.
      A.chaseItems=parsed.items||[];
      saveChaseItems(); // re-stamp fingerprint
      return;
    }
    A.chaseItems=parsed.items||[];
  }catch(err){
    console.warn('Could not load chase items:',err);
    A.chaseItems=[];
  }
}
function saveChaseItems(){
  try{
    const payload={fingerprint:computeDataFingerprint(),items:A.chaseItems,savedAt:new Date().toISOString()};
    localStorage.setItem(CHASE_KEY,JSON.stringify(payload));
  }catch(err){console.warn('Could not save chase items:',err)}
}

async function loadFromCloud(){
  // 1. Load CSV metadata + files
  let cloudCsvMeta={};
  try{cloudCsvMeta=await cloudListCSVMeta()}
  catch(err){console.error('cloudListCSVMeta failed:',err);return}
  for(const key of['inventory','sales','linelist','wip']){
    const meta=cloudCsvMeta[key];
    if(meta&&meta.storage_path){
      try{
        const text=await cloudDownloadCSV(meta.storage_path);
        A.rawCSV[key]=text;
        let hi=detectHeaderRow(text,key);
        A.raw[key]=parseCSV(text,hi,key==='linelist');
        A.uploadMeta[key]={rows:meta.row_count||A.raw[key].length,cols:meta.col_count||0,date:new Date(meta.updated_at).toLocaleString(),fileName:meta.filename||key+'.csv'};
        A.cloudMeta[key]=meta;
      }catch(err){
        console.error('Failed to load CSV',key,err);
        A.raw[key]=null;A.rawCSV[key]=null;
      }
    } else {
      A.raw[key]=null;A.rawCSV[key]=null;A.uploadMeta[key]=null;A.cloudMeta[key]=null;
    }
    updateChip(key);
  }
  // 2. Load Pres Mins
  try{
    const rows=await cloudListPresMins();
    A.presMins={};A.presMinsMeta={};A.pmMeta={};
    rows.forEach(r=>{
      A.presMinsMeta[r.scale_name]={div:r.division||'Mens',sizes:r.sizes||[],onlineOnly:r.online_only_sizes||[],onlineFlat:r.online_flat!==undefined&&r.online_flat!==null?Number(r.online_flat):5};
      A.presMins[r.scale_name]=r.mins||{};
      A.pmMeta[r.scale_name]={updated_by_name:r.updated_by_name,updated_by_email:r.updated_by_email,updated_at:r.updated_at};
    });
  }catch(err){
    console.error('cloudListPresMins failed:',err);
  }
  // 2b. Load Curve Overrides (V9.3) — shared, keyed by div|scale|category|channel
  try{
    const rows=await cloudListCurveOverrides();
    A.curveImports={};
    rows.forEach(r=>{
      const key=r.division+'|'+r.size_scale+'|'+r.category+'|'+r.channel;
      // _div/_scale/_value/_channel carry the RAW stored values for normalized matching + exact deletes
      A.curveImports[key]={curve:r.curve||{},rawSum:r.raw_sum,by:r.updated_by_name,at:r.updated_at,
        _div:r.division,_scale:r.size_scale,_value:r.category,_channel:r.channel};
    });
    rebuildCurveImportIndex();
  }catch(err){
    console.warn('cloudListCurveOverrides failed (table may not exist yet):',err);
    A.curveImports={};rebuildCurveImportIndex();
  }
  // 3. Rebuild derived caches
  A.scaleSizes={};A.scaleSizeCount={};
  if(allUp())buildScaleSizes();
  // 4. Load any persisted curve adjustments — but only if their data fingerprint matches.
  // If any CSV has been re-uploaded since the user last saved adjustments, they're discarded.
  loadCurveAdjustments();
  loadCurveOverrides();
  loadChaseItems();
  trySeasons();
}


function trySeasons(){
  const el=document.getElementById('s-area');if(!el)return;
  if(!allUp()){el.innerHTML='<div class="s-wait">Upload all 4 data sources to continue</div>';return}
  const ll=A.raw.linelist,sc=findCol(ll[0],['Season Code']);
  const dbCol=findCol(ll[0],['Total DTC Buy']);
  const bsCol=findCol(ll[0],['Total Buy | Buy Status','Buy Status']);
  // Per season: total SKUs, SKUs with non-zero buy, Confirmed buys (the actual sized-eligible set)
  const totals={},withBuy={},confirmed={};
  ll.forEach(r=>{
    const s=r[sc]||'';if(!s)return;
    totals[s]=(totals[s]||0)+1;
    const buy=numP(r[dbCol]);
    if(buy>0){
      withBuy[s]=(withBuy[s]||0)+1;
      const bs=String(r[bsCol]||'').trim().toLowerCase();
      if(bs==='confirmed')confirmed[s]=(confirmed[s]||0)+1;
    }
  });
  A.seasons=Object.keys(totals).sort();
  let h='<div class="s-grid">';
  A.seasons.forEach(s=>{
    const tot=totals[s]||0,wb=withBuy[s]||0,cb=confirmed[s]||0;
    h+='<div class="s-btn" onclick="goSeason(\''+esc(s)+'\')">'+
       '<div class="code">'+esc(s)+'</div>'+
       '<div class="ct">Total SKUs: '+fmt(tot)+'</div>'+
       '<div class="ct ct-buy">SKUs with Buys: '+fmt(wb)+'</div>'+
       '<div class="ct ct-conf">Confirmed Buys: '+fmt(cb)+'</div>'+
       '</div>';
  });
  // V9: Chase module entry — off-plan POs sized on a tighter timeline
  const chaseCount=(A.chaseItems||[]).length;
  h+='<div class="s-btn s-btn-chase" onclick="goChase()">'+
     '<div class="code">⚡ Chase</div>'+
     '<div class="ct">Off-plan POs</div>'+
     '<div class="ct ct-chase">'+(chaseCount?fmt(chaseCount)+' chase item'+(chaseCount===1?'':'s'):'None yet')+'</div>'+
     '</div>';
  el.innerHTML=h+'</div>';
}

function processData(){

  buildScaleSizes();

  const c={};
