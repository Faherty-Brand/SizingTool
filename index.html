window.debugRate=debugRate;

function projBOP(rec){
  const w=deliveryToWeeks(rec.deliveryMonth,rec.season);const bop={};
  // Get per-size weekly rate (SKU's own data, or parent-rate fallback)
  const wkInfo=getWeeklyRate(rec);
  const rawRates=wkInfo.rate;
  // V9.9: rebase that rate to an annual-average level, then re-apply seasonality per week.
  const seas=getSeasonalIndex(rec,wkInfo);
  const rebase=seas?seasonRebase(seas,rateMeasuredWeeks(rec,wkInfo)):1;
  // Get pending receipts AND when they arrive (week offset from today, 0 = this week).
  // Filter to receipts arriving before the buy delivery, since later ones don't affect BOP.
  const buyDelivery=getBuyDeliveryDate(rec);
  const today=new Date();today.setHours(0,0,0,0);
  // Seasonal multiplier for projected week `wk`, by that week's real calendar position.
  const seasMult=function(wk){
    if(!seas)return 1;
    const v=seas.idx[weekOfYear(new Date(today.getTime()+wk*7*86400000))];
    return v===undefined?1:v;
  };
  // Build a per-size, per-week receipt schedule: receipts[size][weekOffset] = units arriving that week
  const receiptsByWeek={};rec.sizes.forEach(s=>{receiptsByWeek[s]=[]});
  if(rec.wipByDate){
    for(const dKey in rec.wipByDate){
      const entry=rec.wipByDate[dKey];
      if(buyDelivery&&entry._sortDate&&entry._sortDate>buyDelivery)continue;
      const d=entry._sortDate||today;
      const weekOffset=Math.max(0,Math.floor((d-today)/(7*86400000)));
      if(weekOffset>=w)continue; // arrives at or after delivery - doesn't help BOP
      for(const s in entry.sizes){
        if(receiptsByWeek[s]===undefined)continue;
        if(!receiptsByWeek[s][weekOffset])receiptsByWeek[s][weekOffset]=0;
        receiptsByWeek[s][weekOffset]+=entry.sizes[s]||0;
      }
    }
  }
  // Per-size week-by-week simulation
  const stockoutWeeks={};
  const effRates={};      // V9.9: the rate that actually applied over the burn window - what the UI quotes
  const burnWindows={};   // V9.9: {startWk, weeks} so the tooltip can say which window that rate covers
  rec.sizes.forEach(s=>{
    const annual=(rawRates[s]||0)/(rebase||1);
    const oh=rec.sizeData[s].onHand||0;
    // V9.9: with nothing on hand there is nothing to deplete until stock lands, so the quoted rate
    // must cover first-pending-receipt -> delivery rather than today -> delivery.
    let firstRcpt=-1;
    if(receiptsByWeek[s])for(let k=0;k<w;k++){if(receiptsByWeek[s][k]>0){firstRcpt=k;break}}
    const startWk=oh>0?0:(firstRcpt>=0?firstRcpt:w);
    let rSum=0,rN=0;
    for(let wk=startWk;wk<w;wk++){rSum+=annual*seasMult(wk);rN++}
    effRates[s]=rN>0?rSum/rN:annual*seasMult(0);
    burnWindows[s]={startWk,weeks:rN};
    let avail=oh;
    let stockoutW=0;
    for(let wk=0;wk<w;wk++){
      const rate=annual*seasMult(wk);
      // Receipts arriving this week land at the START of the week
      const arriving=(receiptsByWeek[s]&&receiptsByWeek[s][wk])||0;
      avail+=arriving;
      if(avail<=0){
        // No stock this week at all -> full stockout
        stockoutW+=1;
        avail=0;
      } else if(rate>0&&avail<rate){
        // Partial week - we sell what we have, then run out for the rest of the week
        const fillPct=avail/rate;
        stockoutW+=(1-fillPct);
        avail=0;
      } else {
        // Full week of sell-through
        avail-=rate;
      }
    }
    bop[s]=Math.max(0,Math.round(avail));
    stockoutWeeks[s]=stockoutW;
  });
  bop._w=w;
  bop._rateInfo=wkInfo;
  bop._stockoutWeeks=stockoutWeeks;
  bop._rates=effRates;        // V9.9: window-average seasonal rate (was the flat trailing rate)
  bop._rawRates=rawRates;     // V9.9: pre-seasonal rate, kept for the tooltip
  bop._seasonal=seas?{level:seas.level,label:seas.label,weeks:seas.weeks,activeWeeks:seas.activeWeeks,units:seas.units,rebase:rebase,cohort:!!seas.cohort}:null;
  bop._burnWindows=burnWindows;
  return bop;
}

// Inner helper: allocate a buy pool against a curve with a floor map. Returns per-size alloc.
function allocateBuy(rec,pool,curve,floors,ideals){
  const alloc={};
  if(pool<=0){rec.sizes.forEach(s=>{alloc[s]=0});return alloc}
  const floorSum=rec.sizes.reduce((a,s)=>a+(floors[s]||0),0);
  if(floorSum>=pool){
    // V8.8: The combined floor exceeds the buy — we can't satisfy every size's floor.
    // Distribute the limited pool by the CURVE (sales weighting), not flat floor-proportional.
    // Use the largest-remainder method so units are spread per the curve and the total lands
    // exactly on `pool`, rather than the old approach (flat round → then dump the entire
    // remainder onto a single highest-curve size, which produced "1 each + one size gets 15").
    const curveSum=rec.sizes.reduce((a,s)=>a+(curve[s]||0),0);
    if(curveSum>0){
      const frac={};let assigned=0;
      rec.sizes.forEach(s=>{
        const ideal=(curve[s]/curveSum)*pool;
        const base=Math.floor(ideal);
        frac[s]=ideal-base;
        alloc[s]=base;
        assigned+=base;
      });
      let remaining=pool-assigned;
      const bySizeFrac=[...rec.sizes].sort((a,b)=>frac[b]-frac[a]);
      let idx=0;
      while(remaining>0&&bySizeFrac.length){
        alloc[bySizeFrac[idx%bySizeFrac.length]]++;
        remaining--;idx++;
      }
    } else {
      const baseEach=Math.floor(pool/rec.sizes.length);
      rec.sizes.forEach(s=>{alloc[s]=baseEach});
      let remaining=pool-baseEach*rec.sizes.length;
      let i=0;while(remaining>0){alloc[rec.sizes[i%rec.sizes.length]]++;remaining--;i++}
    }
  } else {
    rec.sizes.forEach(s=>{alloc[s]=floors[s]||0});
    let remaining=pool-floorSum;
    const want={};
    rec.sizes.forEach(s=>{
      const target=ideals?ideals[s]:Math.round(curve[s]*pool);
      want[s]=Math.max(0,target-(floors[s]||0));
    });
    const wantSum=Object.values(want).reduce((a,b)=>a+b,0);
    if(wantSum>0&&remaining>0){
      rec.sizes.forEach(s=>{const extra=Math.round(want[s]/wantSum*remaining);alloc[s]+=extra});
    }
    // Phase 1: reconcile preferring to keep the floor intact
    let allocTotal=rec.sizes.reduce((a,s)=>a+alloc[s],0);
    let diff=pool-allocTotal;
    while(diff!==0){
      const eligible=rec.sizes.filter(s=>diff>0||(alloc[s]>(floors[s]||0)));
      if(!eligible.length)break;
      if(diff>0){const best=eligible.reduce((a,b)=>curve[a]>=curve[b]?a:b);alloc[best]++;diff--}
      else{const best=eligible.reduce((a,b)=>(alloc[a]-(floors[a]||0))>=(alloc[b]-(floors[b]||0))?a:b);if(alloc[best]>(floors[best]||0)){alloc[best]--;diff++}else break}
    }
  }
  // Phase 2 (FINAL GUARANTEE): force the sum to match the pool exactly, even if it means
  // dipping a size below its floor. Total accuracy beats a 1u floor violation since the
  // user trusts the total to roundtrip cleanly through the export.
  let total=rec.sizes.reduce((a,s)=>a+alloc[s],0);
  let diff=pool-total;
  // V8.8: when adding leftover units, distribute across sizes by curve weight (largest-remainder)
  // instead of repeatedly bumping the single highest-curve size. The old single-size bump caused
  // a lopsided "everyone gets 1, one size gets 15" pattern when the floor capped most sizes low.
  if(diff>0){
    const curveSum=rec.sizes.reduce((a,s)=>a+(curve[s]||0),0);
    if(curveSum>0){
      // Allocate `diff` units proportional to curve, largest-remainder
      const frac={};const add={};let assigned=0;
      rec.sizes.forEach(s=>{
        const ideal=((curve[s]||0)/curveSum)*diff;
        add[s]=Math.floor(ideal);frac[s]=ideal-add[s];assigned+=add[s];
      });
      let rem=diff-assigned;
      const order=[...rec.sizes].sort((a,b)=>frac[b]-frac[a]);
      let i=0;while(rem>0&&order.length){add[order[i%order.length]]++;rem--;i++}
      rec.sizes.forEach(s=>{alloc[s]+=add[s]});
      diff=0;
    }
  }
  while(diff!==0&&rec.sizes.length){
    if(diff>0){
      // Fallback (no curve signal): round-robin across sizes rather than dumping on one
      const order=[...rec.sizes].sort((a,b)=>(curve[b]||0)-(curve[a]||0));
      order.forEach(s=>{if(diff>0){alloc[s]++;diff--}});
      if(diff>0)continue;
    } else {
      // Need to subtract — pull from the size that's furthest above its floor;
      // if all are at/below floor, pull from the largest non-zero allocation
      const aboveFloor=rec.sizes.filter(s=>alloc[s]>(floors[s]||0));
      let target;
      if(aboveFloor.length){
        target=aboveFloor.reduce((a,b)=>(alloc[a]-(floors[a]||0))>=(alloc[b]-(floors[b]||0))?a:b);
      } else {
        const nonZero=rec.sizes.filter(s=>alloc[s]>0);
        if(!nonZero.length)break;
        target=nonZero.reduce((a,b)=>alloc[a]>=alloc[b]?a:b);
      }
      alloc[target]--;diff++;
    }
  }
  return alloc;
}

// V8.3.1: After flow size breaks are built independently, the per-size totals across flows
// may not sum exactly to the original combined alloc due to rounding (e.g. a 2u total being
// split 40/30/30 produces 1/1/1 = 3u after rounding, summing 3 vs target 2).
// We reconcile by *swapping units within a flow* — if size A is over-allocated by 1u across flows,
// we subtract 1 from A in whichever flow has the most, and add 1 to whichever other size in that
// same flow is most under-allocated. This way each flow's total units stays fixed AND each size's
// cross-flow total matches the SKU's overall size break.
// V8.6: `protectedFloor` (optional) is a {flowIndex: {size: minUnits}} map. The reconciler will
// never pull a size below its protected floor in that flow (used to guard the CF Global floor).
function reconcileFlowsBySize(splits,combinedAlloc,sizes,protectedFloor){
  function floorFor(flowIdx,s){
    if(!protectedFloor||!protectedFloor[flowIdx])return 0;
    return protectedFloor[flowIdx][s]||0;
  }
  function perSizeDiff(){
    const out={};
    sizes.forEach(s=>{
      let actual=0;splits.forEach(sp=>{actual+=(sp.sizeBreak[s]||0)});
      out[s]=actual-(combinedAlloc[s]||0); // positive = over-allocated, negative = under
    });
    return out;
  }
  let safety=300;
  while(safety-->0){
    const diffs=perSizeDiff();
    let overSize=null,overVal=0,underSize=null,underVal=0;
    sizes.forEach(s=>{
      if(diffs[s]>overVal){overVal=diffs[s];overSize=s}
      if(diffs[s]<underVal){underVal=diffs[s];underSize=s}
    });
    if(!overSize||!underSize)break; // balanced
    // Find a flow that can give up 1 unit of overSize WITHOUT breaching that flow's protected floor
    let bestFlow=-1,bestScore=-1;
    for(let i=0;i<splits.length;i++){
      const ov=splits[i].sizeBreak[overSize]||0;
      const floor=floorFor(i,overSize);
      if(ov<=floor)continue; // can't subtract — would breach the protected floor (or go to 0)
      if(ov>bestScore){bestScore=ov;bestFlow=i}
    }
    if(bestFlow<0)break; // no flow can absorb the swap without breaching a floor
    splits[bestFlow].sizeBreak[overSize]=(splits[bestFlow].sizeBreak[overSize]||0)-1;
    splits[bestFlow].sizeBreak[underSize]=(splits[bestFlow].sizeBreak[underSize]||0)+1;
  }
}

// Compute flow split for the SKU's allocation
// Returns: { count, splits: [{label, units, offset, sizeBreak, ...meta}], math: { perSizeFloor, globalFloorTotal, ...} }
function computeFlows(rec,totalPool,combinedAlloc,retailCurve,onlineCurve,bopBySize){
  const result={
    count:1,
    splits:[{label:'Global',units:totalPool,offset:0,sizeBreak:{...combinedAlloc}}],
    math:null,
    eligible:false
  };
  if(totalPool<1200){result.reason='Total DTC < 1,200u';return result}
  const isInitials=rec.sizingType==='initials';
  const pm=getPresMin(rec); // per-size pres min × stores (already ceiling rounded)
  const apsR=rec.apsRetail||0,apsO=rec.apsOnline||0;
  const scaleMetaFL=A.presMinsMeta[rec.sizeScale]||{};
  const onlineFlatPerSize=scaleMetaFL.onlineFlat!==undefined?Number(scaleMetaFL.onlineFlat):5;
  const ONLINE_FLAT=rec.onlineBuy>0?onlineFlatPerSize:0;

  // Per-size global minimum need (Initials math)
  // = retail pres min units + online flat (5) + 6 weeks retail APS by retail curve % + 6 weeks online APS by online curve %
  const perSizeFloor={};
  let globalFloorTotal=0;
  const stCt=rec.storeCount||0;
  rec.sizes.forEach(s=>{
    const presMinUnits=pm[s]||0;
    const onlineFlat=ONLINE_FLAT;
    // Retail APS is per-store, so total weekly retail rate = APS × stores
    const retailWos=apsR*stCt*6*(retailCurve[s]||0);
    // Online APS is already a global figure (no per-store multiplier)
    const onlineWos=apsO*6*(onlineCurve[s]||0);
    const need=Math.ceil(presMinUnits+onlineFlat+retailWos+onlineWos);
    perSizeFloor[s]={presMinUnits,onlineFlat,retailWos:Math.round(retailWos*10)/10,onlineWos:Math.round(onlineWos*10)/10,total:need};
    globalFloorTotal+=need;
  });

  // V8.6 "Always in stock": CF flows now mirror Initials in that the Global flow must independently
  // satisfy minimum presentation, accounting for projected BOP already on hand when the order lands.
  // Per-size Global floor = max(0, minPres − projBOP). The Global PO guarantees that floor so that
  // BOP + Global ≥ min pres for every size. Whatever remains flows per the existing 60/40 / 40/30/30 rule.
  if(!isInitials){
    // Per-size minimum the Global flow must carry so that (BOP + Global) ≥ min retail pres.
    // We use the retail pres min (pm) as the presentation standard, net of projected BOP.
    const cfGlobalFloor={};
    let cfGlobalFloorTotal=0;
    rec.sizes.forEach(s=>{
      const minPres=pm[s]||0;
      const projBop=(bopBySize&&bopBySize[s])||0;
      const floor=Math.max(0,minPres-projBop);
      cfGlobalFloor[s]=floor;
      cfGlobalFloorTotal+=floor;
    });
    // Cap the floor at the total buy — we can never buy more than the buy.
    if(cfGlobalFloorTotal>=totalPool){
      // Floor consumes the entire buy → single Global PO, no flow. Flag it.
      const sb={};
      // Distribute the buy to satisfy as much of the floor as possible (proportional to floor)
      if(cfGlobalFloorTotal>0){
        rec.sizes.forEach(s=>{sb[s]=Math.round(cfGlobalFloor[s]/cfGlobalFloorTotal*totalPool)});
      } else {
        rec.sizes.forEach(s=>{sb[s]=combinedAlloc[s]||0});
      }
      const subSum=rec.sizes.reduce((a,sz)=>a+sb[sz],0);
      const diff=totalPool-subSum;
      if(diff!==0&&rec.sizes.length){const ms=rec.sizes.reduce((a,b)=>sb[a]>=sb[b]?a:b);sb[ms]+=diff}
      result.eligible=true;result.count=1;
      result.splits=[{label:'Global',units:totalPool,offset:0,sizeBreak:sb}];
      result.math={type:'CF',globalFloorBOP:true,cfGlobalFloorTotal,note:'Global floor (min pres − BOP) meets/exceeds buy; single PO',totalPool};
      return result;
    }
    // Remaining after the Global setup need (floor) is satisfied.
    const remaining=totalPool-cfGlobalFloorTotal;
    // ── V9.9 Flow-count decision ──
    //   • Total buy gates the CEILING of flows: ≥3000 may do 3 POs; ≥1200 may do 2 POs; <1200 = 1 PO.
    //     (V9.9: the 3-PO gate moved 2,000 → 3,000 — a ~2,000u buy split three ways left flows too thin.)
    //   • The post-global REMAINING must exceed 1,200 to do ANY downstream flowing at all.
    //   • V9.9: the season's delivery window caps the flow count too — we can never schedule more
    //     flows than there are remaining months inside the buy's own season.
    //   • When we do flow, the split is a % of the TOTAL POOL (40/30/30 for 3, 60/40 for 2),
    //     with Global always guaranteed to carry at least its floor.
    const maxOff=maxFlowOffset(rec);
    let poolPcts=null; // [globalPct, flow1Pct, (flow2Pct)] of total pool
    if(remaining>1200&&totalPool>=3000&&maxOff>=2){
      poolPcts=[0.4,0.3,0.3];     // 3 POs — needs 2 months of runway
    } else if(remaining>1200&&maxOff>=1){
      poolPcts=[0.6,0.4];          // 2 POs — needs 1 month of runway
    }
    if(!poolPcts){
      // Not enough post-global balance, buy too small, or no month left in season — single Global PO.
      const sb={...combinedAlloc};
      result.eligible=true;result.count=1;
      result.splits=[{label:'Global',units:totalPool,offset:0,sizeBreak:sb}];
      result.math={type:'CF',globalFloorBOP:true,cfGlobalFloor,cfGlobalFloorTotal,remaining,maxOff,
        note:maxOff<1?'No later delivery month inside '+(rec.season||'season')+'; single PO'
          :(remaining<=1200?'Post-global balance ≤ 1,200u; single PO':'Buy below flow threshold; single PO'),totalPool};
      return result;
    }
    // Flow unit totals as % of total pool, but Global must be ≥ its floor.
    let flowTotals=poolPcts.map(p=>Math.round(totalPool*p));
    // Reconcile rounding so the totals sum to the pool exactly (adjust Global).
    let ftSum=flowTotals.reduce((a,b)=>a+b,0);
    flowTotals[0]+=(totalPool-ftSum);
    // Guarantee Global ≥ floor. If the % gave Global less than its floor (rare — happens when the
    // floor is unusually high relative to 40%/60% of pool), pull units from the downstream flows
    // into Global until the floor is met.
    if(flowTotals[0]<cfGlobalFloorTotal){
      let needed=cfGlobalFloorTotal-flowTotals[0];
      for(let i=flowTotals.length-1;i>=1&&needed>0;i--){
        const take=Math.min(needed,flowTotals[i]);
        flowTotals[i]-=take;flowTotals[0]+=take;needed-=take;
      }
    }
    // After guaranteeing the floor, drop any downstream flow that fell below 300u (collapse it up).
    // Re-validate: each downstream flow must clear 300u or we reduce the flow count.
    {
      let changed=true;
      while(changed&&flowTotals.length>1){
        changed=false;
        const lastIdx=flowTotals.length-1;
        if(flowTotals[lastIdx]<300){
          // fold the last flow's units back into Global and drop it
          flowTotals[0]+=flowTotals[lastIdx];
          flowTotals=flowTotals.slice(0,lastIdx);
          changed=true;
        }
      }
    }
    if(flowTotals.length===1){
      const sb={...combinedAlloc};
      result.eligible=true;result.count=1;
      result.splits=[{label:'Global',units:totalPool,offset:0,sizeBreak:sb}];
      result.math={type:'CF',globalFloorBOP:true,cfGlobalFloor,cfGlobalFloorTotal,remaining,
        note:'Downstream flow(s) < 300u after floor guarantee; single PO',totalPool};
      return result;
    }
    result.eligible=true;result.count=flowTotals.length;
    // ── Build the Global size break first (it has the floor guarantee) ──
    // Global per size = floor + curve-driven share of the extra, but never more than the size's
    // total allocation (combinedAlloc[s]) — we can't put more of a size in Global than the buy has.
    // Global's target total is flowTotals[0]; the "extra" above the floor is what's left after the floor.
    const globalExtra=Math.max(0,flowTotals[0]-cfGlobalFloorTotal);
    const globalSb={};
    rec.sizes.forEach(s=>{
      const curveShare=Math.round((combinedAlloc[s]||0)/totalPool*globalExtra);
      const want=cfGlobalFloor[s]+curveShare;
      globalSb[s]=Math.min(combinedAlloc[s]||0,want); // cap at total available for this size
    });
    // The cap may leave Global short of its target total (units that "overflowed" sizes at their cap).
    // Redistribute that shortfall to sizes that still have headroom (combinedAlloc[s] − globalSb[s] > 0),
    // preferring the sizes with the most remaining headroom.
    let globalAssigned=rec.sizes.reduce((a,s)=>a+globalSb[s],0);
    let globalShort=flowTotals[0]-globalAssigned;
    let guard=10000;
    while(globalShort>0&&guard-->0){
      // find size with most headroom
      let best=null,bestHead=0;
      rec.sizes.forEach(s=>{
        const head=(combinedAlloc[s]||0)-globalSb[s];
        if(head>bestHead){bestHead=head;best=s}
      });
      if(!best)break; // no headroom anywhere — Global can't reach its target (rare; buy fully floored)
      globalSb[best]++;globalShort--;
    }
    // ── Downstream flows get whatever's left per size (combinedAlloc − globalSb), distributed by their share ──
    const splits=[{label:'Global',units:rec.sizes.reduce((a,s)=>a+globalSb[s],0),offset:0,sizeBreak:globalSb}];
    // Remaining per size after Global
    const leftBySize={};rec.sizes.forEach(s=>{leftBySize[s]=Math.max(0,(combinedAlloc[s]||0)-globalSb[s])});
    const downstreamTotals=flowTotals.slice(1);
    const downstreamSum=downstreamTotals.reduce((a,b)=>a+b,0);
    const totalLeft=rec.sizes.reduce((a,s)=>a+leftBySize[s],0);
    downstreamTotals.forEach((u,idx)=>{
      const sb={};
      // Distribute this flow's units across sizes proportional to what's left per size
      rec.sizes.forEach(s=>{
        sb[s]=totalLeft>0?Math.round(leftBySize[s]/totalLeft*u):0;
      });
      const subSum=rec.sizes.reduce((a,sz)=>a+sb[sz],0);
      const diff=u-subSum;
      if(diff!==0&&rec.sizes.length){
        // add/remove from the size with the most room
        const ms=rec.sizes.reduce((a,b)=>leftBySize[a]>=leftBySize[b]?a:b);
        sb[ms]+=diff;
      }
      splits.push({label:'Flow '+(idx+1),units:u,offset:idx+1,sizeBreak:sb});
    });
    result.splits=splits;
    // Reconcile per-size cross-flow totals to combinedAlloc, protecting the Global floor (index 0)
    reconcileFlowsBySize(result.splits,combinedAlloc,rec.sizes,{0:cfGlobalFloor});
    result.math={type:'CF',globalFloorBOP:true,cfGlobalFloor,cfGlobalFloorTotal,remaining,poolPcts,maxOff,totalPool};
    return result;
  }

  // INITIALS path: Global must minimally cover globalFloorTotal
  if(globalFloorTotal>totalPool){
    result.reason='Global floor ('+globalFloorTotal+'u) exceeds total pool';return result;
  }
  let remaining=totalPool-globalFloorTotal;
  // Determine how many flows we can support
  // Per V7.6: 2-flow split requires the remaining (after the global PO) to exceed 1,200u.
  // Otherwise, one big flow is more economical than two ~400u flows.
  // Each flow must still be ≥ 300u individually.
  let numFlows=0;
  // V9.9: 2 downstream flows (3 POs total) now require a ≥3,000u buy, up from the old
  // remaining-only test — a ~2,000u buy split three ways left each flow too thin.
  if(remaining>=1200&&totalPool>=3000)numFlows=2;
  else if(remaining>=300)numFlows=1;
  // V9.9: never schedule more flows than there are months left inside the buy's own season.
  const maxOff=maxFlowOffset(rec);
  numFlows=Math.min(numFlows,maxOff);
  if(numFlows===0){
    result.reason=maxOff===0
      ?'No later delivery month inside '+(rec.season||'season')+'; single PO'
      :'Remaining after global floor ('+remaining+'u) too small to flow';
    return result;
  }

  // Target Global percentage based on total split count
  // If numFlows=2 → target 40% Global; if numFlows=1 → target 60% Global
  const targetGlobalPct=numFlows===2?0.4:0.6;
  const targetGlobalUnits=Math.round(targetGlobalPct*totalPool);

  let globalUnits=globalFloorTotal;
  if(globalUnits<targetGlobalUnits){
    // Bump global up to baseline target
    const extra=targetGlobalUnits-globalUnits;
    if(remaining-extra>=numFlows*300){
      globalUnits=targetGlobalUnits;
      remaining=totalPool-globalUnits;
    }
    // else: can't bump without violating 300 floor — leave at floor
  }
  // Distribute remaining across numFlows
  let flowUnits;
  if(numFlows===2){
    // Split remaining as evenly as possible
    const half=Math.floor(remaining/2);
    flowUnits=[half,remaining-half];
    // Validate both ≥ 300; if not, demote to 1 flow
    if(flowUnits[0]<300||flowUnits[1]<300){
      numFlows=1;flowUnits=[remaining];
    }
  } else {flowUnits=[remaining]}

  if(numFlows===1&&flowUnits[0]<300){result.reason='Single flow below 300u';return result}

  // ── Build the Global size break (it carries the per-size presentation floor) ──
  // V9.6 FIX: mirror the CF logic. The Global PO must independently satisfy each size's
  // presentation floor, so we seat the floor FIRST — but capped at the size's total
  // allocation, because we can't put more of a size in Global than the whole buy contains.
  // (e.g. a small-selling size whose floor is 177 but whose total buy is only 162 → Global
  // takes all 162, replenishment gets 0.) Any units that overflow a capped size, plus the
  // bump-to-target extra, are redistributed by curve to sizes that still have headroom.
  // Previously the raw floor was dumped into Global and an UNPROTECTED reconcile was free to
  // rob it back below presentation minimums (the bug: Global S showed 112 vs a 177 floor).
  const cappedFloor={};
  rec.sizes.forEach(s=>{cappedFloor[s]=Math.min(perSizeFloor[s].total,combinedAlloc[s]||0)});
  const cappedFloorTotal=rec.sizes.reduce((a,s)=>a+cappedFloor[s],0);
  const allocSumAll=rec.sizes.reduce((a,s)=>a+(combinedAlloc[s]||0),0);
  const globalExtra=Math.max(0,globalUnits-cappedFloorTotal); // floor shortfall (from capping) + bump-to-target
  const globalSb={};
  rec.sizes.forEach(s=>{
    const curveShare=allocSumAll>0?Math.round((combinedAlloc[s]||0)/allocSumAll*globalExtra):0;
    const want=cappedFloor[s]+curveShare;
    globalSb[s]=Math.min(combinedAlloc[s]||0,want); // never exceed the size's total allocation
  });
  // Redistribute any remaining shortfall to sizes with the most headroom (combinedAlloc − globalSb).
  let guard=10000;
  let globalShort=globalUnits-rec.sizes.reduce((a,s)=>a+globalSb[s],0);
  while(globalShort>0&&guard-->0){
    let best=null,bestHead=0;
    rec.sizes.forEach(s=>{const head=(combinedAlloc[s]||0)-globalSb[s];if(head>bestHead){bestHead=head;best=s}});
    if(!best)break; // no headroom anywhere — buy is fully floored
    globalSb[best]++;globalShort--;
  }
  // If rounding over-assigned, trim from the most over-floor size (never below its capped floor).
  while(globalShort<0&&guard-->0){
    let best=null,bestExcess=0;
    rec.sizes.forEach(s=>{const ex=globalSb[s]-cappedFloor[s];if(ex>bestExcess){bestExcess=ex;best=s}});
    if(!best)break;
    globalSb[best]--;globalShort++;
  }
  globalUnits=rec.sizes.reduce((a,s)=>a+globalSb[s],0); // actual Global total after capping/redistribution

  // ── Downstream flows get whatever's left per size (combinedAlloc − globalSb), by share ──
  const flowSplits=[{label:'Global',units:globalUnits,offset:0,sizeBreak:globalSb}];
  const leftBySize={};rec.sizes.forEach(s=>{leftBySize[s]=Math.max(0,(combinedAlloc[s]||0)-globalSb[s])});
  const totalLeft=rec.sizes.reduce((a,s)=>a+leftBySize[s],0);
  flowUnits.forEach((u,idx)=>{
    const sb={};
    if(totalLeft>0){
      rec.sizes.forEach(s=>{sb[s]=Math.round(leftBySize[s]/totalLeft*u)});
    } else rec.sizes.forEach(s=>{sb[s]=Math.round(u/rec.sizes.length)});
    const sum=rec.sizes.reduce((a,sz)=>a+sb[sz],0);
    const diff=u-sum;
    if(diff!==0&&rec.sizes.length){const ms=rec.sizes.reduce((a,b)=>leftBySize[a]>=leftBySize[b]?a:b);sb[ms]+=diff}
    flowSplits.push({label:'Flow '+(idx+1),units:u,offset:idx+1,sizeBreak:sb});
  });
  // Force cross-flow per-size totals to match combinedAlloc — but PROTECT the Global floor (index 0)
  // so reconciliation can never rob the Global PO below presentation minimums.
  reconcileFlowsBySize(flowSplits,combinedAlloc,rec.sizes,{0:cappedFloor});

  result.eligible=true;result.count=flowSplits.length;result.splits=flowSplits;
  result.math={
    type:'Initials',
    perSizeFloor,
    globalFloorTotal,
    targetGlobalPct,
    targetGlobalUnits,
    globalUnits,
    bumpedAboveFloor:globalUnits>globalFloorTotal,
    apsRetail:apsR,apsOnline:apsO,
    totalPool,
    onlineFlatPerSize:ONLINE_FLAT
  };
  return result;
}

// Returns { adjusted: result, raw: result } where raw is what would be computed
// if no curve adjustments were applied. Used by the SKU detail table to show before→after diffs.
function computeAllocWithRawCompare(rec){
  const adjusted=computeAlloc(rec);
  const sav=A.curveAdjustments[rec.sku];
  if(!sav||!Object.keys(sav).length||!adjusted)return{adjusted,raw:adjusted};
  // Temporarily strip the adjustments for this SKU and re-run
  delete A.curveAdjustments[rec.sku];
  const raw=computeAlloc(rec);
  A.curveAdjustments[rec.sku]=sav;
  return{adjusted,raw};
}

function hasCurveAdjustment(sku){
  const a=A.curveAdjustments[sku];
  if(!a)return false;
  for(const k in a){if(Number(a[k])!==1)return true}
  return false;
}

function getStagedAdj(sku,size){
  const st=A.curveAdjStaged[sku];
  if(st&&st[size]!==undefined)return st[size];
  const a=A.curveAdjustments[sku];
  return a&&a[size]!==undefined?a[size]:1;
}

function setStagedAdj(sku,size,val){
  if(!A.curveAdjStaged[sku])A.curveAdjStaged[sku]={};
  // Normalize: empty / non-numeric / 0 = treat as 1.0
  let n=parseFloat(val);
  if(!isFinite(n)||n<=0)n=1;
  A.curveAdjStaged[sku][size]=n;
  // Re-render the detail page so before/after preview updates
  if(A.selectedSKU===sku)render();
}

function hasStagedAdjChanges(sku){
  const st=A.curveAdjStaged[sku];if(!st)return false;
  for(const k in st){
    const cur=(A.curveAdjustments[sku]&&A.curveAdjustments[sku][k])||1;
    if(Number(st[k])!==Number(cur))return true;
  }
  return false;
}

function acceptCurveAdj(sku){
  const st=A.curveAdjStaged[sku];if(!st){render();return}
  if(!A.curveAdjustments[sku])A.curveAdjustments[sku]={};
  for(const k in st){
    const v=Number(st[k]);
    if(v===1){delete A.curveAdjustments[sku][k]}
    else A.curveAdjustments[sku][k]=v;
  }
  if(!Object.keys(A.curveAdjustments[sku]).length)delete A.curveAdjustments[sku];
  delete A.curveAdjStaged[sku];
  saveCurveAdjustments();
  toast('Curve adjustments applied');
  render();
}

function discardCurveAdj(sku){
  delete A.curveAdjStaged[sku];
  render();
}

function resetCurveAdj(sku){
  if(!confirm('Reset all curve adjustments for this SKU?'))return;
  delete A.curveAdjustments[sku];
  delete A.curveAdjStaged[sku];
  saveCurveAdjustments();
  toast('Curve adjustments reset');
  render();
}

// Returns a new record-like object where curve adjustments are replaced with the staged ones,
// so the renderer can preview "what would happen if you accepted the staged values"
function applyStagedToCompute(rec){
  const st=A.curveAdjStaged[rec.sku];
  if(!st)return computeAllocWithRawCompare(rec);
  const original=A.curveAdjustments[rec.sku];
  // Build merged adjustment set: base + staged overrides (staged 1.0 means "remove")
  const merged={...(original||{})};
  for(const k in st){
    if(Number(st[k])===1)delete merged[k];
    else merged[k]=Number(st[k]);
  }
  if(Object.keys(merged).length)A.curveAdjustments[rec.sku]=merged;
  else delete A.curveAdjustments[rec.sku];
  const adjusted=computeAlloc(rec);
  // Restore originals
  if(original)A.curveAdjustments[rec.sku]=original;
  else delete A.curveAdjustments[rec.sku];
  // Compute raw (no adjustments at all) for before-comparison
  const sav=A.curveAdjustments[rec.sku];
  if(sav)delete A.curveAdjustments[rec.sku];
  const raw=computeAlloc(rec);
  if(sav)A.curveAdjustments[rec.sku]=sav;
  return{adjusted,raw};
}

function computeAlloc(rec){
  if(!rec||rec.dtcBuy<=0||!rec.sizes.length)return null;
  const pool=rec.dtcBuy;
  const retailPool=Math.max(0,rec.retailBuy||0);
  // If channel split data not available, treat the whole pool as retail (legacy behavior)
  let onlinePool;
  if((rec.retailBuy||0)+(rec.onlineBuy||0)===0){
    onlinePool=0;
    // Fall back: treat entire DTC as retail
  } else {
    onlinePool=Math.max(0,rec.onlineBuy||0);
  }
  // Effective retail pool: if channel data exists, use it; otherwise use full DTC as retail
  const useChannelSplit=(rec.retailBuy||0)+(rec.onlineBuy||0)>0;
  const effRetailPool=useChannelSplit?retailPool:pool;
  const effOnlinePool=useChannelSplit?onlinePool:0;

  const ovr=A.overrides[rec.sku]||{};
  const pmRate=getPresMinRate(rec);
  const pm=getPresMin(rec);
  // Online flat floor: per-scale configurable (default 5), applies to each OMNI size.
  // Set lower (e.g. 2 for M6/FM6) for compact size scales. Stored on the pres_mins record.
  const scaleMeta=A.presMinsMeta[rec.sizeScale]||{};
  const ONLINE_FLAT_PRES=scaleMeta.onlineFlat!==undefined?Number(scaleMeta.onlineFlat):5;
  const onlineFloor={};
  rec.sizes.forEach(s=>{onlineFloor[s]=effOnlinePool>0?ONLINE_FLAT_PRES:0});

  // ── BOP / Pending receipts (apply to RETAIL only) ──
  const pendingBefore=getPendingBeforeDelivery(rec);
  const totalPending=Object.values(pendingBefore).reduce((a,b)=>a+b,0);
  // V8.3: a SKU is BOP-relevant if it has OH, sales, OR pending receipts (matches the new CF gate)
  const useBOP=rec.totalOH>0||totalPending>0||rec.totalSales>0;
  let bop={},wtr=0,bopRateInfo=null,bopStockoutWeeks={},bopRates={};
  let bopRawRates={},bopSeasonal=null,bopBurnWindows={};
  if(useBOP){
    const bp=projBOP(rec);
    wtr=bp._w;
    bopRateInfo=bp._rateInfo;
    bopStockoutWeeks=bp._stockoutWeeks||{};
    bopRates=bp._rates||{};
    bopRawRates=bp._rawRates||{};
    bopSeasonal=bp._seasonal||null;
    bopBurnWindows=bp._burnWindows||{};
    // Every underscore key must be stripped - `bop` is summed with Object.values() below.
    delete bp._w;delete bp._rateInfo;delete bp._stockoutWeeks;delete bp._rates;
    delete bp._rawRates;delete bp._seasonal;delete bp._burnWindows;
    bop=bp;
  }
  const totalBOP=useBOP?Object.values(bop).reduce((a,b)=>a+b,0):0;

  // ── Build curves with hierarchy locked to DTC's resolved level ──
  // The DTC curve is the anchor: it picks the most granular level where TOTAL DTC sales
  // pass 100×sizeCount. Retail and Online curves then evaluate at that SAME level, even if
  // their individual channel sales fall below the threshold there. This guarantees the three
  // curve totals are coherent (DTC ≈ Retail + Online at the same hierarchy level) and avoids
  // the misleading "DTC=487, Retail=2,501, Online=445" mismatch that comes from independent walks.
  // V8.7: if the user has manually selected a curve level for this SKU, force the DTC anchor
  // to that level. The channel curves and weekly-rate hierarchy all follow this anchor.
  const manualLevel=A.curveOverrides[rec.sku]||null;
  const dtcCurveAnchor=buildCurve(rec,A.hierSales,manualLevel);
  const forcedLevel=dtcCurveAnchor.acceptedLevel; // resolved level (manual or auto)
  const retailCurveResult=buildCurve(rec,A.hierSalesRet,forcedLevel);
  const onlineCurveResult=buildCurve(rec,A.hierSalesOnline,forcedLevel);

  // V9.3: Curve OVERRIDES. If an imported override exists for this SKU's Product Segmentation+channel,
  // it supersedes the historical curve BY DEFAULT (we don't trust the history). The user can still
  // opt back into history by manually pinning a hierarchy level (A.curveOverrides[sku]) — when a
  // manual level is set, we honor it and ignore the import. Precedence: manual > import > auto.
  // Overrides are stored as {size:pct}; we normalize non-zero percents to sum to 1 (proportional
  // uplift) so the curve distributes a full buy.
  // V9.8: keyed on PRODUCT SEGMENTATION (was subcategory in V9.7) — the single granularity allowed
  // for overrides. SKUs with no segment fall through to history.
  function overrideCurveFor(channel){
    if(manualLevel)return null; // user explicitly chose history
    if(!rec.segment)return null;
    const ov=getCurveOverride(rec.division,rec.sizeScale,rec.segment,channel);
    if(!ov||!ov.curve)return null;
    const norm={};let sum=0;
    rec.sizes.forEach(s=>{const p=ov.curve[s]||0;norm[s]=p;sum+=p});
    if(sum<=0)return null;
    rec.sizes.forEach(s=>{norm[s]=norm[s]/sum}); // proportional uplift to 100%
    return{curve:norm,rawSum:ov.rawSum,by:ov.by};
  }
  const retailOverride=overrideCurveFor('Retail');
  const onlineOverride=overrideCurveFor('Online');
  // Track for UI/breadcrumb display
  rec._retailOverride=retailOverride;rec._onlineOverride=onlineOverride;

  // ── BOP allocation between channels ──
  // BOP is warehouse-level (untagged). Split it between channels by the buy pool ratio
  // so each channel can run its own BOP-aware gap-fill against its own curve.
  const totalChannelPool=effRetailPool+effOnlinePool;
  const retailBopShare=totalChannelPool>0?effRetailPool/totalChannelPool:1;
  const onlineBopShare=totalChannelPool>0?effOnlinePool/totalChannelPool:0;
  const retailBop={},onlineBop={};
  rec.sizes.forEach(s=>{
    const total=useBOP?(bop[s]||0):0;
    retailBop[s]=Math.round(total*retailBopShare);
    onlineBop[s]=total-retailBop[s]; // remainder ensures retailBop+onlineBop = total exactly
  });

  // ── Retail allocation (BOP-aware) ──
  // Online-only sizes get zero retail curve weight (they don't go to stores)
  const onlineOnlySet=new Set(getOnlineOnlySizes(rec));
  const retailCurve={};
  let retailCurveSum=0;
  rec.sizes.forEach(s=>{
    if(onlineOnlySet.has(s))retailCurve[s]=0;
    else{
      // V9.3: use override curve if present, else the historical channel curve
      retailCurve[s]=retailOverride?(retailOverride.curve[s]||0):(retailCurveResult.curve[s]||0);
      retailCurveSum+=retailCurve[s];
    }
  });
  // Renormalize so non-online-only weights sum to 1
  if(retailCurveSum>0){rec.sizes.forEach(s=>{retailCurve[s]=retailCurve[s]/retailCurveSum})}
  const retailIdeals={};
  const retailBopTotal=rec.sizes.reduce((a,s)=>a+retailBop[s],0);
  const retailTotalTgt=retailBopTotal+effRetailPool;
  rec.sizes.forEach(s=>{retailIdeals[s]=Math.round(retailCurve[s]*retailTotalTgt)});
  // Effective retail floor: max(0, presMin - retail's share of BOP)
  const retailFloor={};
  rec.sizes.forEach(s=>{retailFloor[s]=effRetailPool>0?Math.max(0,(pm[s]||0)-retailBop[s]):0});
  // Buy should fill the gap to ideal (after subtracting retail's BOP share)
  const retailIdealMinusBop={};
  rec.sizes.forEach(s=>{retailIdealMinusBop[s]=Math.max(0,retailIdeals[s]-retailBop[s])});
  const retailAlloc=allocateBuy(rec,effRetailPool,retailCurve,retailFloor,retailIdealMinusBop);

  // ── Online allocation (BOP-aware) ──
  // V9.3: use override curve if present, else the historical online channel curve
  let onlineCurve;
  if(onlineOverride){
    onlineCurve={};rec.sizes.forEach(s=>{onlineCurve[s]=onlineOverride.curve[s]||0});
  } else {
    onlineCurve=onlineCurveResult.curve;
  }
  const onlineIdeals={};
  const onlineBopTotal=rec.sizes.reduce((a,s)=>a+onlineBop[s],0);
  const onlineTotalTgt=onlineBopTotal+effOnlinePool;
  rec.sizes.forEach(s=>{onlineIdeals[s]=Math.round(onlineCurve[s]*onlineTotalTgt)});
  const onlineIdealMinusBop={};
  rec.sizes.forEach(s=>{onlineIdealMinusBop[s]=Math.max(0,onlineIdeals[s]-onlineBop[s])});
  const onlineAlloc=allocateBuy(rec,effOnlinePool,onlineCurve,onlineFloor,onlineIdealMinusBop);

  // ── Combined DTC alloc ──
  const alloc={};
  rec.sizes.forEach(s=>{alloc[s]=(retailAlloc[s]||0)+(onlineAlloc[s]||0)});

  // Apply manual overrides AFTER channel split (overrides target the combined size break)
  rec.sizes.forEach(s=>{if(ovr[s]!==undefined)alloc[s]=ovr[s]});

  // ── Curve sales (DTC, Retail, Online) at the level the curve resolved to ──
  // Use the DTC curve trail for the primary "Curve Sales" display
  const dtcCurveResult=dtcCurveAnchor;
  const dtcCurveSales={};
  if(dtcCurveResult.acceptedKey&&A.hierSales[dtcCurveResult.acceptedKey]){
    const hs=A.hierSales[dtcCurveResult.acceptedKey];
    rec.sizes.forEach(s=>{dtcCurveSales[s]=hs[s]||0});
  } else rec.sizes.forEach(s=>{dtcCurveSales[s]=0});
  const retailCurveSales={};
  if(retailCurveResult.acceptedKey&&A.hierSalesRet[retailCurveResult.acceptedKey]){
    const hs=A.hierSalesRet[retailCurveResult.acceptedKey];
    rec.sizes.forEach(s=>{retailCurveSales[s]=hs[s]||0});
  } else rec.sizes.forEach(s=>{retailCurveSales[s]=0});
  const onlineCurveSales={};
  if(onlineCurveResult.acceptedKey&&A.hierSalesOnline[onlineCurveResult.acceptedKey]){
    const hs=A.hierSalesOnline[onlineCurveResult.acceptedKey];
    rec.sizes.forEach(s=>{onlineCurveSales[s]=hs[s]||0});
  } else rec.sizes.forEach(s=>{onlineCurveSales[s]=0});

  // V9.10: when a curve OVERRIDE is driving the buy, reflect the OVERRIDE shape in the displayed
  // "Curve Sales" series (histogram + table) and the DTC Curve %, instead of raw L52W history —
  // otherwise the curve section silently contradicts the buy it produced. We redistribute each
  // channel's historical sales total along the EFFECTIVE channel curve (retailCurve/onlineCurve are
  // already override-aware AND have online-only sizes zeroed for retail), so magnitudes stay familiar
  // while the shape matches what actually drove the allocation. Channels without an override are
  // unaffected (their effective curve equals the historical curve).
  let dispDtcCurve=dtcCurveResult.curve;
  if(retailOverride||onlineOverride){
    const sumOf=o=>rec.sizes.reduce((a,s)=>a+(o[s]||0),0);
    let Tr=sumOf(retailCurveSales);if(Tr<=0)Tr=effRetailPool; // fall back to pool so the bar still shows
    let To=sumOf(onlineCurveSales);if(To<=0)To=effOnlinePool;
    rec.sizes.forEach(s=>{
      retailCurveSales[s]=(retailCurve[s]||0)*Tr; // retailCurve sums to 1 over non-online-only sizes
      onlineCurveSales[s]=(onlineCurve[s]||0)*To;
      dtcCurveSales[s]=retailCurveSales[s]+onlineCurveSales[s];
    });
    const Tdtc=sumOf(dtcCurveSales);
    const odc={};rec.sizes.forEach(s=>{odc[s]=Tdtc>0?dtcCurveSales[s]/Tdtc:0});
    dispDtcCurve=odc; // drives the CURVE % column when an override is active
  }

  // ── Flows: applied to combined DTC pool ──
  // V8.6: pass projected BOP per size so CF flows can guarantee the Global flow + BOP meets min pres.
  const flows=computeFlows(rec,pool,alloc,retailCurve,onlineCurve,useBOP?bop:null);
  const flowSizeBreaks=flows.splits; // already include sizeBreak field

  // For backward compat with existing render code:
  const cr=dtcCurveResult; // primary curve = DTC curve
  const ideal={};rec.sizes.forEach(s=>{ideal[s]=retailIdeals[s]+onlineIdeals[s]});

  return{
    alloc,curve:dispDtcCurve,cr,pm,pmRate,
    bop:useBOP?bop:null,wtr:useBOP?wtr:null,ideal:useBOP?ideal:null,
    bopRateInfo:useBOP?bopRateInfo:null,
    bopStockoutWeeks:useBOP?bopStockoutWeeks:null,
    bopRates:useBOP?bopRates:null,
    bopRawRates:useBOP?bopRawRates:null,
    bopSeasonal:useBOP?bopSeasonal:null,
    bopBurnWindows:useBOP?bopBurnWindows:null,
    pool,curveSales:dtcCurveSales,useBOP,
    // New channel-aware fields:
    retailAlloc,onlineAlloc,
    retailCurve,onlineCurve,
    retailCurveSales,onlineCurveSales,
    retailCurveResult,onlineCurveResult,
    retailPool:effRetailPool,onlinePool:effOnlinePool,
    useChannelSplit,
    flows,flowSizeBreaks
  };
}

// V9.9: "Import" tab — a transposed view of Flows: one row per (flow × sku × size). Unlike Globals/
// Flows, the Size is printed EXACTLY as it comes out of the tool (the internal size key), with NO
// SIZE_DEFS column remapping — e.g. men's tailored "40" prints as "40" here, even though it routes
// to the "40_" column in Globals/Flows. Only non-zero sizes are emitted.
// V9.11: column order matches the third-party upload format — Year and Customer removed, SKU moved
// after Sales Tier. Order is exactly: Season Code, Department, Location, Delivery, Sales Tier, SKU,
// Size, Units. Do not reorder without confirming against the vendor's upload spec.
const IMPORT_HEADER=['Season Code','Department','Location','Delivery','Sales Tier','SKU','Size','Units'];
function pushImportRows(aoa,r,sku,season,salesTier,delivery,sizeBreak){
  (r.sizes||[]).forEach(s=>{
    const u=sizeBreak[s];
    if(!u||u<=0)return; // skip zero/blank sizes (mirrors the blank cells in the Flows tab)
    aoa.push([season,r.division||'','DTC',delivery,salesTier,sku,s,u]);
  });
}

// V9.1: route the top-bar Export button based on the active module
function exportCurrent(){
  if(A.module==='chase')return exportChase();
  return exportCSV();
}

function exportCSV(){
  const acc=Object.keys(A.accepted);if(!acc.length)return;

  // SIZE_COLS now includes a section tag for each column.
  // section: 'kidsOS' (Kids & OS — sizes 2T-XXXL plus shared 6/8/10 for kids), 'mw' (Mens & Womens)
  // Kids 6/8/10 share numeric labels with women's adult, so kidsMatch:true gates them to kids only.
  // We rename women's "00"/"0" to "00_"/"0_" so Excel won't render them indistinguishably from numeric "0".
  const SIZE_DEFS=SIZE_DEFS_GLOBAL;
  const SIZE_COLS=SIZE_DEFS.map(d=>d.col);

  // Info columns (everything before size columns) — same set used for Globals + Flows tabs
  const INFO_COLS=['SIZING TYPE','Year','Season Code','Department','SKU','Location','Delivery','Customer','From Sales Tier','Sales Tier','Sizing Tab Total','Unit Variance','Total'];

  // Section header row aligned with [INFO_COLS, ...SIZE_COLS]: Info | Kids & OS | Mens & Womens
  const sectionRow=[];
  INFO_COLS.forEach(()=>sectionRow.push('Info'));
  SIZE_DEFS.forEach(d=>sectionRow.push(d.sec==='kidsOS'?'Kids & OS':'Mens & Womens'));

  // Header row
  const headerRow=[...INFO_COLS,...SIZE_COLS];

  // Each tab as an array-of-arrays so SheetJS can render directly
  const aoaGlobals=[sectionRow.slice(),headerRow.slice()];
  const aoaFlows=[sectionRow.slice(),headerRow.slice()];

  // Channel Buys tab — simpler structure, single header row
  const CHANNEL_HEADER=['SKU','Division','Category','Style Description','Color Description','Size','Retail Units','Online Units','Total DTC Units'];
  const aoaChannel=[CHANNEL_HEADER.slice()];

  // V9.9: Import tab — transposed Flows (one row per flow × sku × size, raw size labels)
  const aoaImport=[IMPORT_HEADER.slice()];

  const yrMatch=A.activeSeason.match(/(\d{2})$/);
  const year=yrMatch?'20'+yrMatch[1]:'2026';

  function makeRow(r,sku,sizeMap,total,salesTier,delivery){
    const tl=r.sizingType==='initials'?'Initials PO':'CF PO';
    // Determine which division-group this SKU belongs to; populate only that section's columns.
    const divLower=(r.division||'').toLowerCase();
    const catLower=(r.category||'').toLowerCase();
    const isKidsLike=divLower.includes('kid')||divLower.includes('children')||divLower.includes('child');
    const isOSLike=(r.sizes||[]).some(s=>s==='OS');
    const isMens=divLower.includes('men')&&!divLower.includes('women'); // "Mens" but not "Womens"
    // V8.8: Mens Tailored items with numeric sizing route 36/38/40/42... to the "_"-suffixed columns
    // (36_, 38_, etc.) rather than the shared plain numeric columns. This keeps men's blazer/suit
    // numerics from colliding with women's numeric sizes on import.
    const isTailored=catLower==='tailored';
    const isMensTailored=isMens&&isTailored;
    const sizeVals=SIZE_DEFS.map(def=>{
      const lookupKey=def.match!==undefined?def.match:def.col;
      const matchedSku=Object.keys(sizeMap).find(k=>k.toUpperCase()===String(lookupKey).toUpperCase());
      if(!matchedSku)return '';
      // Section gating
      if(def.sec==='kidsOS'){
        if(def.kidsMatch&&!isKidsLike)return '';
        if(!def.kidsMatch&&!isKidsLike&&!isOSLike)return '';
      }
      if(def.sec==='mw'&&isKidsLike&&!isOSLike)return '';
      // V8.8 Tailored numeric routing:
      if(def.tailored){
        // "_"-suffixed columns ONLY populate for Mens Tailored items
        if(!isMensTailored)return '';
      } else if(isMensTailored&&/^(36|38|40|42|44|46|48|50)$/.test(def.col)){
        // For Mens Tailored items, the PLAIN numeric columns (36,38,...) must stay empty —
        // their units belong in the "_" columns instead.
        return '';
      }
      const v=sizeMap[matchedSku];
      // Return as number when non-zero (lets Excel sum/format) — empty string for 0 or missing
      return(v===0||v==null||v==='')?'':v;
    });
    // Sizing Tab Total + Unit Variance left blank — Linelist computes these on import
    return[tl,year,A.activeSeason,r.division,sku,'DTC',delivery,'','Global',salesTier,'','',total,...sizeVals];
  }

  acc.forEach(sku=>{
    const r=A.skus[sku];if(!r||r.dtcBuy<=0)return;
    const res=computeAlloc(r);if(!res)return;
    const total=r.sizes.reduce((a,s)=>a+(res.alloc[s]||0),0);
    const sizeMap={};r.sizes.forEach(s=>{sizeMap[s]=res.alloc[s]||0});
    const baseDelivery=r.deliveryMonth||'';
    // Tab 1 (Globals): single row per SKU with full quantity
    aoaGlobals.push(makeRow(r,sku,sizeMap,total,'Global',baseDelivery));
    // Tab 2 (Flows): one row per flow split (Global + Flow 1 + Flow 2 if applicable)
    if(res.flows.count>1&&res.flowSizeBreaks){
      res.flowSizeBreaks.forEach(fb=>{
        const flowDelivery=shiftDeliveryMonth(baseDelivery,fb.offset);
        aoaFlows.push(makeRow(r,sku,fb.sizeBreak,fb.units,fb.label,flowDelivery));
        pushImportRows(aoaImport,r,sku,A.activeSeason,fb.label,flowDelivery,fb.sizeBreak);
      });
    } else {
      aoaFlows.push(makeRow(r,sku,sizeMap,total,'Global',baseDelivery));
      pushImportRows(aoaImport,r,sku,A.activeSeason,'Global',baseDelivery,sizeMap);
    }
    // Tab 3 (Channel Buys): one row per SKU+size combination, with per-size retail/online split.
    // Lets the merch team review channel allocation at the size grain.
    if(res.retailAlloc&&res.onlineAlloc){
      r.sizes.forEach(s=>{
        const ru=res.retailAlloc[s]||0;
        const ou=res.onlineAlloc[s]||0;
        const tu=ru+ou;
        aoaChannel.push([
          sku,r.division||'',r.category||'',r.styleDescription||'',r.colorDescription||'',
          s,ru,ou,tu
        ]);
      });
    } else {
      // No channel split available — fall back to a single row using Linelist's Retail/Online Buy values
      aoaChannel.push([
        sku,r.division||'',r.category||'',r.styleDescription||'',r.colorDescription||'',
        '',(r.retailBuy||0),(r.onlineBuy||0),total
      ]);
    }
  });

  // Build the workbook with all three sheets
  if(typeof XLSX==='undefined'){
    // Library failed to load — fall back to dual-CSV download so the user isn't stranded
    toast('Excel library unavailable — falling back to CSV downloads');
    function toCsv(aoa){
      return aoa.map(row=>row.map(v=>{
        if(v===null||v===undefined)return '';
        const s=String(v);
        return(s.includes(',')||s.includes('"')||s.includes('\n'))?'"'+s.replace(/"/g,'""')+'"':s;
      }).join(',')).join('\n');
    }
    function downloadCSV(text,filename){
      const blob=new Blob([text],{type:'text/csv'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=filename;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    downloadCSV(toCsv(aoaGlobals),'PO_Sizing_'+A.activeSeason+'_Globals.csv');
    downloadCSV(toCsv(aoaFlows),'PO_Sizing_'+A.activeSeason+'_Flows.csv');
    downloadCSV(toCsv(aoaChannel),'PO_Sizing_'+A.activeSeason+'_ChannelBuys.csv');
    downloadCSV(toCsv(aoaImport),'PO_Sizing_'+A.activeSeason+'_Import.csv');
    return;
  }

  const wb=XLSX.utils.book_new();

  // Tab 1: Globals
  const wsGlobals=XLSX.utils.aoa_to_sheet(aoaGlobals);
  // Lightly set column widths so the SKU/info area is readable; size columns kept narrow
  const globalsCols=INFO_COLS.map((c,i)=>({wch:c==='SKU'?14:c==='Style Description'?22:c==='Color Description'?22:c.length+2}))
    .concat(SIZE_COLS.map(()=>({wch:7})));
  wsGlobals['!cols']=globalsCols;
  XLSX.utils.book_append_sheet(wb,wsGlobals,'Globals');

  // Tab 2: Flows
  const wsFlows=XLSX.utils.aoa_to_sheet(aoaFlows);
  wsFlows['!cols']=globalsCols; // same shape as Globals
  XLSX.utils.book_append_sheet(wb,wsFlows,'Flows');

  // Tab 3: Channel Buys
  const wsChannel=XLSX.utils.aoa_to_sheet(aoaChannel);
  wsChannel['!cols']=[
    {wch:14}, // SKU
    {wch:14}, // Division
    {wch:18}, // Category
    {wch:30}, // Style Description
    {wch:24}, // Color Description
    {wch:10}, // Size
    {wch:13}, // Retail
    {wch:13}, // Online
    {wch:15}  // Total DTC
  ];
  XLSX.utils.book_append_sheet(wb,wsChannel,'Channel Buys');

  // Tab 4: Import (transposed Flows)
  const wsImport=XLSX.utils.aoa_to_sheet(aoaImport);
  wsImport['!cols']=[{wch:12},{wch:14},{wch:10},{wch:12},{wch:12},{wch:16},{wch:10},{wch:9}];
  XLSX.utils.book_append_sheet(wb,wsImport,'Import');

  // Trigger download
  XLSX.writeFile(wb,'PO_Sizing_'+A.activeSeason+'.xlsx');
}

// ═══ V9: Chase export — same 3-tab workbook, scoped to accepted Chase POs ═══
function exportChase(){
  const acceptedItems=(A.chaseItems||[]).filter(ci=>A.chaseAccepted[ci.id]);
  if(!acceptedItems.length){toast('No accepted Chase POs to export');return}

  const SIZE_DEFS=SIZE_DEFS_GLOBAL;
  const SIZE_COLS=SIZE_DEFS.map(d=>d.col);
  const INFO_COLS=['SIZING TYPE','Year','Season Code','Department','SKU','Location','Delivery','Customer','From Sales Tier','Sales Tier','Sizing Tab Total','Unit Variance','Total'];
  const sectionRow=[];
  INFO_COLS.forEach(()=>sectionRow.push('Info'));
  SIZE_DEFS.forEach(d=>sectionRow.push(d.sec==='kidsOS'?'Kids & OS':'Mens & Womens'));
  const headerRow=[...INFO_COLS,...SIZE_COLS];
  const aoaGlobals=[sectionRow.slice(),headerRow.slice()];
  const aoaFlows=[sectionRow.slice(),headerRow.slice()];
  const CHANNEL_HEADER=['SKU','Division','Category','Style Description','Color Description','Size','Retail Units','Online Units','Total DTC Units'];
  const aoaChannel=[CHANNEL_HEADER.slice()];
  const aoaImport=[IMPORT_HEADER.slice()]; // V9.9

  // makeRow variant that takes the season/year per-item (chase items can span seasons)
  function makeRow(r,sku,sizeMap,total,salesTier,delivery,season){
    const tl=r.sizingType==='initials'?'Initials PO':'CF PO';
    const yrMatch=(season||'').match(/(\d{2})$/);
    const year=yrMatch?'20'+yrMatch[1]:'2026';
    const divLower=(r.division||'').toLowerCase();
    const catLower=(r.category||'').toLowerCase();
    const isKidsLike=divLower.includes('kid')||divLower.includes('children')||divLower.includes('child');
    const isOSLike=(r.sizes||[]).some(s=>s==='OS');
    const isMens=divLower.includes('men')&&!divLower.includes('women');
    const isMensTailored=isMens&&catLower==='tailored';
    const sizeVals=SIZE_DEFS.map(def=>{
      const lookupKey=def.match!==undefined?def.match:def.col;
      const matchedSku=Object.keys(sizeMap).find(k=>k.toUpperCase()===String(lookupKey).toUpperCase());
      if(!matchedSku)return '';
      if(def.sec==='kidsOS'){
        if(def.kidsMatch&&!isKidsLike)return '';
        if(!def.kidsMatch&&!isKidsLike&&!isOSLike)return '';
      }
      if(def.sec==='mw'&&isKidsLike&&!isOSLike)return '';
      if(def.tailored){if(!isMensTailored)return ''}
      else if(isMensTailored&&/^(36|38|40|42|44|46|48|50)$/.test(def.col))return '';
      const v=sizeMap[matchedSku];
      return(v===0||v==null||v==='')?'':v;
    });
    return[tl,year,season||'',r.division,sku,'DTC',delivery,'','Chase',salesTier,'','',total,...sizeVals];
  }

  acceptedItems.forEach(ci=>{
    let r;try{r=buildChaseRecord(ci)}catch(e){return}
    if(!r||r.dtcBuy<=0)return;
    const res=computeAlloc(r);if(!res)return;
    const total=r.sizes.reduce((a,s)=>a+(res.alloc[s]||0),0);
    const sizeMap={};r.sizes.forEach(s=>{sizeMap[s]=res.alloc[s]||0});
    const baseDelivery=r.deliveryMonth||'';
    aoaGlobals.push(makeRow(r,ci.sku,sizeMap,total,'Chase',baseDelivery,ci.season));
    if(res.flows&&res.flows.count>1&&res.flowSizeBreaks){
      res.flowSizeBreaks.forEach(fb=>{
        const flowDelivery=shiftDeliveryMonth(baseDelivery,fb.offset);
        aoaFlows.push(makeRow(r,ci.sku,fb.sizeBreak,fb.units,fb.label,flowDelivery,ci.season));
        pushImportRows(aoaImport,r,ci.sku,ci.season||'',fb.label,flowDelivery,fb.sizeBreak);
      });
    } else {
      aoaFlows.push(makeRow(r,ci.sku,sizeMap,total,'Chase',baseDelivery,ci.season));
      pushImportRows(aoaImport,r,ci.sku,ci.season||'','Chase',baseDelivery,sizeMap);
    }
    if(res.retailAlloc&&res.onlineAlloc){
      r.sizes.forEach(s=>{
        const ru=res.retailAlloc[s]||0,ou=res.onlineAlloc[s]||0;
        aoaChannel.push([ci.sku,r.division||'',r.category||'',r.styleDescription||'',r.colorDescription||'',s,ru,ou,ru+ou]);
      });
    } else {
      aoaChannel.push([ci.sku,r.division||'',r.category||'',r.styleDescription||'',r.colorDescription||'','',(r.retailBuy||0),(r.onlineBuy||0),total]);
    }
  });

  const stamp=new Date().toISOString().slice(0,10);
  if(typeof XLSX==='undefined'){
    toast('Excel library unavailable — falling back to CSV downloads');
    function toCsv(aoa){return aoa.map(row=>row.map(v=>{if(v==null)return '';const s=String(v);return(s.includes(',')||s.includes('"')||s.includes('\n'))?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n')}
    function dl(text,fn){const b=new Blob([text],{type:'text/csv'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u)}
    dl(toCsv(aoaGlobals),'Chase_'+stamp+'_Globals.csv');
    dl(toCsv(aoaFlows),'Chase_'+stamp+'_Flows.csv');
    dl(toCsv(aoaChannel),'Chase_'+stamp+'_ChannelBuys.csv');
    dl(toCsv(aoaImport),'Chase_'+stamp+'_Import.csv');
    return;
  }
  const wb=XLSX.utils.book_new();
  const globalsCols=INFO_COLS.map(c=>({wch:c==='SKU'?14:c==='Style Description'?22:c==='Color Description'?22:c.length+2})).concat(SIZE_COLS.map(()=>({wch:7})));
  const wsG=XLSX.utils.aoa_to_sheet(aoaGlobals);wsG['!cols']=globalsCols;XLSX.utils.book_append_sheet(wb,wsG,'Globals');
  const wsF=XLSX.utils.aoa_to_sheet(aoaFlows);wsF['!cols']=globalsCols;XLSX.utils.book_append_sheet(wb,wsF,'Flows');
  const wsC=XLSX.utils.aoa_to_sheet(aoaChannel);wsC['!cols']=[{wch:14},{wch:14},{wch:18},{wch:30},{wch:24},{wch:10},{wch:13},{wch:13},{wch:15}];XLSX.utils.book_append_sheet(wb,wsC,'Channel Buys');
  const wsI=XLSX.utils.aoa_to_sheet(aoaImport);wsI['!cols']=[{wch:12},{wch:14},{wch:10},{wch:12},{wch:12},{wch:16},{wch:10},{wch:9}];XLSX.utils.book_append_sheet(wb,wsI,'Import');
  XLSX.writeFile(wb,'Chase_PO_Sizing_'+stamp+'.xlsx');
}

/* ═══════════════════════════════════════
   PO Sizing V4 — UI Rendering
   ═══════════════════════════════════════ */

function render(){
  const main=document.getElementById('main-area');
  // V9: remove any stale chase-form overlay if the form isn't open
  if(typeof chaseForm==='undefined'||!chaseForm){const cfo=document.getElementById('chase-form-overlay');if(cfo)cfo.remove()}
  try{
    if(A.module==='presmins'){renderPresMins(main);return}
    if(A.module==='datasources'){renderDataSources(main);return}
    if(A.module==='changelog'){renderChangelog(main);return}
    if(A.module==='chase'){
      // Chase detail view if a chase item is selected, else the chase grid
      if(A.view==='detail'&&A.chaseSelected){
        const chase=(A.chaseItems||[]).find(ci=>ci.id===A.chaseSelected);
        if(chase){
          const rec=buildChaseRecord(chase);
          renderDetail(main,rec);
          if(A.flowsModalSku===chase.id){
            const overlay=document.createElement('div');
            overlay.id='flows-modal-overlay';
            overlay.innerHTML=renderFlowsModal(rec);
            main.appendChild(overlay);
          }
          return;
        }
      }
      renderChaseGrid(main);
      return;
    }
    if(A.view==='detail'&&A.selectedSKU&&A.skus[A.selectedSKU]){
      renderDetail(main,A.skus[A.selectedSKU]);
      // Overlay flows modal on top if open
      if(A.flowsModalSku&&A.skus[A.flowsModalSku]){
        const overlay=document.createElement('div');
        overlay.id='flows-modal-overlay';
        overlay.innerHTML=renderFlowsModal(A.skus[A.flowsModalSku]);
        main.appendChild(overlay);
      }
      return;
    }
    renderGrid(main);
  }catch(err){
    console.error('Render error:',err);
    main.innerHTML='<div style="padding:24px;background:var(--wh);border:1px solid var(--red);border-radius:var(--rl);margin:20px"><div style="font-weight:700;color:var(--red);margin-bottom:8px">Render error</div><div style="font-family:var(--mono);font-size:11px;color:var(--txt2);white-space:pre-wrap">'+esc(err.message+'\n\n'+err.stack)+'</div><button class="btn btn-g btn-sm" style="margin-top:12px" onclick="goGrid()">Back to grid</button></div>';
  }
}

// ═══ FLOWS MODAL ═══
function renderFlowsModal(rec){
  const res=computeAlloc(rec);
  if(!res||!res.flows||res.flows.count<=1)return '';
  const{flows,pool,retailCurve,onlineCurve}=res;
  const m=flows.math||{};
  const isInitials=rec.sizingType==='initials';

  // Per-flow cards with delivery date + size table
  let flowsHtml='';
  flows.splits.forEach(sp=>{
    const flowDate=shiftDeliveryMonth(rec.deliveryMonth,sp.offset);
    const pct=pool>0?Math.round(sp.units/pool*100):0;
    let sizeRows='';
    rec.sizes.forEach(s=>{
      sizeRows+='<tr><td class="fm-sz">'+esc(s)+'</td><td class="fm-qty">'+fmt(sp.sizeBreak[s]||0)+'</td></tr>';
    });
    flowsHtml+='<div class="fm-flow"><div class="fm-flow-hdr">'+
      '<div class="fm-flow-name">'+esc(sp.label)+'</div>'+
      '<div class="fm-flow-date">'+esc(flowDate||'—')+'</div>'+
      '</div>'+
      '<div class="fm-flow-stats">'+
        '<span class="fm-flow-tot">'+fmt(sp.units)+' units</span>'+
        '<span class="fm-flow-pct">'+pct+'% of pool</span>'+
      '</div>'+
      '<table class="fm-tbl"><thead><tr><th>Size</th><th>Qty</th></tr></thead><tbody>'+sizeRows+'</tbody></table>'+
    '</div>';
  });

  // Math section — explain how Global was computed
  let mathHtml='';
  if(isInitials&&m.perSizeFloor){
    let perSizeRows='';
    let anyCapped=false;
    const stCt=rec.storeCount||0;
    rec.sizes.forEach(s=>{
      const f=m.perSizeFloor[s];
      const retailCurvePct=Math.round((retailCurve[s]||0)*1000)/10;
      const onlineCurvePct=Math.round((onlineCurve[s]||0)*1000)/10;
      // Combined buy for this size = sum across flows. If the floor exceeds it, the Global PO
      // can only hold the combined amount — the floor is capped by what the buy actually contains.
      let combinedS=0;flows.splits.forEach(sp=>{combinedS+=(sp.sizeBreak[s]||0)});
      const capped=f.total>combinedS;
      if(capped)anyCapped=true;
      perSizeRows+='<tr>'+
        '<td class="fm-sz">'+esc(s)+'</td>'+
        '<td class="fm-num">'+fmt(f.presMinUnits)+'</td>'+
        '<td class="fm-num">'+f.onlineFlat+'</td>'+
        '<td class="fm-num">'+f.retailWos.toFixed(1)+' <span class="fm-sub">('+m.apsRetail.toFixed(1)+'×'+stCt+'×6×'+retailCurvePct+'%)</span></td>'+
        '<td class="fm-num">'+f.onlineWos.toFixed(1)+' <span class="fm-sub">('+m.apsOnline.toFixed(1)+'×6×'+onlineCurvePct+'%)</span></td>'+
        '<td class="fm-num fm-tot">'+(capped?'<span title="Floor capped to the buy — only '+fmt(combinedS)+'u of this size exists across all flows">'+f.total+' → '+fmt(combinedS)+'</span>':f.total)+'</td>'+
        '</tr>';
    });
    const onlineFlatLabel=(A.presMinsMeta[rec.sizeScale]&&A.presMinsMeta[rec.sizeScale].onlineFlat!==undefined)?A.presMinsMeta[rec.sizeScale].onlineFlat:5;
    mathHtml='<div class="fm-math"><div class="fm-math-hdr">Global Floor Calculation (Initials)</div>'+
      '<div class="fm-math-desc">Each size needs: <b>retail pres min</b> + <b>online flat '+onlineFlatLabel+'</b> + <b>(Retail APS × stores) × 6 × retail curve%</b> + <b>Online APS × 6 × online curve%</b></div>'+
      '<table class="fm-math-tbl"><thead><tr>'+
      '<th>Size</th><th>Retail Pres Min</th><th>Online Flat</th><th>Retail WoS</th><th>Online WoS</th><th>Total Need</th>'+
      '</tr></thead><tbody>'+perSizeRows+'</tbody></table>'+
      '<div class="fm-math-summary">'+
        '<div><span class="fm-summary-lbl">Sum of per-size needs:</span> <span class="fm-summary-val">'+fmt(m.globalFloorTotal)+'u</span></div>'+
        '<div><span class="fm-summary-lbl">Target Global %:</span> <span class="fm-summary-val">'+Math.round(m.targetGlobalPct*100)+'% × '+fmt(pool)+'u = '+fmt(m.targetGlobalUnits)+'u</span></div>'+
        '<div><span class="fm-summary-lbl">Final Global:</span> <span class="fm-summary-val">'+fmt(m.globalUnits)+'u'+(m.bumpedAboveFloor?' <span class="fm-bump">(bumped above floor to baseline %)</span>':' <span class="fm-bump">(at minimum floor)</span>')+'</span></div>'+
        '<div><span class="fm-summary-lbl">Remaining to flow:</span> <span class="fm-summary-val">'+fmt(pool-m.globalUnits)+'u</span></div>'+
      '</div>'+
      (anyCapped?'<div class="fm-math-desc" style="margin-top:8px;color:var(--txt2)">Sizes marked <b>→</b> have a presentation floor larger than the whole buy allocates to that size; the Global PO holds the full available quantity (so the size is front-loaded into the initial set and not replenished).</div>':'')+
    '</div>';
  } else if(m.type==='CF'){
    if(m.globalFloorBOP){
      // V8.6 BOP-aware CF flow
      let floorRows='';
      if(m.cfGlobalFloor){
        rec.sizes.forEach(s=>{
          const minPres=(getPresMin(rec)[s]||0);
          const bopV=res&&res.bop?(res.bop[s]||0):0;
          floorRows+='<tr><td>'+esc(s)+'</td><td class="fm-num">'+fmt(minPres)+'</td><td class="fm-num">'+fmt(bopV)+'</td><td class="fm-num fm-tot">'+fmt(m.cfGlobalFloor[s]||0)+'</td></tr>';
        });
      }
      mathHtml='<div class="fm-math"><div class="fm-math-hdr">CF Flow Split — Always In Stock</div>'+
        '<div class="fm-math-desc">Global flow guarantees <b>min pres − projected BOP</b> per size, so BOP + Global ≥ presentation minimum. Remainder flows.</div>'+
        (floorRows?'<table class="fm-math-tbl"><thead><tr><th>Size</th><th>Min Pres</th><th>Proj BOP</th><th>Global Floor</th></tr></thead><tbody>'+floorRows+'</tbody></table>':'')+
        '<div class="fm-math-summary">'+
          '<div><span class="fm-summary-lbl">Total Pool:</span> <span class="fm-summary-val">'+fmt(pool)+'u</span></div>'+
          '<div><span class="fm-summary-lbl">Global Floor (min pres − BOP):</span> <span class="fm-summary-val">'+fmt(m.cfGlobalFloorTotal||0)+'u</span></div>'+
          '<div><span class="fm-summary-lbl">Remaining after floor:</span> <span class="fm-summary-val">'+fmt(m.remaining!=null?m.remaining:pool-(m.cfGlobalFloorTotal||0))+'u</span></div>'+
          (m.note?'<div><span class="fm-summary-lbl">Note:</span> <span class="fm-summary-val">'+esc(m.note)+'</span></div>':'')+
        '</div></div>';
    } else {
      mathHtml='<div class="fm-math"><div class="fm-math-hdr">CF Flow Split</div>'+
        '<div class="fm-math-desc">CF SKUs split based on total pool size:</div>'+
        '<div class="fm-math-summary">'+
          '<div><span class="fm-summary-lbl">Total Pool:</span> <span class="fm-summary-val">'+fmt(pool)+'u</span></div>'+
          '<div><span class="fm-summary-lbl">Split Rule:</span> <span class="fm-summary-val">'+(pool>=2000?'40 / 30 / 30 (≥2000u)':'60 / 40 (1200–1999u)')+'</span></div>'+
        '</div></div>';
    }
  }

  return '<div class="fm-backdrop" onclick="closeFlowsModal()"></div>'+
    '<div class="fm-panel" onclick="event.stopPropagation()">'+
      '<div class="fm-hdr"><div class="fm-title">Flows · '+esc(rec.sku)+'</div>'+
        '<div class="fm-subtitle">'+esc(rec.styleDescription||'')+(rec.colorDescription?' · '+esc(rec.colorDescription):'')+' · '+fmt(pool)+'u total · base delivery '+esc(rec.deliveryMonth||'—')+'</div>'+
        '<button class="fm-close" onclick="closeFlowsModal()" title="Close">×</button>'+
      '</div>'+
      '<div class="fm-body">'+
        '<div class="fm-flows-grid">'+flowsHtml+'</div>'+
        mathHtml+

// ═══ GRID ═══
function getFiltered(){
  let list=Object.values(A.skus).filter(r=>r.sizingType!=='nosize');const f=A.filters;
  if(f.type!=='All')list=list.filter(r=>r.sizingType===f.type);
  if(f.division!=='All')list=list.filter(r=>r.division===f.division);
  if(f.category!=='All')list=list.filter(r=>r.category===f.category);
  if(f.subcategory!=='All')list=list.filter(r=>r.subcategory===f.subcategory);
  if(f.segment&&f.segment!=='All')list=list.filter(r=>r.segment===f.segment);
  if(f.sizeScale&&f.sizeScale!=='All')list=list.filter(r=>r.sizeScale===f.sizeScale);
  if(f.commitCoding&&f.commitCoding!=='All'){
    if(f.commitCoding==='—')list=list.filter(r=>!(r.commitCoding||'').trim());
    else list=list.filter(r=>(r.commitCoding||'')===f.commitCoding);
  }
  if(f.ssConfigured&&f.ssConfigured!=='All'){
    const want=f.ssConfigured==='Configured';
    list=list.filter(r=>{
      // A scale is configured only if it exists in presMinsMeta AND has at least one size
      const scale=r.sizeScale||'';
      const meta=scale?A.presMinsMeta[scale]:null;
      const sizes=meta&&meta.sizes;
      const isConfigured=Array.isArray(sizes)&&sizes.length>0;
      return want===isConfigured;
    });
  }
  if(f.storeCount&&f.storeCount!=='All'){
    if(f.storeCount==='0')list=list.filter(r=>r.storeCount===0);
    else if(f.storeCount==='1-25')list=list.filter(r=>r.storeCount>=1&&r.storeCount<=25);
    else if(f.storeCount==='26-50')list=list.filter(r=>r.storeCount>=26&&r.storeCount<=50);
    else if(f.storeCount==='51-90')list=list.filter(r=>r.storeCount>=51&&r.storeCount<=90);
    else if(f.storeCount==='91+')list=list.filter(r=>r.storeCount>=91);
  }
  if(f.accepted&&f.accepted!=='All'){
    if(f.accepted==='Accepted')list=list.filter(r=>!!A.accepted[r.sku]);
    else if(f.accepted==='Pending')list=list.filter(r=>!A.accepted[r.sku]);
  }
  if(f.deliveryMonth&&f.deliveryMonth!=='All')list=list.filter(r=>formatDeliveryShort(r.deliveryMonth)===f.deliveryMonth);
  if(A.searchTerm){const st=A.searchTerm.toLowerCase();list=list.filter(r=>r.sku.toLowerCase().includes(st)||r.styleDescription.toLowerCase().includes(st)||r.colorDescription.toLowerCase().includes(st))}
  const sk=A.sortKey;const dir=A.sortDir==='asc'?1:-1;
  // For sized sort: compute sized once per SKU and cache on the record (cleared when filters re-render)
  if(sk==='sized'){
    list.forEach(r=>{
      if(r._sizedCache===undefined){
        const meta=A.presMinsMeta[r.sizeScale];
        const pmConfigured=!!(meta&&Array.isArray(meta.sizes)&&meta.sizes.length>0);
        let sizedTotal=0;
        if(pmConfigured&&r.sizes&&r.sizes.length){
          try{const res=computeAlloc(r);if(res&&res.alloc)sizedTotal=r.sizes.reduce((a,s)=>a+(res.alloc[s]||0),0)}catch(e){}
        }
        r._sizedCache=sizedTotal;
      }
    });
  }
  list.sort((a,b)=>{
    let cmp=0;
    if(sk==='dtcBuy')cmp=a.dtcBuy-b.dtcBuy;
    else if(sk==='postBuy')cmp=(a.totalOH+a.dtcBuy)-(b.totalOH+b.dtcBuy);
    else if(sk==='currentOH')cmp=a.totalOH-b.totalOH;
    else if(sk==='sized')cmp=(a._sizedCache||0)-(b._sizedCache||0);
    return cmp*dir;
  });return list;
}

// Compute filter options reactively — each filter's dropdown shows only values that remain
// possible given ALL OTHER active filters (excluding itself, so the user can change selection).
function getFilterOptions(){
  const all=Object.values(A.skus).filter(r=>r.sizingType!=='nosize');
  const f=A.filters;
  // Helper: apply all filters EXCEPT the named one
  function applyFiltersExcept(skipKey){
    return all.filter(r=>{
      if(skipKey!=='type'&&f.type!=='All'&&r.sizingType!==f.type)return false;
      if(skipKey!=='division'&&f.division!=='All'&&r.division!==f.division)return false;
      if(skipKey!=='category'&&f.category!=='All'&&r.category!==f.category)return false;
      if(skipKey!=='subcategory'&&f.subcategory!=='All'&&r.subcategory!==f.subcategory)return false;
      if(skipKey!=='segment'&&f.segment&&f.segment!=='All'&&r.segment!==f.segment)return false;
      if(skipKey!=='sizeScale'&&f.sizeScale!=='All'&&r.sizeScale!==f.sizeScale)return false;
      if(skipKey!=='commitCoding'&&f.commitCoding!=='All'){
        if(f.commitCoding==='—'&&(r.commitCoding||'').trim())return false;
        if(f.commitCoding!=='—'&&(r.commitCoding||'')!==f.commitCoding)return false;
      }
      if(skipKey!=='ssConfigured'&&f.ssConfigured!=='All'){
        const meta=A.presMinsMeta[r.sizeScale||''];
        const isConfigured=!!(meta&&Array.isArray(meta.sizes)&&meta.sizes.length>0);
        const want=f.ssConfigured==='Configured';
        if(want!==isConfigured)return false;
      }
      if(skipKey!=='storeCount'&&f.storeCount!=='All'){
        const sc=r.storeCount;
        if(f.storeCount==='0'&&sc!==0)return false;
        if(f.storeCount==='1-25'&&!(sc>=1&&sc<=25))return false;
        if(f.storeCount==='26-50'&&!(sc>=26&&sc<=50))return false;
        if(f.storeCount==='51-90'&&!(sc>=51&&sc<=90))return false;
        if(f.storeCount==='91+'&&!(sc>=91))return false;
      }
      if(skipKey!=='accepted'&&f.accepted!=='All'){
        if(f.accepted==='Accepted'&&!A.accepted[r.sku])return false;
        if(f.accepted==='Pending'&&A.accepted[r.sku])return false;
      }
      if(skipKey!=='deliveryMonth'&&f.deliveryMonth!=='All'){
        if(formatDeliveryShort(r.deliveryMonth)!==f.deliveryMonth)return false;
      }
      return true;
    });
  }
  const divsBase=applyFiltersExcept('division');
  const divs=[...new Set(divsBase.map(r=>r.division).filter(Boolean))].sort();
  const catsBase=applyFiltersExcept('category');
  const cats=[...new Set(catsBase.map(r=>r.category).filter(Boolean))].sort();
  const subsBase=applyFiltersExcept('subcategory');
  const subs=[...new Set(subsBase.map(r=>r.subcategory).filter(Boolean))].sort();
  const segsBase=applyFiltersExcept('segment');
  const segs=[...new Set(segsBase.map(r=>r.segment).filter(Boolean))].sort();
  const scalesBase=applyFiltersExcept('sizeScale');
  const scales=[...new Set(scalesBase.map(r=>r.sizeScale).filter(Boolean))].sort();
  const commitsBase=applyFiltersExcept('commitCoding');
  const commitsRaw=[...new Set(commitsBase.map(r=>r.commitCoding).filter(Boolean))].sort();
  const hasEmptyCommit=commitsBase.some(r=>!(r.commitCoding||'').trim());
  const commits=hasEmptyCommit?['—',...commitsRaw]:commitsRaw;
  // SS Configured: which states are still possible?
  const ssBase=applyFiltersExcept('ssConfigured');
  const ssHasConfigured=ssBase.some(r=>{const m=A.presMinsMeta[r.sizeScale||''];return!!(m&&Array.isArray(m.sizes)&&m.sizes.length>0)});
  const ssHasUnconfigured=ssBase.some(r=>{const m=A.presMinsMeta[r.sizeScale||''];return!(m&&Array.isArray(m.sizes)&&m.sizes.length>0)});
  // Store Count: which buckets are still possible?
  const stBase=applyFiltersExcept('storeCount');
  const stPossible=new Set();
  stBase.forEach(r=>{
    const sc=r.storeCount;
    if(sc===0)stPossible.add('0');
    else if(sc<=25)stPossible.add('1-25');
    else if(sc<=50)stPossible.add('26-50');
    else if(sc<=90)stPossible.add('51-90');
    else stPossible.add('91+');
  });
  // Type: which types still exist?
  const typeBase=applyFiltersExcept('type');
  const typeHasCF=typeBase.some(r=>r.sizingType==='cf');
  const typeHasInitials=typeBase.some(r=>r.sizingType==='initials');
  // Accepted: which still exist?
  const accBase=applyFiltersExcept('accepted');
  const accHasAccepted=accBase.some(r=>!!A.accepted[r.sku]);
  const accHasPending=accBase.some(r=>!A.accepted[r.sku]);
  // Delivery month: distinct short-formatted values, sorted chronologically by month + suffix
  const dmBase=applyFiltersExcept('deliveryMonth');
  const dmsRaw=new Set();
  dmBase.forEach(r=>{const sm=formatDeliveryShort(r.deliveryMonth);if(sm)dmsRaw.add(sm)});
  const monthOrder={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
  const dms=[...dmsRaw].sort((a,b)=>{
    const ma=a.match(/^([A-Z][a-z]{2})_(\d+)$/);const mb=b.match(/^([A-Z][a-z]{2})_(\d+)$/);
    if(!ma||!mb)return a.localeCompare(b);
    const ma1=monthOrder[ma[1]]||99,mb1=monthOrder[mb[1]]||99;
    if(ma1!==mb1)return ma1-mb1;
    return parseInt(ma[2],10)-parseInt(mb[2],10);
  });
  return{divs,cats,subs,segs,scales,commits,dms,
    ssOptions:{Configured:ssHasConfigured,'Not Configured':ssHasUnconfigured},
    stOptions:stPossible,
    typeOptions:{cf:typeHasCF,initials:typeHasInitials},
    accOptions:{Accepted:accHasAccepted,Pending:accHasPending}
  };
}
