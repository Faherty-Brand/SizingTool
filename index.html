<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PO Sizing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* PO Sizing V4 — Faherty Palette */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--sand:#f4ede4;--sand-lt:#faf6f1;--sand-dk:#e8ddd0;--sand-dkr:#d9cab8;--wh:#fff;
--navy:#1a2744;--navy-lt:#2c3e5e;
--blue:#3b7bc0;--blue-lt:#5a9ae0;--blue-pl:rgba(59,123,192,.08);--blue-md:rgba(59,123,192,.15);--blue-st:rgba(59,123,192,.25);
--orange:#c4572a;--orange-lt:#e07040;--orange-pl:rgba(196,87,42,.08);--orange-md:rgba(196,87,42,.15);
--teal:#2a8a8a;--green:#2d8a5e;--green-pl:rgba(45,138,94,.06);--green-bd:rgba(45,138,94,.35);
--yellow:#b8960f;--yellow-pl:rgba(184,150,15,.08);--yellow-bd:rgba(184,150,15,.35);
--red:#c44040;--pink:#c05a8a;--pink-pl:rgba(192,90,138,.08);
--slate:#6a7a8a;--slate-pl:rgba(106,122,138,.08);
--txt:#1a1a1a;--txt2:#555;--txt3:#999;--txti:#f0f0f0;
--bdr:#d9cab8;--bdr-lt:#e8ddd0;
--mono:'IBM Plex Mono','Fira Code',monospace;--sans:'Instrument Sans',-apple-system,sans-serif;
--r:6px;--rl:10px;--t:150ms ease;
--cb:rgba(59,123,192,.06);--cbd:rgba(59,123,192,.13);--co:rgba(196,87,42,.06);--cod:rgba(196,87,42,.13);
--shmd:0 4px 16px rgba(26,39,68,.08);--shlg:0 8px 32px rgba(26,39,68,.1);
}
html{height:100%}body{font-family:var(--sans);background:var(--sand);color:var(--txt);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
input,select,button,textarea{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--sand-dkr);border-radius:3px}
.hidden{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
.anim{animation:fadeUp .3s ease forwards}
.toast-area{position:fixed;top:12px;right:12px;z-index:999;display:flex;flex-direction:column;gap:6px}
.toast{padding:8px 16px;border-radius:var(--r);font-size:11px;font-weight:600;font-family:var(--mono);animation:toastIn .3s ease;box-shadow:var(--shmd)}
.toast.ok{background:var(--green-pl);color:var(--green);border:1px solid var(--green-bd)}.toast.out{animation:toastOut .5s ease forwards}
.btn{padding:7px 14px;font-size:11px;font-weight:600;border-radius:var(--r);cursor:pointer;transition:all var(--t);border:none;white-space:nowrap}
.btn-g{background:var(--sand-lt);color:var(--txt2);border:1px solid var(--bdr-lt)}.btn-g:hover{border-color:var(--blue);color:var(--txt)}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{background:var(--blue-lt)}.btn-b:disabled{background:var(--sand-dk);color:var(--txt3);cursor:not-allowed}
.btn-grn{background:var(--green);color:#fff;font-weight:700;padding:7px 18px;font-size:12px;border:none;border-radius:var(--r);cursor:pointer}.btn-grn:hover{background:#35a06a}
.btn-sm{padding:5px 10px;font-size:10px}
.bdg{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:2px 6px;border-radius:3px;display:inline-block}
.bdg-cf{color:var(--blue);background:var(--blue-pl)}.bdg-in{color:var(--orange);background:var(--orange-pl)}.bdg-ns{color:var(--txt3);background:var(--sand-dk)}
/* Welcome */
#welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative}
.w-nav{position:fixed;top:0;left:0;right:0;padding:10px 20px;display:flex;gap:8px;z-index:10}
.w-center{text-align:center;max-width:600px}
.sun-svg{display:block;margin:0 auto 12px}
.w-center .tag{font-family:var(--mono);font-size:10px;letter-spacing:4px;color:var(--orange);text-transform:uppercase;margin-bottom:6px}
.w-center h1{font-size:42px;font-weight:700;letter-spacing:-1.5px;color:var(--navy);margin-bottom:8px}
.w-center .sub{color:var(--txt2);font-size:14px;margin-bottom:36px}
.s-wait{color:var(--txt3);font-family:var(--mono);font-size:12px}
.s-grid{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.s-btn{padding:24px 44px;background:var(--wh);border:2px solid var(--bdr-lt);border-radius:var(--rl);cursor:pointer;transition:all .2s;text-align:center;min-width:160px}
.s-btn:hover{border-color:var(--blue);background:var(--blue-pl);transform:translateY(-2px);box-shadow:var(--shlg)}
.s-btn .code{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--navy);margin-bottom:4px}
.s-btn .ct{font-size:12px;color:var(--txt3)}
.u-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:var(--wh);border:1px solid var(--bdr-lt);border-radius:var(--r);cursor:pointer;transition:all var(--t);font-size:11px;font-weight:500;color:var(--txt3);position:relative}
.u-chip:hover{border-color:var(--blue);color:var(--txt2)}.u-chip.ok{border-color:var(--green-bd);color:var(--green);background:var(--green-pl)}
.u-chip input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}.u-chip .meta{font-family:var(--mono);font-size:9px}
.pm-link{display:flex;align-items:center;gap:6px;padding:7px 14px;font-size:11px;font-weight:600;color:var(--navy);background:var(--sand-lt);border:1px solid var(--bdr-lt);border-radius:var(--r);cursor:pointer}.pm-link:hover{border-color:var(--blue);background:var(--blue-pl)}
/* Dashboard */
#dash{display:none;min-height:100vh;flex-direction:column}#dash.active{display:flex}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;border-bottom:1px solid var(--bdr-lt);background:var(--wh);flex-shrink:0;position:sticky;top:0;z-index:20}
.top-l{display:flex;align-items:center;gap:14px}.top-r{display:flex;gap:8px;align-items:center}
.stitle{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--navy);letter-spacing:1px}
.exp-ct{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-right:4px}
/* Grid */
.gv{padding:20px 24px}.gc{margin-bottom:14px}
.gc-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.gc-lbl{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);margin-right:4px;flex-shrink:0}
.sb{padding:5px 10px;font-size:10px;font-weight:600;background:var(--wh);color:var(--txt2);border:1px solid var(--bdr-lt);border-radius:4px;cursor:pointer;transition:all var(--t);white-space:nowrap}
.sb:hover{border-color:var(--blue)}.sb.on{background:var(--navy);color:var(--txti);border-color:var(--navy)}
.fsel{padding:5px 8px;font-size:10px;font-weight:500;background:var(--wh);color:var(--txt);border:1px solid var(--bdr-lt);border-radius:4px;outline:none;cursor:pointer}.fsel.dim{opacity:.5}
.sbar{padding:7px 12px;font-size:12px;background:var(--wh);color:var(--txt);border:1px solid var(--bdr-lt);border-radius:var(--r);outline:none;width:220px}.sbar:focus{border-color:var(--blue)}.sbar::placeholder{color:var(--txt3)}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sc{padding:14px 16px;background:var(--wh);border:2px solid var(--bdr-lt);border-radius:var(--rl);cursor:pointer;transition:all .15s;position:relative}
.sc:hover{border-color:var(--blue);box-shadow:var(--shmd);transform:translateY(-1px)}
.sc.dv-m{border-left:4px solid var(--blue)}.sc.dv-w{border-left:4px solid var(--pink)}.sc.dv-n{border-left:4px solid var(--slate)}
.sc .chk{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.sc .chk-g{background:var(--green);color:#fff}.sc .chk-e{background:var(--wh);border:2px solid var(--bdr);color:transparent}
.sc .sid{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--navy);margin-bottom:2px}
.sc .snm{font-size:10px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.sc .sbu{font-family:var(--mono);font-size:16px;font-weight:700;margin-bottom:2px}.sc .ssb{font-family:var(--mono);font-size:9px;color:var(--txt3)}
.gnote{text-align:center;padding:20px;font-family:var(--mono);font-size:11px;color:var(--txt3)}
/* Detail */
.dv{padding:16px 28px 60px}
.d-back{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:11px;font-weight:600;color:var(--blue);background:var(--blue-pl);border:1px solid var(--blue-md);border-radius:var(--r);cursor:pointer;margin-bottom:12px}.d-back:hover{background:var(--blue-md)}
.detail-sticky{position:sticky;top:52px;z-index:15;background:var(--sand);padding:12px 0 10px;border-bottom:1px solid var(--bdr-lt);margin-bottom:14px}
.ds-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ds-left{display:flex;align-items:center;gap:10px}.ds-left h2{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--navy)}
.ds-right{display:flex;gap:8px;align-items:center}
.attr-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.attr-pill{font-family:var(--mono);font-size:9px;font-weight:600;padding:3px 8px;border-radius:4px;background:var(--blue-pl);color:var(--blue);border:1px solid var(--blue-md)}
.metric-row{display:flex;gap:5px;flex-wrap:wrap}
.metric-pill{font-family:var(--mono);font-size:9px;font-weight:600;padding:3px 8px;border-radius:4px;background:var(--orange-pl);color:var(--orange);border:1px solid var(--orange-md)}
/* V4 Chart */
.cb{background:var(--wh);border:1px solid var(--bdr-lt);border-radius:var(--rl);padding:18px 20px;margin-bottom:12px}
.slbl{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt3);margin-bottom:12px}
.chart-legend-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:8px 0}
.chart-cb{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--txt2);cursor:pointer;padding:4px 10px;border-radius:4px;border:1px solid var(--bdr-lt);background:var(--wh);transition:all var(--t)}
.chart-cb:hover{border-color:var(--blue)}.chart-cb.on{background:var(--sand-lt);border-color:var(--bdr)}
.chart-cb input{display:none}.cb-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.chart-v4{display:flex;gap:0;align-items:flex-end;height:180px;overflow-x:auto;padding-bottom:4px}
.chart-col-v4{flex:1;min-width:36px;display:flex;flex-direction:column;height:100%;border-right:1px solid var(--txt);padding:0 2px}
.chart-col-v4:last-child{border-right:none}
.chart-size-hdr{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--navy);text-align:center;padding:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-bars-v4{display:flex;gap:1px;align-items:flex-end;flex:1}
.cbar{flex:1;border-radius:2px 2px 0 0;transition:height .3s ease;position:relative;min-width:4px}
.cbar:hover{opacity:.8}.cbar:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--navy);color:var(--txti);font-family:var(--mono);font-size:9px;padding:3px 7px;border-radius:3px;white-space:nowrap;z-index:10;pointer-events:none}
/* Rollup */
.rb{font-family:var(--mono);font-size:10px;color:var(--txt2);padding:10px 14px;background:var(--wh);border:1px solid var(--bdr-lt);border-radius:var(--r);margin-bottom:14px;line-height:1.9}
.rs{display:inline-flex;align-items:center;gap:3px;margin-right:6px}.rp{color:var(--green);font-weight:600}.rf{color:var(--red)}
/* Table */
.tb{background:var(--wh);border:1px solid var(--bdr-lt);border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.tbh{padding:12px 18px;border-bottom:1px solid var(--bdr-lt);display:flex;align-items:center;justify-content:space-between;background:var(--wh)}
.tbn{font-family:var(--mono);font-size:10px}.tbs{overflow-x:auto;overflow-y:auto}
.dt{width:100%;border-collapse:collapse}.dt thead{position:sticky;top:0;z-index:4}
.dt .gr th{padding:4px 10px;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;text-align:center;border-bottom:1px solid var(--bdr-lt);background:var(--wh)}
.dt .gr .gs{background:var(--cb);color:var(--blue)}.dt .gr .gi{background:var(--co);color:var(--orange)}
.dt th{padding:6px 10px;text-align:right;font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--txt3);border-bottom:2px solid var(--bdr);white-space:nowrap;background:var(--wh)}
.dt th:first-child{text-align:left}
.dt td{padding:6px 10px;text-align:right;font-family:var(--mono);font-size:11px;border-bottom:1px solid var(--bdr-lt)}.dt td:first-child{text-align:left;font-weight:600;color:var(--navy)}
.dt tbody tr:hover{background:var(--sand-lt)}
.cbl{background-color:var(--cb)!important}.cbd{background-color:var(--cbd)!important}.col{background-color:var(--co)!important}.cod{background-color:var(--cod)!important}
.dt .rt{background:var(--sand-lt);font-weight:700}.dt .rt td{border-top:2px solid var(--bdr);border-bottom:2px solid var(--bdr);padding:8px 10px}
.ai{width:64px;padding:3px 6px;font-family:var(--mono);font-size:11px;text-align:right;background:var(--sand-lt);color:var(--txt);border:1px solid var(--bdr);border-radius:3px;outline:none}.ai:focus{border-color:var(--blue)}.ai.ov{background:var(--blue-pl);color:var(--blue);border-color:var(--blue-st)}
.c-g{color:var(--green)!important}.c-b{color:var(--blue)!important}.c-o{color:var(--orange)!important}.c-r{color:var(--red)!important}.c-n{color:var(--navy)!important}.c-d{color:var(--txt3)!important}.c-t{color:var(--teal)!important}
/* Pres Mins */
.pm-page{padding:24px 28px 60px}.pm-actions{display:flex;gap:8px;margin-bottom:16px}
.pm-cards{display:flex;flex-direction:column;gap:12px}
.pm-card{background:var(--wh);border:1px solid var(--bdr-lt);border-radius:var(--rl);padding:18px;overflow-x:auto;position:relative}
.pm-card.div-m{border-left:4px solid var(--blue)}.pm-card.div-w{border-left:4px solid var(--pink)}.pm-card.div-n{border-left:4px solid var(--slate)}
.pm-card h3{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--navy)}
.pm-delete{position:absolute;top:10px;right:14px;background:var(--red);color:#fff;border:none;width:24px;height:24px;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.7;transition:opacity var(--t)}.pm-delete:hover{opacity:1}
.pm-div-tag{font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;padding:2px 6px;border-radius:3px;display:inline-block;margin-bottom:10px}
.pm-div-m{color:var(--blue);background:var(--blue-pl)}.pm-div-w{color:var(--pink);background:var(--pink-pl)}.pm-div-n{color:var(--slate);background:var(--slate-pl)}
.pm-tbl{width:auto;border-collapse:collapse;min-width:100%}
.pm-tbl th{padding:5px 8px;font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;color:var(--txt3);text-align:center;border-bottom:1px solid var(--bdr-lt);white-space:nowrap}
.pm-tbl td{padding:4px 6px;text-align:center;white-space:nowrap}
.pm-tbl .pm-row-lbl{font-family:var(--mono);font-size:9px;font-weight:600;color:var(--txt3);text-align:left;padding-right:12px;text-transform:uppercase;letter-spacing:.5px}
.pm-tbl .pm-sep td{border-top:1px solid var(--bdr-lt);padding-top:6px}
.pm-val{font-family:var(--mono);font-size:11px;color:var(--txt2);padding:3px 6px}
.pm-input{width:50px;padding:4px;font-family:var(--mono);font-size:11px;text-align:center;background:var(--sand-lt);color:var(--txt);border:1px solid var(--bdr-lt);border-radius:3px;outline:none}.pm-input:focus{border-color:var(--blue)}
.pm-dirty-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--orange-pl);border:1px solid var(--orange-md);border-radius:var(--r);margin-top:10px}
.pm-dirty-bar .dt-text{font-size:11px;font-weight:600;color:var(--orange);flex:1}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeUp .2s ease}
.modal{background:var(--wh);border-radius:var(--rl);padding:28px 32px;max-width:520px;width:90%;box-shadow:var(--shlg);max-height:90vh;overflow-y:auto}
.modal h3{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:16px}
.modal-label{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--txt3);margin-bottom:6px;margin-top:16px}
.modal-input{width:100%;padding:9px 12px;font-size:13px;background:var(--sand-lt);color:var(--txt);border:1px solid var(--bdr);border-radius:var(--r);outline:none}.modal-input:focus{border-color:var(--blue)}
.modal-div-btns{display:flex;gap:6px;margin-top:6px}
.modal-div-btn{padding:8px 18px;font-size:12px;font-weight:600;border-radius:var(--r);cursor:pointer;transition:all var(--t);border:2px solid var(--bdr-lt);background:var(--wh);color:var(--txt2)}.modal-div-btn:hover{border-color:var(--blue)}
.modal-div-btn.sel-m{border-color:var(--blue);background:var(--blue-pl);color:var(--blue)}
.modal-div-btn.sel-w{border-color:var(--pink);background:var(--pink-pl);color:var(--pink)}
.modal-div-btn.sel-n{border-color:var(--slate);background:var(--slate-pl);color:var(--slate)}
.modal-copy-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.modal-copy-btn{padding:5px 12px;font-size:11px;font-weight:600;font-family:var(--mono);border-radius:4px;cursor:pointer;border:1px solid var(--bdr-lt);background:var(--wh);color:var(--txt2)}.modal-copy-btn:hover{border-color:var(--blue)}.modal-copy-btn.sel{border-color:var(--blue);background:var(--blue-pl);color:var(--blue)}
.tag-area{display:flex;flex-wrap:wrap;gap:4px;padding:8px;min-height:40px;background:var(--sand-lt);border:1px solid var(--bdr);border-radius:var(--r);margin-top:6px;align-items:center;cursor:text}.tag-area:focus-within{border-color:var(--blue)}
.size-tag{font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 8px;background:var(--blue-pl);color:var(--blue);border-radius:4px;display:flex;align-items:center;gap:4px}
.size-tag .tag-x{cursor:pointer;font-size:13px;color:var(--txt3);line-height:1}.size-tag .tag-x:hover{color:var(--red)}
.tag-input{border:none;outline:none;background:transparent;font-family:var(--mono);font-size:12px;color:var(--txt);min-width:60px;flex:1;padding:2px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:24px}
/* Data viewer */
.dv-page{padding:24px 28px 60px}.dv-tabs{display:flex;gap:4px;margin-bottom:14px}
.dv-tab{padding:7px 16px;font-size:11px;font-weight:600;background:var(--wh);color:var(--txt2);border:1px solid var(--bdr-lt);border-radius:var(--r);cursor:pointer}.dv-tab:hover{border-color:var(--blue)}.dv-tab.on{background:var(--navy);color:var(--txti);border-color:var(--navy)}
.dv-table-wrap{background:var(--wh);border:1px solid var(--bdr-lt);border-radius:var(--rl);overflow:auto;max-height:calc(100vh - 200px)}
.dv-table{border-collapse:collapse;font-family:var(--mono);font-size:10px;white-space:nowrap}
.dv-table th{position:sticky;top:0;background:var(--sand-lt);padding:6px 10px;text-align:left;font-size:9px;font-weight:600;color:var(--txt2);border-bottom:2px solid var(--bdr)}
.dv-table td{padding:4px 10px;border-bottom:1px solid var(--bdr-lt)}.dv-table tbody tr:hover{background:var(--sand-lt)}
.dv-info{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-bottom:8px}

<script>
/* ═══════════════════════════════════════
   PO Sizing V4 — Core Engine (db + data)
   ═══════════════════════════════════════ */

// ─── IndexedDB ───
const DB_NAME='POSizingV3',DB_VER=2;
let db=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('csvdata'))d.createObjectStore('csvdata');if(!d.objectStoreNames.contains('config'))d.createObjectStore('config')};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=e=>rej(e)})}
function dbPut(store,key,val){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(val,key);tx.oncomplete=()=>res();tx.onerror=e=>rej(e)})}
function dbGet(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e)})}
function dbDel(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>res();tx.onerror=e=>rej(e)})}

// ─── CSV Parser ───
function parseCSV(t,hi){
  hi=hi||0;const rl=[];let c='',q=false,r=[];
  for(let i=0;i<t.length;i++){const ch=t[i];if(ch==='"'){if(q&&t[i+1]==='"'){c+='"';i++}else q=!q}else if(ch===','&&!q){r.push(c.trim());c=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c.trim());if(r.length>1||(r.length===1&&r[0]!==''))rl.push(r);c='';r=[]}else c+=ch}
  if(c||r.length){r.push(c.trim());rl.push(r)}
  // Find the header row: first row that contains a 'SKU' cell (case-insensitive)
  let hdrIdx=-1;
  for(let i=0;i<Math.min(rl.length,8);i++){
    const row=rl[i]||[];
    if(row.some(cell=>cell.replace(/^\uFEFF/,'').trim().toLowerCase()==='sku')){hdrIdx=i;break}
  }
  if(hdrIdx===-1)return[];
  const h=rl[hdrIdx].map(x=>x.replace(/^\uFEFF/,'').trim());
  const res=[];
  for(let i=hdrIdx+1;i<rl.length;i++){
    const row=rl[i];if(!row||row.length<2)continue;
    const o={};h.forEach((hh,idx)=>{o[hh]=row[idx]||''});res.push(o);
  }
  return res;
}

// Header row positions: 42 reports (inventory/sales) always have headers in row 2 (index 1)
// Linelist/WIP have headers in row 3 (index 2)
function detectHeaderRow(text,key){
  return(key==='linelist'||key==='wip')?2:1;
}

function findCol(row,cands){
  if(!row)return null;const keys=Object.keys(row);
  for(const c of cands){const f=keys.find(k=>k.toLowerCase()===c.toLowerCase());if(f)return f}
  for(const c of cands){const cl=c.toLowerCase();const f=keys.find(k=>k.toLowerCase().includes(cl));if(f)return f}
  return null;
}

function numP(v){if(!v)return 0;return parseInt(String(v).replace(/[^0-9\-]/g,''),10)||0}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmt(n){return n.toLocaleString()}
function pct(n){return(n*100).toFixed(1)+'%'}

// ─── Size sort ───
const SO={XXS:1,XS:2,S:3,M:4,L:5,XL:6,XXL:7,XXXL:8,'2XL':7,'3XL':8,MT:5,LT:6,XLT:7,XXLT:8,OS:0};
function ssort(a,b){
  const oa=SO[a.toUpperCase()]??null,ob=SO[b.toUpperCase()]??null;
  if(oa!==null&&ob!==null)return oa-ob;if(oa!==null)return-1;if(ob!==null)return 1;
  const pa=a.match(/^(\d+)/),pb=b.match(/^(\d+)/);
  if(pa&&pb){const wa=+pa[1],wb=+pb[1];if(wa!==wb)return wa-wb;const la=a.match(/(\d+)L$/),lb=b.match(/(\d+)L$/);if(la&&lb)return+la[1]-+lb[1]}
  return a.localeCompare(b);
}

// ─── Toast ───
function toast(msg){const d=document.createElement('div');d.className='toast ok';d.textContent=msg;document.getElementById('toasts').appendChild(d);setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),500)},3000)}

// ─── Delivery month calc ───
const MONTH_MAP={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
function deliveryToWeeks(deliveryMonth,seasonCode){
  if(!deliveryMonth||!seasonCode)return 12;
  const base=deliveryMonth.toLowerCase().replace(/_\d+$/,'');
  const mo=MONTH_MAP[base];if(!mo)return 12;
  const yrMatch=seasonCode.match(/(\d{2})$/);if(!yrMatch)return 12;
  const yr=2000+parseInt(yrMatch[1]);
  const target=new Date(yr,mo-1,1);
  return Math.max(0,Math.round((target-new Date())/(7*24*60*60*1000)));
}

// ═══ APP STATE ═══
const A={
  raw:{inventory:null,sales:null,linelist:null,wip:null},
  rawCSV:{},uploadMeta:{},
  seasons:[],activeSeason:null,
  skus:{},selectedSKU:null,
  view:'grid',module:null,
  overrides:{},accepted:{},
  searchTerm:'',sortKey:'dtcBuy',
  filters:{type:'All',division:'All',category:'All',subcategory:'All'},
  presMins:{M3:{XS:.5,S:1,M:2,L:2,XL:1.5,XXL:.5},FM3:{XS:0,S:1,M:2,L:2,XL:1.5,XXL:0}},
  presMinsMeta:{M3:{div:'Mens',sizes:['XS','S','M','L','XL','XXL']},FM3:{div:'Mens',sizes:['XS','S','M','L','XL','XXL']}},
  scaleSizes:{},scaleSizeCount:{},hierSales:{},salSKU:{},cols:{},
  dvTab:'inventory',
  chartMetrics:null // per-sku chart toggle state
};

// ═══ UPLOAD ═══
function handleUpload(key,inp){
  const file=inp.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async function(ev){
    const text=ev.target.result;
    let hi=detectHeaderRow(text,key);
    A.raw[key]=parseCSV(text,hi);
    A.rawCSV[key]=text;
    A.uploadMeta[key]={rows:A.raw[key].length,cols:A.raw[key][0]?Object.keys(A.raw[key][0]).length:0,date:new Date().toLocaleString(),fileName:file.name};
    updateChip(key);
    await dbPut('csvdata','raw_'+key,text);
    await dbPut('csvdata','meta_'+key,A.uploadMeta[key]);
    // Build scaleSizes from data whenever linelist or sales/inv is uploaded
    if(allUp())buildScaleSizes();
    toast(key.charAt(0).toUpperCase()+key.slice(1)+' uploaded · '+fmt(A.raw[key].length)+' rows');
    trySeasons();
  };reader.readAsText(file);
}

function updateChip(key){
  const chip=document.getElementById('uc-'+key);
  const meta=document.getElementById('um-'+key);
  if(A.raw[key]&&chip){chip.classList.add('ok');const m=A.uploadMeta[key];if(meta)meta.textContent=fmt(m.rows)+'r × '+m.cols+'c · '+m.date}
}

function allUp(){return A.raw.inventory&&A.raw.sales&&A.raw.linelist&&A.raw.wip}

function buildScaleSizes(){
  // Build scaleSizes from linelist + sales + inventory data
  const ll=A.raw.linelist,sales=A.raw.sales,inv=A.raw.inventory;
  if(!ll||!ll[0])return;
  const lSS=findCol(ll[0],['Size Scale']),lS=findCol(ll[0],['SKU']);
  const skuScale={};ll.forEach(r=>{skuScale[r[lS]]=r[lSS]||''});
  A.scaleSizes={};
  if(sales&&sales[0]){const sS=findCol(sales[0],['SKU']),sZ=findCol(sales[0],['Size']);sales.forEach(r=>{const sc=skuScale[r[sS]];if(sc&&r[sZ]){if(!A.scaleSizes[sc])A.scaleSizes[sc]=new Set();A.scaleSizes[sc].add(r[sZ])}})}
  if(inv&&inv[0]){const iS=findCol(inv[0],['SKU']),iZ=findCol(inv[0],['Size']);inv.forEach(r=>{const sc=skuScale[r[iS]];if(sc&&r[iZ]){if(!A.scaleSizes[sc])A.scaleSizes[sc]=new Set();A.scaleSizes[sc].add(r[iZ])}})}
  for(const s in A.scaleSizes){A.scaleSizes[s]=[...A.scaleSizes[s]].sort(ssort);A.scaleSizeCount[s]=A.scaleSizes[s].length}
  // Also populate presMinsMeta sizes from data
  for(const s in A.scaleSizes){
    if(!A.presMinsMeta[s])A.presMinsMeta[s]={div:'Mens',sizes:[...A.scaleSizes[s]]};
    else A.presMinsMeta[s].sizes=[...A.scaleSizes[s]];
  }
  // Persist
  dbPut('config','scaleSizes',Object.fromEntries(Object.entries(A.scaleSizes).map(([k,v])=>[k,Array.isArray(v)?v:[...v]])));
  dbPut('config','presMinsMeta',A.presMinsMeta);
}

async function loadPersistedData(){
  for(const key of['inventory','sales','linelist','wip']){
    const text=await dbGet('csvdata','raw_'+key);
    const meta=await dbGet('csvdata','meta_'+key);
    if(text&&meta){
      let hi=detectHeaderRow(text,key);
      A.raw[key]=parseCSV(text,hi);
      A.rawCSV[key]=text;
      A.uploadMeta[key]=meta;
      // Validate parsed columns include 'SKU' — if not, the cached parse is corrupt
      if(A.raw[key]&&A.raw[key][0]){
        const cols=Object.keys(A.raw[key][0]);
        const hasSKU=cols.some(c=>c.toLowerCase()==='sku');
        if(!hasSKU){
          console.warn('Persisted '+key+' has invalid headers, clearing:',cols);
          A.raw[key]=null;A.rawCSV[key]=null;
          await dbDel('csvdata','raw_'+key);await dbDel('csvdata','meta_'+key);
          continue;
        }
      }
      updateChip(key);
    }
  }
  const pm=await dbGet('config','presMins');if(pm)A.presMins=pm;
  const pmm=await dbGet('config','presMinsMeta');if(pmm)A.presMinsMeta=pmm;
  const ss=await dbGet('config','scaleSizes');
  if(ss){for(const k in ss){A.scaleSizes[k]=ss[k];A.scaleSizeCount[k]=ss[k].length}}
  if(allUp())buildScaleSizes();
  trySeasons();
}

function trySeasons(){
  const el=document.getElementById('s-area');if(!el)return;
  if(!allUp()){el.innerHTML='<div class="s-wait">Upload all 4 data sources to continue</div>';return}
  const ll=A.raw.linelist,sc=findCol(ll[0],['Season Code']);
  const ct={};ll.forEach(r=>{const s=r[sc]||'';if(s)ct[s]=(ct[s]||0)+1});
  A.seasons=Object.keys(ct).sort();
  let h='<div class="s-grid">';
  A.seasons.forEach(s=>{h+='<div class="s-btn" onclick="goSeason(\''+esc(s)+'\')"><div class="code">'+esc(s)+'</div><div class="ct">'+ct[s]+' SKUs</div></div>'});
  el.innerHTML=h+'</div>';
}

function goSeason(s){
  A.activeSeason=s;A.selectedSKU=null;A.view='grid';A.module=null;
  A.overrides={};A.accepted={};A.sortKey='dtcBuy';
  A.filters={type:'All',division:'All',category:'All',subcategory:'All'};
  processData();
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('dash').classList.add('active');
  document.getElementById('slbl').textContent=s;
  render();
}

// ═══ PROCESS DATA ═══
function processData(){
  // Ensure scaleSizes is built before processing SKUs
  buildScaleSizes();
  const inv=A.raw.inventory,sales=A.raw.sales,ll=A.raw.linelist,wip=A.raw.wip;
  const c={};
  c.iS=findCol(inv[0],['SKU']);c.iZ=findCol(inv[0],['Size']);c.iO=findCol(inv[0],['On Hand Units - TY','On Hand Units','On Hand']);
  c.sS=findCol(sales[0],['SKU']);c.sZ=findCol(sales[0],['Size']);c.sU=findCol(sales[0],['Net Sales Units - TY','Net Sales Units']);
  c.sD=findCol(sales[0],['Merchandise Division','Division','Department']);c.sC=findCol(sales[0],['Category']);
  c.sSC=findCol(sales[0],['Sub-Category','SubCategory','Subcategory']);c.sSD=findCol(sales[0],['Style Description']);
  c.lS=findCol(ll[0],['SKU']);c.lSe=findCol(ll[0],['Season Code']);c.lDp=findCol(ll[0],['Department']);
  c.lCa=findCol(ll[0],['Category']);c.lSc=findCol(ll[0],['Subcategory','Sub-Category']);
  c.lSt=findCol(ll[0],['Style']);c.lSD=findCol(ll[0],['Style Description']);
  c.lCC=findCol(ll[0],['Color Code']);c.lCD=findCol(ll[0],['Color Description']);
  c.lSS=findCol(ll[0],['Size Scale']);c.lDB=findCol(ll[0],['Total DTC Buy']);
  c.lSn=findCol(ll[0],['Store Count']);c.lTr=findCol(ll[0],['Store Tier']);
  c.lLC=findCol(ll[0],['Seasonal Life Cycle']);c.lCm=findCol(ll[0],['Commit Coding']);
  c.lRo=findCol(ll[0],['Roll Out Code - Retail','Roll Out Code']);c.lPS=findCol(ll[0],['PST PLANNING ATTRIBUTE 1']);
  c.lDM=findCol(ll[0],['Delivery Month']);
  c.wS=findCol(wip[0],['SKU']);c.wZ=findCol(wip[0],['Size']);c.wO=findCol(wip[0],['Ordered']);
  c.wSt=findCol(wip[0],['Shipment Status']);c.wPS=findCol(wip[0],['PO Status']);
  c.wDC=findCol(wip[0],['New Expected in DC','Expected in DC']);
  A.cols=c;

  const invI={};inv.forEach(r=>{const k=r[c.iS];if(!invI[k])invI[k]={};invI[k][r[c.iZ]]=(invI[k][r[c.iZ]]||0)+numP(r[c.iO])});
  const salI={},hS={};A.salSKU={};
  sales.forEach(r=>{
    const sku=r[c.sS],sz=r[c.sZ],u=numP(r[c.sU]);
    if(!salI[sku])salI[sku]={};salI[sku][sz]=(salI[sku][sz]||0)+u;
    A.salSKU[sku]=(A.salSKU[sku]||0)+u;
    const d=(r[c.sD]||'').toLowerCase(),ca=(r[c.sC]||'').toLowerCase(),sc=(r[c.sSC]||'').toLowerCase(),pr=(r[c.sSD]||'').toLowerCase();
    ['prog|'+d+'|'+ca+'|'+sc+'|'+pr,'sub|'+d+'|'+ca+'|'+sc,'cat|'+d+'|'+ca,'div|'+d].forEach(k=>{if(!hS[k])hS[k]={};hS[k][sz]=(hS[k][sz]||0)+u});
  });
  A.hierSales=hS;

  const wipI={};
  wip.forEach(r=>{if(r[c.wPS]==='Dropped'||r[c.wSt]==='Received')return;const sku=r[c.wS],sz=r[c.wZ];if(!wipI[sku])wipI[sku]={};if(!wipI[sku][sz])wipI[sku][sz]={ordered:0,dc:''};wipI[sku][sz].ordered+=numP(r[c.wO]);if(r[c.wDC]&&!wipI[sku][sz].dc)wipI[sku][sz].dc=r[c.wDC]});

  A.skus={};
  ll.filter(r=>r[c.lSe]===A.activeSeason).forEach(r=>{
    const sku=r[c.lS],scale=r[c.lSS]||'';
    let sizes=A.scaleSizes[scale]?[...A.scaleSizes[scale]]:[];
    if(!sizes.length&&A.presMinsMeta[scale]&&A.presMinsMeta[scale].sizes)sizes=[...A.presMinsMeta[scale].sizes].sort(ssort);
    if(!sizes.length&&A.presMins[scale])sizes=Object.keys(A.presMins[scale]).sort(ssort);
    const stCt=numP(r[c.lSn]),dtcBuy=numP(r[c.lDB]);
    const sI=invI[sku]||{},sS=salI[sku]||{},sW=wipI[sku]||{};
    let tOH=0,tSl=0,tWIP=0;const sd={};
    sizes.forEach(s=>{const oh=sI[s]||0,sl=sS[s]||0,wi=sW[s]||{ordered:0,dc:''};sd[s]={onHand:oh,sales:sl,wipOrd:wi.ordered,wipDC:wi.dc};tOH+=oh;tSl+=sl;tWIP+=wi.ordered});
    let sType=dtcBuy===0?'nosize':(tOH===0&&tSl===0?'initials':'cf');
    const div=r[c.lDp]||'',cat=r[c.lCa]||'',sub=r[c.lSc]||'',prog=r[c.lSD]||'',dm=r[c.lDM]||'';
    A.skus[sku]={
      sku,season:A.activeSeason,division:div,category:cat,subcategory:sub,
      style:r[c.lSt]||'',styleDescription:prog,
      colorCode:r[c.lCC]||'',colorDescription:r[c.lCD]||'',
      sizeScale:scale,sizeCount:A.scaleSizeCount[scale]||sizes.length,
      dtcBuy,storeCount:stCt,storeTier:r[c.lTr]||'',
      lifecycle:r[c.lLC]||'',commitCoding:r[c.lCm]||'',
      rollout:r[c.lRo]||'',pst:r[c.lPS]||'',deliveryMonth:dm,
      sizingType:sType,sizes,sizeData:sd,
      totalOH:tOH,totalSales:tSl,totalWIP:tWIP,skuSalesTotal:A.salSKU[sku]||0,
      _hk:{prog:'prog|'+div.toLowerCase()+'|'+cat.toLowerCase()+'|'+sub.toLowerCase()+'|'+prog.toLowerCase(),
           sub:'sub|'+div.toLowerCase()+'|'+cat.toLowerCase()+'|'+sub.toLowerCase(),
           cat:'cat|'+div.toLowerCase()+'|'+cat.toLowerCase(),
           div:'div|'+div.toLowerCase()}
    };
  });
}

// ═══ SIZE CURVE ═══
function buildCurve(rec){
  const eligible=new Set(rec.sizes),thresh=100*rec.sizeCount;
  const levels=[
    {key:rec._hk.prog,label:rec.styleDescription,level:'Program'},
    {key:rec._hk.sub,label:rec.subcategory,level:'Subcategory'},
    {key:rec._hk.cat,label:rec.category,level:'Category'},
    {key:rec._hk.div,label:rec.division,level:'Division'}
  ];
  const trail=[];
  for(const lv of levels){
    const sbs=A.hierSales[lv.key];
    if(!sbs){trail.push({...lv,total:0,thresh,pass:false});continue}
    let total=0;const filt={};for(const s in sbs){if(eligible.has(s)){filt[s]=sbs[s];total+=sbs[s]}}
    if(total>=thresh){trail.push({...lv,total,thresh,pass:true});const curve={};rec.sizes.forEach(s=>{curve[s]=total>0?(filt[s]||0)/total:1/rec.sizes.length});return{curve,level:lv.level+' ('+lv.label+')',total,trail}}
    trail.push({...lv,total,thresh,pass:false});
  }
  const curve={};rec.sizes.forEach(s=>{curve[s]=1/rec.sizes.length});return{curve,level:'Even distribution',total:0,trail};
}

function getPresMin(rec){
  const cfg=A.presMins[rec.sizeScale]||{};const fl={};
  rec.sizes.forEach(s=>{fl[s]=Math.ceil((cfg[s]!==undefined?cfg[s]:0)*rec.storeCount)});
  return fl;
}

function getPresMinRate(rec){
  const cfg=A.presMins[rec.sizeScale]||{};const r={};
  rec.sizes.forEach(s=>{r[s]=cfg[s]!==undefined?cfg[s]:0});return r;
}

function projBOP(rec){
  const w=deliveryToWeeks(rec.deliveryMonth,rec.season);const bop={};
  rec.sizes.forEach(s=>{const oh=rec.sizeData[s].onHand;const pending=rec.sizeData[s].wipOrd;const wr=rec.sizeData[s].sales/52;bop[s]=Math.max(0,Math.round(oh+pending-wr*w))});
  bop._w=w;return bop;
}

function computeAlloc(rec){
  if(!rec||rec.dtcBuy<=0||!rec.sizes.length)return null;
  const cr=buildCurve(rec),curve=cr.curve,pm=getPresMin(rec),pmRate=getPresMinRate(rec),pool=rec.dtcBuy;
  const ovr=A.overrides[rec.sku]||{},isCF=rec.sizingType==='cf';
  let bop={},wtr=0;
  if(isCF){const bp=projBOP(rec);wtr=bp._w;delete bp._w;bop=bp}
  const totalBOP=isCF?Object.values(bop).reduce((a,b)=>a+b,0):0;
  const totalTgt=totalBOP+pool;
  const ideal={};
  rec.sizes.forEach(s=>{ideal[s]=Math.round(curve[s]*totalTgt)});

  // ── Allocation with strict pres min enforcement ──
  const alloc={};
  const floorSum=rec.sizes.reduce((a,s)=>a+(pm[s]||0),0);

  if(floorSum>=pool){
    // Floors alone exceed pool — distribute pool proportionally to floors
    rec.sizes.forEach(s=>{alloc[s]=Math.round((pm[s]||0)/floorSum*pool)});
  } else {
    // Step 1: Give every size its floor
    rec.sizes.forEach(s=>{alloc[s]=pm[s]||0});
    // Step 2: Distribute remaining units by curve, only to sizes that want more than their floor
    let remaining=pool-floorSum;
    // For CF: the "want" per size is ideal target minus BOP minus floor already given
    // For Initials: the "want" is curve-proportional share of pool minus floor
    const want={};
    rec.sizes.forEach(s=>{
      const curveShare=isCF?Math.max(0,ideal[s]-(bop[s]||0)):Math.round(curve[s]*pool);
      want[s]=Math.max(0,curveShare-(pm[s]||0));
    });
    const wantSum=Object.values(want).reduce((a,b)=>a+b,0);
    if(wantSum>0&&remaining>0){
      rec.sizes.forEach(s=>{
        const extra=Math.round(want[s]/wantSum*remaining);
        alloc[s]+=extra;
      });
    }
    // Step 3: Reconcile rounding — but NEVER go below floor
    let allocTotal=rec.sizes.reduce((a,s)=>a+alloc[s],0);
    let diff=pool-allocTotal;
    // Add/subtract from sizes that have the most headroom above their floor
    while(diff!==0){
      const eligible=rec.sizes.filter(s=>diff>0||(alloc[s]>(pm[s]||0)));
      if(!eligible.length)break;
      if(diff>0){
        // Add to size with largest curve share
        const best=eligible.reduce((a,b)=>curve[a]>=curve[b]?a:b);
        alloc[best]++;diff--;
      } else {
        // Remove from size with most headroom above floor
        const best=eligible.reduce((a,b)=>(alloc[a]-(pm[a]||0))>=(alloc[b]-(pm[b]||0))?a:b);
        if(alloc[best]>(pm[best]||0)){alloc[best]--;diff++}else break;
      }
    }
  }

  // Apply manual overrides (these CAN go below floor — user's explicit choice)
  let hasOvr=false;
  rec.sizes.forEach(s=>{if(ovr[s]!==undefined){alloc[s]=ovr[s];hasOvr=true}});

  // Curve source sales
  const curveSales={};let acceptedKey=null;
  for(const t of cr.trail){if(t.pass){acceptedKey=t.key;break}}
  if(acceptedKey&&A.hierSales[acceptedKey]){const hs=A.hierSales[acceptedKey];rec.sizes.forEach(s=>{curveSales[s]=hs[s]||0})}
  else{rec.sizes.forEach(s=>{curveSales[s]=0})}
  return{alloc,curve,cr,pm,pmRate,bop:isCF?bop:null,wtr:isCF?wtr:null,ideal:isCF?ideal:null,pool,curveSales};
}

function getFiltered(){
  let list=Object.values(A.skus).filter(r=>r.sizingType!=='nosize');const f=A.filters;
  if(f.type!=='All')list=list.filter(r=>r.sizingType===f.type);
  if(f.division!=='All')list=list.filter(r=>r.division===f.division);
  if(f.category!=='All')list=list.filter(r=>r.category===f.category);
  if(f.subcategory!=='All')list=list.filter(r=>r.subcategory===f.subcategory);
  if(A.searchTerm){const st=A.searchTerm.toLowerCase();list=list.filter(r=>r.sku.toLowerCase().includes(st)||r.styleDescription.toLowerCase().includes(st)||r.colorDescription.toLowerCase().includes(st))}
  const sk=A.sortKey;
  list.sort((a,b)=>{
    if(sk==='dtcBuy')return b.dtcBuy-a.dtcBuy;
    if(sk==='postBuy')return(b.totalOH+b.dtcBuy)-(a.totalOH+a.dtcBuy);
    if(sk==='currentOH')return b.totalOH-a.totalOH;
    if(sk==='storeCount')return b.storeCount-a.storeCount;
    if(sk==='type'){const to={cf:0,initials:1};return(to[a.sizingType]||9)-(to[b.sizingType]||9)}
    if(sk==='accepted'){return(A.accepted[a.sku]?0:1)-(A.accepted[b.sku]?0:1)}
    return 0;
  });return list;
}

  // Compute totals
  let totSkuSl=0,totCurveSl=0,totOH=0,totPend=0,totBOP=0,totIdeal=0,totAl=0,totPost=0,totMinRet=0;
  rec.sizes.forEach(s=>{
    const sd=rec.sizeData[s],a=alloc[s]||0;
    totSkuSl+=sd.sales;totCurveSl+=(curveSales[s]||0);totOH+=sd.onHand;
    if(isCF){totPend+=sd.wipOrd;totBOP+=(bop[s]||0)}
    totIdeal+=(isCF?(ideal[s]||0):Math.round(curve[s]*pool));
    totAl+=a;totPost+=(isCF?(bop[s]||0):0)+a;
    totMinRet+=pm[s];tPM+=(pmRate[s]||0);
  });

  // Totals row first
  let tBody='<tr class="rt"><td>TOTAL</td>';
  tBody+='<td class="cbl">'+fmt(totSkuSl)+'</td><td class="cbd">'+fmt(totCurveSl)+'</td><td class="cbl">100%</td><td class="cbd"></td>';
  tBody+='<td class="col">'+fmt(totOH)+'</td>';
  if(isCF)tBody+='<td class="cod">'+fmt(totPend)+'</td><td class="col c-t">'+fmt(totBOP)+'</td>';
  tBody+='<td class="cod">'+fmt(totIdeal)+'</td><td class="col"></td><td class="cod">'+fmt(totMinRet)+'</td>';
  tBody+='<td class="col c-o">'+fmt(totAl)+'</td><td class="cod">100%</td>';
  tBody+='<td class="col c-g" style="font-weight:700">'+fmt(totPost)+'</td></tr>';

  // Data rows
  rec.sizes.forEach(s=>{
    const sd=rec.sizeData[s],a=alloc[s]||0;
    const wr=(sd.sales/52).toFixed(1);const cv=curve[s];const sbPct=totAl>0?a/totAl:0;
    const postBuy=(isCF?(bop[s]||0):0)+a;
    const minRetail=pm[s];
    const hasOv=A.overrides[rec.sku]&&A.overrides[rec.sku][s]!==undefined;
    const inp=locked?'<span class="c-o">'+fmt(a)+'</span>':'<input class="ai'+(hasOv?' ov':'')+'" type="number" value="'+a+'" onchange="setOvr(\''+esc(rec.sku)+'\',\''+esc(s)+'\',this.value)">';
    tBody+='<tr><td>'+esc(s)+'</td>';
    tBody+='<td class="cbl">'+fmt(sd.sales)+'</td>';
    tBody+='<td class="cbd">'+fmt(curveSales[s]||0)+'</td>';
    tBody+='<td class="cbl c-d">'+pct(cv)+'</td>';
    tBody+='<td class="cbd c-d">'+wr+'</td>';
    tBody+='<td class="col">'+fmt(sd.onHand)+'</td>';
    if(isCF){tBody+='<td class="cod">'+fmt(sd.wipOrd)+'</td>';tBody+='<td class="col c-t">'+fmt(bop[s]||0)+'</td>'}
    tBody+='<td class="cod">'+fmt(isCF?(ideal[s]||0):Math.round(cv*pool))+'</td>';
    tBody+='<td class="col c-d">'+(pmRate[s]||'—')+'</td>';
    tBody+='<td class="cod'+(a<minRetail&&minRetail>0?' c-r':'')+'">'+fmt(minRetail)+'</td>';
    tBody+='<td class="col">'+inp+'</td>';
    tBody+='<td class="cod c-d">'+pct(sbPct)+'</td>';
    tBody+='<td class="col c-g" style="font-weight:600">'+fmt(postBuy)+'</td></tr>';
  });

  const variance=totAl-pool;
  const vNote=variance!==0?'<span class="tbn c-r">Variance: '+(variance>0?'+':'')+variance+'</span>':'<span class="tbn c-g">Balanced — '+fmt(pool)+' units</span>';
  const lockBtn=locked?'<button class="btn-grn" style="opacity:.6" onclick="toggleAcc(\''+esc(rec.sku)+'\')">✓ Accepted</button>':'<button class="btn-grn" onclick="toggleAcc(\''+esc(rec.sku)+'\')">Accept</button>';
  const hasOvrs=A.overrides[rec.sku]&&Object.keys(A.overrides[rec.sku]).length>0;
  const resetBtn=hasOvrs&&!locked?'<button class="btn btn-g btn-sm" onclick="clrOvr(\''+esc(rec.sku)+'\')">Reset</button>':'';
  const skuL52W=rec.skuSalesTotal;
  const totalBOPv=isCF?totBOP:0;

  el.innerHTML='<div class="dv anim">'+
    '<button class="d-back" onclick="goGrid()">← Back to '+esc(A.activeSeason)+'</button>'+
    '<div class="detail-sticky"><div class="ds-row1"><div class="ds-left"><h2>'+esc(rec.sku)+'</h2><span class="bdg '+(isCF?'bdg-cf':'bdg-in')+'">'+rec.sizingType.toUpperCase()+'</span></div>'+
    '<div class="ds-right">'+resetBtn+lockBtn+'</div></div>'+
    '<div class="attr-row">'+attrPills(rec)+'</div>'+
    '<div class="metric-row">'+
      '<span class="metric-pill">'+esc(rec.season)+' Buy: '+fmt(pool)+'</span>'+
      '<span class="metric-pill">Stores: '+fmt(rec.storeCount)+'</span>'+
      '<span class="metric-pill">Current OH: '+fmt(rec.totalOH)+'</span>'+
      (isCF?'<span class="metric-pill">Proj. BOP: '+fmt(totalBOPv)+' ('+wks+'w)</span>':'')+
      '<span class="metric-pill">L52W SKU Sales: '+fmt(skuL52W)+'</span>'+
    '</div></div>'+
    // Chart
    '<div class="cb"><div class="slbl">Size Distribution</div>'+legend+
    '<div class="chart-v4">'+bars+'</div></div>'+
    trail+
    // Table
    '<div class="tb"><div class="tbh"><div class="slbl" style="margin:0">Data Table</div>'+vNote+'</div>'+
    '<div class="tbs"><table class="dt"><thead>'+thead+'</thead><tbody>'+tBody+'</tbody></table></div></div></div>';
}

function attrPills(rec){
  return '<span class="attr-pill">'+esc(rec.division)+'</span>'+
    '<span class="attr-pill">'+esc(rec.category)+'</span>'+
    '<span class="attr-pill">'+esc(rec.subcategory)+'</span>'+
    '<span class="attr-pill">'+esc(rec.sizeScale)+'</span>'+
    '<span class="attr-pill">'+esc(rec.storeTier||'—')+'</span>'+
    (rec.deliveryMonth?'<span class="attr-pill">'+esc(rec.deliveryMonth)+'</span>':'');
}

// ═══ PRES MINS ═══
let pmStaged={};

function renderPresMins(el){
  // Combine scales from presMins config AND scaleSizes (data-derived) AND presMinsMeta
  const allScales=new Set();
  for(const s in A.presMins)allScales.add(s);
  for(const s in A.scaleSizes)allScales.add(s);
  for(const s in A.presMinsMeta)allScales.add(s);
  let scales=[...allScales].sort();

  let h='<div class="pm-page anim"><button class="d-back" onclick="goBackFromModule()">← Back</button>'+
    '<h2 style="font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px">Presentation Minimums</h2>'+
    '<p style="font-size:12px;color:var(--txt2);margin-bottom:14px">Per-size units per store. Persisted across sessions.</p>'+
    '<div class="pm-actions"><button class="btn btn-b btn-sm" onclick="openAddScaleModal()">+ Add Size Scale</button></div>'+
    '<div class="pm-cards">';

  scales.forEach(scale=>{
    // Get sizes from presMinsMeta first, then scaleSizes, then derive from presMins keys
    const metaSizes=(A.presMinsMeta[scale]&&A.presMinsMeta[scale].sizes)||[];
    const dataSizes=A.scaleSizes[scale]||[];
    const pmKeys=Object.keys(A.presMins[scale]||{});
    // Merge all known sizes
    const sizeSet=new Set([...metaSizes,...dataSizes,...pmKeys]);
    const sizes=[...sizeSet].sort(ssort);
    if(!sizes.length)return;

    const cfg=A.presMins[scale]||{};
    const staged=pmStaged[scale]||{};
    const meta=A.presMinsMeta[scale]||{};
    const divCls=meta.div==='Womens'?'div-w':meta.div==='Non-Apparel'?'div-n':'div-m';
    const divTag=meta.div==='Womens'?'pm-div-w':meta.div==='Non-Apparel'?'pm-div-n':'pm-div-m';
    const storeSizes=sizes.filter(s=>(cfg[s]||0)>0).length;
    const hasStagedChanges=Object.keys(staged).length>0&&Object.keys(staged).some(s=>{const sv=staged[s];const cv=cfg[s];return sv!==cv});

    h+='<div class="pm-card '+divCls+'" style="position:relative"><button class="pm-delete" onclick="deleteScale(\''+esc(scale)+'\')" title="Delete scale">✕</button>'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><h3 style="margin:0">'+esc(scale)+' <span style="font-weight:400;color:var(--txt3)">('+sizes.length+' sizes · '+storeSizes+' store)</span></h3>'+
      '<button class="btn btn-g btn-sm" onclick="openEditScaleModal(\''+esc(scale)+'\')">Edit Sizes</button></div>';
    if(meta.div)h+='<span class="pm-div-tag '+divTag+'">'+esc(meta.div)+'</span>';
    h+='<table class="pm-tbl"><thead><tr><th></th>';
    sizes.forEach(s=>{h+='<th>'+esc(s)+'</th>'});
    h+='</tr></thead><tbody>';
    h+='<tr><td class="pm-row-lbl">Current</td>';
    sizes.forEach(s=>{const v=cfg[s]!==undefined?cfg[s]:'—';h+='<td><span class="pm-val">'+v+'</span></td>'});
    h+='</tr>';
    h+='<tr class="pm-sep"><td class="pm-row-lbl">Overwrite</td>';
    sizes.forEach(s=>{
      const sv=staged[s]!==undefined?staged[s]:(cfg[s]!==undefined?cfg[s]:'');
      h+='<td><input class="pm-input" type="number" step="0.5" min="0" value="'+sv+'" onchange="stagePM(\''+esc(scale)+'\',\''+esc(s)+'\',this.value)"></td>';
    });
    h+='</tr></tbody></table>';
    if(hasStagedChanges){
      h+='<div class="pm-dirty-bar"><span class="dt-text">Unsaved changes</span>'+
        '<button class="btn btn-grn btn-sm" onclick="acceptPMOverwrites(\''+esc(scale)+'\')">Accept Overwrites</button>'+
        '<button class="btn btn-g btn-sm" onclick="clearPMStaged(\''+esc(scale)+'\')">Discard</button></div>';
    }
    h+='</div>';
  });

  if(!scales.length)h+='<div class="gnote">No size scales configured. Click "+ Add Size Scale" to create one.</div>';
  h+='</div></div>';el.innerHTML=h;
}

function stagePM(scale,size,val){
  if(!pmStaged[scale])pmStaged[scale]={};
  const v=parseFloat(val);pmStaged[scale][size]=isNaN(v)||v<0?0:v;
  render();
}

async function acceptPMOverwrites(scale){
  const staged=pmStaged[scale]||{};
  if(!A.presMins[scale])A.presMins[scale]={};
  for(const s in staged)A.presMins[scale][s]=staged[s];
  delete pmStaged[scale];
  await dbPut('config','presMins',A.presMins);
  toast(scale+' pres mins updated');render();
}

function clearPMStaged(scale){delete pmStaged[scale];render()}

async function deleteScale(scale){
  if(!confirm('Delete size scale "'+scale+'"? This cannot be undone.'))return;
  delete A.presMins[scale];delete A.presMinsMeta[scale];delete A.scaleSizes[scale];delete A.scaleSizeCount[scale];
  await dbPut('config','presMins',A.presMins);
  await dbPut('config','presMinsMeta',A.presMinsMeta);
  await dbPut('config','scaleSizes',Object.fromEntries(Object.entries(A.scaleSizes).map(([k,v])=>[k,Array.isArray(v)?v:[...v]])));
  toast(scale+' deleted');render();
}

// ─── Add/Edit Scale Modal ───
let modalState={name:'',div:'Mens',copyFrom:'',sizes:[],sizeInput:'',editing:null};

function openAddScaleModal(){
  modalState={name:'',div:'Mens',copyFrom:'',sizes:[],sizeInput:'',editing:null};renderModal();
}

function openEditScaleModal(scale){
  const meta=A.presMinsMeta[scale]||{};
  const sizes=A.scaleSizes[scale]||meta.sizes||Object.keys(A.presMins[scale]||{});
  modalState={name:scale,div:meta.div||'Mens',copyFrom:'',sizes:[...sizes],sizeInput:'',editing:scale};
  renderModal();
}

function closeModal(){document.getElementById('modal-root').innerHTML=''}

function renderModal(){
  const ms=modalState;
  const existingScales=Object.keys(A.scaleSizes).filter(s=>(A.scaleSizes[s]||[]).length>0);
  const hasExisting=existingScales.length>0&&!ms.editing;
  const isEdit=!!ms.editing;
  const divBtns=[
    {val:'Mens',label:'Mens',cls:ms.div==='Mens'?'sel-m':''},
    {val:'Womens',label:'Womens',cls:ms.div==='Womens'?'sel-w':''},
    {val:'Non-Apparel',label:'Non-Apparel',cls:ms.div==='Non-Apparel'?'sel-n':''}
  ];

  let h='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+
    '<h3>'+(isEdit?'Edit '+esc(ms.editing):'Add Size Scale')+'</h3>';
  if(!isEdit){
    h+='<div class="modal-label">Scale Name</div><input class="modal-input" type="text" placeholder="e.g. FM6" value="'+esc(ms.name)+'" oninput="modalState.name=this.value">';
  }
  h+='<div class="modal-label">Division</div><div class="modal-div-btns">';
  divBtns.forEach(b=>{h+='<button class="modal-div-btn '+b.cls+'" onclick="modalState.div=\''+b.val+'\';renderModal()">'+b.label+'</button>'});
  h+='</div>';
  if(hasExisting&&!ms.copyFrom){
    h+='<div class="modal-label">Copy Sizes From (optional)</div><div class="modal-copy-btns">';
    h+='<button class="modal-copy-btn sel" onclick="">None — enter manually</button>';
    existingScales.forEach(s=>{h+='<button class="modal-copy-btn" onclick="modalState.copyFrom=\''+esc(s)+'\';modalState.sizes=[...(A.scaleSizes[\''+esc(s)+'\']||[])];renderModal()">'+esc(s)+' ('+((A.scaleSizes[s]||[]).length)+')</button>'});
    h+='</div>';
  }
  if(hasExisting&&ms.copyFrom){
    h+='<div class="modal-label">Copied from '+esc(ms.copyFrom)+' <a href="#" onclick="modalState.copyFrom=\'\';renderModal();return false" style="color:var(--red);font-size:10px">clear</a></div>';
  }
  // Tag input for sizes
  h+='<div class="modal-label">Sizes</div><div class="tag-area" onclick="this.querySelector(\'.tag-input\')?.focus()">';
  ms.sizes.forEach((s,i)=>{h+='<span class="size-tag">'+esc(s)+'<span class="tag-x" onclick="event.stopPropagation();modalState.sizes.splice('+i+',1);renderModal()">×</span></span>'});
  h+='<input class="tag-input" type="text" placeholder="Type + Enter" value="'+esc(ms.sizeInput)+'" oninput="modalState.sizeInput=this.value" onkeydown="handleTagKey(event)">';
  h+='</div><div style="font-size:10px;color:var(--txt3);margin-top:4px">Press Enter or comma to add. Click × to remove.</div>';
  const canSave=(isEdit||ms.name.trim())&&ms.sizes.length>0;
  h+='<div class="modal-footer"><button class="btn btn-g" onclick="closeModal()">Cancel</button>'+
    '<button class="btn btn-b"'+(canSave?'':' disabled')+' onclick="saveScale()">'+(isEdit?'Save Changes':'Create Scale')+'</button></div></div></div>';
  document.getElementById('modal-root').innerHTML=h;
  if(!isEdit&&!ms.name){const inp=document.querySelector('.modal-input');if(inp)setTimeout(()=>inp.focus(),50)}
}

function handleTagKey(e){
  if(e.key==='Enter'||e.key===','){
    e.preventDefault();const val=modalState.sizeInput.replace(',','').trim().toUpperCase();
    if(val&&!modalState.sizes.includes(val))modalState.sizes.push(val);
    modalState.sizeInput='';renderModal();
    setTimeout(()=>{const inp=document.querySelector('.tag-input');if(inp)inp.focus()},50);
  }
}

async function saveScale(){
  const ms=modalState;
  const name=ms.editing||ms.name.trim().toUpperCase();if(!name||!ms.sizes.length)return;
  A.scaleSizes[name]=[...ms.sizes];A.scaleSizeCount[name]=ms.sizes.length;
  if(!A.presMins[name])A.presMins[name]={};
  A.presMinsMeta[name]={div:ms.div,sizes:[...ms.sizes]};
  if(!ms.editing&&ms.copyFrom&&A.presMins[ms.copyFrom])A.presMins[name]={...A.presMins[ms.copyFrom]};
  await dbPut('config','presMins',A.presMins);
  await dbPut('config','presMinsMeta',A.presMinsMeta);
  await dbPut('config','scaleSizes',Object.fromEntries(Object.entries(A.scaleSizes).map(([k,v])=>[k,Array.isArray(v)?v:[...v]])));
  closeModal();toast(name+(ms.editing?' updated':' created'));render();
}

// ═══ DATA SOURCES ═══
function renderDataSources(el){
  const tabs=['inventory','sales','linelist','wip'];
  let h='<div class="dv-page anim"><button class="d-back" onclick="goBackFromModule()">← Back</button>'+
    '<h2 style="font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px">Data Sources</h2>'+
    '<p style="font-size:12px;color:var(--txt2);margin-bottom:14px">Live view of ingested CSV data.</p><div class="dv-tabs">';
  tabs.forEach(t=>{const m=A.uploadMeta[t];h+='<button class="dv-tab'+(A.dvTab===t?' on':'')+'" onclick="A.dvTab=\''+t+'\';render()">'+t.charAt(0).toUpperCase()+t.slice(1)+(m?' ('+fmt(m.rows)+'r)':'')+'</button>'});
  h+='</div>';const data=A.raw[A.dvTab];const meta=A.uploadMeta[A.dvTab];
  if(!data)h+='<div class="gnote">No data loaded for '+A.dvTab+'</div>';
  else{
    h+='<div class="dv-info">'+fmt(meta.rows)+' rows × '+meta.cols+' cols · '+meta.date+' · '+esc(meta.fileName)+'</div>';
    h+='<div class="dv-table-wrap"><table class="dv-table"><thead><tr>';
    const cols=Object.keys(data[0]);cols.forEach(c=>{h+='<th>'+esc(c)+'</th>'});
    h+='</tr></thead><tbody>';data.slice(0,500).forEach(r=>{h+='<tr>';cols.forEach(c=>{h+='<td>'+esc(r[c]||'')+'</td>'});h+='</tr>'});
    h+='</tbody></table></div>';if(data.length>500)h+='<div class="gnote">Showing 500 of '+fmt(data.length)+'</div>';
  }
  h+='</div>';el.innerHTML=h;
}

openDB().then(()=>loadPersistedData()).catch(e=>console.error('DB error:',e));
</script>
