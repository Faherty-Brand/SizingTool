  c.sD=findCol(sales[0],['Merchandise Division','Division','Department']);c.sC=findCol(sales[0],['Category']);
  c.sSC=findCol(sales[0],['Sub-Category','SubCategory','Subcategory']);c.sSD=findCol(sales[0],['Style Description']);
  c.sCD=findCol(sales[0],['Color Description']);
  c.sLT=findCol(sales[0],['Location Type']);
  c.sWk=findCol(sales[0],['Week']);                                  // V7.8: weekly breakdown for weeksLive
  c.sSeg=findCol(sales[0],['Product Segmentation','Segmentation']);   // V7.8: segment level
  c.lS=findCol(ll[0],['SKU']);c.lSe=findCol(ll[0],['Season Code']);c.lDp=findCol(ll[0],['Department']);
  c.lCa=findCol(ll[0],['Category']);c.lSc=findCol(ll[0],['Subcategory','Sub-Category']);
  c.lSt=findCol(ll[0],['Style']);c.lSD=findCol(ll[0],['Style Description']);
  c.lCC=findCol(ll[0],['Color Code']);c.lCD=findCol(ll[0],['Color Description']);
  c.lSeg=findCol(ll[0],['Product Segmentation','Segmentation']);     // V7.8: SKU-to-segment lookup
  c.lSS=findCol(ll[0],['Size Scale']);c.lDB=findCol(ll[0],['Total DTC Buy']);
  c.lRB=findCol(ll[0],['Retail Final Buy']);
  c.lOB=findCol(ll[0],['Online Final Buy']);
  c.lAPSr=findCol(ll[0],['APS Final | Retail']);
  c.lAPSo=findCol(ll[0],['APS Final | Online']);
  c.lSn=findCol(ll[0],['Store Count']);c.lTr=findCol(ll[0],['Store Tier']);
  c.lLC=findCol(ll[0],['Seasonal Life Cycle']);c.lCm=findCol(ll[0],['Commit Coding']);
  c.lRo=findCol(ll[0],['Roll Out Code - Retail','Roll Out Code']);c.lPS=findCol(ll[0],['PST PLANNING ATTRIBUTE 1']);
  c.lDM=findCol(ll[0],['Delivery Month']);
  c.lBs=findCol(ll[0],['Total Buy | Buy Status','Buy Status']);
  c.wS=findCol(wip[0],['SKU']);c.wZ=findCol(wip[0],['Size']);c.wO=findCol(wip[0],['Ordered']);
  c.wSt=findCol(wip[0],['Shipment Status']);c.wPS=findCol(wip[0],['PO Status']);
  c.wLoc=findCol(wip[0],['Location']);
  c.wMDC=findCol(wip[0],['Master In DC','Master in DC']);
  c.wTDD=findCol(wip[0],['Target Delivery Date']);
  c.wDC=findCol(wip[0],['New Expected in DC','Expected in DC']); // legacy fallback
  A.cols=c;

  const invI={};inv.forEach(r=>{const k=r[c.iS];if(!invI[k])invI[k]={};invI[k][r[c.iZ]]=(invI[k][r[c.iZ]]||0)+numP(r[c.iO])});
  // Hierarchical sales: total (DTC), Retail-only, Online-only
  // V7.8: hierarchy now has Segment level between Program and Subcategory.
  // V7.8: also track weeksLive per SKU = count of distinct weeks with sales > 0
  const salI={},hS={},hSr={},hSo={};A.salSKU={};A.salSKURet={};A.salSKUOnline={};
  const salIr={},salIo={};  // V9.3: per-SKU per-size sales split by channel
  const hierSkus={};  // V8.3: hierarchy key -> Set<sku> with sales > 0 (denominator for parent-rate fallback)
  const skuWeeks={};         // SKU -> Set<weekLabel> with sales > 0
  const skuWkUnits={};       // V9.9: SKU -> {weekOfYear: units} — the seasonal shape, per SKU
  const hierWk={};           // V9.9: hierarchy key -> {weekOfYear: units} — parent seasonal shapes
  const hierWkSeas={};       // V9.9.1: 'SU|<hierKey>' -> {weekOfYear: units} — season-aligned cohorts
  let wkParsed=0,wkUnparsed=0;  // V9.9: diagnostics for the Week column
  A.salSkuMeta={};           // V9: SKU -> {division,category,subcategory,segment,styleDescription,colorDescription, sizes:Set}
  // V9.9.1: SKU -> season family, so weekly sales can be bucketed into season-aligned cohorts.
  // A blended 'all men's shirts' curve is nearly FLAT (it mixes summer and fall product), which is
  // why the first cut of the seasonal index barely moved the rate. Restricting the curve to the
  // same season family is what actually gives it a summer peak and a dead winter.
  const skuSeasonPfx={};
  if(ll&&ll[0]&&c.lS!=null&&c.lSe!=null){
    ll.forEach(r=>{
      const k=r[c.lS];if(!k)return;
      const pfx=seasonPrefix(r[c.lSe]);
      if(pfx)skuSeasonPfx[k]=pfx;
    });
  }
  const hasWeekCol=c.sWk!==null&&c.sWk!==undefined;
  const hasSegCol=c.sSeg!==null&&c.sSeg!==undefined;
  sales.forEach(r=>{
    const sku=r[c.sS],sz=r[c.sZ],u=numP(r[c.sU]);
    const lt=(r[c.sLT]||'').toLowerCase();
    const isOnline=lt.includes('online')||lt.includes('ecom')||lt==='online';
    const isRetail=lt.includes('retail')||lt==='retail';
    if(!salI[sku])salI[sku]={};salI[sku][sz]=(salI[sku][sz]||0)+u;
    A.salSKU[sku]=(A.salSKU[sku]||0)+u;
    if(isRetail)A.salSKURet[sku]=(A.salSKURet[sku]||0)+u;
    if(isOnline)A.salSKUOnline[sku]=(A.salSKUOnline[sku]||0)+u;
    // V9.3: channel-split per-SKU per-size sales (for category sales-curve breakdown by channel)
    if(isRetail){if(!salIr[sku])salIr[sku]={};salIr[sku][sz]=(salIr[sku][sz]||0)+u}
    if(isOnline){if(!salIo[sku])salIo[sku]={};salIo[sku][sz]=(salIo[sku][sz]||0)+u}
    // V9: capture SKU identity (raw-case for display) for Chase SKU lookup
    if(!A.salSkuMeta[sku]){
      A.salSkuMeta[sku]={
        division:r[c.sD]||'',category:r[c.sC]||'',subcategory:r[c.sSC]||'',
        segment:hasSegCol?(r[c.sSeg]||''):'',
        styleDescription:r[c.sSD]||'',colorDescription:c.sCD!=null?(r[c.sCD]||''):'',
        sizes:new Set()
      };
    }
    if(sz)A.salSkuMeta[sku].sizes.add(sz);
    // weeksLive tracking — only count weeks where this SKU had ANY sales (>0)
    if(hasWeekCol&&u>0){
      const wk=String(r[c.sWk]||'').trim();
      if(wk){
        if(!skuWeeks[sku])skuWeeks[sku]=new Set();
        skuWeeks[sku].add(wk);
      }
    }
    // V9.9: keep the weekly units, not just the week count, so we can build a seasonality curve.
    const wkNum=hasWeekCol?parseWeekLabel(r[c.sWk]):null;
    if(hasWeekCol){if(wkNum)wkParsed++;else if(String(r[c.sWk]||'').trim())wkUnparsed++}
    const d=(r[c.sD]||'').toLowerCase(),ca=(r[c.sC]||'').toLowerCase(),sc=(r[c.sSC]||'').toLowerCase(),pr=(r[c.sSD]||'').toLowerCase();
    const seg=hasSegCol?(r[c.sSeg]||'').toLowerCase():'';
    // V7.8: hierarchy walks Program -> Segment -> Subcategory -> Category -> Division
    // When segment is missing for a sales row, we just don't emit a seg-level key for it
    // (the SKU's own walk will skip Segment if its segment is unmapped).
    const keys=['prog|'+d+'|'+ca+'|'+sc+'|'+pr,'sub|'+d+'|'+ca+'|'+sc,'cat|'+d+'|'+ca,'div|'+d];
    if(seg)keys.push('seg|'+d+'|'+ca+'|'+sc+'|'+seg);
    if(wkNum){
      if(!skuWkUnits[sku])skuWkUnits[sku]={};
      skuWkUnits[sku][wkNum]=(skuWkUnits[sku][wkNum]||0)+u;
    }
    const rowPfx=skuSeasonPfx[sku]||null;
    keys.forEach(k=>{
      if(wkNum){
        if(!hierWk[k])hierWk[k]={};
        hierWk[k][wkNum]=(hierWk[k][wkNum]||0)+u;
        // Same level, but only styles from the same season family.
        if(rowPfx){
          const ck=rowPfx+'|'+k;
          if(!hierWkSeas[ck])hierWkSeas[ck]={};
          hierWkSeas[ck][wkNum]=(hierWkSeas[ck][wkNum]||0)+u;
        }
      }
      if(!hS[k])hS[k]={};hS[k][sz]=(hS[k][sz]||0)+u;
      if(isRetail){if(!hSr[k])hSr[k]={};hSr[k][sz]=(hSr[k][sz]||0)+u}
      if(isOnline){if(!hSo[k])hSo[k]={};hSo[k][sz]=(hSo[k][sz]||0)+u}
      // V8.3: track distinct SKUs that contributed sales > 0 at each level (for parent-rate fallback denominator)
      if(u>0){
        if(!hierSkus[k])hierSkus[k]=new Set();
        hierSkus[k].add(sku);
      }
    });
  });
  A.hierSales=hS;A.hierSalesRet=hSr;A.hierSalesOnline=hSo;
  A.invSKU=invI;          // V9: SKU -> {size:onHand} for Chase inventory lookup
  A.salSKUbySize=salI;    // V9: SKU -> {size:sales} for Chase sales lookup
  A.salSKURetBySize=salIr;    // V9.3: SKU -> {size:retail sales}
  A.salSKUOnlineBySize=salIo; // V9.3: SKU -> {size:online sales}
  // Convert weeks sets into per-SKU counts with the V7.8 minimum-4 floor
  A.skuWeeksLive={};
  for(const sku in skuWeeks){
    A.skuWeeksLive[sku]=Math.max(4,skuWeeks[sku].size);
  }
  A.skuWkUnits=skuWkUnits;      // V9.9: SKU -> {weekOfYear: units}
  A.hierWeekly=hierWk;          // V9.9: hierarchy key -> {weekOfYear: units}
  A.hierWeeklySeason=hierWkSeas; // V9.9.1: 'SU|<hierKey>' -> {weekOfYear: units}
  A.skuSeasonPfx=skuSeasonPfx;   // V9.9.1: SKU -> season family
  A.seasonIdxCache={};          // V9.9: cleared on every reprocess — the shapes just changed
  A.weekParseStats={parsed:wkParsed,unparsed:wkUnparsed};
  // V9.9.2: how much of the year the export actually covers. Zero-filling absent weeks is only
  // sound if the file spans a full year - otherwise a short export would read as "dead all winter".
  const allWeeks=new Set();
  for(const k in hierWk)for(const w in hierWk[k])allWeeks.add(+w);
  A.weeklySpan=allWeeks.size;
  A.weeklyFullYear=allWeeks.size>=40;
  if(!hasWeekCol){
    console.warn('[SizingTool] No "Week" column found in the sales export. Weekly rates fall back '+
      'to a 52-week denominator and the SEASONAL RATE ADJUSTMENT IS DISABLED. Columns present:',
      (A.raw.sales&&A.raw.sales[0])?Object.keys(A.raw.sales[0]):'(none)');
  }
  if(hasWeekCol&&wkUnparsed>wkParsed){
    console.warn('[V9.9] Week column mostly unparseable ('+wkUnparsed+' vs '+wkParsed+
      ' rows). Seasonal rate adjustment will stay OFF. Sample label:',
      (A.raw.sales&&A.raw.sales[0])?A.raw.sales[0][c.sWk]:'(n/a)');
  }
  A.hasWeeklyData=hasWeekCol;   // engine flag — falls back to 52 if false (legacy sales file)
  A.hasSegmentData=hasSegCol;   // engine flag — skips segment level if false
  // V8.3: build per-hierarchy-level metadata for parent-rate fallback
  // Each entry: {skuCount, sumWeeksLive} so we can compute "average SKU weekly rate" at that level
  A.hierMeta={};
  for(const k in hierSkus){
    const skus=hierSkus[k];
    // V9.9.3: the default must honour A.hasWeeklyData, as the other two call sites do. With no
    // Week column A.skuWeeksLive is empty, so a bare ||4 collapsed avgWeeksLive to 4 rather than
    // 52 and inflated every hierarchy-sourced rate by ~13x.
    const wlDefault=A.hasWeeklyData?4:52;
    let sumW=0;skus.forEach(s=>{sumW+=(A.skuWeeksLive[s]||wlDefault)});
    A.hierMeta[k]={skuCount:skus.size,sumWeeksLive:sumW,avgWeeksLive:skus.size>0?sumW/skus.size:52};
  }

  // ─── WIP / Pending Receipts ───
  // Per-SKU: { totalOrdered, bySize:{size:total}, byDate:[{date,size,ordered,daysOut}], byDateAgg:{date:{size:qty,total:n}} }
  const today=new Date();today.setHours(0,0,0,0);
  function parseWipDate(s){
    if(!s)return null;
    // MM/DD/YYYY format
    const m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(!m)return null;
    const d=new Date(parseInt(m[3]),parseInt(m[1])-1,parseInt(m[2]));
    d.setHours(0,0,0,0);return d;
  }
  function fmtDate(d){if(!d)return'';return(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear()}
  const wipI={};
  wip.forEach(r=>{
    // Status filter
    if(r[c.wPS]==='Dropped')return;
    if(r[c.wSt]==='Received')return;
    // Location filter — only DTC if column exists
    if(c.wLoc&&r[c.wLoc]&&r[c.wLoc]!=='DTC')return;
    // Date resolution: Master In DC > Target Delivery Date > legacy DC
    let dtStr='';
    if(c.wMDC&&r[c.wMDC]&&r[c.wMDC].trim()&&r[c.wMDC]!=='0')dtStr=r[c.wMDC];
    else if(c.wTDD&&r[c.wTDD]&&r[c.wTDD].trim())dtStr=r[c.wTDD];
    else if(c.wDC&&r[c.wDC])dtStr=r[c.wDC];
    const dt=parseWipDate(dtStr);
    // Skip past-dated receipts (even if status isn't "Received")
    if(dt&&dt<today)return;
    const sku=r[c.wS],sz=r[c.wZ],qty=numP(r[c.wO]);
    if(!sku||!sz||qty<=0)return;
    if(!wipI[sku])wipI[sku]={bySize:{},byDateAgg:{}};
    wipI[sku].bySize[sz]=(wipI[sku].bySize[sz]||0)+qty;
    const dKey=dt?fmtDate(dt):'TBD';
    if(!wipI[sku].byDateAgg[dKey])wipI[sku].byDateAgg[dKey]={_sortDate:dt||new Date(2099,0,1),sizes:{},total:0};
    wipI[sku].byDateAgg[dKey].sizes[sz]=(wipI[sku].byDateAgg[dKey].sizes[sz]||0)+qty;
    wipI[sku].byDateAgg[dKey].total+=qty;
  });
  A.wipSKU=wipI;  // V9: SKU -> {bySize, byDateAgg} for Chase WIP lookup

  A.skus={};
  ll.filter(r=>{
    if(r[c.lSe]!==A.activeSeason)return false;
    // Only include SKUs with Buy Status = "Confirmed". Match Linelist behavior — anything else
    // (Pending, Hold, blank) is excluded entirely from the season view.
    const bs=String(r[c.lBs]||'').trim().toLowerCase();
    return bs==='confirmed';
  }).forEach(r=>{
    const sku=r[c.lS],scale=r[c.lSS]||'';
    // ENFORCE: sizes come ONLY from the user-configured presMinsMeta. No data-derived fallback.
    let sizes=[];
    if(A.presMinsMeta[scale]&&A.presMinsMeta[scale].sizes)sizes=[...A.presMinsMeta[scale].sizes].sort(ssort);
    const stCt=numP(r[c.lSn]),dtcBuy=numP(r[c.lDB]);
    const retailBuy=c.lRB?numP(r[c.lRB]):0;
    const onlineBuy=c.lOB?numP(r[c.lOB]):0;
    // APS Final values may be decimal — preserve as float
    const apsRetail=c.lAPSr?(parseFloat(String(r[c.lAPSr]||'').replace(/[^0-9.\-]/g,''))||0):0;
    const apsOnline=c.lAPSo?(parseFloat(String(r[c.lAPSo]||'').replace(/[^0-9.\-]/g,''))||0):0;
    const sI=invI[sku]||{},sS=salI[sku]||{},wipRec=wipI[sku]||{bySize:{},byDateAgg:{}};
    let tOH=0,tSl=0,tWIP=0;const sd={};
    sizes.forEach(s=>{
      const oh=sI[s]||0,sl=sS[s]||0,wo=(wipRec.bySize&&wipRec.bySize[s])||0;
      sd[s]={onHand:oh,sales:sl,wipOrd:wo};
      tOH+=oh;tSl+=sl;tWIP+=wo;
    });
    // V8.3: SKU is CF if it has OH, sales, OR pending receipts (any inventory presence past or future).
    // Previously, a SKU with zero OH and zero sales but pending receipts was incorrectly tagged Initials.
    // The presence of a pending receipt means we'll have stock to burn down before the new buy lands.
    let sType=dtcBuy===0?'nosize':(tOH===0&&tSl===0&&tWIP===0?'initials':'cf');
    const div=r[c.lDp]||'',cat=r[c.lCa]||'',sub=r[c.lSc]||'',prog=r[c.lSD]||'',dm=r[c.lDM]||'';
    const seg=c.lSeg?(r[c.lSeg]||''):'';
    A.skus[sku]={
      sku,season:A.activeSeason,division:div,category:cat,subcategory:sub,segment:seg,
      style:r[c.lSt]||'',styleDescription:prog,
      colorCode:r[c.lCC]||'',colorDescription:r[c.lCD]||'',
      sizeScale:scale,sizeCount:A.scaleSizeCount[scale]||sizes.length,
      dtcBuy,retailBuy,onlineBuy,
      apsRetail,apsOnline,apsTotal:apsRetail+apsOnline,
      storeCount:stCt,storeTier:r[c.lTr]||'',
      lifecycle:r[c.lLC]||'',commitCoding:r[c.lCm]||'',
      buyStatus:String(r[c.lBs]||'').trim(),
      rollout:r[c.lRo]||'',pst:r[c.lPS]||'',deliveryMonth:dm,
      sizingType:sType,sizes,sizeData:sd,
      totalOH:tOH,totalSales:tSl,totalWIP:tWIP,
      skuSalesTotal:A.salSKU[sku]||0,
      skuSalesRetail:A.salSKURet[sku]||0,
      skuSalesOnline:A.salSKUOnline[sku]||0,
      weeksLive:(A.skuWeeksLive&&A.skuWeeksLive[sku])||(A.hasWeeklyData?4:52),  // V7.8: actual weeks live, fall back to 52 if weekly data unavailable
      wipByDate:wipRec.byDateAgg||{},
      _hk:{prog:'prog|'+div.toLowerCase()+'|'+cat.toLowerCase()+'|'+sub.toLowerCase()+'|'+prog.toLowerCase(),
           seg:seg?'seg|'+div.toLowerCase()+'|'+cat.toLowerCase()+'|'+sub.toLowerCase()+'|'+seg.toLowerCase():null,
           sub:'sub|'+div.toLowerCase()+'|'+cat.toLowerCase()+'|'+sub.toLowerCase(),
           cat:'cat|'+div.toLowerCase()+'|'+cat.toLowerCase(),
           div:'div|'+div.toLowerCase()}
    };
  });
}

// V9: ensure the SKU-keyed data maps (invSKU, salSKUbySize, wipSKU, salSkuMeta, hier*) are built.
// These are populated as a side-effect of processData. For Chase we may need them without an active
// season, so we run processData once if the maps are missing. processData with no active season
// simply yields an empty A.skus, which is harmless.
function ensureDataMaps(){
  if(!allUp())return false;
  if(!A.salSkuMeta||!A.invSKU||!A.wipSKU||!A.salSKURetBySize){
    const savedSeason=A.activeSeason;
    processData();
    A.activeSeason=savedSeason;
  }
  return true;
}

// ═══ V9: Chase PO helpers ═══

// Extract distinct store groups (tier name → store count) from a given season's linelist rows.
// Returns null if the season has no rows in the current linelist (caller should prompt for reupload).
function getStoreGroupsForSeason(seasonCode){
  if(!A.raw||!A.raw.linelist)return null;
  const ll=A.raw.linelist;
  const c={};
  c.lSe=findCol(ll[0],['Season Code']);
  c.lTr=findCol(ll[0],['Store Tier','Tier','Store Group']);
  c.lSn=findCol(ll[0],['Store Count','Stores','# Stores','Number of Stores']);
  const groups={};let anyRow=false;
  ll.forEach(r=>{
    if(r[c.lSe]!==seasonCode)return;
    anyRow=true;
    const tier=String(r[c.lTr]||'').trim();
    if(!tier)return;
    const cnt=numP(r[c.lSn]);
    // Keep the max store count seen for a tier (tiers should be consistent, but be safe)
    if(!groups[tier]||cnt>groups[tier])groups[tier]=cnt;
  });
  if(!anyRow)return null; // season not present in current linelist
  return groups;
}

// Distinct season codes present in the current linelist
function getLinelistSeasons(){
  if(!A.raw||!A.raw.linelist)return [];
  const ll=A.raw.linelist;
  const sc=findCol(ll[0],['Season Code']);
  const set=new Set();
  ll.forEach(r=>{const s=r[sc];if(s)set.add(s)});
  return [...set].sort();
}

// ═══ V9.3: Curve Override helpers ═══
// Find the categories that have L52W sales in a given division + size-scale combo.
// Match rule (per spec C): division matches the sales division AND at least one size overlaps
// between the scale's configured sizes and the historicals for that division.
// V9.8: generalized over a hierarchy field. `field` is one of 'category' | 'subcategory' | 'segment'.
// Returns the distinct values of that field for SKUs whose sizes overlap the scale, in the division.
function getValuesForScale(division,sizeScale,field){
  ensureDataMaps();
  const meta=A.presMinsMeta[sizeScale];
  if(!meta)return [];
  const scaleSizes=new Set((meta.sizes||[]).map(s=>String(s).toUpperCase()));
  if(!scaleSizes.size||!A.salSkuMeta)return [];
  const divLc=(division||'').toLowerCase();
  const vals=new Set();
  for(const sku in A.salSkuMeta){
    const m=A.salSkuMeta[sku];
    if((m.division||'').toLowerCase()!==divLc)continue;
    // does this SKU have any size overlapping the scale?
    let overlap=false;
    for(const sz of m.sizes){if(scaleSizes.has(String(sz).toUpperCase())){overlap=true;break}}
    if(overlap&&m[field])vals.add(m[field]);
  }
  return [...vals].sort();
}

// Compute a hierarchy value's L52W sales-by-size for a division+scale+channel.
// Returns { bySize:{size:units}, total, pctBySize:{size:pct} } restricted to the scale's sizes.
function getFieldSalesCurve(division,sizeScale,field,value,channel){
  ensureDataMaps();
  const meta=A.presMinsMeta[sizeScale];
  if(!meta)return{bySize:{},total:0,pctBySize:{}};
  const sizes=(meta.sizes||[]).map(s=>String(s));
  const divLc=(division||'').toLowerCase(),valLc=(value||'').toLowerCase();
  // Pick the right channel-scoped per-SKU sales source
  const srcBySize=channel==='Retail'?A.salSKURetBySize:channel==='Online'?A.salSKUOnlineBySize:A.salSKUbySize;
  const bySize={};sizes.forEach(s=>{bySize[s]=0});
  let total=0;
  for(const sku in A.salSkuMeta){
    const m=A.salSkuMeta[sku];
    if((m.division||'').toLowerCase()!==divLc)continue;
    if((m[field]||'').toLowerCase()!==valLc)continue;
    const sk=(srcBySize&&srcBySize[sku])||{};
    sizes.forEach(s=>{const u=sk[s]||0;if(u){bySize[s]+=u;total+=u}});
  }
  const pctBySize={};sizes.forEach(s=>{pctBySize[s]=total>0?(bySize[s]/total*100):0});
  return{bySize,total,pctBySize};
}

// V9.9.1: Override matching is NORMALIZED, not exact. The stored value comes from a hand-filled
// spreadsheet (trimmed) while a SKU's division/scale/segment come from the Linelist export, which is
// NOT trimmed/cased consistently — so a trailing space, double space, or different casing in the
// Product Segmentation silently broke the exact-string match (override stored but never applied).
// We canonicalize each key part (trim, collapse internal whitespace, uppercase) for matching only;
// the raw values remain the source of truth for storage, deletes, and the bulk-clear counter.
function _ovNorm(s){return String(s==null?'':s).trim().toUpperCase().replace(/\s+/g,' ');}
function _ovNormKey(div,scale,value,channel){return _ovNorm(div)+'|'+_ovNorm(scale)+'|'+_ovNorm(value)+'|'+_ovNorm(channel);}
// Build the normalized lookup index from A.curveImports. Each entry carries the RAW components so
// deletes can target the exact stored values regardless of how the lookup was spelled.
function rebuildCurveImportIndex(){
  const idx={};
  for(const key in A.curveImports){
    const o=A.curveImports[key];
    const div=o._div,scale=o._scale,value=o._value,channel=o._channel;
    if(div===undefined)continue; // older entry without raw parts — skip (will be repopulated on next cloud load)
    idx[_ovNormKey(div,scale,value,channel)]={...o};
  }
  A._curveImportsNorm=idx;
}

// Look up an active curve override. Matching is case/whitespace-insensitive (see _ovNorm above).
function getCurveOverride(division,sizeScale,value,channel){
  if(!A._curveImportsNorm)rebuildCurveImportIndex();
  return A._curveImportsNorm[_ovNormKey(division,sizeScale,value,channel)]||null;
}

// ─── Curve override import: template download ───
function downloadCurveTemplate(){
  const header=['Division','Size Scale','Product Segmentation','Channel','Size','Percent'];
  // Provide a couple of example rows using a real configured scale + segment if available
  const rows=[header];
  const scales=Object.keys(A.presMinsMeta||{});
  if(scales.length){
    const sc=scales[0];const meta=A.presMinsMeta[sc];const div=meta.div||'Womens';
    const segs=getValuesForScale(div,sc,'segment');
    const exSeg=segs.length?segs[0]:'ALL';
    const sizes=(meta.sizes||[]).slice(0,3);
    sizes.forEach((s,i)=>rows.push([div,sc,exSeg,'ALL',s,i===0?40:i===1?35:25]));
  } else {
    rows.push(['Womens','00-16','ALL','ALL','4',40]);
    rows.push(['Womens','00-16','Core','Retail','6',60]);
  }
  if(typeof XLSX==='undefined'){
    const csv=rows.map(r=>r.join(',')).join('\n');
    const b=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(b);
    const a=document.createElement('a');a.href=u;a.download='Curve_Override_Template.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
    return;
  }
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:12},{wch:18},{wch:10},{wch:12},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws,'Curve Overrides');
  XLSX.writeFile(wb,'Curve_Override_Template.xlsx');
}

// V9.5: export every size scale — one row per (scale × size).
// Columns: Size Scale, Division, Size, Retail Pres Min, Online Pres Min (flat), Online Only (Y/N).
function exportSizeScales(){
  const header=['Size Scale','Division','Size','Retail Pres Min','Online Pres Min','Online Only'];
  const rows=[header];
  // Sort scales by division, then name, so each division's scales group together.
  const scales=Object.keys(A.presMinsMeta||{})
    .filter(s=>((A.presMinsMeta[s].sizes||[]).length))
    .sort((a,b)=>{
      const da=A.presMinsMeta[a].div||'',db=A.presMinsMeta[b].div||'';
      return da.localeCompare(db)||a.localeCompare(b);
    });
  scales.forEach(scale=>{
    const meta=A.presMinsMeta[scale]||{};
    const div=meta.div||'';
    const sizes=meta.sizes||[];
    const onlineOnly=new Set(meta.onlineOnly||[]);
    const onlineFlat=meta.onlineFlat!==undefined?meta.onlineFlat:5;
    const cfg=A.presMins[scale]||{};
    sizes.forEach(s=>{
      const isOO=onlineOnly.has(s);
      // Online-only sizes have no retail presence → blank retail pres min (matches the "—" in the detail view).
      const retailPM=isOO?'':(cfg[s]!==undefined?cfg[s]:'');
      // Online pres min is the scale's flat online value, applied to every size.
      rows.push([scale,div,s,retailPM,onlineFlat,isOO?'Y':'N']);
    });
  });
  if(rows.length===1){toast('No size scales to export');return}
  const stamp=new Date().toISOString().slice(0,10);
  if(typeof XLSX==='undefined'){
    const csv=rows.map(r=>r.map(c=>{const v=String(c);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
    const b=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(b);
    const a=document.createElement('a');a.href=u;a.download='Size_Scales_'+stamp+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
    return;
  }
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:14},{wch:14},{wch:12},{wch:16},{wch:16},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,'Size Scales');
  XLSX.writeFile(wb,'Size_Scales_'+stamp+'.xlsx');
  toast('Exported '+(rows.length-1)+' size-scale rows');
}

// ─── Curve override import: parse + validate + apply ───
async function handleCurveImportFile(file){
  if(!file)return;
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(!rows.length){curveImportReport({errors:['The file is empty.']});return}
    // Map header
    const hdr=rows[0].map(h=>String(h).trim().toLowerCase());
    const ci={
      div:hdr.findIndex(h=>h==='division'),
      scale:hdr.findIndex(h=>h==='size scale'||h==='scale'),
      // V9.8: column C is now Product Segmentation. Accept legacy "subcategory"/"category" as aliases
      // so older templates don't hard-fail; the value is treated as a Product Segmentation either way.
      cat:hdr.findIndex(h=>h==='product segmentation'||h==='segmentation'||h==='segment'||h==='subcategory'||h==='sub-category'||h==='subcat'||h==='category'),
      chan:hdr.findIndex(h=>h==='channel'),
      size:hdr.findIndex(h=>h==='size'),
      pct:hdr.findIndex(h=>h==='percent'||h==='percent to scale curve'||h==='pct')
    };
    const missing=Object.entries(ci).filter(([k,v])=>v<0).map(([k])=>k==='cat'?'product segmentation':k);
    if(missing.length){curveImportReport({errors:['Missing required column(s): '+missing.join(', ')+'. Use the template.']});return}

    // Collect raw rows
    const raw=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i];if(!r||!r.length)continue;
      const div=String(r[ci.div]||'').trim();
      const scale=String(r[ci.scale]||'').trim();
      const cat=String(r[ci.cat]||'').trim();
      const chan=String(r[ci.chan]||'').trim();
      // V9.8.1: size 0 is a real size (e.g. the "0" in scale "00-16"). Don't use `|| ''` here —
      // `0 || ''` is '' in JS (zero is falsy), which silently turned size 0 into an empty string and
      // failed the "is in scale" check. Stringify only when the cell is genuinely null/undefined.
      const szCell=r[ci.size];
      const size=(szCell===undefined||szCell===null)?'':String(szCell).trim();
      const pct=numF(r[ci.pct]);
      if(!div&&!scale&&!cat&&!size)continue; // blank row
      raw.push({div,scale,cat,chan,size,pct,line:i+1});
    }
    if(!raw.length){curveImportReport({errors:['No data rows found.']});return}

    // Validate + group into (div|scale|cat|channel) buckets, expanding ALL category/channel
    const errors=[],warnings=[];
    // Resolve channel tokens
    function expandChannels(chan,line){
      const c=chan.toLowerCase();
      if(c==='all'||c==='')return['Retail','Online'];
      if(c==='retail'||c==='r')return['Retail'];
      if(c==='online'||c==='o'||c==='ecom')return['Online'];
      errors.push('Line '+line+': unknown channel "'+chan+'" (use Retail, Online, or ALL).');
      return[];
    }
    // First pass: validate every row, and record which (scale|category|channel) blocks are
    // EXPLICITLY targeted by a specific (non-ALL) category row. A specific block stands entirely
    // on its own — ALL rows in the same file do NOT bleed into it (per spec: touching a block for
    // any size means the user is redefining the whole block; unlisted sizes default to 0).
    const validRows=[];
    const specificBlocks=new Set(); // "scale|category|channel" explicitly set by a non-ALL row
    raw.forEach(row=>{
      const meta=A.presMinsMeta[row.scale];
      if(!meta){errors.push('Line '+row.line+': size scale "'+row.scale+'" does not exist.');return}
      const div=meta.div||row.div;
      if(row.div&&row.div.toLowerCase()!==(meta.div||'').toLowerCase()){
        warnings.push('Line '+row.line+': division "'+row.div+'" doesn\'t match scale "'+row.scale+'" (configured as '+meta.div+'). Using '+meta.div+'.');
      }
      const scaleSizes=(meta.sizes||[]).map(s=>String(s).toUpperCase());
      if(!scaleSizes.includes(String(row.size).toUpperCase())){
        errors.push('Line '+row.line+': size "'+row.size+'" is not in scale "'+row.scale+'".');return;
      }
      if(row.pct<0){errors.push('Line '+row.line+': percent cannot be negative.');return}
      const channels=expandChannels(row.chan,row.line);
      if(!channels.length)return; // bad channel already logged
      const isAllCat=row.cat.toLowerCase()==='all'||row.cat==='';
      // V9.8: gentle nudge if a specific Product Segmentation isn't found in this division+scale (likely a typo).
      // Not a hard error — the override is simply inert until a matching SKU appears.
      if(!isAllCat){
        const segsHere=getValuesForScale(div,row.scale,'segment').map(x=>x.toLowerCase());
        if(segsHere.length&&!segsHere.includes(row.cat.toLowerCase())){
          warnings.push('Line '+row.line+': Product Segmentation "'+row.cat+'" has no L52W sales in '+div+' / '+row.scale+' — the override will be stored but won\'t apply until a matching SKU exists.');
        }
      }
      validRows.push({...row,div,scale:row.scale,channels,isAllCat});
      if(!isAllCat)channels.forEach(channel=>{specificBlocks.add(row.scale+'|'+row.cat+'|'+channel)});
    });

    if(errors.length){curveImportReport({errors,warnings});return}

    // Second pass: build buckets.
    // Bucket: "div|scale|cat|channel" -> { div,scale,cat,channel, curve:{size:pct}, lines:[] }
    const buckets={};
    const allScopes=[]; // track ALL-category scopes so we can wipe existing category-specific rows in the cloud
    validRows.forEach(row=>{
      row.channels.forEach(channel=>{
        let cats;
        if(row.isAllCat){
          allScopes.push({div:row.div,scale:row.scale,channel,size:row.size,pct:row.pct});
          // ALL only populates Product Segmentations NOT explicitly targeted by a specific row in this file
          cats=getValuesForScale(row.div,row.scale,'segment').filter(cat=>!specificBlocks.has(row.scale+'|'+cat+'|'+channel));
          if(!getValuesForScale(row.div,row.scale,'segment').length){
            warnings.push('Line '+row.line+': no Product Segmentations with sales found for '+row.div+' / '+row.scale+'.');
          }
        } else {
          cats=[row.cat];
        }
        cats.forEach(cat=>{
          const k=row.div+'|'+row.scale+'|'+cat+'|'+channel;
          if(!buckets[k])buckets[k]={div:row.div,scale:row.scale,cat,channel,curve:{},isAllCat:row.isAllCat,lines:[]};
          buckets[k].curve[row.size]=row.pct;
          buckets[k].lines.push(row.line);
          if(row.isAllCat)buckets[k].isAllCat=true;
        });
      });
    });

    // Validate sums per bucket — reject > 100, flag < 100
    const toApply=[];
    for(const k in buckets){
      const b=buckets[k];
      const sum=Object.values(b.curve).reduce((a,v)=>a+v,0);
      if(sum>100.0001){
        errors.push(b.div+' / '+b.scale+' / '+b.cat+' / '+b.channel+': percentages sum to '+sum.toFixed(1)+'% (exceeds 100%).');
        continue;
      }
      if(sum<99.9999)warnings.push(b.div+' / '+b.scale+' / '+b.cat+' / '+b.channel+': sums to '+sum.toFixed(1)+'% (under 100% — will be flagged as suboptimal).');
      toApply.push({...b,rawSum:sum});
    }
    if(errors.length){curveImportReport({errors,warnings});return}
    if(!toApply.length){curveImportReport({errors:['Nothing valid to import.'],warnings});return}

    // Apply: ALL-category scopes first wipe existing category-specific rows for that scale+channel,
    // then we upsert each concrete bucket. Last-write-wins within this file (buckets already merged).
    curveImportReport({applying:true});
    const wipedScaleChannels=new Set();
    for(const sc of allScopes){
      const wk=sc.div+'|'+sc.scale+'|'+sc.channel;
      if(wipedScaleChannels.has(wk))continue;
      wipedScaleChannels.add(wk);
      try{await cloudDeleteCurveOverridesForScaleChannel(sc.div,sc.scale,sc.channel)}catch(e){console.warn('wipe failed',e)}
    }
    let applied=0;
    for(const b of toApply){
      try{
        await cloudSaveCurveOverride(b.div,b.scale,b.cat,b.channel,b.curve,b.rawSum);
        applied++;
      }catch(e){errors.push('Failed to save '+b.cat+'/'+b.channel+': '+e.message)}
    }
    // Changelog
    const scopeSummary=[...new Set(toApply.map(b=>b.div+' '+b.scale))].join(', ');
    await cloudLogEvent('curve_override_import','curve',scopeSummary,
      'imported '+applied+' curve override'+(applied===1?'':'s')+' ('+scopeSummary+')',
      {buckets:toApply.map(b=>({scope:b.div+'/'+b.scale+'/'+b.cat+'/'+b.channel,sum:b.rawSum}))});
    // Reload from cloud so everyone (and we) see the canonical state
    await loadFromCloud();
    curveImportReport({success:true,applied,warnings,errors});
    render();
  }catch(err){
    console.error('Curve import failed:',err);
    curveImportReport({errors:['Import failed: '+err.message]});
  }
}

// Render the import result panel (errors/warnings/success) into the size-scales page
function curveImportReport(state){
  A._curveImportState=state;
  const box=document.getElementById('curve-import-report');
  if(box)box.innerHTML=curveImportReportHtml(state);
}
function curveImportReportHtml(state){
  if(!state)return '';
  if(state.applying)return '<div class="ci-report ci-info">Applying overrides…</div>';
  let h='';
  if(state.errors&&state.errors.length){
    h+='<div class="ci-report ci-err"><b>Import failed — '+state.errors.length+' error'+(state.errors.length===1?'':'s')+':</b><ul>'+
      state.errors.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul></div>';
  }
  if(state.warnings&&state.warnings.length){
    h+='<div class="ci-report ci-warn"><b>'+state.warnings.length+' warning'+(state.warnings.length===1?'':'s')+':</b><ul>'+
      state.warnings.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul></div>';
  }
  if(state.success){
    h+='<div class="ci-report ci-ok"><b>✓ Imported '+state.applied+' curve override'+(state.applied===1?'':'s')+' successfully.</b></div>';
  }
  return h;
}

// SKU search for Chase — matches across SKU code, style description, and color description
// (like the seasonal grid search). Supports multiple space-separated terms (all must match).
function searchSalesSkus(query,limit){
  limit=limit||20;
  if(!A.salSkuMeta)return [];
  const terms=(query||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  const out=[];
  for(const sku in A.salSkuMeta){
    const m=A.salSkuMeta[sku];
    const hay=(sku+' '+(m.styleDescription||'')+' '+(m.colorDescription||'')+' '+(m.category||'')).toLowerCase();
    if(!terms.length||terms.every(t=>hay.includes(t))){
      out.push({sku,styleDescription:m.styleDescription,colorDescription:m.colorDescription,category:m.category});
      if(out.length>=limit)break;
    }
  }
  return out;
}

// Build a synthetic SKU record from a Chase item definition, identical in shape to a seasonal
// record so the entire downstream engine (curve, BOP, flows, channel split, export) works unchanged.
function buildChaseRecord(chase){
  const scale=chase.sizeScale;
  let sizes=[];
  if(A.presMinsMeta[scale]&&A.presMinsMeta[scale].sizes)sizes=[...A.presMinsMeta[scale].sizes].sort(ssort);
  const meta=(A.salSkuMeta&&A.salSkuMeta[chase.sku])||{};
  const div=meta.division||'',cat=meta.category||'',sub=meta.subcategory||'',seg=meta.segment||'';
  const prog=meta.styleDescription||chase.sku;
  // Inventory + sales + WIP pulled by SKU code (same source as seasonal SKUs)
  const sI=(A.invSKU&&A.invSKU[chase.sku])||{};
  const sS=(A.salSKUbySize&&A.salSKUbySize[chase.sku])||{};
  const wipRec=(A.wipSKU&&A.wipSKU[chase.sku])||{bySize:{},byDateAgg:{}};
  let tOH=0,tSl=0,tWIP=0;const sd={};
  sizes.forEach(s=>{
    const oh=sI[s]||0,sl=sS[s]||0,wo=(wipRec.bySize&&wipRec.bySize[s])||0;
    sd[s]={onHand:oh,sales:sl,wipOrd:wo};
    tOH+=oh;tSl+=sl;tWIP+=wo;
  });
  const dtcBuy=chase.dtcBuy||0;
  // Channel split: use provided, else 50/50
  let retailBuy=chase.retailBuy,onlineBuy=chase.onlineBuy;
  if(retailBuy==null||onlineBuy==null||retailBuy===''||onlineBuy===''){
    retailBuy=Math.round(dtcBuy/2);onlineBuy=dtcBuy-retailBuy;
  }
  // APS: derive from the SKU's own historical sales over weeksLive and store count (best-effort)
  const weeksLive=(A.skuWeeksLive&&A.skuWeeksLive[chase.sku])||(A.hasWeeklyData?4:52);
  const stCt=chase.storeCount||0;
  const salesRet=A.salSKURet[chase.sku]||0,salesOnline=A.salSKUOnline[chase.sku]||0;
  const apsRetail=(stCt>0&&weeksLive>0)?(salesRet/weeksLive/stCt):0;
  const apsOnline=(weeksLive>0)?(salesOnline/weeksLive):0;
  return{
    sku:chase.sku,isChase:true,chaseId:chase.id,
    season:chase.season,division:div,category:cat,subcategory:sub,segment:seg,
    style:'',styleDescription:prog,
    colorCode:'',colorDescription:meta.colorDescription||'',
    sizeScale:scale,sizeCount:A.scaleSizeCount[scale]||sizes.length,
    dtcBuy,retailBuy,onlineBuy,
    apsRetail,apsOnline,apsTotal:apsRetail+apsOnline,
    storeCount:stCt,storeTier:chase.storeTier||'',
    lifecycle:'',commitCoding:'',buyStatus:'Chase',
    rollout:'',pst:'',deliveryMonth:chase.deliveryMonth||'',
    sizingType:'cf', // Chase is always carryforward by nature
    sizes,sizeData:sd,
    totalOH:tOH,totalSales:tSl,totalWIP:tWIP,
    skuSalesTotal:A.salSKU[chase.sku]||0,
    skuSalesRetail:salesRet,skuSalesOnline:salesOnline,
    weeksLive,
    wipByDate:wipRec.byDateAgg||{},
    _hk:{prog:'prog|'+div.toLowerCase()+'|'+cat.toLowerCase()+'|'+sub.toLowerCase()+'|'+prog.toLowerCase(),
         seg:seg?'seg|'+div.toLowerCase()+'|'+cat.toLowerCase()+'|'+sub.toLowerCase()+'|'+seg.toLowerCase():null,
         sub:'sub|'+div.toLowerCase()+'|'+cat.toLowerCase()+'|'+sub.toLowerCase(),
         cat:'cat|'+div.toLowerCase()+'|'+cat.toLowerCase(),
         div:'div|'+div.toLowerCase()}
  };
}

// ═══ SIZE CURVE ═══
function buildCurve(rec,hierSource,forceLevel){
  // hierSource: A.hierSales (DTC, default), A.hierSalesRet (Retail), or A.hierSalesOnline (Online)
  // forceLevel (optional): if provided, skip the threshold walk and use this hierarchy level directly.
  //   Used to keep channel curves consistent with the DTC curve's resolved level — even when the
  //   channel's sales at that level are below the 100×sizeCount threshold individually.
  //   Value should be one of: 'Program','Subcategory','Category','Division'
  const src=hierSource||A.hierSales;
  const eligible=new Set(rec.sizes),thresh=SIZE_THRESHOLD_MULTIPLIER*rec.sizeCount;
  const adj=A.curveAdjustments[rec.sku]||{};
  const levels=[
    {key:rec._hk.prog,label:rec.styleDescription,level:'Program'},
    // Segment lives between Program and Subcategory. Skipped when the SKU has no segment value
    // (key will be null) — the threshold check below handles that automatically since src[null] is undefined.
    {key:rec._hk.seg,label:rec.segment||'(no segment)',level:'Segment'},
    {key:rec._hk.sub,label:rec.subcategory,level:'Subcategory'},
    {key:rec._hk.cat,label:rec.category,level:'Category'},
    {key:rec._hk.div,label:rec.division,level:'Division'}
  ];

  // Helper: build the full trail (all levels with their totals/pass status) for display.
  // Used both by the auto-walk and the forced path so the UI can always show every option.
  function buildFullTrail(){
    const tr=[];
    for(const lv of levels){
      if(!lv.key)continue;
      const sbs=src[lv.key];
      if(!sbs){tr.push({...lv,total:0,thresh,pass:false});continue}
      let t=0;for(const s in sbs){if(eligible.has(s))t+=sbs[s]}
      tr.push({...lv,total:t,thresh,pass:t>=thresh});
    }
    return tr;
  }

  // If forceLevel is set, build the curve at that exact level and return — no walk.
  if(forceLevel){
    const lv=levels.find(l=>l.level===forceLevel&&l.key);
    if(lv){
      const sbs=src[lv.key]||{};
      let rawTotal=0;const rawFilt={};
      for(const s in sbs){if(eligible.has(s)){rawFilt[s]=sbs[s];rawTotal+=sbs[s]}}
      let adjTotal=0;const adjFilt={};
      rec.sizes.forEach(s=>{
        const factor=(adj[s]!==undefined&&adj[s]!==null)?Number(adj[s])||1:1;
        const v=(rawFilt[s]||0)*factor;
        adjFilt[s]=v;adjTotal+=v;
      });
      const curve={};
      rec.sizes.forEach(s=>{curve[s]=adjTotal>0?(adjFilt[s]||0)/adjTotal:1/rec.sizes.length});
      const fullTrail=buildFullTrail();
      // mark the forced level in the trail
      fullTrail.forEach(t=>{if(t.level===forceLevel)t.forced=true});
      return{curve,level:lv.level+' ('+lv.label+')',total:adjTotal,rawTotal,trail:fullTrail,
        acceptedKey:lv.key,acceptedLevel:lv.level,acceptedLabel:lv.label,rawFilt,adjFilt,
        manualForced:true,belowThreshold:rawTotal<thresh};
    }
  }

  const trail=[];
  for(const lv of levels){
    // Skip levels with no key (e.g. SKU has no Segment value) — don't pollute the trail with empty rows
    if(!lv.key)continue;
    const sbs=src[lv.key];
    if(!sbs){trail.push({...lv,total:0,thresh,pass:false});continue}
    // Compute the unadjusted total against the eligibility threshold.
    // We use raw (unadjusted) sales for the threshold check so adjustments don't change which hierarchy level is selected.
    let rawTotal=0;const rawFilt={};for(const s in sbs){if(eligible.has(s)){rawFilt[s]=sbs[s];rawTotal+=sbs[s]}}
    if(rawTotal>=thresh){
      // Apply per-size adjustment factors (default 1.0) when computing the curve weighting
      let adjTotal=0;const adjFilt={};
      rec.sizes.forEach(s=>{
        const factor=(adj[s]!==undefined&&adj[s]!==null)?Number(adj[s])||1:1;
        const v=(rawFilt[s]||0)*factor;
        adjFilt[s]=v;adjTotal+=v;
      });
      trail.push({...lv,total:rawTotal,thresh,pass:true});
      const curve={};
      rec.sizes.forEach(s=>{curve[s]=adjTotal>0?(adjFilt[s]||0)/adjTotal:1/rec.sizes.length});
      return{curve,level:lv.level+' ('+lv.label+')',total:adjTotal,rawTotal,trail,acceptedKey:lv.key,acceptedLevel:lv.level,acceptedLabel:lv.label,rawFilt,adjFilt};
    }
    trail.push({...lv,total:rawTotal,thresh,pass:false});
  }
  // V8.5 "guaranteed sales": every level missed the threshold. Rather than discard real signal
  // with an even split, fall back to the BROADEST level that actually has data (Division first,
  // walking down). We flag it `guaranteed:true` so the UI can warn that we're below threshold.
  // Only if NO level has any data at all do we use a true even distribution.
  const divLevel=levels.find(l=>l.level==='Division'&&l.key);
  // Walk from broadest (Division) to narrowest looking for ANY non-zero data pool
  const fallbackOrder=['Division','Category','Subcategory','Segment','Program'];
  for(const lvName of fallbackOrder){
    const lv=levels.find(l=>l.level===lvName&&l.key);
    if(!lv)continue;
    const sbs=src[lv.key];if(!sbs)continue;
    let rawTotal=0;const rawFilt={};
    for(const s in sbs){if(eligible.has(s)){rawFilt[s]=sbs[s];rawTotal+=sbs[s]}}
    if(rawTotal>0){
      // Found a level with data — use it even though it's below threshold
      let adjTotal=0;const adjFilt={};
      rec.sizes.forEach(s=>{
        const factor=(adj[s]!==undefined&&adj[s]!==null)?Number(adj[s])||1:1;
        const v=(rawFilt[s]||0)*factor;
        adjFilt[s]=v;adjTotal+=v;
      });
      const curve={};
      rec.sizes.forEach(s=>{curve[s]=adjTotal>0?(adjFilt[s]||0)/adjTotal:1/rec.sizes.length});
      return{curve,level:lv.level+' ('+lv.label+') — below threshold',total:adjTotal,rawTotal,trail,
        acceptedKey:lv.key,acceptedLevel:lv.level,acceptedLabel:lv.label,rawFilt,adjFilt,guaranteed:true};
    }
  }
  // Truly no data anywhere — even distribution
  const curve={};rec.sizes.forEach(s=>{curve[s]=1/rec.sizes.length});
  return{curve,level:'Even distribution',total:0,trail,acceptedKey:null};
}

function getOnlineOnlySizes(rec){
  const meta=A.presMinsMeta[rec.sizeScale];
  return(meta&&meta.onlineOnly)||[];
}

function getPresMin(rec){
  const cfg=A.presMins[rec.sizeScale]||{};const fl={};
  const online=new Set(getOnlineOnlySizes(rec));
  rec.sizes.forEach(s=>{
    // Online-only sizes contribute 0 to retail (no store presence)
    if(online.has(s)){fl[s]=0;return}
    fl[s]=Math.ceil((cfg[s]!==undefined?cfg[s]:0)*rec.storeCount);
  });
  return fl;
}

function getPresMinRate(rec){
  const cfg=A.presMins[rec.sizeScale]||{};const r={};
  const online=new Set(getOnlineOnlySizes(rec));
  rec.sizes.forEach(s=>{
    // Online-only sizes display 0 per-store rate too (they don't go to stores)
    if(online.has(s)){r[s]=0;return}
    r[s]=cfg[s]!==undefined?cfg[s]:0;
  });
  return r;
}

function getPendingBeforeDelivery(rec){
  // Returns total pending receipts per size that arrive BEFORE this SKU's buy delivery
  const buyDelivery=getBuyDeliveryDate(rec);
  const result={};rec.sizes.forEach(s=>{result[s]=0});
  if(!rec.wipByDate)return result;
  for(const dKey in rec.wipByDate){
    const entry=rec.wipByDate[dKey];
    // Skip dates that are AFTER the buy delivery (those won't help BOP)
    if(buyDelivery&&entry._sortDate&&entry._sortDate>buyDelivery)continue;
    for(const s in entry.sizes){if(result[s]!==undefined)result[s]+=entry.sizes[s]}
  }
  return result;
}

function getBuyDeliveryDate(rec){
  // Convert delivery month + season year to a Date object
  if(!rec.deliveryMonth||!rec.season)return null;
  const base=rec.deliveryMonth.toLowerCase().replace(/_\d+$/,'');
  const mo=MONTH_MAP[base];if(!mo)return null;
  const yrMatch=rec.season.match(/(\d{2})$/);if(!yrMatch)return null;
  const yr=2000+parseInt(yrMatch[1]);
  let target=new Date(yr,mo-1,1);
  // V8.4: roll forward a year if the naive date is well in the past (>4w grace; season straddles year boundary)
  const now=new Date();
  if(target<new Date(now.getTime()-4*7*24*60*60*1000))target=new Date(yr+1,mo-1,1);
  return target;
}

// V8.3: Compute per-size weekly rate, with parent-rate fallback when the SKU's own data is thin.
// Returns { rate:{size:rate}, sourceLevel:'SKU'|'Program'|'Subcategory'|...etc, sourceLabel:string }
function getWeeklyRate(rec){
  const skuWeeksLive=A.skuWeeksLive&&A.skuWeeksLive[rec.sku]||0;
  const skuTotalSales=rec.totalSales||0;
  const thresh=SIZE_THRESHOLD_MULTIPLIER*rec.sizeCount;
  const levels=[
    {key:rec._hk.prog,label:rec.styleDescription,level:'Program'},
    {key:rec._hk.seg,label:rec.segment||'(no segment)',level:'Segment'},
    {key:rec._hk.sub,label:rec.subcategory,level:'Subcategory'},
    {key:rec._hk.cat,label:rec.category,level:'Category'},
    {key:rec._hk.div,label:rec.division,level:'Division'}
  ];
  // V8.7: manual curve override — if the user forced a level, compute the rate at that exact level
  // (average-SKU rate), bypassing the SKU's own data and the auto-walk.
  const manualLevel=A.curveOverrides[rec.sku]||null;
  if(manualLevel){
    const lv=levels.find(l=>l.level===manualLevel&&l.key);
    if(lv){
      const sbs=A.hierSales[lv.key];const meta=A.hierMeta[lv.key];
      if(sbs&&meta&&meta.skuCount>0){
        const denom=meta.skuCount*meta.avgWeeksLive;
        const rate={};
        rec.sizes.forEach(s=>{rate[s]=denom>0?(sbs[s]||0)/denom:0});
        return{rate,sourceLevel:lv.level,sourceLabel:lv.label,manualForced:true};
      }
    }
  }
  // First test: does the SKU's OWN data clear both the 4-week minimum AND the curve threshold (100×sizeCount)?
  if(skuWeeksLive>=4&&skuTotalSales>=thresh){
    const rate={};
    rec.sizes.forEach(s=>{rate[s]=(rec.sizeData[s].sales||0)/skuWeeksLive});
    return{rate,sourceLevel:'SKU',sourceLabel:rec.sku};
  }
  // Otherwise: walk the hierarchy. At each level, compute "average SKU weekly rate per size" =
  //   (sum of sales at that level for that size) / (distinct SKU count) / (average SKU weeksLive at that level)
  for(const lv of levels){
    if(!lv.key)continue;
    const sbs=A.hierSales[lv.key];if(!sbs)continue;
    const meta=A.hierMeta[lv.key];if(!meta||meta.skuCount===0)continue;
    // Total at this level (across all eligible sizes for this SKU)
    let total=0;rec.sizes.forEach(s=>{total+=(sbs[s]||0)});
    if(total<thresh)continue;
    // Average SKU weekly rate at this level
    const denom=meta.skuCount*meta.avgWeeksLive;
    const rate={};
    rec.sizes.forEach(s=>{rate[s]=denom>0?(sbs[s]||0)/denom:0});
    return{rate,sourceLevel:lv.level,sourceLabel:lv.label};
  }
  // V8.5 guaranteed-sales: no level cleared the threshold. Use the broadest level (Division-first)
  // that has ANY data, computing average-SKU rate, rather than the SKU's own sparse numbers.
  const fallbackOrder=['Division','Category','Subcategory','Segment','Program'];
  for(const lvName of fallbackOrder){
    const lv=levels.find(l=>l.level===lvName&&l.key);
    if(!lv)continue;
    const sbs=A.hierSales[lv.key];if(!sbs)continue;
    const meta=A.hierMeta[lv.key];if(!meta||meta.skuCount===0)continue;
    let total=0;rec.sizes.forEach(s=>{total+=(sbs[s]||0)});
    if(total<=0)continue;
    const denom=meta.skuCount*meta.avgWeeksLive;
    const rate={};
    rec.sizes.forEach(s=>{rate[s]=denom>0?(sbs[s]||0)/denom:0});
    return{rate,sourceLevel:lv.level+' (below threshold)',sourceLabel:lv.label,guaranteed:true};
  }
  // Truly nothing — fall back to SKU's own rate even if thin (or 0 across the board)
  const rate={};
  const wl=Math.max(4,skuWeeksLive||4);
  rec.sizes.forEach(s=>{rate[s]=(rec.sizeData[s].sales||0)/wl});
  return{rate,sourceLevel:'SKU (sparse)',sourceLabel:rec.sku};
}

// === V9.9: seasonal weekly rate ===
// PROBLEM: getWeeklyRate returns total sales / weeks-live, i.e. the average rate over the weeks
// the style ACTUALLY SOLD IN. Applying that flat across a forward window is only valid when the
// window sits in the same part of the year. It doesn't for a forward seasonal buy: a SU27 buy
// delivering June 2027 has a now-to-receipt window running through fall, winter and spring, but
// the rate being burned was measured on elevated summer selling. The sim burned ~40 weeks at a
// summer rate and drove projected BOP to 0, which in turn inflated the CF Global floor
// (minPres - BOP).
//
// FIX: split the rate into LEVEL and SHAPE.
//   1. Build a seasonal index from the weekly sales curve, normalised to average 1.0.
//   2. Rebase the measured rate to an annual-average equivalent by dividing out the average index
//      over the weeks that rate was measured on. (A summer style measured only in summer has a
//      rebase well above 1.0, so its annual-average level lands correctly below its summer rate.)
//   3. Re-apply the index week by week at each projected week's real calendar position.
// A style with full-year selling has a rebase of ~1.0 and an index of ~1.0 throughout, so this is
// a no-op for core product - it only bites where the window and the selling history disagree.
// V9.9.2: what makes a weekly curve trustworthy is VOLUME plus enough distinct selling weeks to
// describe a shape - NOT coverage of most of the calendar. The old 40-week gate had it backwards:
// a genuinely seasonal style never sells in 40 weeks, so every seasonal program was rejected and
// the walk climbed to a blended parent, which is exactly the curve that cannot correct it.
const SEASON_IDX_MIN_ACTIVE_WEEKS=6;   // enough selling weeks to define a shape
const SEASON_IDX_MIN_UNITS=500;        // enough volume that the shape isn't noise

function buildSeasonIndex(wkUnits){
  if(!wkUnits)return null;
  // A week with no sales rows means the style sold NOTHING that week, not that we lack data - the
  // export covers a full year. Excluding those weeks was the core bug: the dead winter weeks we
  // most need to discount dropped out of the curve entirely and then defaulted to full rate.
  // Only zero-fill when the file really does span a year (see A.weeklyFullYear).
  const fill=A.weeklyFullYear!==false;
  const clean={};let active=0,sum=0,slots=0;
  for(let w=1;w<=53;w++){
    const raw=wkUnits[w];
    if(raw===undefined&&!fill)continue;
    const u=Math.max(0,raw===undefined?0:raw);   // returns can push a week negative; floor at 0
    clean[w]=u;slots++;sum+=u;
    if(u>0)active++;
  }
  if(active<SEASON_IDX_MIN_ACTIVE_WEEKS||sum<SEASON_IDX_MIN_UNITS)return null;
  const mean=sum/slots;
  if(mean<=0)return null;
  const idx={};
  // Averages 1.0 across the whole year. Clamped so one dead or freak week can't zero the rate or
  // blow it up; the bounds are wide enough to leave real seasonality intact.
  for(const w in clean)idx[w]=Math.min(4,Math.max(0.02,clean[w]/mean));
  return{idx,weeks:slots,activeWeeks:active,units:sum};
}

// The chain of levels a seasonal shape can come from, finest-to-broadest. `key` is the hierarchy
// key used for both the blended curve and (prefixed with the season family) the cohort curve.
function seasonChain(rec){
  return[
    {level:'SKU',label:rec.sku,key:null},   // present only so a SKU-sourced RATE can be located; never used as a shape
    {level:'Program',label:rec.styleDescription,key:rec._hk.prog},
    {level:'Segment',label:rec.segment||'(no segment)',key:rec._hk.seg},
    {level:'Subcategory',label:rec.subcategory,key:rec._hk.sub},
    {level:'Category',label:rec.category,key:rec._hk.cat},
    {level:'Division',label:rec.division,key:rec._hk.div}
  ];
}

// Normalise a sourceLevel string ('Category (below threshold)', 'SKU (sparse)') to its bare level.
function baseRateLevel(wkInfo){
  return String(wkInfo&&wkInfo.sourceLevel||'').replace(/\s*\((?:below threshold|sparse)\)$/,'');
}

// Seasonal shape for this SKU, measured no lower than the level the RATE resolved to and walking
// up until a level has enough weekly coverage.
//
// V9.9.1: at each level the SEASON-ALIGNED COHORT is tried first, and only then the blended curve.
// This is the fix that makes the correction actually bite. A blended parent curve ('all men's
// shirts', 'all of Men's') is nearly FLAT, because it mixes summer product with fall and holiday
// product — averaged together they cover the whole year evenly. Multiplying an elevated summer
// rate by a flat index leaves it elevated, which is why the first cut barely moved the rate.
// Restricted to the same season family, the same level shows a real summer peak and a dead winter.
function getSeasonalIndex(rec,wkInfo){
  if(!A.seasonIdxCache)A.seasonIdxCache={};
  const src=baseRateLevel(wkInfo);
  const pfx=seasonPrefix(rec.season);
  const ck=rec.sku+'|'+src+'|'+(pfx||'-');
  if(A.seasonIdxCache[ck]!==undefined)return A.seasonIdxCache[ck];
  const chain=seasonChain(rec);
  let start=chain.findIndex(c=>c.level===src);
  if(start<0)start=0;
  // V9.9.2: never take the shape from a single SKU's own history. Once absent weeks count as real
  // zeroes, a style launched a few months ago would read as "seasonally dead" for the other 40
  // weeks when it simply did not exist yet. Seasonality is a property of the style/category within
  // a season, so measure it at Program or broader - which is also the level approved for the curve.
  if(start<1)start=1;
  let out=null;
  for(let i=start;i<chain.length&&!out;i++){
    const c=chain[i];
    // 1. Season-aligned cohort at this level.
    if(pfx&&c.key&&A.hierWeeklySeason){
      const b=buildSeasonIndex(A.hierWeeklySeason[pfx+'|'+c.key]);
      if(b){out={idx:b.idx,level:c.level+' \u00b7 '+pfx,label:c.label,weeks:b.weeks,activeWeeks:b.activeWeeks,units:b.units,cohort:true}}
    }
    // 2. Fall back to the blended curve at this level (or the SKU's own, at the SKU level).
    if(!out){
      const units=c.key?(A.hierWeekly||{})[c.key]:null;
      const b=buildSeasonIndex(units);
      if(b){out={idx:b.idx,level:c.level,label:c.label,weeks:b.weeks,activeWeeks:b.activeWeeks,units:b.units,cohort:false}}
    }
  }
  A.seasonIdxCache[ck]=out;
  return out;
}

// The weeks the base rate's denominator actually covered - the weeks with sales at its source.
function rateMeasuredWeeks(rec,wkInfo){
  const src=baseRateLevel(wkInfo);
  let units=null;
  if(src.indexOf('SKU')===0){
    units=A.skuWkUnits&&A.skuWkUnits[rec.sku];
  } else {
    const map={Program:'prog',Segment:'seg',Subcategory:'sub',Category:'cat',Division:'div'};
    const hk=map[src]&&rec._hk[map[src]];
    units=hk&&A.hierWeekly?A.hierWeekly[hk]:null;
  }
  if(!units)return[];
  return Object.keys(units).map(Number).filter(w=>units[w]>0);
}

// Average index across the measured weeks. Because rate = SUM(units) / Nweeks and we model
// units_w = annualLevel * idx_w, the UNWEIGHTED mean over those weeks is the exact divisor that
// recovers the annual level.
function seasonRebase(seas,measuredWeeks){
  if(!seas||!measuredWeeks||!measuredWeeks.length)return 1;
  let sum=0,n=0;
  measuredWeeks.forEach(w=>{const v=seas.idx[w];if(v!==undefined){sum+=v;n++}});
  if(!n)return 1;
  const avg=sum/n;
  return avg>0.05?avg:1;   // guard a degenerate divisor from blowing the rate up
}
