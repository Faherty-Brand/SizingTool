<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PO Sizing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* PO Sizing V4 — Faherty Palette */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--sand:#f4ede4;--sand-lt:#faf6f1;--sand-dk:#e8ddd0;--sand-dkr:#d9cab8;--wh:#fff;
--navy:#1a2744;--navy-lt:#2c3e5e;
--blue:#3b7bc0;--blue-lt:#5a9ae0;--blue-pl:rgba(59,123,192,.08);--blue-md:rgba(59,123,192,.15);--blue-st:rgba(59,123,192,.25);
--orange:#c4572a;--orange-lt:#e07040;--orange-pl:rgba(196,87,42,.08);--orange-md:rgba(196,87,42,.15);
--teal:#2a8a8a;--green:#2d8a5e;--green-pl:rgba(45,138,94,.06);--green-bd:rgba(45,138,94,.35);
--yellow:#b8960f;--yellow-pl:rgba(184,150,15,.08);--yellow-bd:rgba(184,150,15,.35);
--red:#c44040;--pink:#c05a8a;--pink-pl:rgba(192,90,138,.08);
--slate:#6a7a8a;--slate-pl:rgba(106,122,138,.08);
--txt:#1a1a1a;--txt2:#555;--txt3:#999;--txti:#f0f0f0;
--bdr:#d9cab8;--bdr-lt:#e8ddd0;
--mono:'IBM Plex Mono','Fira Code',monospace;--sans:'Instrument Sans',-apple-system,sans-serif;
--r:6px;--rl:10px;--t:150ms ease;
--cb:rgba(59,123,192,.06);--cbd:rgba(59,123,192,.13);--co:rgba(196,87,42,.06);--cod:rgba(196,87,42,.13);
--shmd:0 4px 16px rgba(26,39,68,.08);--shlg:0 8px 32px rgba(26,39,68,.1);
}
html{height:100%}body{font-family:var(--sans);background:var(--sand);color:var(--txt);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
input,select,button,textarea{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--sand-dkr);border-radius:3px}
.hidden{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
.anim{animation:fadeUp .3s ease forwards}
.toast-area{position:fixed;bottom:32px;left:16px;z-index:9500;display:flex;flex-direction:column;gap:6px;max-width:380px;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--r);font-size:12px;font-weight:600;font-family:var(--mono);animation:toastIn .3s ease;box-shadow:var(--shmd);pointer-events:auto;word-wrap:break-word}
.toast.ok{background:var(--green-pl);color:var(--green);border:1px solid var(--green-bd)}.toast.out{animation:toastOut .5s ease forwards}
.btn{padding:7px 14px;font-size:11px;font-weight:600;border-radius:var(--r);cursor:pointer;transition:all var(--t);border:none;white-space:nowrap}
.btn-g{background:var(--sand-lt);color:var(--txt2);border:1px solid var(--bdr-lt)}.btn-g:hover{border-color:var(--blue);color:var(--txt)}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{background:var(--blue-lt)}.btn-b:disabled{background:var(--sand-dk);color:var(--txt3);cursor:not-allowed}
.btn-grn{background:var(--green);color:#fff;font-weight:700;padding:7px 18px;font-size:12px;border:none;border-radius:var(--r);cursor:pointer}.btn-grn:hover{background:#35a06a}
.btn-pk{background:var(--pink);color:#fff;font-weight:700;padding:7px 14px;font-size:11px;border:none;border-radius:var(--r);cursor:pointer}.btn-pk:hover{background:rgba(192,90,138,.85);filter:brightness(1.05)}
.btn-sm{padding:5px 10px;font-size:10px}
.metric-pill.mp-ch{background:rgba(42,138,138,.08);color:var(--teal);border:1px solid rgba(42,138,138,.35)}

/* Flows Modal */
.fm-backdrop{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(20,30,40,.55);backdrop-filter:blur(2px);z-index:1000}
.fm-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90vw;max-width:1100px;max-height:88vh;background:var(--wh);border:1px solid var(--bdr-lt);border-radius:var(--rl);box-shadow:0 30px 80px rgba(0,0,0,.25);z-index:1001;display:flex;flex-direction:column;overflow:hidden}
.fm-hdr{padding:16px 22px;border-bottom:1px solid var(--bdr-lt);background:var(--sand-lt);display:flex;flex-direction:column;gap:4px;position:relative}
.fm-title{font-size:18px;font-weight:700;color:var(--navy);font-family:var(--display)}
.fm-subtitle{font-family:var(--mono);font-size:10px;color:var(--txt3);letter-spacing:.5px}
.fm-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:1px solid var(--bdr-lt);background:var(--wh);color:var(--txt2);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.fm-close:hover{border-color:var(--red);color:var(--red)}
.fm-body{padding:18px 22px;overflow:auto;flex:1}
.fm-flows-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:24px}
.fm-flow{background:rgba(192,90,138,.04);border:1px solid rgba(192,90,138,.25);border-radius:var(--rl);padding:14px}
.fm-flow-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.fm-flow-name{font-weight:700;color:var(--pink);font-size:13px}
.fm-flow-date{font-family:var(--mono);font-size:10px;color:var(--txt2);font-weight:600;background:var(--wh);padding:2px 8px;border-radius:3px;border:1px solid rgba(192,90,138,.3)}
.fm-flow-stats{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed rgba(192,90,138,.3)}
.fm-flow-tot{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--navy)}
.fm-flow-pct{font-family:var(--mono);font-size:10px;color:var(--txt3)}
.fm-tbl{width:100%;border-collapse:collapse}
.fm-tbl th{font-family:var(--mono);font-size:9px;color:var(--txt3);font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:5px 8px;text-align:right;border-bottom:1px solid var(--bdr-lt)}
.fm-tbl th:first-child{text-align:left}
.fm-tbl td{padding:4px 8px;font-family:var(--mono);font-size:11px;border-bottom:1px solid rgba(192,90,138,.08)}
.fm-tbl td.fm-sz{font-weight:700;color:var(--navy)}
.fm-tbl td.fm-qty{text-align:right;color:var(--txt)}
.fm-math{margin-top:6px;background:var(--sand-lt);border:1px solid var(--bdr-lt);border-radius:var(--rl);padding:14px}
.fm-math-hdr{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
.fm-math-desc{font-size:11px;color:var(--txt2);margin-bottom:10px;line-height:1.5}
.fm-math-tbl{width:100%;border-collapse:collapse;margin-bottom:14px;background:var(--wh);border-radius:var(--r);overflow:hidden}
.fm-math-tbl th{padding:7px 10px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--txt2);background:var(--sand-dk);border-bottom:2px solid var(--bdr);text-align:right;white-space:nowrap}
.fm-math-tbl th:first-child{text-align:left}
.fm-math-tbl td{padding:5px 10px;font-family:var(--mono);font-size:10px;border-bottom:1px solid var(--bdr-lt);text-align:right}
.fm-math-tbl td.fm-sz{text-align:left;font-weight:700;color:var(--navy)}
.fm-math-tbl td.fm-num{color:var(--txt)}
.fm-math-tbl td.fm-tot{font-weight:700;color:var(--orange);background:var(--orange-pl)}
.fm-math-tbl .fm-sub{color:var(--txt3);font-size:8px}
.fm-math-summary{display:flex;flex-direction:column;gap:5px;padding:10px 0 0;border-top:1px dashed var(--bdr)}
.fm-math-summary>div{font-size:11px;display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
.fm-summary-lbl{color:var(--txt2);font-weight:500}
.fm-summary-val{font-family:var(--mono);font-weight:700;color:var(--navy)}
.fm-bump{font-size:9px;color:var(--orange);font-weight:600;font-style:italic;margin-left:4px}
.bdg{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:2px 6px;border-radius:3px;display:inline-block}
.bdg-cf{color:var(--blue);background:var(--blue-pl)}.bdg-in{color:var(--orange);background:var(--orange-pl)}.bdg-ns{color:var(--txt3);background:var(--sand-dk)}
.pm-flag{font-family:var(--mono);font-size:8px;font-weight:600;padding:3px 6px;border-radius:3px;margin-top:6px;line-height:1.3}
.pm-flag-ok{background:var(--green-pl);color:var(--green);border:1px solid var(--green-bd)}
.pm-flag-bad{background:rgba(196,64,64,.08);color:var(--red);border:1px solid rgba(196,64,64,.35)}
/* Welcome */
#welcome{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative}
#welcome.shown{display:flex}
.w-nav{position:fixed;top:0;left:0;right:0;padding:10px 20px;display:flex;gap:8px;z-index:10}
.w-center{text-align:center;max-width:600px}
.sun-svg{display:block;margin:0 auto 12px}
.w-center .tag{font-family:var(--mono);font-size:10px;letter-spacing:4px;color:var(--orange);text-transform:uppercase;margin-bottom:6px}
.w-center h1{font-size:42px;font-weight:700;letter-spacing:-1.5px;color:var(--navy);margin-bottom:8px}
.w-center .sub{color:var(--txt2);font-size:14px;margin-bottom:36px}
.s-wait{color:var(--txt3);font-family:var(--mono);font-size:12px}
.s-grid{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.s-btn{padding:20px 36px;background:var(--wh);border:2px solid var(--bdr-lt);border-radius:var(--rl);cursor:pointer;transition:all .2s;text-align:center;min-width:200px}
.s-btn:hover{border-color:var(--blue);background:var(--blue-pl);transform:translateY(-2px);box-shadow:var(--shlg)}
.s-btn .code{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--navy);margin-bottom:8px}
.s-btn .ct{font-size:11px;color:var(--txt3);font-family:var(--mono);letter-spacing:.3px;line-height:1.5}
.s-btn .ct-buy{color:var(--green);font-weight:600}
.u-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:var(--wh);border:1px solid var(--bdr-lt);border-radius:var(--r);cursor:pointer;transition:all var(--t);font-size:11px;font-weight:500;color:var(--txt3);position:relative}
.u-chip:hover{border-color:var(--blue);color:var(--txt2)}.u-chip.ok{border-color:var(--green-bd);color:var(--green);background:var(--green-pl)}
.u-chip input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}.u-chip .meta{font-family:var(--mono);font-size:9px}
.pm-link{display:flex;align-items:center;gap:6px;padding:7px 14px;font-size:11px;font-weight:600;color:var(--navy);background:var(--sand-lt);border:1px solid var(--bdr-lt);border-radius:var(--r);cursor:pointer}.pm-link:hover{border-color:var(--blue);background:var(--blue-pl)}
/* Dashboard */
#dash{display:none;min-height:100vh;flex-direction:column}#dash.active{display:flex}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;border-bottom:1px solid var(--bdr-lt);background:var(--wh);flex-shrink:0;position:sticky;top:0;z-index:20}
.top-l{display:flex;align-items:center;gap:14px}.top-r{display:flex;gap:8px;align-items:center}
.stitle{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--navy);letter-spacing:1px}
.exp-ct{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-right:4px}
/* Grid */
.gv{padding:20px 24px}.gc{margin-bottom:14px}
.gc-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.gc-lbl{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);margin-right:4px;flex-shrink:0}
.sb{padding:5px 10px;font-size:10px;font-weight:600;background:var(--wh);color:var(--txt2);border:1px solid var(--bdr-lt);border-radius:4px;cursor:pointer;transition:all var(--t);white-space:nowrap}
.sb:hover{border-color:var(--blue)}.sb.on{background:var(--navy);color:var(--txti);border-color:var(--navy)}
.fsel{padding:5px 8px;font-size:10px;font-weight:500;background:var(--wh);color:var(--txt);border:1px solid var(--bdr-lt);border-radius:4px;outline:none;cursor:pointer}.fsel.dim{opacity:.5}
.sbar{padding:7px 12px;font-size:12px;background:var(--wh);color:var(--txt);border:1px solid var(--bdr-lt);border-radius:var(--r);outline:none;width:220px}.sbar:focus{border-color:var(--blue)}.sbar::placeholder{color:var(--txt3)}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sc{padding:14px 16px;background:var(--wh);border:2px solid var(--bdr-lt);border-radius:var(--rl);cursor:pointer;transition:all .15s;position:relative}
.sc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:1px;padding-right:0}
.sc-deliv-wrap{flex:1;display:flex;justify-content:center;min-width:0}
.sc-deliv{font-family:var(--mono);font-size:9px;color:var(--orange);font-weight:700;letter-spacing:.5px;background:var(--orange-pl);padding:2px 6px;border-radius:3px;white-space:nowrap}
.sc-buy{font-family:var(--mono);margin:4px 0 2px;line-height:1.2;display:flex;align-items:baseline;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-sized-ok{font-size:14px;font-weight:700;color:var(--green)}
.sc-sized-warn{font-size:14px;font-weight:700;color:#b8800c;animation:flashAmber 1.4s ease-in-out infinite}
.sc-sized-bad{font-size:14px;font-weight:700;color:var(--red);animation:flashRed 1.2s ease-in-out infinite}
.sc-slash{color:var(--txt3);font-size:11px}
.sc-bought{font-size:11px;font-weight:600;color:var(--txt2)}
.sc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.sc-commit{font-family:var(--mono);font-size:9px;color:var(--txt2);background:var(--sand-lt);padding:3px 8px;border-radius:3px;letter-spacing:.3px;font-weight:600;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1}
.sc-commit-empty{color:var(--txt3);background:transparent;padding-left:2px}
@keyframes flashRed{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes flashAmber{0%,100%{opacity:1}50%{opacity:.6}}

/* Mass action buttons */
.sb.mass-btn{font-size:11px;font-weight:700;letter-spacing:.3px;padding:6px 12px;border-radius:var(--rs);transition:all .15s}
.sb.mass-acc{background:var(--green);color:#fff;border:1px solid var(--green)}
.sb.mass-acc:hover{background:#246e4c;border-color:#246e4c}
.sb.mass-unacc{background:var(--wh);color:var(--red);border:1px solid var(--red)}
.sb.mass-unacc:hover{background:var(--red);color:#fff}
.sc:hover{border-color:var(--blue);box-shadow:var(--shmd);transform:translateY(-1px)}
.sc.dv-m{border-left:4px solid var(--blue)}.sc.dv-w{border-left:4px solid var(--pink)}.sc.dv-n{border-left:4px solid var(--slate)}
.sc .chk{position:relative;width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;transition:all var(--t);flex-shrink:0}
.sc .chk:hover{transform:scale(1.1)}
.sc .chk-g{background:var(--green);color:#fff}.sc .chk-e{background:var(--wh);border:2px solid var(--bdr);color:transparent}
.sc .chk-e:hover{border-color:var(--green)}
.sc .sid{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--navy);margin-bottom:2px}
.sc .snm{font-size:10px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.sc .sbu{font-family:var(--mono);font-size:16px;font-weight:700;margin-bottom:2px}.sc .ssb{font-family:var(--mono);font-size:9px;color:var(--txt3)}
.gnote{text-align:center;padding:20px;font-family:var(--mono);font-size:11px;color:var(--txt3)}
/* Detail */
.dv{padding:16px 28px 60px}
.d-back{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:11px;font-weight:600;color:var(--blue);background:var(--blue-pl);border:1px solid var(--blue-md);border-radius:var(--r);cursor:pointer;margin-bottom:12px}.d-back:hover{background:var(--blue-md)}
.detail-sticky{position:sticky;top:52px;z-index:15;background:var(--sand);padding:12px 0 10px;border-bottom:1px solid var(--bdr-lt);margin-bottom:14px}
.ds-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ch-mismatch{background:#fdf3e6;border:1px solid #c4572a;color:#8a3d1e;padding:10px 14px;border-radius:var(--rs);font-size:12px;margin-bottom:12px;line-height:1.5}
.ch-mismatch b{color:#c4572a}
.ds-name{font-size:14px;color:var(--txt2);font-weight:500;margin-bottom:8px}
.ds-color{color:var(--orange);font-weight:600}
.ds-left{display:flex;align-items:center;gap:10px}.ds-left h2{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--navy)}
.ds-right{display:flex;gap:8px;align-items:center}
.attr-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.attr-pill{font-family:var(--mono);font-size:9px;font-weight:600;padding:3px 8px;border-radius:4px;background:var(--blue-pl);color:var(--blue);border:1px solid var(--blue-md)}
.metric-row{display:flex;gap:5px;flex-wrap:wrap}
.metric-pill{font-family:var(--mono);font-size:9px;font-weight:600;padding:3px 8px;border-radius:4px;background:var(--orange-pl);color:var(--orange);border:1px solid var(--orange-md)}
/* V4 Chart */
.cb{background:var(--wh);border:1px solid var(--bdr-lt);border-radius:var(--rl);padding:18px 20px;margin-bottom:12px}
.slbl{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt3);margin-bottom:12px}
.chart-legend-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:8px 0}
.chart-cb{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--txt2);cursor:pointer;padding:4px 10px;border-radius:4px;border:1px solid var(--bdr-lt);background:var(--wh);transition:all var(--t)}
.chart-cb:hover{border-color:var(--blue)}.chart-cb.on{background:var(--sand-lt);border-color:var(--bdr)}
.chart-cb input{display:none}.cb-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.chart-v4{display:flex;gap:0;align-items:flex-end;height:180px;overflow-x:auto;padding-bottom:4px}
.chart-col-v4{flex:1;min-width:36px;display:flex;flex-direction:column;height:100%;border-right:1px solid var(--txt);padding:0 2px}
.chart-col-v4:last-child{border-right:none}
.chart-size-hdr{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--navy);text-align:center;padding:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-bars-v4{display:flex;gap:1px;align-items:flex-end;flex:1}
.cbar{flex:1;border-radius:2px 2px 0 0;transition:height .3s ease;position:relative;min-width:4px}
.cbar:hover{opacity:.8}.cbar:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--navy);color:var(--txti);font-family:var(--mono);font-size:9px;padding:3px 7px;border-radius:3px;white-space:nowrap;z-index:10;pointer-events:none}
/* Rollup */
.rb{font-family:var(--mono);font-size:10px;color:var(--txt2);padding:10px 14px;background:var(--wh);border:1px solid var(--bdr-lt);border-radius:var(--r);margin-bottom:14px;line-height:1.9}
.rs{display:inline-flex;align-items:center;gap:3px;margin-right:6px}.rp{color:var(--green);font-weight:600}.rf{color:var(--red)}
/* Table */
.tb{background:var(--wh);border:1px solid var(--bdr-lt);border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.tbh{padding:12px 18px;border-bottom:1px solid var(--bdr-lt);display:flex;align-items:center;justify-content:space-between;background:var(--wh)}
.tbn{font-family:var(--mono);font-size:10px}.tbs{overflow-x:auto;overflow-y:auto}
.dt{width:100%;border-collapse:collapse}.dt thead{position:sticky;top:0;z-index:4}

<script>
/* ═══════════════════════════════════════
   PO Sizing V7.1 — Supabase Cloud Backend
   ═══════════════════════════════════════ */

// Supabase configuration
const SUPABASE_URL='https://qwtylbbqwkchqkmaycbj.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3dHlsYmJxd2tjaHFrbWF5Y2JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTkxODgsImV4cCI6MjA5MzQ5NTE4OH0.F9CmnmHMc5ST2I_PD3L9OY-_uwNSQKL87vy1T9VKeQw';
const ALLOWED_DOMAIN='@fahertybrand.com';
const SUPA=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});

// Auth state — populated on login, used for attribution writes
const Auth={user:null,email:null,displayName:null};

// ═══ Display name derivation ═══
// "julia.appicelli@fahertybrand.com" → "Julia Appicelli"
function deriveDisplayName(email){
  if(!email)return 'Unknown';
  const local=email.split('@')[0]||email;
  return local.split(/[._\-]+/).map(p=>p?p.charAt(0).toUpperCase()+p.slice(1).toLowerCase():'').filter(Boolean).join(' ')||local;
}

function formatRelTime(iso){
  if(!iso)return '';
  const d=new Date(iso),now=new Date(),diff=(now-d)/1000;
  if(diff<60)return 'just now';
  if(diff<3600)return Math.floor(diff/60)+'m ago';
  if(diff<86400)return Math.floor(diff/3600)+'h ago';
  if(diff<86400*7)return Math.floor(diff/86400)+'d ago';
  return d.toLocaleDateString();
}

// ═══ Auth flow ═══
async function sendMagicLink(){
  const input=document.getElementById('login-email');
  const msg=document.getElementById('login-msg');
  const btn=document.getElementById('login-btn');
  const email=(input.value||'').trim().toLowerCase();
  msg.className='login-msg';msg.textContent='';
  if(!email||!email.includes('@')){msg.className='login-msg err';msg.textContent='Please enter a valid email.';return}
  if(!email.endsWith(ALLOWED_DOMAIN)){msg.className='login-msg err';msg.textContent='Only '+ALLOWED_DOMAIN+' email addresses are allowed.';return}
  btn.disabled=true;btn.textContent='Sending...';
  try{
    const{error}=await SUPA.auth.signInWithOtp({
      email,
      options:{emailRedirectTo:window.location.origin+window.location.pathname}
    });
    if(error)throw error;
    msg.className='login-msg ok';msg.textContent='✓ Check your email for the magic link. It\'ll be valid for 24 hours.';
    btn.textContent='Sent';
  }catch(err){
    msg.className='login-msg err';msg.textContent='Error: '+err.message;
    btn.disabled=false;btn.textContent='Send magic link';
  }
}

async function logout(){
  if(!confirm('Sign out?'))return;
  await SUPA.auth.signOut();
  // Clear in-memory state
  A.raw={inventory:null,sales:null,linelist:null,wip:null};
  A.rawCSV={};A.uploadMeta={};A.cloudMeta={};
  A.presMins={};A.presMinsMeta={};A.scaleSizes={};A.scaleSizeCount={};
  A.activeSeason=null;A.accepted={};A.overrides={};
  Auth.user=null;Auth.email=null;Auth.displayName=null;
  showLogin();
}

function showLogin(){
  document.getElementById('login').classList.add('active');
  document.getElementById('welcome').classList.remove('shown');
  document.getElementById('dash').classList.remove('active');

// ─── CSV Parser ───
function parseCSV(t,hi,mergePrevHeader){
  hi=hi||0;const rl=[];let c='',q=false,r=[],fieldStart=true;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(ch==='"'){
      if(q){
        if(t[i+1]==='"'){c+='"';i++}
        else q=false;
      } else if(fieldStart){q=true}
      else{c+='"'}
    } else if(ch===','&&!q){
      r.push(c.trim());c='';fieldStart=true;continue;
    } else if((ch==='\n'||ch==='\r')&&!q){
      if(ch==='\r'&&t[i+1]==='\n')i++;
      r.push(c.trim());
      if(r.length>1||(r.length===1&&r[0]!==''))rl.push(r);
      c='';r=[];fieldStart=true;continue;
    } else{c+=ch}
    fieldStart=false;
  }
  if(c||r.length){r.push(c.trim());rl.push(r)}
  // Find the header row: first row that contains a 'SKU' cell (case-insensitive)
  let hdrIdx=-1;
  for(let i=0;i<Math.min(rl.length,8);i++){
    const row=rl[i]||[];
    if(row.some(cell=>cell.replace(/^\uFEFF/,'').trim().toLowerCase()==='sku')){hdrIdx=i;break}
  }
  if(hdrIdx===-1)return[];
  let h=rl[hdrIdx].map(x=>x.replace(/^\uFEFF/,'').trim());
  // For Linelist: merge row 2 (group labels) into row 3 (column names) to disambiguate.
  // Strategy: find which row 3 labels appear more than once, and ONLY merge those with their
  // forward-filled row 2 group. Unique labels stay as-is. This prevents over-eager prefixing
  // of unrelated columns.
  if(mergePrevHeader&&hdrIdx>0){
    const prev=rl[hdrIdx-1].map(x=>x.replace(/^\uFEFF/,'').trim());
    // Forward-fill row 2: empty cells inherit the most recent non-empty group above
    const filled=[];let last='';
    for(let i=0;i<prev.length;i++){if(prev[i])last=prev[i];filled.push(last)}
    // Count row 3 occurrences
    const counts={};h.forEach(c=>{const k=c.toLowerCase();counts[k]=(counts[k]||0)+1});
    h=h.map((cell,i)=>{
      const isDup=counts[cell.toLowerCase()]>1;
      const ownGroup=prev[i]||''; // non-forward-filled value at this position
      const grp=filled[i]||'';
      if(isDup){
        // Need disambiguation — use forward-filled group if available
        if(grp&&grp!==cell)return grp+' | '+cell;
      } else if(ownGroup&&ownGroup!==cell){
        // Has its own group label (not forward-filled) — merge for clarity
        return ownGroup+' | '+cell;
      }
      return cell;
    });
    // Final dedup safety net: suffix any still-duplicate keys
    const seen={};
    h=h.map(k=>{if(seen[k]){seen[k]++;return k+' ('+seen[k]+')'}seen[k]=1;return k});
  }
  const res=[];
  for(let i=hdrIdx+1;i<rl.length;i++){
    const row=rl[i];if(!row||row.length<2)continue;
    const o={};h.forEach((hh,idx)=>{o[hh]=row[idx]||''});res.push(o);
  }
  return res;
}

// Header row positions: 42 reports (inventory/sales) always have headers in row 2 (index 1)
// Linelist/WIP have headers in row 3 (index 2)
function detectHeaderRow(text,key){
  return(key==='linelist'||key==='wip')?2:1;
}

function findCol(row,cands){
  if(!row)return null;const keys=Object.keys(row);
  for(const c of cands){const f=keys.find(k=>k.toLowerCase()===c.toLowerCase());if(f)return f}
  for(const c of cands){const cl=c.toLowerCase();const f=keys.find(k=>k.toLowerCase().includes(cl));if(f)return f}
  return null;
}

function numP(v){if(!v)return 0;return parseInt(String(v).replace(/[^0-9\-]/g,''),10)||0}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmt(n){return n.toLocaleString()}
function pct(n){return(n*100).toFixed(1)+'%'}
function formatDeliveryShort(deliveryMonth){
  if(!deliveryMonth)return '';
  const m=String(deliveryMonth).match(/^([A-Za-z]+)(_(\d+))?$/);
  if(!m)return deliveryMonth;
  const abbr=m[1].slice(0,3);
  const cap=abbr.charAt(0).toUpperCase()+abbr.slice(1).toLowerCase();
  const suffix=m[3]||'1';
  return cap+'_'+suffix;
}

// ─── Size sort ───
const SO={XXS:1,XS:2,S:3,M:4,L:5,XL:6,XXL:7,XXXL:8,'2XL':7,'3XL':8,MT:5,LT:6,XLT:7,XXLT:8,OS:0};
function ssort(a,b){
  const oa=SO[a.toUpperCase()]??null,ob=SO[b.toUpperCase()]??null;
  if(oa!==null&&ob!==null)return oa-ob;if(oa!==null)return-1;if(ob!==null)return 1;
  const pa=a.match(/^(\d+)/),pb=b.match(/^(\d+)/);
  if(pa&&pb){const wa=+pa[1],wb=+pb[1];if(wa!==wb)return wa-wb;const la=a.match(/(\d+)L$/),lb=b.match(/(\d+)L$/);if(la&&lb)return+la[1]-+lb[1]}
  return a.localeCompare(b);
}

// ─── Delivery month calc ───
const MONTH_MAP={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
function deliveryToWeeks(deliveryMonth,seasonCode){
  if(!deliveryMonth||!seasonCode)return 12;
  const base=deliveryMonth.toLowerCase().replace(/_\d+$/,'');
  const mo=MONTH_MAP[base];if(!mo)return 12;
  const yrMatch=seasonCode.match(/(\d{2})$/);if(!yrMatch)return 12;
  const yr=2000+parseInt(yrMatch[1]);
  const target=new Date(yr,mo-1,1);
  return Math.max(0,Math.round((target-new Date())/(7*24*60*60*1000)));
}

// Shift a delivery month forward by N months, preserving any _N suffix
// e.g. shiftDelivery('November_2', 1) => 'December_2'
//      shiftDelivery('December_2', 1) => 'January_2' (year wraps but suffix kept)
function shiftDeliveryMonth(deliveryMonth,offset){
  if(!deliveryMonth||offset===0)return deliveryMonth||'';
  const m=deliveryMonth.match(/^([A-Za-z]+)(_\d+)?$/);
  if(!m)return deliveryMonth;
  const base=m[1].toLowerCase();
  const suffix=m[2]||'';
  const mo=MONTH_MAP[base];if(!mo)return deliveryMonth;
  let newMo=mo+offset;
  // Wrap modulo 12 for January follows December
  while(newMo>12)newMo-=12;
  while(newMo<1)newMo+=12;
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return monthNames[newMo-1]+suffix;
}

function handleUpload(key,inp){
  const file=inp.files[0];if(!file)return;
  if(!Auth.email){alert('Please log in first.');return}
  const reader=new FileReader();
  reader.onload=async function(ev){
    const text=ev.target.result;
    let hi=detectHeaderRow(text,key);
    A.raw[key]=parseCSV(text,hi,key==='linelist');
    A.rawCSV[key]=text;
    const rows=A.raw[key].length;
    const cols=A.raw[key][0]?Object.keys(A.raw[key][0]).length:0;
    A.uploadMeta[key]={rows,cols,date:new Date().toLocaleString(),fileName:file.name};
    A.cloudMeta[key]={updated_by_name:Auth.displayName,updated_by_email:Auth.email,updated_at:new Date().toISOString(),filename:file.name,row_count:rows,col_count:cols};
    updateChip(key);
    toast('Uploading '+key+' to cloud...');
    try{
      await cloudUploadCSV(key,text,file.name,rows,cols);
      toast(key.charAt(0).toUpperCase()+key.slice(1)+' synced · '+fmt(rows)+' rows');
    }catch(err){
      console.error('Cloud upload failed:',err);
      toast('Cloud upload failed: '+err.message);
    }
    // Build scaleSizes from data whenever linelist or sales/inv is uploaded
    if(allUp())buildScaleSizes();
    trySeasons();
    inp.value='';
  };reader.readAsText(file);
}

function updateChip(key){
  const chip=document.getElementById('uc-'+key);
  const meta=document.getElementById('um-'+key);
  if(A.raw[key]&&chip){
    chip.classList.add('ok');
    const m=A.uploadMeta[key];
    const cm=A.cloudMeta[key];
    let txt=fmt(m.rows)+'r × '+m.cols+'c';
    if(cm&&cm.updated_by_name)txt+=' · '+cm.updated_by_name+' '+formatRelTime(cm.updated_at);
    else if(m.date)txt+=' · '+m.date;
    if(meta)meta.textContent=txt;
  } else if(chip) {
    chip.classList.remove('ok');
    if(meta)meta.textContent='';
  }
}

function allUp(){return A.raw.inventory&&A.raw.sales&&A.raw.linelist&&A.raw.wip}

function buildScaleSizes(){
  // Build scaleSizes from linelist + sales + inventory data (used internally for SKU matching)
  // Does NOT create or modify presMinsMeta — that is user-controlled only.
  const ll=A.raw.linelist,sales=A.raw.sales,inv=A.raw.inventory;
  if(!ll||!ll[0])return;
  const lSS=findCol(ll[0],['Size Scale']),lS=findCol(ll[0],['SKU']);
  const skuScale={};ll.forEach(r=>{skuScale[r[lS]]=r[lSS]||''});
  A.scaleSizes={};
  if(sales&&sales[0]){const sS=findCol(sales[0],['SKU']),sZ=findCol(sales[0],['Size']);sales.forEach(r=>{const sc=skuScale[r[sS]];if(sc&&r[sZ]){if(!A.scaleSizes[sc])A.scaleSizes[sc]=new Set();A.scaleSizes[sc].add(r[sZ])}})}
  if(inv&&inv[0]){const iS=findCol(inv[0],['SKU']),iZ=findCol(inv[0],['Size']);inv.forEach(r=>{const sc=skuScale[r[iS]];if(sc&&r[iZ]){if(!A.scaleSizes[sc])A.scaleSizes[sc]=new Set();A.scaleSizes[sc].add(r[iZ])}})}
  for(const s in A.scaleSizes){A.scaleSizes[s]=[...A.scaleSizes[s]].sort(ssort);A.scaleSizeCount[s]=A.scaleSizes[s].length}
  // Cache scaleSizes locally (best-effort; not persisted to cloud since it's derived)
  try{dbPut('config','scaleSizes',Object.fromEntries(Object.entries(A.scaleSizes).map(([k,v])=>[k,Array.isArray(v)?v:[...v]])))}catch(e){}
}

async function loadFromCloud(){
  // 1. Load CSV metadata + files
  let cloudCsvMeta={};
  try{cloudCsvMeta=await cloudListCSVMeta()}
  catch(err){console.error('cloudListCSVMeta failed:',err);return}
  for(const key of['inventory','sales','linelist','wip']){
    const meta=cloudCsvMeta[key];
    if(meta&&meta.storage_path){
      try{
        const text=await cloudDownloadCSV(meta.storage_path);
        A.rawCSV[key]=text;
        let hi=detectHeaderRow(text,key);
        A.raw[key]=parseCSV(text,hi,key==='linelist');
        A.uploadMeta[key]={rows:meta.row_count||A.raw[key].length,cols:meta.col_count||0,date:new Date(meta.updated_at).toLocaleString(),fileName:meta.filename||key+'.csv'};
        A.cloudMeta[key]=meta;
      }catch(err){
        console.error('Failed to load CSV',key,err);
        A.raw[key]=null;A.rawCSV[key]=null;
      }
    } else {
      A.raw[key]=null;A.rawCSV[key]=null;A.uploadMeta[key]=null;A.cloudMeta[key]=null;
    }
    updateChip(key);
  }
  // 2. Load Pres Mins
  try{
    const rows=await cloudListPresMins();
    A.presMins={};A.presMinsMeta={};A.pmMeta={};
    rows.forEach(r=>{
      A.presMinsMeta[r.scale_name]={div:r.division||'Mens',sizes:r.sizes||[]};
      A.presMins[r.scale_name]=r.mins||{};
      A.pmMeta[r.scale_name]={updated_by_name:r.updated_by_name,updated_by_email:r.updated_by_email,updated_at:r.updated_at};
    });
  }catch(err){
    console.error('cloudListPresMins failed:',err);
  }
  // 3. Rebuild derived caches
  A.scaleSizes={};A.scaleSizeCount={};
  if(allUp())buildScaleSizes();
  trySeasons();
}


function trySeasons(){
  const el=document.getElementById('s-area');if(!el)return;
  if(!allUp()){el.innerHTML='<div class="s-wait">Upload all 4 data sources to continue</div>';return}
  const ll=A.raw.linelist,sc=findCol(ll[0],['Season Code']);
  const dbCol=findCol(ll[0],['Total DTC Buy']);
  // Per season: total SKUs + count with non-zero DTC buy
  const totals={},withBuy={};
  ll.forEach(r=>{
    const s=r[sc]||'';if(!s)return;
    totals[s]=(totals[s]||0)+1;
    const buy=numP(r[dbCol]);
    if(buy>0)withBuy[s]=(withBuy[s]||0)+1;
  });
  A.seasons=Object.keys(totals).sort();
  let h='<div class="s-grid">';
  A.seasons.forEach(s=>{
    const tot=totals[s]||0,wb=withBuy[s]||0;
    h+='<div class="s-btn" onclick="goSeason(\''+esc(s)+'\')">'+
       '<div class="code">'+esc(s)+'</div>'+

       '<div class="ct ct-buy">SKUs with Buys: '+fmt(wb)+'</div>'+
       '</div>';
  });
  el.innerHTML=h+'</div>';
}

  c.wDC=findCol(wip[0],['New Expected in DC','Expected in DC']); // legacy fallback
  A.cols=c;

  const invI={};inv.forEach(r=>{const k=r[c.iS];if(!invI[k])invI[k]={};invI[k][r[c.iZ]]=(invI[k][r[c.iZ]]||0)+numP(r[c.iO])});
  // Hierarchical sales: total (DTC), Retail-only, Online-only
  const salI={},hS={},hSr={},hSo={};A.salSKU={};A.salSKURet={};A.salSKUOnline={};
  sales.forEach(r=>{
    const sku=r[c.sS],sz=r[c.sZ],u=numP(r[c.sU]);
    const lt=(r[c.sLT]||'').toLowerCase();
    const isOnline=lt.includes('online')||lt.includes('ecom')||lt==='online';
    const isRetail=lt.includes('retail')||lt==='retail';
    if(!salI[sku])salI[sku]={};salI[sku][sz]=(salI[sku][sz]||0)+u;
    A.salSKU[sku]=(A.salSKU[sku]||0)+u;
    if(isRetail)A.salSKURet[sku]=(A.salSKURet[sku]||0)+u;
    if(isOnline)A.salSKUOnline[sku]=(A.salSKUOnline[sku]||0)+u;
    const d=(r[c.sD]||'').toLowerCase(),ca=(r[c.sC]||'').toLowerCase(),sc=(r[c.sSC]||'').toLowerCase(),pr=(r[c.sSD]||'').toLowerCase();
    const keys=['prog|'+d+'|'+ca+'|'+sc+'|'+pr,'sub|'+d+'|'+ca+'|'+sc,'cat|'+d+'|'+ca,'div|'+d];
    keys.forEach(k=>{
      if(!hS[k])hS[k]={};hS[k][sz]=(hS[k][sz]||0)+u;
      if(isRetail){if(!hSr[k])hSr[k]={};hSr[k][sz]=(hSr[k][sz]||0)+u}
      if(isOnline){if(!hSo[k])hSo[k]={};hSo[k][sz]=(hSo[k][sz]||0)+u}
    });
  });
  A.hierSales=hS;A.hierSalesRet=hSr;A.hierSalesOnline=hSo;

  // ─── WIP / Pending Receipts ───
  // Per-SKU: { totalOrdered, bySize:{size:total}, byDate:[{date,size,ordered,daysOut}], byDateAgg:{date:{size:qty,total:n}} }
  const today=new Date();today.setHours(0,0,0,0);
  function parseWipDate(s){
    if(!s)return null;
    // MM/DD/YYYY format
    const m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(!m)return null;
    const d=new Date(parseInt(m[3]),parseInt(m[1])-1,parseInt(m[2]));
    d.setHours(0,0,0,0);return d;
  }
  function fmtDate(d){if(!d)return'';return(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear()}
  const wipI={};
  wip.forEach(r=>{
    // Status filter
    if(r[c.wPS]==='Dropped')return;
    if(r[c.wSt]==='Received')return;
    // Location filter — only DTC if column exists
    if(c.wLoc&&r[c.wLoc]&&r[c.wLoc]!=='DTC')return;
    // Date resolution: Master In DC > Target Delivery Date > legacy DC
    let dtStr='';
    if(c.wMDC&&r[c.wMDC]&&r[c.wMDC].trim()&&r[c.wMDC]!=='0')dtStr=r[c.wMDC];
    else if(c.wTDD&&r[c.wTDD]&&r[c.wTDD].trim())dtStr=r[c.wTDD];
    else if(c.wDC&&r[c.wDC])dtStr=r[c.wDC];
    const dt=parseWipDate(dtStr);
    // Skip past-dated receipts (even if status isn't "Received")
    if(dt&&dt<today)return;
    const sku=r[c.wS],sz=r[c.wZ],qty=numP(r[c.wO]);
    if(!sku||!sz||qty<=0)return;
    if(!wipI[sku])wipI[sku]={bySize:{},byDateAgg:{}};
    wipI[sku].bySize[sz]=(wipI[sku].bySize[sz]||0)+qty;
    const dKey=dt?fmtDate(dt):'TBD';
    if(!wipI[sku].byDateAgg[dKey])wipI[sku].byDateAgg[dKey]={_sortDate:dt||new Date(2099,0,1),sizes:{},total:0};
    wipI[sku].byDateAgg[dKey].sizes[sz]=(wipI[sku].byDateAgg[dKey].sizes[sz]||0)+qty;
    wipI[sku].byDateAgg[dKey].total+=qty;
  });

  A.skus={};
  ll.filter(r=>r[c.lSe]===A.activeSeason).forEach(r=>{
    const sku=r[c.lS],scale=r[c.lSS]||'';
    // ENFORCE: sizes come ONLY from the user-configured presMinsMeta. No data-derived fallback.
    let sizes=[];
    if(A.presMinsMeta[scale]&&A.presMinsMeta[scale].sizes)sizes=[...A.presMinsMeta[scale].sizes].sort(ssort);
    const stCt=numP(r[c.lSn]),dtcBuy=numP(r[c.lDB]);
    const retailBuy=c.lRB?numP(r[c.lRB]):0;
    const onlineBuy=c.lOB?numP(r[c.lOB]):0;
    // APS Final values may be decimal — preserve as float
    const apsRetail=c.lAPSr?(parseFloat(String(r[c.lAPSr]||'').replace(/[^0-9.\-]/g,''))||0):0;
    const apsOnline=c.lAPSo?(parseFloat(String(r[c.lAPSo]||'').replace(/[^0-9.\-]/g,''))||0):0;
    const sI=invI[sku]||{},sS=salI[sku]||{},wipRec=wipI[sku]||{bySize:{},byDateAgg:{}};
    let tOH=0,tSl=0,tWIP=0;const sd={};
    sizes.forEach(s=>{
      const oh=sI[s]||0,sl=sS[s]||0,wo=(wipRec.bySize&&wipRec.bySize[s])||0;
      sd[s]={onHand:oh,sales:sl,wipOrd:wo};
      tOH+=oh;tSl+=sl;tWIP+=wo;
    });
    let sType=dtcBuy===0?'nosize':(tOH===0&&tSl===0?'initials':'cf');
    const div=r[c.lDp]||'',cat=r[c.lCa]||'',sub=r[c.lSc]||'',prog=r[c.lSD]||'',dm=r[c.lDM]||'';
    A.skus[sku]={
      sku,season:A.activeSeason,division:div,category:cat,subcategory:sub,
      style:r[c.lSt]||'',styleDescription:prog,
      colorCode:r[c.lCC]||'',colorDescription:r[c.lCD]||'',
      sizeScale:scale,sizeCount:A.scaleSizeCount[scale]||sizes.length,
      dtcBuy,retailBuy,onlineBuy,
      apsRetail,apsOnline,apsTotal:apsRetail+apsOnline,
      storeCount:stCt,storeTier:r[c.lTr]||'',
      lifecycle:r[c.lLC]||'',commitCoding:r[c.lCm]||'',
      rollout:r[c.lRo]||'',pst:r[c.lPS]||'',deliveryMonth:dm,
      sizingType:sType,sizes,sizeData:sd,
      totalOH:tOH,totalSales:tSl,totalWIP:tWIP,
      skuSalesTotal:A.salSKU[sku]||0,
      skuSalesRetail:A.salSKURet[sku]||0,
      skuSalesOnline:A.salSKUOnline[sku]||0,
      wipByDate:wipRec.byDateAgg||{},
      _hk:{prog:'prog|'+div.toLowerCase()+'|'+cat.toLowerCase()+'|'+sub.toLowerCase()+'|'+prog.toLowerCase(),
           sub:'sub|'+div.toLowerCase()+'|'+cat.toLowerCase()+'|'+sub.toLowerCase(),
           cat:'cat|'+div.toLowerCase()+'|'+cat.toLowerCase(),
           div:'div|'+div.toLowerCase()}
    };
  });
}

// ═══ SIZE CURVE ═══
function buildCurve(rec,hierSource){
  // hierSource: A.hierSales (DTC, default), A.hierSalesRet (Retail), or A.hierSalesOnline (Online)
  const src=hierSource||A.hierSales;
  const eligible=new Set(rec.sizes),thresh=100*rec.sizeCount;
  const levels=[
    {key:rec._hk.prog,label:rec.styleDescription,level:'Program'},
    {key:rec._hk.sub,label:rec.subcategory,level:'Subcategory'},
    {key:rec._hk.cat,label:rec.category,level:'Category'},
    {key:rec._hk.div,label:rec.division,level:'Division'}
  ];
  const trail=[];
  for(const lv of levels){
    const sbs=src[lv.key];
    if(!sbs){trail.push({...lv,total:0,thresh,pass:false});continue}
    let total=0;const filt={};for(const s in sbs){if(eligible.has(s)){filt[s]=sbs[s];total+=sbs[s]}}
    if(total>=thresh){trail.push({...lv,total,thresh,pass:true});const curve={};rec.sizes.forEach(s=>{curve[s]=total>0?(filt[s]||0)/total:1/rec.sizes.length});return{curve,level:lv.level+' ('+lv.label+')',total,trail,acceptedKey:lv.key,acceptedLevel:lv.level,acceptedLabel:lv.label}}
    trail.push({...lv,total,thresh,pass:false});
  }
  const curve={};rec.sizes.forEach(s=>{curve[s]=1/rec.sizes.length});return{curve,level:'Even distribution',total:0,trail,acceptedKey:null};
}

function getPresMin(rec){
  const cfg=A.presMins[rec.sizeScale]||{};const fl={};
  rec.sizes.forEach(s=>{fl[s]=Math.ceil((cfg[s]!==undefined?cfg[s]:0)*rec.storeCount)});
  return fl;
}

function getPresMinRate(rec){
  const cfg=A.presMins[rec.sizeScale]||{};const r={};
  rec.sizes.forEach(s=>{r[s]=cfg[s]!==undefined?cfg[s]:0});return r;
}

function getPendingBeforeDelivery(rec){
  // Returns total pending receipts per size that arrive BEFORE this SKU's buy delivery
  const buyDelivery=getBuyDeliveryDate(rec);
  const result={};rec.sizes.forEach(s=>{result[s]=0});
  if(!rec.wipByDate)return result;
  for(const dKey in rec.wipByDate){
    const entry=rec.wipByDate[dKey];
    // Skip dates that are AFTER the buy delivery (those won't help BOP)
    if(buyDelivery&&entry._sortDate&&entry._sortDate>buyDelivery)continue;
    for(const s in entry.sizes){if(result[s]!==undefined)result[s]+=entry.sizes[s]}
  }
  return result;
}

function getBuyDeliveryDate(rec){
  // Convert delivery month + season year to a Date object
  if(!rec.deliveryMonth||!rec.season)return null;
  const base=rec.deliveryMonth.toLowerCase().replace(/_\d+$/,'');
  const mo=MONTH_MAP[base];if(!mo)return null;
  const yrMatch=rec.season.match(/(\d{2})$/);if(!yrMatch)return null;
  return new Date(2000+parseInt(yrMatch[1]),mo-1,1);
}

function projBOP(rec){
  const w=deliveryToWeeks(rec.deliveryMonth,rec.season);const bop={};
  const pendingBefore=getPendingBeforeDelivery(rec);
  rec.sizes.forEach(s=>{
    const oh=rec.sizeData[s].onHand;
    const pending=pendingBefore[s]||0;
    const wr=rec.sizeData[s].sales/52;
    bop[s]=Math.max(0,Math.round(oh+pending-wr*w));
  });
  bop._w=w;return bop;
}

// Inner helper: allocate a buy pool against a curve with a floor map. Returns per-size alloc.
function allocateBuy(rec,pool,curve,floors,ideals){
  const alloc={};
  if(pool<=0){rec.sizes.forEach(s=>{alloc[s]=0});return alloc}
  const floorSum=rec.sizes.reduce((a,s)=>a+(floors[s]||0),0);
  if(floorSum>=pool){
    rec.sizes.forEach(s=>{alloc[s]=Math.round((floors[s]||0)/floorSum*pool)});
  } else {
    rec.sizes.forEach(s=>{alloc[s]=floors[s]||0});
    let remaining=pool-floorSum;
    const want={};
    rec.sizes.forEach(s=>{
      const target=ideals?ideals[s]:Math.round(curve[s]*pool);
      want[s]=Math.max(0,target-(floors[s]||0));
    });
    const wantSum=Object.values(want).reduce((a,b)=>a+b,0);
    if(wantSum>0&&remaining>0){
      rec.sizes.forEach(s=>{const extra=Math.round(want[s]/wantSum*remaining);alloc[s]+=extra});
    }
    // Phase 1: reconcile preferring to keep the floor intact
    let allocTotal=rec.sizes.reduce((a,s)=>a+alloc[s],0);
    let diff=pool-allocTotal;
    while(diff!==0){
      const eligible=rec.sizes.filter(s=>diff>0||(alloc[s]>(floors[s]||0)));
      if(!eligible.length)break;
      if(diff>0){const best=eligible.reduce((a,b)=>curve[a]>=curve[b]?a:b);alloc[best]++;diff--}
      else{const best=eligible.reduce((a,b)=>(alloc[a]-(floors[a]||0))>=(alloc[b]-(floors[b]||0))?a:b);if(alloc[best]>(floors[best]||0)){alloc[best]--;diff++}else break}
    }
  }
  // Phase 2 (FINAL GUARANTEE): force the sum to match the pool exactly, even if it means
  // dipping a size below its floor. Total accuracy beats a 1u floor violation since the
  // user trusts the total to roundtrip cleanly through the export.
  let total=rec.sizes.reduce((a,s)=>a+alloc[s],0);
  let diff=pool-total;
  while(diff!==0&&rec.sizes.length){
    if(diff>0){
      // Need to add — bump the size with the highest curve weight
      const best=rec.sizes.reduce((a,b)=>curve[a]>=curve[b]?a:b);
      alloc[best]++;diff--;
    } else {
      // Need to subtract — pull from the size that's furthest above its floor;
      // if all are at/below floor, pull from the largest non-zero allocation
      const aboveFloor=rec.sizes.filter(s=>alloc[s]>(floors[s]||0));
      let target;
      if(aboveFloor.length){
        target=aboveFloor.reduce((a,b)=>(alloc[a]-(floors[a]||0))>=(alloc[b]-(floors[b]||0))?a:b);
      } else {
        // Fallback: pull from the size with the largest allocation (still > 0)
        const nonZero=rec.sizes.filter(s=>alloc[s]>0);
        if(!nonZero.length)break;
        target=nonZero.reduce((a,b)=>alloc[a]>=alloc[b]?a:b);
      }
      alloc[target]--;diff++;
    }
  }
  return alloc;
}

// Compute flow split for the SKU's allocation
// Returns: { count, splits: [{label, units, offset, sizeBreak, ...meta}], math: { perSizeFloor, globalFloorTotal, ...} }
function computeFlows(rec,totalPool,combinedAlloc,retailCurve,onlineCurve){
  const result={
    count:1,
    splits:[{label:'Global',units:totalPool,offset:0,sizeBreak:{...combinedAlloc}}],
    math:null,
    eligible:false
  };
  if(totalPool<1200){result.reason='Total DTC < 1,200u';return result}
  const isInitials=rec.sizingType==='initials';
  const pm=getPresMin(rec); // per-size pres min × stores (already ceiling rounded)
  const apsR=rec.apsRetail||0,apsO=rec.apsOnline||0;
  const ONLINE_FLAT=rec.onlineBuy>0?5:0;

  // Per-size global minimum need (Initials math)
  // = retail pres min units + online flat (5) + 6 weeks retail APS by retail curve % + 6 weeks online APS by online curve %
  const perSizeFloor={};
  let globalFloorTotal=0;
  const stCt=rec.storeCount||0;
  rec.sizes.forEach(s=>{
    const presMinUnits=pm[s]||0;
    const onlineFlat=ONLINE_FLAT;
    // Retail APS is per-store, so total weekly retail rate = APS × stores
    const retailWos=apsR*stCt*6*(retailCurve[s]||0);
    // Online APS is already a global figure (no per-store multiplier)
    const onlineWos=apsO*6*(onlineCurve[s]||0);
    const need=Math.ceil(presMinUnits+onlineFlat+retailWos+onlineWos);
    perSizeFloor[s]={presMinUnits,onlineFlat,retailWos:Math.round(retailWos*10)/10,onlineWos:Math.round(onlineWos*10)/10,total:need};
    globalFloorTotal+=need;
  });

  // For CF: use the simpler rule (no per-size floor enforcement; OH covers presentation)
  if(!isInitials){
    let splits;
    if(totalPool>=2000)splits=[0.4,0.3,0.3];
    else splits=[0.6,0.4];
    const rawUnits=splits.map(p=>Math.round(totalPool*p));
    const sum=rawUnits.reduce((a,b)=>a+b,0);
    rawUnits[0]+=(totalPool-sum);
    // Validate: each non-Global flow ≥ 300
    if(!rawUnits.slice(1).every(u=>u>=300)){result.reason='CF flow(s) below 300u';return result}
    result.eligible=true;result.count=rawUnits.length;
    result.splits=rawUnits.map((u,i)=>{
      const ratio=totalPool>0?u/totalPool:0;
      const sb={};rec.sizes.forEach(s=>{sb[s]=Math.round((combinedAlloc[s]||0)*ratio)});
      // Reconcile so flow total matches u
      const subSum=rec.sizes.reduce((a,sz)=>a+sb[sz],0);
      const diff=u-subSum;
      if(diff!==0&&rec.sizes.length){const ms=rec.sizes.reduce((a,b)=>sb[a]>=sb[b]?a:b);sb[ms]+=diff}
      return{label:i===0?'Global':'Flow '+i,units:u,offset:i,sizeBreak:sb};
    });
    result.math={type:'CF',percentages:splits,totalPool};
    return result;
  }

  // INITIALS path: Global must minimally cover globalFloorTotal
  if(globalFloorTotal>totalPool){
    result.reason='Global floor ('+globalFloorTotal+'u) exceeds total pool';return result;
  }
  let remaining=totalPool-globalFloorTotal;
  // Determine how many flows we can support (each ≥ 300)
  let numFlows=0;
  if(remaining>=600)numFlows=2;
  else if(remaining>=300)numFlows=1;
  if(numFlows===0){result.reason='Remaining after global floor ('+remaining+'u) too small to flow';return result}

  // Target Global percentage based on total split count
  // If numFlows=2 → target 40% Global; if numFlows=1 → target 60% Global
  const targetGlobalPct=numFlows===2?0.4:0.6;
  const targetGlobalUnits=Math.round(targetGlobalPct*totalPool);

  let globalUnits=globalFloorTotal;
  if(globalUnits<targetGlobalUnits){
    // Bump global up to baseline target
    const extra=targetGlobalUnits-globalUnits;
    if(remaining-extra>=numFlows*300){
      globalUnits=targetGlobalUnits;
      remaining=totalPool-globalUnits;
    }
    // else: can't bump without violating 300 floor — leave at floor
  }
  // Distribute remaining across numFlows
  let flowUnits;
  if(numFlows===2){
    // Split remaining as evenly as possible
    const half=Math.floor(remaining/2);
    flowUnits=[half,remaining-half];
    // Validate both ≥ 300; if not, demote to 1 flow
    if(flowUnits[0]<300||flowUnits[1]<300){
      numFlows=1;flowUnits=[remaining];
    }
  } else {flowUnits=[remaining]}

  if(numFlows===1&&flowUnits[0]<300){result.reason='Single flow below 300u';return result}

  // Build size break for Global (hit per-size floor first, then distribute by combined curve)
  const globalSb={};
  rec.sizes.forEach(s=>{globalSb[s]=perSizeFloor[s].total});
  let globalAssigned=globalFloorTotal;
  // Distribute the bump-up extra (if any) by combined alloc curve
  const bumpExtra=globalUnits-globalFloorTotal;
  if(bumpExtra>0){
    const allocSum=rec.sizes.reduce((a,s)=>a+(combinedAlloc[s]||0),0);
    if(allocSum>0){
      rec.sizes.forEach(s=>{
        const share=Math.round((combinedAlloc[s]||0)/allocSum*bumpExtra);
        globalSb[s]+=share;
      });
      // Reconcile
      const sum=rec.sizes.reduce((a,s)=>a+globalSb[s],0);
      const diff=globalUnits-sum;
      if(diff!==0&&rec.sizes.length){const ms=rec.sizes.reduce((a,b)=>globalSb[a]>=globalSb[b]?a:b);globalSb[ms]+=diff}
    }
  }

  // Flow size breaks: distribute by combined alloc curve, scaled to flow units
  const flowSplits=[{label:'Global',units:globalUnits,offset:0,sizeBreak:globalSb}];
  flowUnits.forEach((u,idx)=>{
    const sb={};
    const allocSum=rec.sizes.reduce((a,s)=>a+(combinedAlloc[s]||0),0);
    if(allocSum>0){
      rec.sizes.forEach(s=>{sb[s]=Math.round((combinedAlloc[s]||0)/allocSum*u)});
    } else rec.sizes.forEach(s=>{sb[s]=Math.round(u/rec.sizes.length)});
    const sum=rec.sizes.reduce((a,sz)=>a+sb[sz],0);
    const diff=u-sum;
    if(diff!==0&&rec.sizes.length){const ms=rec.sizes.reduce((a,b)=>sb[a]>=sb[b]?a:b);sb[ms]+=diff}
    flowSplits.push({label:'Flow '+(idx+1),units:u,offset:idx+1,sizeBreak:sb});
  });

  result.eligible=true;result.count=flowSplits.length;result.splits=flowSplits;
  result.math={
    type:'Initials',
    perSizeFloor,
    globalFloorTotal,
    targetGlobalPct,
    targetGlobalUnits,
    globalUnits,
    bumpedAboveFloor:globalUnits>globalFloorTotal,
    apsRetail:apsR,apsOnline:apsO,
    totalPool,
    onlineFlatPerSize:ONLINE_FLAT
  };
  return result;
}

function computeAlloc(rec){
  if(!rec||rec.dtcBuy<=0||!rec.sizes.length)return null;
  const pool=rec.dtcBuy;
  const retailPool=Math.max(0,rec.retailBuy||0);
  // If channel split data not available, treat the whole pool as retail (legacy behavior)
  let onlinePool;
  if((rec.retailBuy||0)+(rec.onlineBuy||0)===0){
    onlinePool=0;
    // Fall back: treat entire DTC as retail
  } else {
    onlinePool=Math.max(0,rec.onlineBuy||0);
  }
  // Effective retail pool: if channel data exists, use it; otherwise use full DTC as retail
  const useChannelSplit=(rec.retailBuy||0)+(rec.onlineBuy||0)>0;
  const effRetailPool=useChannelSplit?retailPool:pool;
  const effOnlinePool=useChannelSplit?onlinePool:0;

  const ovr=A.overrides[rec.sku]||{};
  const pmRate=getPresMinRate(rec);
  const pm=getPresMin(rec);
  // Online flat floor: 5 per size, regardless of pres mins config
  // BUT: only applies when retail buy > 0 (i.e. SKU is sold across all stores)
  // If retail buy is 0, online is the only channel, but flat 5 still makes sense as a per-size minimum
  const ONLINE_FLAT_PRES=5;
  const onlineFloor={};
  rec.sizes.forEach(s=>{onlineFloor[s]=effOnlinePool>0?ONLINE_FLAT_PRES:0});

  // ── BOP / Pending receipts (apply to RETAIL only) ──
  const pendingBefore=getPendingBeforeDelivery(rec);
  const totalPending=Object.values(pendingBefore).reduce((a,b)=>a+b,0);
  const useBOP=rec.totalOH>0||totalPending>0;
  let bop={},wtr=0;
  if(useBOP){const bp=projBOP(rec);wtr=bp._w;delete bp._w;bop=bp}
  const totalBOP=useBOP?Object.values(bop).reduce((a,b)=>a+b,0):0;

  // ── Build channel curves first (used by both alloc and BOP split) ──
  const retailCurveResult=buildCurve(rec,A.hierSalesRet);
  const onlineCurveResult=buildCurve(rec,A.hierSalesOnline);

  // ── BOP allocation between channels ──
  // BOP is warehouse-level (untagged). Split it between channels by the buy pool ratio
  // so each channel can run its own BOP-aware gap-fill against its own curve.
  const totalChannelPool=effRetailPool+effOnlinePool;
  const retailBopShare=totalChannelPool>0?effRetailPool/totalChannelPool:1;
  const onlineBopShare=totalChannelPool>0?effOnlinePool/totalChannelPool:0;
  const retailBop={},onlineBop={};
  rec.sizes.forEach(s=>{
    const total=useBOP?(bop[s]||0):0;
    retailBop[s]=Math.round(total*retailBopShare);
    onlineBop[s]=total-retailBop[s]; // remainder ensures retailBop+onlineBop = total exactly
  });

  // ── Retail allocation (BOP-aware) ──
  const retailCurve=retailCurveResult.curve;
  const retailIdeals={};
  const retailBopTotal=rec.sizes.reduce((a,s)=>a+retailBop[s],0);
  const retailTotalTgt=retailBopTotal+effRetailPool;
  rec.sizes.forEach(s=>{retailIdeals[s]=Math.round(retailCurve[s]*retailTotalTgt)});
  // Effective retail floor: max(0, presMin - retail's share of BOP)
  const retailFloor={};
  rec.sizes.forEach(s=>{retailFloor[s]=effRetailPool>0?Math.max(0,(pm[s]||0)-retailBop[s]):0});
  // Buy should fill the gap to ideal (after subtracting retail's BOP share)
  const retailIdealMinusBop={};
  rec.sizes.forEach(s=>{retailIdealMinusBop[s]=Math.max(0,retailIdeals[s]-retailBop[s])});
  const retailAlloc=allocateBuy(rec,effRetailPool,retailCurve,retailFloor,retailIdealMinusBop);

  // ── Online allocation (BOP-aware) ──
  const onlineCurve=onlineCurveResult.curve;
  const onlineIdeals={};
  const onlineBopTotal=rec.sizes.reduce((a,s)=>a+onlineBop[s],0);
  const onlineTotalTgt=onlineBopTotal+effOnlinePool;
  rec.sizes.forEach(s=>{onlineIdeals[s]=Math.round(onlineCurve[s]*onlineTotalTgt)});
  const onlineIdealMinusBop={};
  rec.sizes.forEach(s=>{onlineIdealMinusBop[s]=Math.max(0,onlineIdeals[s]-onlineBop[s])});
  const onlineAlloc=allocateBuy(rec,effOnlinePool,onlineCurve,onlineFloor,onlineIdealMinusBop);

  // ── Combined DTC alloc ──
  const alloc={};
  rec.sizes.forEach(s=>{alloc[s]=(retailAlloc[s]||0)+(onlineAlloc[s]||0)});

  // Apply manual overrides AFTER channel split (overrides target the combined size break)
  rec.sizes.forEach(s=>{if(ovr[s]!==undefined)alloc[s]=ovr[s]});

  // ── Curve sales (DTC, Retail, Online) at the level the curve resolved to ──
  // Use the DTC curve trail for the primary "Curve Sales" display
  const dtcCurveResult=buildCurve(rec,A.hierSales);
  const dtcCurveSales={};
  if(dtcCurveResult.acceptedKey&&A.hierSales[dtcCurveResult.acceptedKey]){
    const hs=A.hierSales[dtcCurveResult.acceptedKey];
    rec.sizes.forEach(s=>{dtcCurveSales[s]=hs[s]||0});
  } else rec.sizes.forEach(s=>{dtcCurveSales[s]=0});
  const retailCurveSales={};
  if(retailCurveResult.acceptedKey&&A.hierSalesRet[retailCurveResult.acceptedKey]){
    const hs=A.hierSalesRet[retailCurveResult.acceptedKey];
    rec.sizes.forEach(s=>{retailCurveSales[s]=hs[s]||0});
  } else rec.sizes.forEach(s=>{retailCurveSales[s]=0});
  const onlineCurveSales={};
  if(onlineCurveResult.acceptedKey&&A.hierSalesOnline[onlineCurveResult.acceptedKey]){
    const hs=A.hierSalesOnline[onlineCurveResult.acceptedKey];
    rec.sizes.forEach(s=>{onlineCurveSales[s]=hs[s]||0});
  } else rec.sizes.forEach(s=>{onlineCurveSales[s]=0});

  // ── Flows: applied to combined DTC pool ──
  const flows=computeFlows(rec,pool,alloc,retailCurve,onlineCurve);
  const flowSizeBreaks=flows.splits; // already include sizeBreak field

  // For backward compat with existing render code:
  const cr=dtcCurveResult; // primary curve = DTC curve
  const ideal={};rec.sizes.forEach(s=>{ideal[s]=retailIdeals[s]+onlineIdeals[s]});

  return{
    alloc,curve:dtcCurveResult.curve,cr,pm,pmRate,
    bop:useBOP?bop:null,wtr:useBOP?wtr:null,ideal:useBOP?ideal:null,
    pool,curveSales:dtcCurveSales,useBOP,
    // New channel-aware fields:
    retailAlloc,onlineAlloc,
    retailCurve,onlineCurve,
    retailCurveSales,onlineCurveSales,
    retailCurveResult,onlineCurveResult,
    retailPool:effRetailPool,onlinePool:effOnlinePool,
    useChannelSplit,
    flows,flowSizeBreaks
  };
}

function exportCSV(){
  const acc=Object.keys(A.accepted);if(!acc.length)return;

  // SIZE_COLS now includes a section tag for each column.
  // section: 'kidsOS' (Kids & OS — sizes 2T-XXXL plus shared 6/8/10 for kids), 'mw' (Mens & Womens)
  // For the previously-duplicated sizes (6, 8, 10), we keep a single canonical column for each
  // and tag it as 'mw' (since adult women's 6/8/10 is the more common use case in apparel).
  // Kids' 6/8/10 sizes are not represented separately in this dataset; if needed later, suffix would distinguish.
  // We rename women's "00"/"0" to "00W"/"0W" so Excel won't render them indistinguishably from numeric "0".
  const SIZE_DEFS=[
    // Kids & OS
    {col:'2T',sec:'kidsOS'},{col:'3T',sec:'kidsOS'},{col:'4T',sec:'kidsOS'},{col:'5',sec:'kidsOS'},{col:'OS',sec:'kidsOS'},
    // Mens & Womens — letter sizes
    {col:'XXS',sec:'mw'},{col:'XS',sec:'mw'},{col:'S',sec:'mw'},{col:'M',sec:'mw'},{col:'L',sec:'mw'},{col:'XL',sec:'mw'},{col:'XXL',sec:'mw'},{col:'XXXL',sec:'mw'},
    {col:'XS/S',sec:'mw'},{col:'S/M',sec:'mw'},{col:'M/L',sec:'mw'},{col:'L/XL',sec:'mw'},
    {col:'MT',sec:'mw'},{col:'LT',sec:'mw'},{col:'XLT',sec:'mw'},{col:'XXLT',sec:'mw'},
    // Mens & Womens — Womens dress sizes (renamed to avoid Excel's leading-zero collapse on 00/0)
    {col:'00W',sec:'mw',match:'00'},{col:'0W',sec:'mw',match:'0'},
    {col:'2',sec:'mw'},{col:'4',sec:'mw'},{col:'6',sec:'mw'},{col:'8',sec:'mw'},{col:'10',sec:'mw'},
    {col:'12',sec:'mw'},{col:'14',sec:'mw'},{col:'16',sec:'mw'},
    // Mens & Womens — numeric (waist/etc.)
    {col:'24',sec:'mw'},{col:'25',sec:'mw'},{col:'26',sec:'mw'},{col:'27',sec:'mw'},{col:'28',sec:'mw'},{col:'29',sec:'mw'},
    {col:'30',sec:'mw'},{col:'31',sec:'mw'},{col:'32',sec:'mw'},{col:'33',sec:'mw'},{col:'34',sec:'mw'},{col:'35',sec:'mw'},
    {col:'36',sec:'mw'},{col:'38',sec:'mw'},{col:'40',sec:'mw'},{col:'42',sec:'mw'},
    // Tall variants
    {col:'30T',sec:'mw'},{col:'32T',sec:'mw'},{col:'34T',sec:'mw'},{col:'36T',sec:'mw'},{col:'38T',sec:'mw'},{col:'40T',sec:'mw'},
    // Mens denim WxL combos
    {col:'28WX30L',sec:'mw'},{col:'29WX30L',sec:'mw'},{col:'30WX30L',sec:'mw'},{col:'31WX30L',sec:'mw'},{col:'32WX30L',sec:'mw'},{col:'33WX30L',sec:'mw'},{col:'34WX30L',sec:'mw'},{col:'35WX30L',sec:'mw'},{col:'36WX30L',sec:'mw'},{col:'38WX30L',sec:'mw'},{col:'40WX30L',sec:'mw'},{col:'42WX30L',sec:'mw'},
    {col:'28WX32L',sec:'mw'},{col:'29WX32L',sec:'mw'},{col:'30WX32L',sec:'mw'},{col:'31WX32L',sec:'mw'},{col:'32WX32L',sec:'mw'},{col:'33WX32L',sec:'mw'},{col:'34WX32L',sec:'mw'},{col:'35WX32L',sec:'mw'},{col:'36WX32L',sec:'mw'},{col:'38WX32L',sec:'mw'},{col:'40WX32L',sec:'mw'},{col:'42WX32L',sec:'mw'},
    {col:'28WX34L',sec:'mw'},{col:'29WX34L',sec:'mw'},{col:'30WX34L',sec:'mw'},{col:'31WX34L',sec:'mw'},{col:'32WX34L',sec:'mw'},{col:'33WX34L',sec:'mw'},{col:'34WX34L',sec:'mw'},{col:'35WX34L',sec:'mw'},{col:'36WX34L',sec:'mw'},{col:'38WX34L',sec:'mw'},{col:'40WX34L',sec:'mw'},{col:'42WX34L',sec:'mw'},
    {col:'1XL',sec:'mw'},{col:'2XL',sec:'mw'},{col:'3XL',sec:'mw'},{col:'4XL',sec:'mw'},{col:'5XL',sec:'mw'},
    {col:'1XLT',sec:'mw'},{col:'2XLT',sec:'mw'},{col:'3XLT',sec:'mw'},{col:'4XLT',sec:'mw'},
    {col:'40W36L',sec:'mw'},{col:'42W32L',sec:'mw'},{col:'42W34L',sec:'mw'},{col:'44W30L',sec:'mw'},{col:'44W32L',sec:'mw'},{col:'44W34L',sec:'mw'},
    {col:'46W30L',sec:'mw'},{col:'46W32L',sec:'mw'},{col:'48W30L',sec:'mw'},{col:'48W32L',sec:'mw'},{col:'50W30L',sec:'mw'},{col:'52W30L',sec:'mw'},
    {col:'36_',sec:'mw'},{col:'38_',sec:'mw'},{col:'40_',sec:'mw'},{col:'42_',sec:'mw'},{col:'44_',sec:'mw'},{col:'46_',sec:'mw'},{col:'48_',sec:'mw'},{col:'50_',sec:'mw'}
  ];
  const SIZE_COLS=SIZE_DEFS.map(d=>d.col);

  // Info columns (everything before size columns)
  const INFO_COLS=['SIZING TYPE','Year','Season Code','Department','SKU','Location','Delivery','Customer','From Sales Tier','Sales Tier','Sizing Tab Total','Unit Variance','Total'];

  // Section header row: Info | Kids & OS | Mens & Womens
  const sectionRow=[];
  INFO_COLS.forEach(()=>sectionRow.push('Info'));
  SIZE_DEFS.forEach(d=>sectionRow.push(d.sec==='kidsOS'?'Kids & OS':'Mens & Womens'));

  // Header row
  const headerRow=[...INFO_COLS,...SIZE_COLS];

  const linesGlobal=[sectionRow.join(','),headerRow.join(',')];
  const linesFlows=[sectionRow.join(','),headerRow.join(',')];

  const yrMatch=A.activeSeason.match(/(\d{2})$/);
  const year=yrMatch?'20'+yrMatch[1]:'2026';

  function makeRow(r,sku,sizeMap,total,salesTier,delivery){
    const tl=r.sizingType==='initials'?'Initials PO':'CF PO';
    // Determine which division-group this SKU belongs to; populate only that section's columns.
    // 'Kids & OS' is for Kids/OS sizes. 'Mens & Womens' is for adult Mens/Womens.
    // Right now we don't size kids items (per user spec), so all output goes into 'mw' columns.
    // If a SKU's division is Mens, Womens, or anything not explicitly Kids/Childrens, populate mw only.
    const divLower=(r.division||'').toLowerCase();
    const isKidsLike=divLower.includes('kid')||divLower.includes('children')||divLower.includes('child');
    const isOSLike=(r.sizes||[]).some(s=>s==='OS');
    const sizeVals=SIZE_DEFS.map(def=>{
      // Match the SKU's actual size key against this column
      // Use def.match if provided (renamed columns like 00W → match '00'), otherwise def.col
      const lookupKey=def.match!==undefined?def.match:def.col;
      const matchedSku=Object.keys(sizeMap).find(k=>k.toUpperCase()===String(lookupKey).toUpperCase());
      if(!matchedSku)return '';
      // Section gating: only populate columns belonging to this SKU's section
      if(def.sec==='kidsOS'&&!isKidsLike&&!isOSLike)return '';
      if(def.sec==='mw'&&isKidsLike&&!isOSLike)return '';
      return sizeMap[matchedSku]||'';
    });
    // Sizing Tab Total + Unit Variance left blank — Linelist computes these on import
    const row=[tl,year,A.activeSeason,r.division,sku,'DTC',delivery,'','Global',salesTier,'','',total,...sizeVals];
    return row.map(v=>typeof v==='string'&&v.includes(',')?'"'+v+'"':v).join(',');
  }

  acc.forEach(sku=>{
    const r=A.skus[sku];if(!r||r.dtcBuy<=0)return;
    const res=computeAlloc(r);if(!res)return;
    const total=r.sizes.reduce((a,s)=>a+(res.alloc[s]||0),0);
    const sizeMap={};r.sizes.forEach(s=>{sizeMap[s]=res.alloc[s]||0});
    const baseDelivery=r.deliveryMonth||'';
    // Tab 1 (Global): single row with full quantity
    linesGlobal.push(makeRow(r,sku,sizeMap,total,'Global',baseDelivery));
    // Tab 2 (Flows): one row per flow split (Global + Flow 1 + Flow 2 if applicable)
    if(res.flows.count>1&&res.flowSizeBreaks){
      res.flowSizeBreaks.forEach(fb=>{
        const flowDelivery=shiftDeliveryMonth(baseDelivery,fb.offset);
        linesFlows.push(makeRow(r,sku,fb.sizeBreak,fb.units,fb.label,flowDelivery));
      });
    } else {
      linesFlows.push(makeRow(r,sku,sizeMap,total,'Global',baseDelivery));
    }
  });

  // Download both files synchronously within the same user-activation window.
  function downloadCSV(text,filename){
    const blob=new Blob([text],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  downloadCSV(linesGlobal.join('\n'),'PO_Sizing_'+A.activeSeason+'_Global.csv');
  downloadCSV(linesFlows.join('\n'),'PO_Sizing_'+A.activeSeason+'_Flows.csv');
}

  const main=document.getElementById('main-area');
  try{
    if(A.module==='presmins'){renderPresMins(main);return}
    if(A.module==='datasources'){renderDataSources(main);return}
    if(A.view==='detail'&&A.selectedSKU&&A.skus[A.selectedSKU]){
      renderDetail(main,A.skus[A.selectedSKU]);

      if(A.flowsModalSku&&A.skus[A.flowsModalSku]){
        const overlay=document.createElement('div');
        overlay.id='flows-modal-overlay';
        overlay.innerHTML=renderFlowsModal(A.skus[A.flowsModalSku]);
        main.appendChild(overlay);
      }
      return;
    }
    renderGrid(main);
  }catch(err){

    main.innerHTML='<div style="padding:24px;background:var(--wh);border:1px solid var(--red);border-radius:var(--rl);margin:20px"><div style="font-weight:700;color:var(--red);margin-bottom:8px">Render error</div><div style="font-family:var(--mono);font-size:11px;color:var(--txt2);white-space:pre-wrap">'+esc(err.message+'\n\n'+err.stack)+'</div><button class="btn btn-g btn-sm" style="margin-top:12px" onclick="goGrid()">Back to grid</button></div>';
  }
}

// ═══ FLOWS MODAL ═══
function renderFlowsModal(rec){
  const res=computeAlloc(rec);
  if(!res||!res.flows||res.flows.count<=1)return '';
  const{flows,pool,retailCurve,onlineCurve}=res;
  const m=flows.math||{};
  const isInitials=rec.sizingType==='initials';

  // Per-flow cards with delivery date + size table
  let flowsHtml='';
  flows.splits.forEach(sp=>{
    const flowDate=shiftDeliveryMonth(rec.deliveryMonth,sp.offset);
    const pct=pool>0?Math.round(sp.units/pool*100):0;
    let sizeRows='';
    rec.sizes.forEach(s=>{
      sizeRows+='<tr><td class="fm-sz">'+esc(s)+'</td><td class="fm-qty">'+fmt(sp.sizeBreak[s]||0)+'</td></tr>';
    });
    flowsHtml+='<div class="fm-flow"><div class="fm-flow-hdr">'+
      '<div class="fm-flow-name">'+esc(sp.label)+'</div>'+
      '<div class="fm-flow-date">'+esc(flowDate||'—')+'</div>'+
      '</div>'+
      '<div class="fm-flow-stats">'+
        '<span class="fm-flow-tot">'+fmt(sp.units)+' units</span>'+
        '<span class="fm-flow-pct">'+pct+'% of pool</span>'+
      '</div>'+
      '<table class="fm-tbl"><thead><tr><th>Size</th><th>Qty</th></tr></thead><tbody>'+sizeRows+'</tbody></table>'+
    '</div>';
  });

  // Math section — explain how Global was computed
  let mathHtml='';
  if(isInitials&&m.perSizeFloor){
    let perSizeRows='';
    const stCt=rec.storeCount||0;
    rec.sizes.forEach(s=>{
      const f=m.perSizeFloor[s];
      const retailCurvePct=Math.round((retailCurve[s]||0)*1000)/10;
      const onlineCurvePct=Math.round((onlineCurve[s]||0)*1000)/10;
      perSizeRows+='<tr>'+
        '<td class="fm-sz">'+esc(s)+'</td>'+
        '<td class="fm-num">'+fmt(f.presMinUnits)+'</td>'+
        '<td class="fm-num">'+f.onlineFlat+'</td>'+
        '<td class="fm-num">'+f.retailWos.toFixed(1)+' <span class="fm-sub">('+m.apsRetail.toFixed(1)+'×'+stCt+'×6×'+retailCurvePct+'%)</span></td>'+
        '<td class="fm-num">'+f.onlineWos.toFixed(1)+' <span class="fm-sub">('+m.apsOnline.toFixed(1)+'×6×'+onlineCurvePct+'%)</span></td>'+
        '<td class="fm-num fm-tot">'+f.total+'</td>'+
        '</tr>';
    });
    mathHtml='<div class="fm-math"><div class="fm-math-hdr">Global Floor Calculation (Initials)</div>'+
      '<div class="fm-math-desc">Each size needs: <b>retail pres min</b> + <b>online flat 5</b> + <b>(Retail APS × stores) × 6 × retail curve%</b> + <b>Online APS × 6 × online curve%</b></div>'+
      '<table class="fm-math-tbl"><thead><tr>'+
      '<th>Size</th><th>Retail Pres Min</th><th>Online Flat</th><th>Retail WoS</th><th>Online WoS</th><th>Total Need</th>'+
      '</tr></thead><tbody>'+perSizeRows+'</tbody></table>'+
      '<div class="fm-math-summary">'+
        '<div><span class="fm-summary-lbl">Sum of per-size needs:</span> <span class="fm-summary-val">'+fmt(m.globalFloorTotal)+'u</span></div>'+
        '<div><span class="fm-summary-lbl">Target Global %:</span> <span class="fm-summary-val">'+Math.round(m.targetGlobalPct*100)+'% × '+fmt(pool)+'u = '+fmt(m.targetGlobalUnits)+'u</span></div>'+
        '<div><span class="fm-summary-lbl">Final Global:</span> <span class="fm-summary-val">'+fmt(m.globalUnits)+'u'+(m.bumpedAboveFloor?' <span class="fm-bump">(bumped above floor to baseline %)</span>':' <span class="fm-bump">(at minimum floor)</span>')+'</span></div>'+
        '<div><span class="fm-summary-lbl">Remaining to flow:</span> <span class="fm-summary-val">'+fmt(pool-m.globalUnits)+'u</span></div>'+
      '</div>'+
    '</div>';
  } else if(m.type==='CF'){
    mathHtml='<div class="fm-math"><div class="fm-math-hdr">CF Flow Split</div>'+
      '<div class="fm-math-desc">CF SKUs split based on total pool size:</div>'+
      '<div class="fm-math-summary">'+
        '<div><span class="fm-summary-lbl">Total Pool:</span> <span class="fm-summary-val">'+fmt(pool)+'u</span></div>'+
        '<div><span class="fm-summary-lbl">Split Rule:</span> <span class="fm-summary-val">'+(pool>=2000?'40 / 30 / 30 (≥2000u)':'60 / 40 (1200–1999u)')+'</span></div>'+
      '</div></div>';
  }

  return '<div class="fm-backdrop" onclick="closeFlowsModal()"></div>'+
    '<div class="fm-panel" onclick="event.stopPropagation()">'+
      '<div class="fm-hdr"><div class="fm-title">Flows · '+esc(rec.sku)+'</div>'+
        '<div class="fm-subtitle">'+esc(rec.styleDescription||'')+(rec.colorDescription?' · '+esc(rec.colorDescription):'')+' · '+fmt(pool)+'u total · base delivery '+esc(rec.deliveryMonth||'—')+'</div>'+
        '<button class="fm-close" onclick="closeFlowsModal()" title="Close">×</button>'+
      '</div>'+
      '<div class="fm-body">'+
        '<div class="fm-flows-grid">'+flowsHtml+'</div>'+
        mathHtml+
      '</div>'+
    '</div>';
}

// ═══ GRID ═══
function getFiltered(){
  let list=Object.values(A.skus).filter(r=>r.sizingType!=='nosize');const f=A.filters;
  if(f.type!=='All')list=list.filter(r=>r.sizingType===f.type);
  if(f.division!=='All')list=list.filter(r=>r.division===f.division);
  if(f.category!=='All')list=list.filter(r=>r.category===f.category);
  if(f.subcategory!=='All')list=list.filter(r=>r.subcategory===f.subcategory);
  if(f.sizeScale&&f.sizeScale!=='All')list=list.filter(r=>r.sizeScale===f.sizeScale);
  if(f.commitCoding&&f.commitCoding!=='All'){
    if(f.commitCoding==='—')list=list.filter(r=>!(r.commitCoding||'').trim());
    else list=list.filter(r=>(r.commitCoding||'')===f.commitCoding);
  }
  if(f.ssConfigured&&f.ssConfigured!=='All'){
    const want=f.ssConfigured==='Configured';
    list=list.filter(r=>{
      // A scale is configured only if it exists in presMinsMeta AND has at least one size
      const scale=r.sizeScale||'';
      const meta=scale?A.presMinsMeta[scale]:null;
      const sizes=meta&&meta.sizes;
      const isConfigured=Array.isArray(sizes)&&sizes.length>0;
      return want===isConfigured;
    });
  }
  if(f.storeCount&&f.storeCount!=='All'){
    if(f.storeCount==='0')list=list.filter(r=>r.storeCount===0);
    else if(f.storeCount==='1-25')list=list.filter(r=>r.storeCount>=1&&r.storeCount<=25);
    else if(f.storeCount==='26-50')list=list.filter(r=>r.storeCount>=26&&r.storeCount<=50);
    else if(f.storeCount==='51-90')list=list.filter(r=>r.storeCount>=51&&r.storeCount<=90);
    else if(f.storeCount==='91+')list=list.filter(r=>r.storeCount>=91);
  }
  if(f.accepted&&f.accepted!=='All'){
    if(f.accepted==='Accepted')list=list.filter(r=>!!A.accepted[r.sku]);
    else if(f.accepted==='Pending')list=list.filter(r=>!A.accepted[r.sku]);
  }
  if(A.searchTerm){const st=A.searchTerm.toLowerCase();list=list.filter(r=>r.sku.toLowerCase().includes(st)||r.styleDescription.toLowerCase().includes(st)||r.colorDescription.toLowerCase().includes(st))}
  const sk=A.sortKey;const dir=A.sortDir==='asc'?1:-1;
  // For sized sort: compute sized once per SKU and cache on the record (cleared when filters re-render)
  if(sk==='sized'){
    list.forEach(r=>{
      if(r._sizedCache===undefined){
        const meta=A.presMinsMeta[r.sizeScale];
        const pmConfigured=!!(meta&&Array.isArray(meta.sizes)&&meta.sizes.length>0);
        let sizedTotal=0;
        if(pmConfigured&&r.sizes&&r.sizes.length){
          try{const res=computeAlloc(r);if(res&&res.alloc)sizedTotal=r.sizes.reduce((a,s)=>a+(res.alloc[s]||0),0)}catch(e){}
        }
        r._sizedCache=sizedTotal;
      }
    });
  }
  list.sort((a,b)=>{
    let cmp=0;
    if(sk==='dtcBuy')cmp=a.dtcBuy-b.dtcBuy;
    else if(sk==='postBuy')cmp=(a.totalOH+a.dtcBuy)-(b.totalOH+b.dtcBuy);
    else if(sk==='currentOH')cmp=a.totalOH-b.totalOH;
    else if(sk==='sized')cmp=(a._sizedCache||0)-(b._sizedCache||0);
    return cmp*dir;
  });return list;
}

// Compute filter options reactively — sub-filters only show values valid given the higher-level filter
function getFilterOptions(){
  const all=Object.values(A.skus).filter(r=>r.sizingType!=='nosize');
  const f=A.filters;
  // Divisions: always all
  const divs=[...new Set(all.map(r=>r.division).filter(Boolean))].sort();
  // Categories: filtered by division
  let catBase=all;if(f.division!=='All')catBase=catBase.filter(r=>r.division===f.division);
  const cats=[...new Set(catBase.map(r=>r.category).filter(Boolean))].sort();
  // Subcategories: filtered by division + category
  let subBase=catBase;if(f.category!=='All')subBase=subBase.filter(r=>r.category===f.category);
  const subs=[...new Set(subBase.map(r=>r.subcategory).filter(Boolean))].sort();
  // Size scales: filtered by all of the above
  let scaleBase=subBase;if(f.subcategory!=='All')scaleBase=scaleBase.filter(r=>r.subcategory===f.subcategory);
  const scales=[...new Set(scaleBase.map(r=>r.sizeScale).filter(Boolean))].sort();
  // Commit codes: independent of cascade; just unique values across the season
  // Include "—" entry if any SKU has empty commit code
  const commitsRaw=[...new Set(all.map(r=>r.commitCoding).filter(Boolean))].sort();
  const hasEmptyCommit=all.some(r=>!(r.commitCoding||'').trim());
  const commits=hasEmptyCommit?['—',...commitsRaw]:commitsRaw;
  return{divs,cats,subs,scales,commits};
}

function renderGridCards(){
  const container=document.getElementById('sku-cards-container');
  const countEl=document.getElementById('sku-count');
  if(!container)return;
  const list=getFiltered();
  // Update count + accepted-of-filtered display
  if(countEl){
    const accInList=list.filter(r=>A.accepted[r.sku]).length;
    countEl.textContent=fmt(list.length)+' SKUs · '+fmt(accInList)+' accepted';
  }
  let h='';
  list.slice(0,500).forEach(r=>{
    const acc=A.accepted[r.sku];
    const divCls=r.division==='Womens'?'dv-w':(r.division==='Non-Apparel'||r.division==='Accessories'||r.division==='Footwear')?'dv-n':'dv-m';
    const bc=r.sizingType==='cf'?'bdg-cf':'bdg-in';
    const bl=r.sizingType==='cf'?'CF':'INITIALS';
    // Pres mins flag
    const pmConfigured=A.presMinsMeta[r.sizeScale]&&(A.presMinsMeta[r.sizeScale].sizes||[]).length>0;
    let pmFlag='';
    if(pmConfigured){
      const sizes=A.presMinsMeta[r.sizeScale].sizes||[];
      const cfg=A.presMins[r.sizeScale]||{};
      const totalSizes=sizes.length;
      const retailSizes=sizes.filter(s=>(cfg[s]||0)>0).length;
      const totalMin=sizes.reduce((a,s)=>a+(cfg[s]||0),0);
      pmFlag='<div class="pm-flag pm-flag-ok">✓ '+r.sizeScale+': '+totalSizes+'sz · '+retailSizes+'rt · min '+totalMin+'</div>';
    } else {
      pmFlag='<div class="pm-flag pm-flag-bad">⚠ '+esc(r.sizeScale||'NO SCALE')+' not configured</div>';
    }

    // Compute sized total — only sized SKUs have an allocation; if pres min isn't configured, sized=0
    let sizedTotal=0;
    if(pmConfigured&&r.sizes&&r.sizes.length){
      try{
        const res=computeAlloc(r);
        if(res&&res.alloc)sizedTotal=r.sizes.reduce((a,s)=>a+(res.alloc[s]||0),0);
      }catch(e){sizedTotal=0}
    }
    const bought=r.dtcBuy||0;
    // 3-tier color: Green (match), Yellow (off by 1-2), Red (off by 3+)
    let sizedCls='sc-sized-ok';
    if(pmConfigured){
      const variance=Math.abs(sizedTotal-bought);
      if(variance===0)sizedCls='sc-sized-ok';
      else if(variance<3)sizedCls='sc-sized-warn';
      else sizedCls='sc-sized-bad';
    }

    // Delivery month (short form)
    const dShort=formatDeliveryShort(r.deliveryMonth);
    // Commit code — display as dash if missing
    const commit=(r.commitCoding||'').trim();
    const commitDisplay=commit||'—';

    h+='<div class="sc '+divCls+'" onclick="goDetail(\''+esc(r.sku)+'\')">';
    // Top row: SKU id (left) · delivery (middle) · accept checkbox (right)
    h+='<div class="sc-top"><div class="sid">'+esc(r.sku)+'</div>'+
       '<div class="sc-deliv-wrap">'+(dShort?'<span class="sc-deliv">'+esc(dShort)+'</span>':'')+'</div>';
    if(acc)h+='<div class="chk chk-g" onclick="event.stopPropagation();toggleAccGrid(\''+esc(r.sku)+'\')" title="Click to revert to pending">✓</div>';
    else h+='<div class="chk chk-e" onclick="event.stopPropagation();toggleAccGrid(\''+esc(r.sku)+'\')" title="Click to accept"></div>';
    h+='</div>';
    h+='<div class="snm">'+esc(r.styleDescription)+(r.colorDescription?' · '+esc(r.colorDescription):'')+'</div>';
    // Sized / bought single-line: "1,614 sized / 1,614"
    h+='<div class="sc-buy"><span class="'+sizedCls+'">'+fmt(sizedTotal)+' sized</span> <span class="sc-slash">/</span> <span class="sc-bought">'+fmt(bought)+'</span></div>';
    h+='<div class="ssb">OH: '+fmt(r.totalOH)+' · Stores: '+r.storeCount+'</div>';
    // Footer: commit code (left, always) + INITIALS/CF (right, always)
    h+='<div class="sc-foot">';
    h+='<span class="sc-commit'+(commit?'':' sc-commit-empty')+'" title="'+esc(commit||'No commit code')+'">'+esc(commitDisplay)+'</span>';
    h+='<span class="bdg '+bc+'" style="font-size:10px;padding:3px 8px">'+bl+'</span>';
    h+='</div>'+pmFlag+'</div>';
  });
  if(list.length>500)h+='<div class="gnote">Showing 500 of '+fmt(list.length)+'</div>';
  if(!list.length)h+='<div class="gnote">No SKUs match filters</div>';
  container.innerHTML=h;
}

const CHART_COLORS={buy:'#c4572a',curveSales:'#3b7bc0',postBuy:'#2d8a5e',oh:'#6a7a8a',minRetail:'#b8960f'};
const CHART_LABELS={buy:'Buy Qty',curveSales:'Curve Sales',postBuy:'Post-Buy Qty',oh:'Current OH',minRetail:'Min Retail Pres'};

function getChartMetrics(isCF){
  if(A.chartMetrics)return A.chartMetrics;
  const defaults={buy:true,curveSales:true,postBuy:isCF,oh:false,minRetail:false};
  return defaults;
}

function toggleChartMetric(key){
