    '<select class="'+fcls(A.filters.subcategory!=='All')+(subs.length<=1?' dim':'')+'" onchange="setFilter(\'subcategory\',this.value)">'+opts(subs,'Subcategory',A.filters.subcategory)+'</select>'+
    '<select class="'+fcls(A.filters.segment!=='All')+(segs.length<=1?' dim':'')+'" onchange="setFilter(\'segment\',this.value)">'+opts(segs,'Product Seg',A.filters.segment)+'</select>'+
    '<select class="'+fcls(A.filters.sizeScale!=='All')+(scales.length<=1?' dim':'')+'" onchange="setFilter(\'sizeScale\',this.value)">'+opts(scales,'Size Scale',A.filters.sizeScale)+'</select>'+
    '<select class="'+fcls(A.filters.commitCoding!=='All')+(commits.length<=1?' dim':'')+'" onchange="setFilter(\'commitCoding\',this.value)">'+opts(commits,'Commit Code',A.filters.commitCoding)+'</select>'+
    '<select class="'+fcls(A.filters.deliveryMonth!=='All')+(dms.length<=1?' dim':'')+'" onchange="setFilter(\'deliveryMonth\',this.value)">'+opts(dms,'Delivery',A.filters.deliveryMonth)+'</select>'+
    '<select class="'+fcls(A.filters.ssConfigured!=='All')+'" onchange="setFilter(\'ssConfigured\',this.value)"><option value="All">SS Configured: All</option>'+ssOpt('Configured')+ssOpt('Not Configured')+'</select>'+
    '<select class="'+fcls(A.filters.storeCount!=='All')+'" onchange="setFilter(\'storeCount\',this.value)"><option value="All">Store Count: All</option>'+stOpt('0','0')+stOpt('1-25','1–25')+stOpt('26-50','26–50')+stOpt('51-90','51–90')+stOpt('91+','91+')+'</select>'+
    '<select class="'+fcls(A.filters.accepted!=='All')+'" onchange="setFilter(\'accepted\',this.value)"><option value="All">Status: All</option>'+accOpt('Accepted','Accepted')+accOpt('Pending','Pending')+'</select>'+
    (activeFilters>0?'<button class="sb mass-btn clear-filters" onclick="clearAllFilters()" title="Clear all active filters">✕ Clear Filters ('+activeFilters+')</button>':'')+
    '<div style="flex:1"></div><span class="gc-lbl" id="sku-count"></span>'+
    '<button class="sb mass-btn mass-acc" onclick="massAccept()" title="Accept all SKUs in current filter">✓ Accept All Filtered</button>'+
    '<button class="sb mass-btn mass-unacc" onclick="massUnaccept()" title="Revert all filtered SKUs to pending">✕ Unaccept All Filtered</button>'+
    '</div></div>';
  h+='<div class="sg" id="sku-cards-container"></div></div>';
  el.innerHTML=h;
  renderGridCards();
}

function setSort(k){
  if(A.sortKey===k)A.sortDir=A.sortDir==='asc'?'desc':'asc';
  else{A.sortKey=k;A.sortDir='desc'}
  renderGrid(document.getElementById('main-area'));
}

function setFilter(key,val){
  A.filters[key]=val;
  // Re-render full grid so dropdowns reflect cascading options
  renderGrid(document.getElementById('main-area'));
}

function setDivision(div){
  A.filters.division=div;
  // Re-render the seasonal grid (cascade resets & filter dropdowns refresh) AND the division pills
  renderGrid(document.getElementById('main-area'));
  renderDivisionPills();
}

function clearAllFilters(){
  // Reset every filter EXCEPT division (which is now controlled by header pills)
  const keepDiv=A.filters.division;
  A.filters={type:'All',division:keepDiv,category:'All',subcategory:'All',segment:'All',sizeScale:'All',commitCoding:'All',ssConfigured:'All',storeCount:'All',accepted:'All',deliveryMonth:'All'};
  A.searchTerm='';
  renderGrid(document.getElementById('main-area'));
}

function renderDivisionPills(){
  const host=document.getElementById('division-pills');
  if(!host)return;
  if(!A.activeSeason||!A.skus){host.innerHTML='';return}
  const all=Object.values(A.skus).filter(r=>r.sizingType!=='nosize');
  const divs=[...new Set(all.map(r=>r.division).filter(Boolean))].sort();
  if(!divs.length){host.innerHTML='';return}
  function divCls(d){return d==='Womens'?'div-w':(d==='Non-Apparel'||d==='Accessories'||d==='Footwear')?'div-n':'div-m'}
  let h='';
  if(divs.length===1){
    // Only one division — show as a static highlighted pill, no toggle
    const d=divs[0];
    h+='<span class="dv-pill dv-pill-static '+divCls(d)+'">'+esc(d)+'</span>';
    if(A.filters.division!=='All')A.filters.division='All'; // ensure no over-restrict
  } else {
    const cur=A.filters.division||'All';
    h+='<button class="dv-pill dv-pill-all'+(cur==='All'?' on':'')+'" onclick="setDivision(\'All\')">All</button>';
    divs.forEach(d=>{
      h+='<button class="dv-pill '+divCls(d)+(cur===d?' on':'')+'" onclick="setDivision(\''+esc(d)+'\')">'+esc(d)+'</button>';
    });
  }
  host.innerHTML=h;
}

function renderGridCards(){
  const container=document.getElementById('sku-cards-container');
  const countEl=document.getElementById('sku-count');
  if(!container)return;
  const list=getFiltered();
  // Update count + accepted-of-filtered display
  if(countEl){
    const accInList=list.filter(r=>A.accepted[r.sku]).length;
    countEl.textContent=fmt(list.length)+' SKUs · '+fmt(accInList)+' accepted';
  }
  let h='';
  list.slice(0,500).forEach(r=>{
    const acc=A.accepted[r.sku];
    const divCls=r.division==='Womens'?'dv-w':(r.division==='Non-Apparel'||r.division==='Accessories'||r.division==='Footwear')?'dv-n':'dv-m';
    const bc=r.sizingType==='cf'?'bdg-cf':'bdg-in';
    const bl=r.sizingType==='cf'?'CF':'INITIALS';
    // Pres mins flag
    const pmConfigured=A.presMinsMeta[r.sizeScale]&&(A.presMinsMeta[r.sizeScale].sizes||[]).length>0;
    let pmFlag='';
    if(pmConfigured){
      const sizes=A.presMinsMeta[r.sizeScale].sizes||[];
      const onlineOnly=A.presMinsMeta[r.sizeScale].onlineOnly||[];
      const cfg=A.presMins[r.sizeScale]||{};
      const totalSizes=sizes.length;
      const omniCount=totalSizes-onlineOnly.length;
      // Pres min total only counts non-online-only sizes (those go to stores with floors)
      const totalMin=sizes.filter(s=>!onlineOnly.includes(s)).reduce((a,s)=>a+(cfg[s]||0),0);
      const ooSuffix=onlineOnly.length?' · '+onlineOnly.length+' OO':'';
      pmFlag='<div class="pm-flag pm-flag-ok">✓ '+r.sizeScale+': '+totalSizes+'sz · '+omniCount+' OMNI'+ooSuffix+' · min '+totalMin+'</div>';
    } else {
      pmFlag='<div class="pm-flag pm-flag-bad">⚠ '+esc(r.sizeScale||'NO SCALE')+' not configured</div>';
    }

    // Compute sized total — only sized SKUs have an allocation; if pres min isn't configured, sized=0
    let sizedTotal=0;
    if(pmConfigured&&r.sizes&&r.sizes.length){
      try{
        const res=computeAlloc(r);
        if(res&&res.alloc)sizedTotal=r.sizes.reduce((a,s)=>a+(res.alloc[s]||0),0);
      }catch(e){sizedTotal=0}
    }
    const bought=r.dtcBuy||0;
    // 3-tier color: Green (match), Yellow (off by 1-2), Red (off by 3+, OR not configured with non-zero buy)
    let sizedCls='sc-sized-ok';
    if(bought>0){
      if(!pmConfigured){
        // SKU has a buy but no pres mins — output is broken. Always red.
        sizedCls='sc-sized-bad';
      } else {
        const variance=Math.abs(sizedTotal-bought);
        if(variance===0)sizedCls='sc-sized-ok';
        else if(variance<3)sizedCls='sc-sized-warn';
        else sizedCls='sc-sized-bad';
      }
    }

    // Delivery month (short form)
    const dShort=formatDeliveryShort(r.deliveryMonth);
    // Commit code — display as dash if missing
    const commit=(r.commitCoding||'').trim();
    const commitDisplay=commit||'—';

    h+='<div class="sc '+divCls+'" onclick="goDetail(\''+esc(r.sku)+'\')">';
    // Top row: SKU id (left) · delivery (middle) · accept checkbox (right)
    const hasAdj=hasCurveAdjustment(r.sku);
    const hasCurveOvr=!!A.curveOverrides[r.sku];
    h+='<div class="sc-top"><div class="sid">'+esc(r.sku)+(hasAdj?'<span class="sc-adj-badge" title="Curve adjustments active">ADJ</span>':'')+(hasCurveOvr?'<span class="sc-curve-badge" title="Manual curve level: '+esc(A.curveOverrides[r.sku])+'">📌 '+esc(A.curveOverrides[r.sku]).slice(0,3).toUpperCase()+'</span>':'')+'</div>'+
       '<div class="sc-deliv-wrap">'+(dShort?'<span class="sc-deliv">'+esc(dShort)+'</span>':'')+'</div>';
    if(acc)h+='<div class="chk chk-g" onclick="event.stopPropagation();toggleAccGrid(\''+esc(r.sku)+'\')" title="Click to revert to pending">✓</div>';
    else h+='<div class="chk chk-e" onclick="event.stopPropagation();toggleAccGrid(\''+esc(r.sku)+'\')" title="Click to accept"></div>';
    h+='</div>';
    h+='<div class="snm">'+esc(r.styleDescription)+(r.colorDescription?' · '+esc(r.colorDescription):'')+'</div>';
    // Sized / bought single-line: "1,614 sized / 1,614"
    h+='<div class="sc-buy"><span class="'+sizedCls+'">'+fmt(sizedTotal)+' sized</span> <span class="sc-slash">/</span> <span class="sc-bought">'+fmt(bought)+'</span></div>';
    h+='<div class="ssb">OH: '+fmt(r.totalOH)+' · Stores: '+r.storeCount+'</div>';
    // Footer: commit code (left, always) + INITIALS/CF (right, always)
    h+='<div class="sc-foot">';
    h+='<span class="sc-commit'+(commit?'':' sc-commit-empty')+'" title="'+esc(commit||'No commit code')+'">'+esc(commitDisplay)+'</span>';
    h+='<span class="bdg '+bc+'" style="font-size:10px;padding:3px 8px">'+bl+'</span>';
    h+='</div>'+pmFlag+'</div>';
  });
  if(list.length>500)h+='<div class="gnote">Showing 500 of '+fmt(list.length)+'</div>';
  if(!list.length)h+='<div class="gnote">No SKUs match filters</div>';
  container.innerHTML=h;
}

// ═══ DETAIL ═══
const CHART_COLORS={buy:'#c4572a',curveSales:'#3b7bc0',postBuy:'#2d8a5e',oh:'#6a7a8a',minRetail:'#b8960f'};
const CHART_LABELS={buy:'Buy Qty',curveSales:'Curve Sales',postBuy:'Post-Buy Qty',oh:'Current OH',minRetail:'Min Retail Pres'};

function getChartMetrics(isCF){
  if(A.chartMetrics)return A.chartMetrics;
  const defaults={buy:true,curveSales:true,postBuy:isCF,oh:false,minRetail:false};
  return defaults;
}

function toggleChartMetric(key){
  if(!A.chartMetrics)A.chartMetrics={...getChartMetrics(A.skus[A.selectedSKU]?.sizingType==='cf')};
  A.chartMetrics[key]=!A.chartMetrics[key];
  render();
}

function renderDetail(el,rec){
  const compareResults=applyStagedToCompute(rec);
  const res=compareResults.adjusted;
  const rawRes=compareResults.raw;
  if(!res&&rec.sizingType!=='nosize'){
    const issues=[];
    if(rec.dtcBuy<=0)issues.push('DTC Buy is 0');
    if(!rec.sizes.length)issues.push('Size scale "'+rec.sizeScale+'" is not configured in Pres Mins. Add it to the Pres Mins module before sizing this SKU.');
    el.innerHTML='<div class="dv anim"><button class="d-back" onclick="goGrid()">← Back to '+esc(A.activeSeason)+'</button>'+
      '<div class="detail-sticky"><div class="ds-row1"><div class="ds-left"><h2>'+esc(rec.sku)+'</h2></div></div></div>'+
      '<div style="padding:20px;background:var(--wh);border-radius:var(--rl);border:1px solid var(--bdr-lt);margin-top:12px">'+
      '<div style="font-weight:700;color:var(--red);margin-bottom:8px">Unable to compute allocation</div>'+
      '<div style="font-family:var(--mono);font-size:11px;color:var(--txt2)">'+(issues.length?issues.join('<br>'):'DTC Buy: '+rec.dtcBuy+', Sizes: '+rec.sizes.length+', Scale: '+rec.sizeScale)+'</div>'+
      '<div style="font-size:11px;color:var(--txt3);margin-top:8px">Try returning to homepage and re-uploading your data files.</div>'+
      '</div></div>';return}
  if(rec.sizingType==='nosize'){
    el.innerHTML='<div class="dv anim"><button class="d-back" onclick="goGrid()">← Back to '+esc(A.activeSeason)+'</button><div class="detail-sticky"><div class="ds-row1"><div class="ds-left"><h2>'+esc(rec.sku)+'</h2><span class="bdg bdg-ns">NO BUY</span></div></div></div><p style="color:var(--txt3);margin-top:12px">No buy — sizing not required.</p></div>';return}
  const{alloc,curve,cr,pm,pmRate,bop,wtr,ideal,pool,curveSales,useBOP,
    bopRateInfo,bopStockoutWeeks,bopRates,bopRawRates,bopSeasonal,bopBurnWindows,
    retailAlloc,onlineAlloc,retailCurveSales,onlineCurveSales,
    retailCurve,onlineCurve,retailCurveResult,onlineCurveResult,
    retailPool,onlinePool,useChannelSplit,flows,flowSizeBreaks}=res;
  const isCF=rec.sizingType==='cf';
  const locked=rec.isChase?(A.chaseAccepted[rec.chaseId]||false):(A.accepted[rec.sku]||false);
  const backLabel=rec.isChase?'Chase':esc(A.activeSeason);
  const wks=useBOP?wtr:deliveryToWeeks(rec.deliveryMonth,rec.season);
  const metrics=getChartMetrics(useBOP);

  // ── Chart with toggleable metrics ──
  // Bar heights are based on each metric's percentage of its own total (not raw values)
  // This way, a metric with 24K total sales and another with 1K buy are visually comparable
  const chartData={};
  rec.sizes.forEach(s=>{
    chartData[s]={
      buy:alloc[s]||0,
      curveSales:curveSales[s]||0,
      postBuy:useBOP?((bop[s]||0)+(alloc[s]||0)):(alloc[s]||0),
      oh:rec.sizeData[s].onHand,
      minRetail:pm[s]||0
    };
  });
  const activeKeys=Object.keys(metrics).filter(k=>metrics[k]);

  // Compute totals per metric for percentage scaling
  const metricTotals={};
  activeKeys.forEach(k=>{metricTotals[k]=rec.sizes.reduce((a,s)=>a+(chartData[s][k]||0),0)});

  // Find max percentage across all sizes & metrics — this becomes 100% bar height
  let maxPct=0;
  rec.sizes.forEach(s=>{
    activeKeys.forEach(k=>{
      const v=chartData[s][k]||0;const tot=metricTotals[k]||0;
      if(tot>0){const p=v/tot;if(p>maxPct)maxPct=p}
    });
  });
  if(maxPct===0)maxPct=1;

  // Legend checkboxes
  let legend='<div class="chart-legend-bar">';
  for(const k in CHART_LABELS){
    const checked=metrics[k];
    legend+='<label class="chart-cb'+(checked?' on':'')+'" style="--cb-color:'+CHART_COLORS[k]+'"><input type="checkbox" '+(checked?'checked':'')+' onchange="toggleChartMetric(\''+k+'\')"><span class="cb-dot" style="background:'+CHART_COLORS[k]+'"></span>'+CHART_LABELS[k]+'</label>';
  }
  legend+='</div>';

  // Bars — height = (value/metricTotal) / maxPct so the largest % fills the chart
  let bars='';
  rec.sizes.forEach(s=>{
    const cd=chartData[s];
    let barsInner='';
    activeKeys.forEach(k=>{
      const v=cd[k]||0;
      const tot=metricTotals[k]||0;
      const sizePct=tot>0?(v/tot):0;
      const hPct=(sizePct/maxPct*100).toFixed(1);
      barsInner+='<div class="cbar" style="height:'+hPct+'%;background:'+CHART_COLORS[k]+'" data-tip="'+CHART_LABELS[k]+': '+fmt(v)+' ('+(sizePct*100).toFixed(1)+'%)"></div>';
    });
    bars+='<div class="chart-col-v4"><div class="chart-size-hdr">'+esc(s)+'</div><div class="chart-bars-v4">'+barsInner+'</div></div>';
  });

  // ── Rollup trail (V8.7: levels are clickable to manually force the curve) ──
  const manualLevel=A.curveOverrides[rec.sku]||null;
  const acceptedLvl=cr.acceptedLevel;
  let trail='<div class="rb"><span class="gc-lbl">Curve source: </span>';
  cr.trail.forEach((t,i)=>{
    const isActive=t.level===acceptedLvl;
    const isManual=manualLevel&&t.level===manualLevel;
    const cls=t.pass?'rs rp':'rs rf';
    const activeCls=isActive?' rs-active':'';
    const tip=isManual?'Manually selected — click another level to change, or click Auto to revert':
      (t.pass?'Click to force this level as the curve source':'Below threshold — click to force anyway (uses limited data)');
    trail+='<span class="'+cls+activeCls+' rs-click" onclick="setCurveOverride(\''+esc(rec.sku)+'\',\''+t.level+'\')" title="'+esc(tip)+'">'+
      (isManual?'📌 ':'')+esc(t.level)+' ('+esc(t.label)+') '+(t.pass?'✓':'✗')+' ['+fmt(t.total)+' vs '+fmt(t.thresh)+' needed]'+
      (isActive?' ◀':'')+'</span>';
    if(i<cr.trail.length-1&&!t.pass&&!isActive)trail+=' → ';
    else trail+=' ';
  });
  if(cr.guaranteed&&!manualLevel){
    trail+='<span class="rs rg" title="No hierarchy level met the sales threshold. Using '+esc(cr.acceptedLevel)+' data anyway (below threshold) rather than an even split — limited signal, use with caution.">⚠ '+esc(cr.acceptedLevel)+' below threshold — '+fmt(cr.rawTotal)+' units</span>';
  } else if(cr.acceptedKey===null&&!manualLevel){
    trail+='<span class="rs rf">Even distribution (no data at any level)</span>';
  }
  if(manualLevel){
    trail+='<span class="rs rovr" title="A manual curve level is forced for this SKU.">Manual override active</span>';
    trail+='<button class="rovr-reset" onclick="setCurveOverride(\''+esc(rec.sku)+'\',\'auto\')" title="Revert to automatic curve selection">↺ Auto</button>';
  } else if(rec._retailOverride||rec._onlineOverride){
    // V9.3: an imported curve override is driving this SKU's curve (not history)
    const chans=[];if(rec._retailOverride)chans.push('Retail');if(rec._onlineOverride)chans.push('Online');
    trail+='<span class="rs rg" title="An imported curve override for '+esc(rec.segment)+' ('+chans.join(' + ')+') is driving this curve instead of sales history. Click a hierarchy level above to use L52W history instead.">⤳ Curve override active — '+esc(rec.segment)+' ('+chans.join(' + ')+')</span>';
  }
  trail+='</div>';

  // ── Data Table ──
  const curveSalesTotal=Object.values(curveSales).reduce((a,b)=>a+b,0);
  let tAlloc=0,tPM=0,tMinRetail=0;

  // Build by-date receipts list (sorted, only dates ≤ buy delivery) — needed for header build
  const buyDelivery=getBuyDeliveryDate(rec);
  const dateRows=[];
  if(useBOP&&rec.wipByDate){
    for(const dKey in rec.wipByDate){
      const entry=rec.wipByDate[dKey];
      if(buyDelivery&&entry._sortDate&&entry._sortDate>buyDelivery)continue;
      dateRows.push({date:dKey,sortDate:entry._sortDate,sizes:entry.sizes,total:entry.total});
    }
    dateRows.sort((a,b)=>(a.sortDate||0)-(b.sortDate||0));
  }
  const wipExpanded=A.expandedWipSku===rec.sku;
  const channelExpanded=A.expandedChannelSku===rec.sku;
  const showDateCols=useBOP&&wipExpanded&&dateRows.length>0;
  const showChannelCols=useChannelSplit&&channelExpanded;

  // Header
  const dateColCount=showDateCols?dateRows.length:0;
  // Inventory metrics col count: base 8 (Current OH, Ideal Target, Pres Min, Min Retail Pres, Size Break, Break %, Post-Buy, Post-Buy %)
  // + 2 if useBOP (Pending Rcpts, Proj BOP)
  // + dateColCount if showDateCols
  // + 2 if showChannelCols (Retail Buy, Online Buy under Size Break)
  let invColspan=8;
  if(useBOP)invColspan+=2+dateColCount;
  if(showChannelCols)invColspan+=2;
  // Sales metrics col count: base 5 (Adjustment, SKU Sales, Curve Sales, Curve %, Wkly Rate)
  // + 4 if showChannelCols (Retail Curve Sales, Online Curve Sales, Retail Curve %, Online Curve %)
  let salesColspan=5;
  if(showChannelCols)salesColspan+=4;
  let thead='<tr class="gr"><th></th><th class="gs" colspan="'+salesColspan+'">Sales Metrics</th>';
  thead+='<th class="gi" colspan="'+invColspan+'">Inventory Metrics</th>';
  thead+='</tr><tr><th style="text-align:left">Size</th>';
  thead+='<th class="cbl ca-col" title="Multiplier applied to historical curve sales for this size. Default 1.0.">Adjust</th>';
  thead+='<th class="cbl">SKU Sales</th>';
  // Curve Sales (with channel expand chevron)
  const channelChevron=useChannelSplit?' <span class="rcpt-expand" onclick="toggleChannelExpand(\''+esc(rec.sku)+'\')" title="'+(channelExpanded?'Hide':'Show')+' channel split">'+(channelExpanded?'▼':'▶')+'</span>':'';
  thead+='<th class="cbd">Curve Sales'+channelChevron+'</th>';
  if(showChannelCols)thead+='<th class="cbd-ch">Retail Curve</th><th class="cbd-ch">Online Curve</th>';
  thead+='<th class="cbl">Curve %</th>';
  if(showChannelCols)thead+='<th class="cbl-ch">Retail %</th><th class="cbl-ch">Online %</th>';
  thead+='<th class="cbd">Wkly Rate</th>';
  thead+='<th class="col">Current OH</th>';
  if(useBOP){
    const expandBtn=dateRows.length>0?' <span class="rcpt-expand" onclick="toggleWipExpand(\''+esc(rec.sku)+'\')" title="'+(wipExpanded?'Hide':'Show')+' by date">'+(wipExpanded?'▼':'▶')+'</span>':'';
    thead+='<th class="cod">Pending Rcpts'+expandBtn+'</th>';
    if(showDateCols){dateRows.forEach(dr=>{thead+='<th class="cod-date">'+esc(dr.date)+'</th>'})}
    thead+='<th class="col">Proj. BOP</th>';
  }
  thead+='<th class="cod">Ideal Target</th><th class="col">Pres Min</th><th class="cod">Min Retail Pres</th>';
  // Size Break with channel chevron only (flows live in popup now)
  const sbChannelChevron=useChannelSplit?' <span class="rcpt-expand" onclick="toggleChannelExpand(\''+esc(rec.sku)+'\')" title="'+(channelExpanded?'Hide':'Show')+' channel split">'+(channelExpanded?'▼':'▶')+'</span>':'';
  thead+='<th class="col">Size Break'+sbChannelChevron+'</th>';
  if(showChannelCols)thead+='<th class="col-ch">Retail Buy</th><th class="col-ch">Online Buy</th>';
  thead+='<th class="cod">Break %</th>';
  thead+='<th class="col">Post-Buy</th>';
  thead+='<th class="col" title="Each size\'s share of total post-buy inventory (OH + buy) — the resulting on-floor size distribution. Key for CF/Chase.">Post-Buy %</th></tr>';

  // Compute totals + date-filtered pending receipts
  let totSkuSl=0,totCurveSl=0,totOH=0,totPend=0,totBOP=0,totIdeal=0,totAl=0,totPost=0,totMinRet=0;
  let totRetCurve=0,totOnlineCurve=0,totRetAlloc=0,totOnlineAlloc=0;
  const pendingFiltered=useBOP?getPendingBeforeDelivery(rec):{};
  rec.sizes.forEach(s=>{
    const sd=rec.sizeData[s],a=alloc[s]||0;
    totSkuSl+=sd.sales;totCurveSl+=(curveSales[s]||0);totOH+=sd.onHand;
    if(useBOP){totPend+=(pendingFiltered[s]||0);totBOP+=(bop[s]||0)}
    totIdeal+=(useBOP?(ideal[s]||0):Math.round(curve[s]*pool));
    totAl+=a;totPost+=(useBOP?(bop[s]||0):0)+a;
    totMinRet+=pm[s];tPM+=(pmRate[s]||0);
    totRetCurve+=(retailCurveSales[s]||0);totOnlineCurve+=(onlineCurveSales[s]||0);
    totRetAlloc+=(retailAlloc[s]||0);totOnlineAlloc+=(onlineAlloc[s]||0);
  });

  // Helper: render a numeric cell with before/after diff if values differ
  // `before` is the unadjusted value (rawRes), `after` is the live/staged value
  function diffCell(before,after,formatter,extraCls){
    formatter=formatter||fmt;
    extraCls=extraCls||'';
    const bDisp=formatter(before);
    const aDisp=formatter(after);
    if(bDisp===aDisp)return '<td class="'+extraCls+'">'+aDisp+'</td>';
    return '<td class="'+extraCls+' ca-diff"><span class="ca-before">'+bDisp+'</span><span class="ca-arrow">→</span><span class="ca-after">'+aDisp+'</span></td>';
  }
  // Helper: get raw (unadjusted) value safely
  function rawVal(obj,s){return rawRes&&rawRes[obj]?(rawRes[obj][s]||0):0}

  // Compute raw totals for the totals row's diff
  let rawTotCurve=0,rawTotRetCurve=0,rawTotOnlineCurve=0,rawTotAl=0,rawTotRetAlloc=0,rawTotOnlineAlloc=0;
  if(rawRes){
    rec.sizes.forEach(s=>{
      rawTotCurve+=(rawRes.curveSales&&rawRes.curveSales[s])||0;
      rawTotRetCurve+=(rawRes.retailCurveSales&&rawRes.retailCurveSales[s])||0;
      rawTotOnlineCurve+=(rawRes.onlineCurveSales&&rawRes.onlineCurveSales[s])||0;
      rawTotAl+=rawRes.alloc[s]||0;
      rawTotRetAlloc+=(rawRes.retailAlloc&&rawRes.retailAlloc[s])||0;
      rawTotOnlineAlloc+=(rawRes.onlineAlloc&&rawRes.onlineAlloc[s])||0;
    });
  }

  // Totals row first
  let tBody='<tr class="rt"><td>TOTAL</td>';
  tBody+='<td class="cbl ca-col"></td>'; // Adjustment col blank in totals row
  tBody+='<td class="cbl">'+fmt(totSkuSl)+'</td>';
  tBody+=diffCell(rawTotCurve||totCurveSl,totCurveSl,fmt,'cbd');
  if(showChannelCols){
    tBody+=diffCell(rawTotRetCurve||totRetCurve,totRetCurve,fmt,'cbd-ch');
    tBody+=diffCell(rawTotOnlineCurve||totOnlineCurve,totOnlineCurve,fmt,'cbd-ch');
  }
  tBody+='<td class="cbl">100%</td>';
  if(showChannelCols)tBody+='<td class="cbl-ch">100%</td><td class="cbl-ch">100%</td>';
  // V9.9: explain the seasonal rate adjustment wherever a BOP figure is shown. Declared at the
  // function's own scope because both the totals row and the per-size loop below use it, and the
  // per-size loop sits outside the `if(useBOP)` block.
  const seasTip=function(size){
    if(!bopSeasonal)return '';
    let t='\nSeasonal rate: '+bopSeasonal.level+' curve ('+bopSeasonal.label+', '+
      (bopSeasonal.activeWeeks||bopSeasonal.weeks)+' selling wks'+(bopSeasonal.cohort?', season-aligned':', BLENDED — may under-correct')+')';
    if(bopSeasonal.rebase&&Math.abs(bopSeasonal.rebase-1)>0.05){
      t+='\nTrailing rate rebased ÷'+bopSeasonal.rebase.toFixed(2)+
         ' to an annual average, then re-seasonalised week by week';
    }
    if(size&&bopRawRates&&bopRawRates[size]!==undefined&&bopRates&&bopRates[size]!==undefined){
      t+='\nRate this window: '+bopRates[size].toFixed(1)+
         '/wk (trailing was '+bopRawRates[size].toFixed(1)+'/wk)';
    }
    const bw=size&&bopBurnWindows?bopBurnWindows[size]:null;
    if(bw&&bw.startWk>0){
      t+='\nNo on-hand — rate covers wk '+bw.startWk+' (first pending receipt) to delivery, '+
         bw.weeks+'w';
    }
    return t;
  };
  // Cumulative weekly rate (V8.3): sum the per-size rates from bopRates (which apply parent fallback).
  // Falls back to sku-total/weeksLive for non-BOP (Initials) SKUs.
  let cumRate=0;
  if(bopRates&&Object.keys(bopRates).length){
    rec.sizes.forEach(s=>{cumRate+=(bopRates[s]||0)});
  } else if(rec.weeksLive&&totSkuSl>0){
    cumRate=totSkuSl/rec.weeksLive;
  }
  const cumWkly=cumRate>0?cumRate.toFixed(1):'';
  tBody+='<td class="cbd c-d" style="font-weight:700">'+cumWkly+'</td>';
  tBody+='<td class="col">'+fmt(totOH)+'</td>';
  if(useBOP){
    tBody+='<td class="cod">'+fmt(totPend)+'</td>';
    if(showDateCols){dateRows.forEach(dr=>{tBody+='<td class="cod-date" style="font-weight:700">'+fmt(dr.total)+'</td>'})}
    // BOP tooltip on totals row (V8.3): includes rate source and total stockout weeks
    const totProjSales=Math.round(cumRate*wks);
    let totStockout=0;
    if(bopStockoutWeeks)rec.sizes.forEach(s=>{totStockout+=(bopStockoutWeeks[s]||0)});
    let totBopTip='Weekly rate × weeks until order = projected sales\n'+
      cumRate.toFixed(1)+' × '+wks+'w = '+fmt(totProjSales)+' projected sales\n\n'+
      'Current OH − Projected sales + Pending receipts = Projected BOP\n'+
      fmt(totOH)+' − '+fmt(totProjSales)+' + '+fmt(totPend)+' = '+fmt(totBOP);
    const avgStockout=totStockout/(rec.sizes.length||1);
    if(avgStockout>=0.5)totBopTip+='\n\nAvg '+avgStockout.toFixed(1)+'w of expected stockout per size';
    if(bopRateInfo&&bopRateInfo.sourceLevel!=='SKU')totBopTip+='\nRate source: '+bopRateInfo.sourceLevel+' avg ('+bopRateInfo.sourceLabel+')';
    totBopTip+=seasTip(null);
    tBody+='<td class="col c-t bop-cell" title="'+esc(totBopTip)+'">'+fmt(totBOP)+'</td>';
  }
  tBody+='<td class="cod">'+fmt(totIdeal)+'</td><td class="col"></td><td class="cod">'+fmt(totMinRet)+'</td>';
  tBody+=diffCell(rawTotAl||totAl,totAl,fmt,'col c-o');
  if(showChannelCols){
    tBody+=diffCell(rawTotRetAlloc||totRetAlloc,totRetAlloc,fmt,'col-ch');
    tBody+=diffCell(rawTotOnlineAlloc||totOnlineAlloc,totOnlineAlloc,fmt,'col-ch');
  }
  tBody+='<td class="cod">100%</td>';
  tBody+='<td class="col c-g" style="font-weight:700">'+fmt(totPost)+'</td>';
  tBody+='<td class="col c-d" style="font-weight:700">'+(totPost>0?'100%':'—')+'</td></tr>';

  // Data rows
  rec.sizes.forEach(s=>{
    const sd=rec.sizeData[s],a=alloc[s]||0;
    // V8.3: prefer the engine's computed per-size rate (which includes parent fallback for sparse SKUs)
    const rateForSize=(bopRates&&bopRates[s]!==undefined)?bopRates[s]:(sd.sales/(rec.weeksLive||52));
    const wr=rateForSize.toFixed(1);const cv=curve[s];const sbPct=totAl>0?a/totAl:0;
    const postBuy=(useBOP?(bop[s]||0):0)+a;
    const minRetail=pm[s];
    const pendingForSize=useBOP?(pendingFiltered[s]||0):0;
    const hasOv=A.overrides[rec.sku]&&A.overrides[rec.sku][s]!==undefined;
    const inp=locked?'<span class="c-o">'+fmt(a)+'</span>':'<input class="ai'+(hasOv?' ov':'')+'" type="number" value="'+a+'" onchange="setOvr(\''+esc(rec.sku)+'\',\''+esc(s)+'\',this.value)">';
    const retCv=retailCurve[s]||0,onCv=onlineCurve[s]||0;
    const isOnlineOnly=(getOnlineOnlySizes(rec)||[]).includes(s);
    const sizeLabel=isOnlineOnly?'<span class="size-row-online" title="Online-only size — no retail allocation">'+esc(s)+' 🌐</span>':esc(s);
    // Adjustment factor for this size (staged or accepted; defaults to 1)
    const adjFactor=getStagedAdj(rec.sku,s);
    const adjInp=locked?'<span class="ca-locked">'+adjFactor.toFixed(2)+'</span>':
      '<input class="ai ca-input'+(adjFactor!==1?' ca-input-active':'')+'" type="number" step="0.05" min="0.1" value="'+adjFactor+'" onchange="setStagedAdj(\''+esc(rec.sku)+'\',\''+esc(s)+'\',this.value)" title="Multiplier on this size\'s historical sales">';
    // Raw values for diff display
    const rawCurveSales=rawVal('curveSales',s);
    const rawCv=rawRes&&rawRes.curve?rawRes.curve[s]||0:0;
    const rawRetCv=rawRes&&rawRes.retailCurve?rawRes.retailCurve[s]||0:0;
    const rawOnCv=rawRes&&rawRes.onlineCurve?rawRes.onlineCurve[s]||0:0;
    const rawRetCurveSales=rawVal('retailCurveSales',s);
    const rawOnlineCurveSales=rawVal('onlineCurveSales',s);
    const rawA=rawRes?rawRes.alloc[s]||0:a;
    const rawRetAlloc=rawVal('retailAlloc',s);
    const rawOnlineAlloc=rawVal('onlineAlloc',s);

    tBody+='<tr'+(isOnlineOnly?' class="size-row-online-row"':'')+'><td>'+sizeLabel+'</td>';
    tBody+='<td class="cbl ca-col">'+adjInp+'</td>';
    tBody+='<td class="cbl">'+fmt(sd.sales)+'</td>';
    tBody+=diffCell(rawCurveSales,curveSales[s]||0,fmt,'cbd');
    if(showChannelCols){
      tBody+=diffCell(rawRetCurveSales,retailCurveSales[s]||0,fmt,'cbd-ch');
      tBody+=diffCell(rawOnlineCurveSales,onlineCurveSales[s]||0,fmt,'cbd-ch');
    }
    tBody+=diffCell(rawCv,cv,pct,'cbl c-d');
    if(showChannelCols){
      tBody+=diffCell(rawRetCv,retCv,pct,'cbl-ch c-d');
      tBody+=diffCell(rawOnCv,onCv,pct,'cbl-ch c-d');
    }
    tBody+='<td class="cbd c-d">'+wr+'</td>';
    tBody+='<td class="col">'+fmt(sd.onHand)+'</td>';
    if(useBOP){
      tBody+='<td class="cod">'+fmt(pendingForSize)+'</td>';
      if(showDateCols){
        dateRows.forEach(dr=>{
          const v=dr.sizes[s]||0;
          tBody+='<td class="cod-date">'+(v>0?fmt(v):'<span class="c-d">—</span>')+'</td>';
        });
      }
      // BOP tooltip (V8.3): walks week-by-week, only depletes if stock present.
      // Now shows the rate source (SKU's own data vs parent-level fallback) and total stockout weeks.
      const szRate=(bopRates&&bopRates[s]!==undefined)?bopRates[s]:(sd.sales/(rec.weeksLive||52));
      const szProjSales=Math.round(szRate*wks);
      const szBop=bop[s]||0;
      const szStockout=bopStockoutWeeks&&bopStockoutWeeks[s]?bopStockoutWeeks[s]:0;
      let szBopTip='Weekly rate × weeks until order = projected sales\n'+
        szRate.toFixed(1)+' × '+wks+'w = '+fmt(szProjSales)+' projected sales\n\n'+
        'Current OH − Projected sales + Pending receipts = Projected BOP\n'+
        fmt(sd.onHand)+' − '+fmt(szProjSales)+' + '+fmt(pendingForSize)+' = '+fmt(szBop);
      if(szStockout>=0.5)szBopTip+='\n\n'+szStockout.toFixed(1)+'w of expected stockout';
      if(bopRateInfo&&bopRateInfo.sourceLevel!=='SKU')szBopTip+='\nRate source: '+bopRateInfo.sourceLevel+' avg ('+bopRateInfo.sourceLabel+')';
      szBopTip+=seasTip(s);
      tBody+='<td class="col c-t bop-cell" title="'+esc(szBopTip)+'">'+fmt(szBop)+'</td>';
    }
    tBody+='<td class="cod">'+fmt(useBOP?(ideal[s]||0):Math.round(cv*pool))+'</td>';
    tBody+='<td class="col c-d">'+(pmRate[s]||'—')+'</td>';
    tBody+='<td class="cod'+(a<minRetail&&minRetail>0?' c-r':'')+'">'+fmt(minRetail)+'</td>';
    tBody+=diffCell(rawA,a,fmt,'col'); // Size Break with diff
    if(showChannelCols){
      tBody+=diffCell(rawRetAlloc,retailAlloc[s]||0,fmt,'col-ch');
      tBody+=diffCell(rawOnlineAlloc,onlineAlloc[s]||0,fmt,'col-ch');
    }
    tBody+='<td class="cod c-d">'+pct(sbPct)+'</td>';
    const postBuyPct=totPost>0?postBuy/totPost:0;
    tBody+='<td class="col c-g" style="font-weight:600">'+fmt(postBuy)+'</td>';
    tBody+='<td class="col c-d">'+(totPost>0?pct(postBuyPct):'—')+'</td></tr>';
  });

  const variance=totAl-pool;
  const vNote=variance!==0?'<span class="tbn c-r">Variance: '+(variance>0?'+':'')+variance+'</span>':'<span class="tbn c-g">Balanced — '+fmt(pool)+' units</span>';
  const lockBtn=locked?'<button class="btn-grn" style="opacity:.6" onclick="toggleAcc(\''+esc(rec.sku)+'\')">✓ Accepted</button>':'<button class="btn-grn" onclick="toggleAcc(\''+esc(rec.sku)+'\')">Accept</button>';
  const hasOvrs=A.overrides[rec.sku]&&Object.keys(A.overrides[rec.sku]).length>0;
  const resetBtn=hasOvrs&&!locked?'<button class="btn btn-g btn-sm" onclick="clrOvr(\''+esc(rec.sku)+'\')">Reset</button>':'';
  // Curve adjustment control bar — appears below the data table when changes are staged or applied
  const stagedAdjDirty=hasStagedAdjChanges(rec.sku);
  const hasAcceptedAdj=hasCurveAdjustment(rec.sku);
  let adjBar='';
  if(!locked&&(stagedAdjDirty||hasAcceptedAdj)){
    let adjMsg='';
    if(stagedAdjDirty)adjMsg='<span class="ca-bar-text">Curve adjustments staged — review the yellow→green changes above before accepting.</span>';
    else if(hasAcceptedAdj)adjMsg='<span class="ca-bar-text c-g">✓ Curve adjustments active for this SKU.</span>';
    let adjBtns='';
    if(stagedAdjDirty){
      adjBtns+='<button class="btn btn-grn btn-sm" onclick="acceptCurveAdj(\''+esc(rec.sku)+'\')">Accept Adjustments</button>';
      adjBtns+='<button class="btn btn-g btn-sm" onclick="discardCurveAdj(\''+esc(rec.sku)+'\')">Discard</button>';
    }
    if(hasAcceptedAdj&&!stagedAdjDirty){
      adjBtns+='<button class="btn btn-g btn-sm" onclick="resetCurveAdj(\''+esc(rec.sku)+'\')">Reset to 1.0</button>';
    }
    adjBar='<div class="ca-bar">'+adjMsg+'<div class="ca-bar-actions">'+adjBtns+'</div></div>';
  }
  const flowsBtn=flows.eligible&&flows.count>1?'<button class="btn btn-pk btn-sm" onclick="openFlowsModal(\''+esc(rec.sku)+'\')" title="View flow breakdown">Flows ('+flows.count+')</button>':'';
  const chaseEditBtn=rec.isChase?'<button class="btn btn-g btn-sm" onclick="openChaseForm(\''+esc(rec.chaseId)+'\')" title="Edit this Chase PO">✎ Edit Chase</button>':'';
  const skuL52W=rec.skuSalesTotal;
  const totalBOPv=useBOP?totBOP:0;
  const apsR=rec.apsRetail||0,apsO=rec.apsOnline||0;
  const stCt=rec.storeCount||0;
  const apsR_disp=apsR>=10?Math.round(apsR):(apsR.toFixed(1));
  const apsO_disp=apsO>=10?Math.round(apsO):(apsO.toFixed(1));
  const apsRtotal=Math.round(apsR*stCt);
  const apsRpill=stCt>0?'Retail APS: '+apsR_disp+' × '+fmt(stCt)+' = '+fmt(apsRtotal):'Retail APS: '+apsR_disp;

  // Channel buy mismatch detection — surfaces planning data error
  const retailBuyVal=rec.retailBuy||0,onlineBuyVal=rec.onlineBuy||0;
  const channelSum=retailBuyVal+onlineBuyVal;
  const channelMismatch=channelSum>0&&channelSum!==pool;
  let mismatchBanner='';
  if(channelMismatch){
    const diff=pool-channelSum;
    mismatchBanner='<div class="ch-mismatch">⚠ <b>Planning data discrepancy:</b> Retail Buy ('+fmt(retailBuyVal)+') + Online Buy ('+fmt(onlineBuyVal)+') = '+fmt(channelSum)+', but Total DTC Buy = '+fmt(pool)+' ('+(diff>0?'+':'')+fmt(diff)+'u gap). Sized output will follow channel buys; please verify with the planner.</div>';
  }

  el.innerHTML='<div class="dv anim">'+
    '<button class="d-back" onclick="goGrid()">← Back to '+backLabel+'</button>'+
    mismatchBanner+
    '<div class="detail-sticky"><div class="ds-row1"><div class="ds-left"><h2>'+esc(rec.sku)+'</h2><span class="bdg '+(isCF?'bdg-cf':'bdg-in')+'">'+rec.sizingType.toUpperCase()+'</span>'+(rec.isChase?'<span class="chase-badge">CHASE</span>':'')+'</div>'+
    '<div class="ds-right">'+chaseEditBtn+resetBtn+flowsBtn+lockBtn+'</div></div>'+
    '<div class="ds-name">'+esc(rec.styleDescription||'')+(rec.colorDescription?' · <span class="ds-color">'+esc(rec.colorDescription)+'</span>':'')+'</div>'+
    '<div class="attr-row">'+attrPills(rec)+'</div>'+
    '<div class="metric-row">'+
      '<span class="metric-pill">'+esc(rec.season)+' Buy: '+fmt(pool)+'</span>'+
      '<span class="metric-pill">Stores: '+fmt(rec.storeCount)+'</span>'+
      '<span class="metric-pill">Current OH: '+fmt(rec.totalOH)+'</span>'+
      (useBOP?'<span class="metric-pill">Proj. BOP: '+fmt(totalBOPv)+' ('+wks+'w)</span>':'')+
      '<span class="metric-pill">L52W SKU Sales: '+fmt(skuL52W)+(A.hasWeeklyData?' <span style="color:var(--txt3)">/ '+(rec.weeksLive||52)+'w live</span>':'')+'</span>'+
      '<span class="metric-pill mp-ch">'+apsRpill+'</span>'+
      '<span class="metric-pill mp-ch">Online APS: '+apsO_disp+'</span>'+
    '</div></div>'+
    // Chart
    '<div class="cb"><div class="slbl">Size Distribution</div>'+legend+
    '<div class="chart-v4">'+bars+'</div></div>'+
    trail+
    // Table
    '<div class="tb"><div class="tbh"><div class="slbl" style="margin:0">Data Table</div>'+vNote+'</div>'+
    '<div class="tbs"><table class="dt"><thead>'+thead+'</thead><tbody>'+tBody+'</tbody></table></div>'+
    adjBar+
    '</div>'+
    '</div>';
}

function attrPills(rec){
  return '<span class="attr-pill">'+esc(rec.division)+'</span>'+
    '<span class="attr-pill">'+esc(rec.category)+'</span>'+
    '<span class="attr-pill">'+esc(rec.subcategory)+'</span>'+
    (rec.segment?'<span class="attr-pill">'+esc(rec.segment)+'</span>':'')+
    '<span class="attr-pill">'+esc(rec.sizeScale)+'</span>'+
    '<span class="attr-pill">'+esc(rec.storeTier||'—')+'</span>'+
    (rec.deliveryMonth?'<span class="attr-pill">'+esc(rec.deliveryMonth)+'</span>':'');
}

// ═══ PRES MINS ═══
let pmStaged={};

function renderPresMins(el){
  // V9.3: if a scale is selected, show its detail page; otherwise the compact grid
  if(A.selectedScale&&A.presMinsMeta[A.selectedScale]){
    return renderScaleDetail(el,A.selectedScale);
  }
  const allScales=Object.keys(A.presMinsMeta).filter(s=>(A.presMinsMeta[s].sizes||[]).length);
  // V9.4: divisions present across configured scales (for the filter dropdown)
  const divsPresent=[...new Set(allScales.map(s=>A.presMinsMeta[s].div||'').filter(Boolean))].sort();
  if(A.scaleFilterDiv!=='All'&&!divsPresent.includes(A.scaleFilterDiv))A.scaleFilterDiv='All';
  // Apply division filter
  let scales=allScales.filter(s=>A.scaleFilterDiv==='All'||(A.presMinsMeta[s].div||'')===A.scaleFilterDiv);
  // Apply sort (name | size count | division), then direction
  const dir=A.scaleSortDir==='asc'?1:-1;
  scales.sort((a,b)=>{
    let cmp;
    if(A.scaleSort==='sizeCount'){
      cmp=((A.presMinsMeta[a].sizes||[]).length)-((A.presMinsMeta[b].sizes||[]).length);
      if(cmp===0)cmp=a.localeCompare(b);
    } else if(A.scaleSort==='division'){
      cmp=(A.presMinsMeta[a].div||'').localeCompare(A.presMinsMeta[b].div||'');
      if(cmp===0)cmp=a.localeCompare(b);
    } else { // name
      cmp=a.localeCompare(b);
    }
    return cmp*dir;
  });
  let h='<div class="pm-page anim"><button class="d-back" onclick="goBackFromModule()">← Back</button>'+
    '<h2 style="font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px">Size Scales</h2>'+
    '<p style="font-size:12px;color:var(--txt2);margin-bottom:14px">Presentation minimums and sales-curve overrides by size scale. Click a scale to view details.</p>'+
    '<div class="pm-actions">'+
      '<button class="btn btn-b btn-sm" onclick="openAddScaleModal()">+ Add Size Scale</button>'+
      '<button class="btn btn-g btn-sm" onclick="exportSizeScales()">⬇ Export Size Scales</button>'+
      '<button class="btn btn-g btn-sm" onclick="downloadCurveTemplate()">⬇ Curve Template</button>'+
      '<label class="btn btn-g btn-sm" style="cursor:pointer;margin:0">⬆ Import Curves<input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleCurveImportFile(this.files[0]);this.value=\'\'"></label>'+
    '</div>'+
    '<div id="curve-import-report">'+curveImportReportHtml(A._curveImportState)+'</div>';

  // V9.4: Sort + filter control bar
  function scsb(k,l){
    const on=A.scaleSort===k;
    const arrow=on?(A.scaleSortDir==='asc'?' ↑':' ↓'):'';
    return'<button class="sb'+(on?' on':'')+'" onclick="setScaleSort(\''+k+'\')">'+l+arrow+'</button>';
  }
  let divOpts='<option value="All">Division: All</option>';
  divsPresent.forEach(d=>{divOpts+='<option value="'+esc(d)+'"'+(A.scaleFilterDiv===d?' selected':'')+'>'+esc(d)+'</option>'});
  h+='<div class="gc" style="margin-bottom:12px"><div class="gc-row gc-flex">'+
    '<span class="gc-lbl">Sort</span>'+scsb('name','Name')+scsb('sizeCount','Size Count')+scsb('division','Division')+
    '<span class="gc-lbl" style="margin-left:10px">Filter</span>'+
    '<select class="fsel'+(A.scaleFilterDiv!=='All'?' on':'')+'" onchange="A.scaleFilterDiv=this.value;render()">'+divOpts+'</select>'+
    (A.scaleFilterDiv!=='All'?'<button class="sb mass-btn clear-filters" onclick="A.scaleFilterDiv=\'All\';render()" title="Clear division filter">✕ Clear</button>':'')+
    '<div style="flex:1"></div><span class="gc-lbl">'+scales.length+' of '+allScales.length+' scales</span>'+
    '</div></div>';

  h+='<div class="sg pm-grid">';
  scales.forEach(scale=>{
    const meta=A.presMinsMeta[scale]||{};
    const sizes=(meta.sizes||[]).slice();
    if(!sizes.length)return;
    const onlineOnly=meta.onlineOnly||[];
    const omniCount=sizes.length-onlineOnly.length;
    const ooCount=onlineOnly.length;
    const onlineFlatVal=meta.onlineFlat!==undefined?meta.onlineFlat:5;
    const divCls=meta.div==='Womens'?'dv-w':(meta.div==='Non-Apparel'||meta.div==='Accessories')?'dv-n':'dv-m';
    // Count active overrides touching this scale
    let ovCount=0;for(const k in A.curveImports){if(k.split('|')[1]===scale)ovCount++}
    h+='<div class="sc '+divCls+'" onclick="goScaleDetail(\''+esc(scale)+'\')">'+
      '<div class="sc-top"><div class="sid">'+esc(scale)+'</div></div>'+

  h+=curveLevelGridHtml(div,scale,sizes,'category','Category',false);

// V9.8: render one hierarchy level's sales-curve grid (Category | Subcategory | Product Segmentation).
// withOverrides=true (Product Segmentation only) adds the override % row, per-row remove ✕, and the
// scale-wide "Clear all overwrites" button.
function curveLevelGridHtml(div,scale,sizes,field,levelLabel,withOverrides){
  let h='';
  let clearAllBtn='';
  if(withOverrides){
    let scaleOvCount=0;for(const k in A.curveImports){if(k.split('|')[1]===scale)scaleOvCount++}
    clearAllBtn=scaleOvCount>0?'<button class="btn btn-g btn-sm" style="margin-left:auto" onclick="clearAllCurveOverrides(\''+esc(div)+'\',\''+esc(scale)+'\')" title="Remove every imported curve override on this size scale">✕ Clear all overwrites ('+scaleOvCount+')</button>':'';
  }
  const subtitle=withOverrides?'— L52W history, with imported overrides where present':'— L52W history (reference only — overrides apply at Product Segmentation)';
  h+='<div class="sd-section-lbl" style="margin-top:24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">Sales Curves by '+esc(levelLabel)+' &amp; Channel <span style="font-weight:400;color:var(--txt3);text-transform:none;letter-spacing:0">'+subtitle+'</span>'+clearAllBtn+'</div>';
  const vals=getValuesForScale(div,scale,field);
  // V9.9.1: at the override level, also surface segments that have a stored override but NO L52W
  // sales (otherwise an override on a no-history segmentation is invisible — stored "under the
  // covers" with no way to see or remove it). Union them in by normalized value.
  if(withOverrides){
    const dN=_ovNorm(div),sN=_ovNorm(scale);
    const seen=new Set(vals.map(v=>_ovNorm(v)));
    for(const k in A.curveImports){
      const o=A.curveImports[k];if(o._div===undefined)continue;
      if(_ovNorm(o._div)===dN&&_ovNorm(o._scale)===sN&&!seen.has(_ovNorm(o._value))){
        seen.add(_ovNorm(o._value));vals.push(o._value);
      }
    }
    vals.sort();
  }
  if(!vals.length){
    h+='<div class="gnote">No '+esc(levelLabel)+' values with L52W sales found for '+esc(div)+' / '+esc(scale)+'.</div>';
    return h;
  }
  vals.forEach(val=>{
    ['Retail','Online'].forEach(channel=>{
      const sc=getFieldSalesCurve(div,scale,field,val,channel);
      const ov=withOverrides?getCurveOverride(div,scale,val,channel):null;
      // Skip channel rows with literally no sales AND no override (keeps each grid relevant)
      if(sc.total===0&&!ov)return;
      const ovSum=ov?Object.values(ov.curve).reduce((a,v)=>a+v,0):0;
      const ovFlag=ov&&ovSum<99.9999;
      const dDel=ov&&ov._div!==undefined?ov._div:div;
      const sDel=ov&&ov._scale!==undefined?ov._scale:scale;
      const vDel=ov&&ov._value!==undefined?ov._value:val;
      const cDel=ov&&ov._channel!==undefined?ov._channel:channel;
      h+='<div class="cc-block">'+
        '<div class="cc-hdr">'+
          '<span class="cc-cat">'+esc(val)+'</span><span class="cc-chan cc-chan-'+channel.toLowerCase()+'">'+channel+'</span>'+
          '<span class="cc-total">'+fmt(sc.total)+' units L52W</span>'+
          (ov?'<span class="cc-ov-tag'+(ovFlag?' cc-ov-flag':'')+'" title="'+(ovFlag?'Override sums to '+ovSum.toFixed(1)+'% — suboptimal':'Override active')+'">⤳ override'+(ovFlag?' '+ovSum.toFixed(0)+'%':'')+'</span><button class="cc-ov-rm" title="Remove this '+channel+' override for '+esc(val)+'" onclick="removeCurveOverride(\''+esc(dDel)+'\',\''+esc(sDel)+'\',\''+esc(vDel)+'\',\''+esc(cDel)+'\')">✕</button>':'')+
        '</div>';
      // Always show the detail (no dropdown): Sales %, Sales units, and (P-Seg only) Override % if present.
      h+='<table class="cc-tbl"><thead><tr><th>Source</th>';
      sizes.forEach(s=>{h+='<th>'+esc(s)+'</th>'});
      h+='<th>Total</th></tr></thead><tbody>';
      h+='<tr><td class="cc-src">Sales %</td>';
      sizes.forEach(s=>{h+='<td>'+(sc.total>0?sc.pctBySize[s].toFixed(1)+'%':'—')+'</td>'});
      h+='<td class="cc-tot">'+fmt(sc.total)+'</td></tr>';
      h+='<tr class="cc-units"><td class="cc-src">Sales units</td>';
      sizes.forEach(s=>{h+='<td>'+(sc.bySize[s]?fmt(sc.bySize[s]):'—')+'</td>'});
      h+='<td class="cc-tot">'+fmt(sc.total)+'</td></tr>';
      if(ov){
        h+='<tr class="cc-ovrow'+(ovFlag?' cc-ovrow-flag':'')+'"><td class="cc-src">Override %'+(ov.by?' <span class="cc-by">('+esc(ov.by)+')</span>':'')+'</td>';
        sizes.forEach(s=>{const p=ov.curve[s]||0;h+='<td>'+(p?p.toFixed(1)+'%':'—')+'</td>'});
        h+='<td class="cc-tot'+(ovFlag?' cc-tot-flag':'')+'">'+ovSum.toFixed(0)+'%</td></tr>';
      }
      h+='</tbody></table>';
      h+='</div>';
    });
  });
  return h;
}

// V9.4: clear every imported curve override for a size scale in one action
async function clearAllCurveOverrides(div,scale){
  let count=0;for(const k in A.curveImports){if(k.split('|')[1]===scale)count++}
  if(!count)return;
  if(!confirm('Clear all '+count+' curve override'+(count===1?'':'s')+' for size scale "'+scale+'"? This removes them for the whole team and cannot be undone.'))return;
  try{
    await cloudDeleteCurveOverridesForScale(div,scale);
    await cloudLogEvent('curve_override_clear_all','curve',div+' '+scale,
      'cleared all '+count+' curve override'+(count===1?'':'s')+' for '+div+' '+scale,{count:count});
    for(const k in A.curveImports){if(k.split('|')[1]===scale)delete A.curveImports[k]}
    rebuildCurveImportIndex();
    toast('Cleared '+count+' override'+(count===1?'':'s')+' for '+scale);
    render();
  }catch(err){toast('Clear failed: '+err.message)}
}

async function removeCurveOverride(div,scale,cat,channel){
  if(!confirm('Remove the '+channel+' curve override for '+cat+' ('+scale+')?'))return;
  try{
    await cloudDeleteCurveOverride(div,scale,cat,channel);
    await cloudLogEvent('curve_override_remove','curve',div+' '+scale+' '+cat+' '+channel,
      'removed '+channel+' curve override for '+cat+' ('+div+' '+scale+')',null);
    delete A.curveImports[div+'|'+scale+'|'+cat+'|'+channel];
    rebuildCurveImportIndex();
    toast('Override removed');
    render();
  }catch(err){toast('Remove failed: '+err.message)}
}

function stagePM(scale,size,val){
  if(!pmStaged[scale])pmStaged[scale]={};
  const v=parseFloat(val);pmStaged[scale][size]=isNaN(v)||v<0?0:v;
  render();
}

async function acceptPMOverwrites(scale){
  const staged=pmStaged[scale]||{};
  // Capture before-state for diff
  const before={};
  if(A.presMins[scale])for(const s in A.presMins[scale])before[s]=A.presMins[scale][s];
  if(!A.presMins[scale])A.presMins[scale]={};
  // Build the actual diff (only sizes whose value changed)
  const diff=[];
  for(const s in staged){
    const old=before[s];
    const nu=staged[s];
    if(old!==nu)diff.push({size:s,from:old===undefined?null:old,to:nu});
    A.presMins[scale][s]=nu;
  }
  delete pmStaged[scale];
  const meta=A.presMinsMeta[scale]||{div:'Mens',sizes:[],onlineOnly:[]};
  try{
    await cloudSavePresMin(scale,meta.div,meta.sizes||[],A.presMins[scale],meta.onlineOnly||[],meta.onlineFlat!==undefined?meta.onlineFlat:5);
    A.pmMeta[scale]={updated_by_name:Auth.displayName,updated_by_email:Auth.email,updated_at:new Date().toISOString()};
    toast(scale+' pres mins updated');
    if(diff.length){
      const summary='adjusted pres mins for '+scale;
      cloudLogEvent('presmins_update','presmins',scale,summary,{changes:diff});
    }
  }catch(err){
    console.error('cloudSavePresMin failed:',err);toast('Save failed: '+err.message);
  }
  render();
}

function clearPMStaged(scale){delete pmStaged[scale];render()}

async function deleteScale(scale){
  if(!confirm('Delete size scale "'+scale+'"? This cannot be undone.'))return;
  const sizesCount=(A.presMinsMeta[scale]&&(A.presMinsMeta[scale].sizes||[]).length)||0;
  delete A.presMins[scale];delete A.presMinsMeta[scale];delete A.scaleSizes[scale];delete A.scaleSizeCount[scale];delete A.pmMeta[scale];
  try{
    await cloudDeletePresMin(scale);
    toast(scale+' deleted');
    cloudLogEvent('presmins_delete','presmins',scale,'deleted '+scale+' size scale',{sizes_removed:sizesCount});
  }catch(err){
    console.error('cloudDeletePresMin failed:',err);toast('Delete failed: '+err.message);
  }
  render();
}

function closeModal(){document.getElementById('modal-root').innerHTML=''}

function toggleOnlineOnly(size){
  const ms=modalState;
  const i=ms.onlineOnly.indexOf(size);
  if(i>=0)ms.onlineOnly.splice(i,1);else ms.onlineOnly.push(size);
  renderModal();
}

function toggleReorderMode(){
  modalState.reorderMode=!modalState.reorderMode;
  modalState._dragIdx=null;
  renderModal();
}

// Drag-and-drop reorder helpers
function dragSizeStart(ev,idx){
  modalState._dragIdx=idx;
  // Hint to the browser this is a move operation
  if(ev.dataTransfer){
    ev.dataTransfer.effectAllowed='move';
    ev.dataTransfer.setData('text/plain',String(idx));
  }
  // Visual feedback: tag the dragged element with a class via setTimeout
  // (setting it synchronously cancels the drag in some browsers)
  setTimeout(()=>{const el=ev.target.closest('.size-tag');if(el)el.classList.add('size-tag-dragging')},0);
}

function dragSizeOver(ev,idx){
  ev.preventDefault();
  if(ev.dataTransfer)ev.dataTransfer.dropEffect='move';
  // Visual: mark which slot is the current drop target
  const ms=modalState;
  if(ms._dragOverIdx!==idx){
    ms._dragOverIdx=idx;
    // Lightweight refresh of indicators only — no full renderModal to avoid janky redraws mid-drag
    const tags=document.querySelectorAll('.tag-area .size-tag');
    tags.forEach((t,i)=>{
      t.classList.toggle('size-tag-drop-before',i===idx&&ms._dragIdx!==null&&i<ms._dragIdx);
      t.classList.toggle('size-tag-drop-after',i===idx&&ms._dragIdx!==null&&i>ms._dragIdx);
    });
  }
}

function dragSizeDrop(ev,targetIdx){
  ev.preventDefault();
  const ms=modalState;
  const fromIdx=ms._dragIdx;
  ms._dragIdx=null;ms._dragOverIdx=null;
  if(fromIdx===null||fromIdx===undefined||fromIdx===targetIdx){renderModal();return}
  // Move the size from fromIdx → targetIdx, preserving relative order of the rest
  const moved=ms.sizes.splice(fromIdx,1)[0];
  // Adjust target if we removed something before it
  const insertAt=fromIdx<targetIdx?targetIdx:targetIdx;
  ms.sizes.splice(insertAt,0,moved);
  renderModal();
}

function dragSizeEnd(){
  const ms=modalState;
  ms._dragIdx=null;ms._dragOverIdx=null;
  // Clean up classes
  document.querySelectorAll('.size-tag').forEach(t=>{
    t.classList.remove('size-tag-dragging','size-tag-drop-before','size-tag-drop-after');
  });
}

function removeSizeAt(idx){
  const ms=modalState;
  const removed=ms.sizes[idx];
  ms.sizes.splice(idx,1);
  const oi=ms.onlineOnly.indexOf(removed);
  if(oi>=0)ms.onlineOnly.splice(oi,1);
  renderModal();
}

  const canSave=(isEdit||ms.name.trim())&&ms.sizes.length>0;
  h+='<div class="modal-footer"><button class="btn btn-g" onclick="closeModal()">Cancel</button>'+
    '<button class="btn btn-b"'+(canSave?'':' disabled')+' onclick="saveScale()">'+(isEdit?'Save Changes':'Create Scale')+'</button></div></div></div>';
  document.getElementById('modal-root').innerHTML=h;
  if(!isEdit&&!ms.name){const inp=document.querySelector('.modal-input');if(inp)setTimeout(()=>inp.focus(),50)}
}

function handleTagKey(e){
  if(e.key==='Enter'||e.key===','){
    e.preventDefault();const val=modalState.sizeInput.replace(',','').trim().toUpperCase();
    if(val&&!modalState.sizes.includes(val))modalState.sizes.push(val);
    modalState.sizeInput='';renderModal();
    setTimeout(()=>{const inp=document.querySelector('.tag-input');if(inp)inp.focus()},50);
  }
}

async function saveScale(){
  const ms=modalState;
  const name=ms.editing||ms.name.trim().toUpperCase();if(!name||!ms.sizes.length)return;
  // Capture before-state for diff (only relevant for edits)
  const isEdit=!!ms.editing;
  const prevSizes=isEdit?[...((A.presMinsMeta[name]&&A.presMinsMeta[name].sizes)||[])]:[];
  const prevOnlineOnly=isEdit?[...((A.presMinsMeta[name]&&A.presMinsMeta[name].onlineOnly)||[])]:[];
  const prevOnlineFlat=isEdit?(A.presMinsMeta[name]&&A.presMinsMeta[name].onlineFlat!==undefined?A.presMinsMeta[name].onlineFlat:5):5;
  // Validate online-only list against current sizes (drop stale entries)
  const onlineOnly=(ms.onlineOnly||[]).filter(s=>ms.sizes.includes(s));
  const onlineFlat=ms.onlineFlat!==undefined?Number(ms.onlineFlat):5;
  A.scaleSizes[name]=[...ms.sizes];A.scaleSizeCount[name]=ms.sizes.length;
  if(!A.presMins[name])A.presMins[name]={};
  A.presMinsMeta[name]={div:ms.div,sizes:[...ms.sizes],onlineOnly,onlineFlat};
  if(!isEdit&&ms.copyFrom&&A.presMins[ms.copyFrom])A.presMins[name]={...A.presMins[ms.copyFrom]};
  try{
    await cloudSavePresMin(name,ms.div,ms.sizes,A.presMins[name],onlineOnly,onlineFlat);
    A.pmMeta[name]={updated_by_name:Auth.displayName,updated_by_email:Auth.email,updated_at:new Date().toISOString()};
    // Log
    if(isEdit){
      const added=ms.sizes.filter(s=>!prevSizes.includes(s));
      const removed=prevSizes.filter(s=>!ms.sizes.includes(s));
      const onlineAdded=onlineOnly.filter(s=>!prevOnlineOnly.includes(s));
      const onlineRemoved=prevOnlineOnly.filter(s=>!onlineOnly.includes(s));
      const reorderedOnly=!added.length&&!removed.length&&JSON.stringify(prevSizes)!==JSON.stringify(ms.sizes);
      const onlineFlatChanged=Number(prevOnlineFlat)!==Number(onlineFlat);
      if(added.length||removed.length){
        const parts=[];
        if(added.length)parts.push(added.length+' size'+(added.length===1?'':'s')+' added ['+added.join(', ')+']');
        if(removed.length)parts.push(removed.length+' size'+(removed.length===1?'':'s')+' removed ['+removed.join(', ')+']');
        cloudLogEvent('presmins_update','presmins',name,'edited '+name+' size scale: '+parts.join(', '),{added,removed,sizes_after:ms.sizes});
      } else if(reorderedOnly){
        cloudLogEvent('presmins_reorder','presmins',name,'reordered sizes in '+name,{before:prevSizes,after:ms.sizes});
      }
      if(onlineAdded.length||onlineRemoved.length){
        const parts=[];
        if(onlineAdded.length)parts.push('marked online-only: '+onlineAdded.join(', '));
        if(onlineRemoved.length)parts.push('removed online-only flag: '+onlineRemoved.join(', '));
        cloudLogEvent('presmins_online_only','presmins',name,parts.join('; ')+' ('+name+')',{added:onlineAdded,removed:onlineRemoved});
      }
      if(onlineFlatChanged){
        cloudLogEvent('presmins_update','presmins',name,'changed online flat pres min for '+name+' from '+prevOnlineFlat+' to '+onlineFlat,{changes:[{size:'(online flat)',from:prevOnlineFlat,to:onlineFlat}]});
      }
    } else {
      cloudLogEvent('presmins_create','presmins',name,'added '+name+' size scale ['+ms.sizes.length+' size'+(ms.sizes.length===1?'':'s')+' added]',{sizes:ms.sizes,onlineOnly,onlineFlat,division:ms.div});
    }
    closeModal();toast(name+(isEdit?' updated':' created'));
  }catch(err){
    console.error('cloudSavePresMin failed:',err);toast('Save failed: '+err.message);
  }
  render();
}

// ═══ CHANGELOG ═══
let _changelogState={category:'all',expanded:{}}; // category: 'all' | 'csv' | 'presmins'

function setChangelogCategory(cat){
  _changelogState.category=cat;
  _changelogState.expanded={};
  render();
}

function toggleChangelogExpanded(id){
  _changelogState.expanded[id]=!_changelogState.expanded[id];
  render();
}

async function renderChangelog(el){
  el.innerHTML='<div class="cl-page anim"><button class="d-back" onclick="goBackFromModule()">← Back</button>'+
    '<h2 style="font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px">Changelog</h2>'+
    '<p style="font-size:12px;color:var(--txt2);margin-bottom:14px">Recent activity from all team members. Last 100 events.</p>'+
    '<div class="cl-filters">'+
      '<button class="sb'+(_changelogState.category==='all'?' on':'')+'" onclick="setChangelogCategory(\'all\')">All</button>'+
      '<button class="sb'+(_changelogState.category==='csv'?' on':'')+'" onclick="setChangelogCategory(\'csv\')">CSV Uploads</button>'+
      '<button class="sb'+(_changelogState.category==='presmins'?' on':'')+'" onclick="setChangelogCategory(\'presmins\')">Size Scales</button>'+
      '<button class="sb'+(_changelogState.category==='curve'?' on':'')+'" onclick="setChangelogCategory(\'curve\')">Curve Overrides</button>'+
    '</div>'+
    '<div id="cl-list" class="cl-list"><div class="cl-loading">Loading...</div></div>'+
    '</div>';

  let events=[];
  try{
    events=await cloudListChanges(_changelogState.category,100);
  }catch(err){
    console.error('cloudListChanges failed:',err);
    document.getElementById('cl-list').innerHTML='<div class="cl-empty">Failed to load changelog: '+esc(err.message)+'</div>';
    return;
  }

  if(!events.length){
    document.getElementById('cl-list').innerHTML='<div class="cl-empty">No events yet.</div>';
    return;
  }

  let h='';
  events.forEach(ev=>{
    const cat=ev.category;
    const catCls=cat==='csv'?'cl-cat-csv':cat==='curve'?'cl-cat-curve':'cl-cat-pm';
    const catLabel=cat==='csv'?'CSV':cat==='curve'?'CURVE':'SIZE SCALE';
    const isExpandable=cat==='presmins'&&ev.event_type==='presmins_update'&&ev.details&&Array.isArray(ev.details.changes)&&ev.details.changes.length>0;
    const expanded=isExpandable&&_changelogState.expanded[ev.id];
    const when=new Date(ev.created_at);
    const whenAbs=when.toLocaleString();
    const whenRel=formatRelTime(ev.created_at);
    h+='<div class="cl-row '+catCls+(isExpandable?' cl-expandable':'')+'"'+(isExpandable?' onclick="toggleChangelogExpanded('+ev.id+')"':'')+'>'+
      '<div class="cl-row-main">'+
        '<span class="cl-cat-tag '+catCls+'">'+catLabel+'</span>'+
        '<span class="cl-actor">'+esc(ev.actor_name||ev.actor_email||'Unknown')+'</span>'+
        '<span class="cl-summary">'+esc(ev.summary||'')+'</span>'+
        '<span class="cl-time" title="'+esc(whenAbs)+'">'+esc(whenRel)+'</span>'+
        (isExpandable?'<span class="cl-chevron">'+(expanded?'▾':'▸')+'</span>':'')+
      '</div>';
    if(isExpandable&&expanded){
      h+='<div class="cl-detail" onclick="event.stopPropagation()">'+
        '<table class="cl-diff"><thead><tr><th>Size</th><th>From</th><th>→</th><th>To</th></tr></thead><tbody>';
      ev.details.changes.forEach(c=>{
        const from=c.from===null||c.from===undefined?'—':c.from;
        const to=c.to===null||c.to===undefined?'—':c.to;
        h+='<tr><td class="cl-diff-size">'+esc(c.size)+'</td><td class="cl-diff-from">'+esc(String(from))+'</td><td class="cl-diff-arrow">→</td><td class="cl-diff-to">'+esc(String(to))+'</td></tr>';
      });
      h+='</tbody></table></div>';
    }
    h+='</div>';
  });
  document.getElementById('cl-list').innerHTML=h;
}

// ═══ V7.1 BOOTSTRAP — Auth gate, then cloud load, then realtime ═══
async function boot(){
  // Step 1: Open IndexedDB (still used as a fallback / scratch for any edge cases) — but don't block on it
  try{await openDB()}catch(e){console.warn('IndexedDB unavailable:',e)}
  // Step 2: Check auth state. Supabase auto-detects session in URL (magic-link return)
  // and persists it in localStorage.
  const{data:{session}}=await SUPA.auth.getSession();
  if(session&&session.user&&session.user.email){
    onSignedIn(session.user);
  } else {
    showLogin();
  }
  // Step 3: Listen for auth state changes (magic-link arrival, manual logout, etc.)
  SUPA.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_IN'&&session&&session.user){
      onSignedIn(session.user);
    } else if(event==='SIGNED_OUT'){
      showLogin();
    }
  });
}

async function onSignedIn(user){
  Auth.user=user;
  Auth.email=user.email;
  Auth.displayName=deriveDisplayName(user.email);
  hideLogin();
  // Load shared data from cloud
  await loadFromCloud();
  // Subscribe to realtime updates (primary path: WebSocket push)
  setupRealtime();
  // Tab focus / visibility — catches cases where realtime drops during inactivity
  setupVisibilityRefresh();
  // 60s polling fallback — catches dropped WebSockets while tab is active
  setupPollingFallback();
}

boot().catch(e=>console.error('Boot error:',e));
